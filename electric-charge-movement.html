    const fin=Math.min(1,s/(60*k)),fout=rev>=L-1?Math.min(1,(L-s)/(60*k)):Math.min(1,(rev-s)/(110*k)),a=o.alpha*Math.min(fin,fout);
    const pts=[];for(let i=0;i<=8;i++)pts.push(RP.pos(u+sg*(i/8-.5)*du));   // 진행 방향 끝이 머리
    ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.strokeStyle=o.col;ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<8;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
    arrow(ctx,pts[7].x,pts[7].y,pts[8].x,pts[8].y,o.col,7,19);ctx.restore();}}
/* 스위치(레몬 전지 슬라이드)의 열림 상태를 슬라이드와 애니메이션이 함께 쓴다 */
const CFL={open:1};

/* 애니메이션: ANIMS.이름 = o => { o.frame = () => {…} }.  o.phase = 현재 단계(빈칸 공개 수), 한 번 누르는 것(빈칸 하나) = 한 단계.
   회로 상태(S)는 cfSt()/cfStep()(스위치 열림 → 흐름·전구·전자 위치)이 시간 순서대로 이어 가며, 방향이 바뀔 때는 속도가 0 을 지나 반대로 간다.
   모든 값(전자 수·속도·크기)은 모식이다. 전자는 늘 조금씩 떨리고(열운동), 스위치가 닫히면 한 방향으로 이동한다. */
const CFK=o=>Math.min(o.W/820,o.H/660);
function cfSt(){return {open:1,fl:0,dirv:-1,pos:0,lp:0,wheel:0,wpos:0};}
/* openT 0 닫힘 / 1 열림, flipT 0: (+)극 위쪽(전류 시계 방향) / 1: 반대. R: 확대 원 반지름, k: 크기 배율 */
function cfStep(S,dt,openT,flipT,R,k){
  const d=openT-S.open;S.open+=Math.max(-2*dt,Math.min(2*dt,d));
  const on=S.open<.3?1:0;S.fl+=(on-S.fl)*Math.min(1,dt*(on?2.2:7));
  S.dirv+=((flipT?1:-1)-S.dirv)*Math.min(1,dt*3);
  const v=S.fl*S.dirv;S.tr=(S.tr||0)+Math.abs(v)*dt*85*k;S.pos+=v*dt*85*k;S.lp+=v*dt*R*.45;S.wpos+=S.fl*dt*85*k;S.wheel+=S.fl*dt*3.2;return v;}
function cfBase(o,lens){const k=CFK(o),W=o.W,H=o.H;
  const G=lens?cfLoop(W*.175,H*.54,W*.67,H*.27,k):cfLoop(W*.18,H*.27,W*.67,H*.42,k);
  return {k,G,R:Math.min(W*.15,H*.17),lx:W*.56,ly:H*.21};}
/* 화살표가 천천히 나타나고 사라지도록 목표값 쪽으로 부드럽게 */
const cfEase=(S,key,tgt,dt,sp)=>{S[key]=(S[key]==null?0:S[key]);S[key]+=(tgt-S[key])*Math.min(1,dt*(sp||1.6));return S[key];};
const cfCap=(o,s,col)=>txt(o.ctx,s,o.W*.5,o.H*.93,28,col||TH.ink,'center',800);

/* ---------- 표지: 스위치(플러그)가 열려 있으면? 닫으면? ---------- */
ANIMS.cover=o=>{const S=cfSt();o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);const dt=cfTick(o),b=cfBase(o);
  ctx.save();rr(ctx,4,4,W-8,H-8,28);ctx.fillStyle='#FBFDFC';ctx.fill();ctx.restore();
  const u=t%12,open=(u<4||u>=10)?1:0;cfStep(S,dt,open,0,b.R,b.k);
  const G=cfLoop(W*.2,H*.44,W*.6,H*.34,b.k);
  cfCircuit(ctx,G,{open:S.open,pos:S.pos,lv:S.fl,t});
  if(open)pill(ctx,'스위치(플러그)가 열려 있다 → 작동하지 않는다',W*.5,H*.2,26,'#7A8A87');
  else pill(ctx,'스위치를 닫으면 → 전구에 불이 켜진다!',W*.5,H*.2,26,'#1F7A6C');
  txt(ctx,'전선 속에서는 어떤 일이 일어날까?',W*.5,H*.9,28,TH.ink,'center',800);};};

/* ---------- STAGE 1 (빈칸 2개: 전류 · 전기 회로) ---------- */
ANIMS.circ_def=o=>{const S=cfSt();o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=cfTick(o),{k,G,R}=cfBase(o),ph=o.phase;
  cfStep(S,dt,ph>=1?0:1,0,R,k);cfCircuit(ctx,G,{open:S.open,pos:S.pos,lv:S.fl,t});
  if(ph<1)pill(ctx,'스위치가 열려 있어 전구가 켜지지 않는다',W*.5,H*.2,28,'#7A8A87');
  else if(ph===1)pill(ctx,'전하(전자)의 흐름 = 전류',W*.5,H*.2,34,'#1F7A6C');
  if(ph>=2){pill(ctx,'전류가 흐를 수 있도록 연결한 것 = 전기 회로',W*.5,H*.075,28,'#1F7A6C');
    const yb=G.y+G.h/2;[['전지',G.x+34*k+46,yb],['스위치',G.x+G.w/2,G.y-54*k],['전구',G.x+G.w-56*k-46,yb],['전선',G.x+G.w/2,G.y+G.h+38*k]].forEach(a=>pill(ctx,a[0],a[1],a[2],26,'#55646A'));}
  if(ph<1)cfCap(o,'전기 기구가 작동하지 않는다. 무엇이 필요할까?');};};

/* ---------- STAGE 1 (빈칸 4개: 전자 · 불규칙 · (−) · (+)) — 전선 속 확대 ---------- */
ANIMS.wire=o=>{const S=cfSt();o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=cfTick(o),{k,G,R,lx,ly}=cfBase(o,true),ph=o.phase,yb=G.y+G.h/2;
  const v=cfStep(S,dt,ph>=3?0:1,0,R,k);
  const hl={};
  cfCircuit(ctx,G,{open:S.open,pos:S.pos,lv:S.fl,t,hl});
  cfLens(ctx,G,{cx:lx,cy:ly,R,u:G.w*.2,t,vel:v,lp:S.lp,arrows:ph>=2});
  if(ph===1){ctx.save();ctx.strokeStyle=C_NEG;ctx.lineWidth=7;ctx.shadowColor=C_NEG;ctx.shadowBlur=14;ctx.globalAlpha=.6+.4*Math.sin(t*5);ctx.beginPath();ctx.arc(lx,ly,R+10,0,PI2);ctx.stroke();ctx.restore();pill(ctx,'전자 (−)',lx+R+70,ly,26,C_NEG);pill(ctx,'원자핵 (+)',lx-R-84,ly,26,C_POS);}
  if(ph===3)cfRing(ctx,G.x,yb+36*k,86*k,66*k,C_NEG,t);
  // (−)가 나오면 (−)극에서 화살표가 나와 반시계 방향으로 움직이고, (+)가 나오면 (+)극으로 들어간다
  cfFlowArrows(ctx,G,{sg:-1,col:C_NEG,side:-1,rev:cfEase(S,'rv',ph>=4?1:(ph>=3?.45:0),dt),tr:S.tr,alpha:S.fl,n:6});
  if(ph>=4)cfRing(ctx,G.x,yb-36*k,86*k,66*k,C_POS,t);
  if(ph<=1)cfCap(o,'스위치가 열려 있다 — 전선 속을 확대해 보자 (모식도)');
  else if(ph===2)cfCap(o,'열린 스위치: 전자가 여러 방향으로 제멋대로 움직인다 → 전류 ✕',TH.ink);
  else if(ph===3)cfCap(o,'스위치를 닫으면 전자가 전지의 (−)극에서 나와 한 방향으로 움직인다',C_NEG);
  else cfCap(o,'전자는 (−)극 → (+)극 쪽으로 이동한다 → 전류가 흐른다',C_NEG);};};

/* ---------- STAGE 2 (빈칸 3개: (+) · (−) · 반대) ---------- */
ANIMS.dir=o=>{const S=cfSt();o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=cfTick(o),{k,G,R}=cfBase(o),ph=o.phase,yb=G.y+G.h/2;
  cfStep(S,dt,0,0,R,k);cfCircuit(ctx,G,{open:S.open,pos:S.pos,lv:S.fl,t});
  cfFlowArrows(ctx,G,{sg:1,col:C_POS,side:1,rev:cfEase(S,'rc',ph>=2?1:(ph>=1?.45:0),dt),tr:S.tr,alpha:S.fl,n:6});
  if(ph===1)cfRing(ctx,G.x,yb-36*k,86*k,66*k,C_POS,t);
  if(ph===2)cfRing(ctx,G.x,yb+36*k,86*k,66*k,C_NEG,t);
  cfFlowArrows(ctx,G,{sg:-1,col:C_NEG,side:-1,rev:cfEase(S,'re',ph>=3?1:0,dt,1.1),tr:S.tr,alpha:S.fl,n:6});
  if(ph>=3){
    pill(ctx,'전류의 방향 ↔ 전자의 이동 방향 : 반대',W*.5,H*.16,30,'#1F7A6C');}
  if(ph===0)cfCap(o,'전류가 흐르고 있다. 전류는 어느 쪽으로 흐른다고 정했을까?');
  else if(ph===1)cfCap(o,'전류는 전지의 (+)극에서 나온다',C_POS);
  else if(ph===2)cfCap(o,'전류는 전지의 (−)극 쪽으로 들어간다  (전류의 방향: (+) → (−))',C_POS);
  else cfCap(o,'주황 = 전류의 방향 · 파랑 = 전자의 이동 방향',TH.ink);};};

/* ---------- STAGE 2 (빈칸 2개: 전하 · A) — 1초 동안 한 단면을 지나가는 전자
   전자는 단면을 따라 한 줄이 아니라 전선 속에 넓게 흩어져(위치는 모식) 같은 속도로 이동한다. 전자를 같은 간격으로 놓았으므로 1초 동안 단면을 지나는 수는 늘 같다(약할 때 2개 · 셀 때 6개). ---------- */
ANIMS.amp=o=>{const lanes=[{y:.30,n:8,c:2,lab:'전류가 약할 때'},{y:.62,n:24,c:6,lab:'전류가 셀 때'}];
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=cfTick(o),ph=o.phase,k=CFK(o),x0=W*.1,wd=W*.8,xp=x0+wd*.72,d=wd*.25,hh=50*k;
    if(ph>=1)pill(ctx,'1초 동안 한 단면을 통과하는 전하의 양',W*.5,H*.1,28,'#1F7A6C');
    else txt(ctx,'전선의 한 단면을 전자가 지나간다',W*.5,H*.1,28,TH.ink,'center',800);
    lanes.forEach((L,li)=>{const cy=H*L.y,sp=wd/L.n;
      txt(ctx,L.lab,x0+4,cy-hh-34*k,26,TH.ink,'left',900);
      pill(ctx,'전자의 이동 방향  →',x0+wd*.44,cy-hh-34*k,22,C_NEG);
      rr(ctx,x0,cy-hh,wd,2*hh,hh);ctx.fillStyle='#EEF3F5';ctx.fill();
      ctx.save();ctx.fillStyle='rgba(31,122,108,.14)';ctx.fillRect(xp-d,cy-hh+4,d,2*hh-8);ctx.restore();   // 1초 동안 가는 거리
      ctx.lineWidth=5;ctx.strokeStyle=CF_WIRE;rr(ctx,x0,cy-hh,wd,2*hh,hh);ctx.stroke();
      const E=(o._E=o._E||[])[li]||(o._E[li]=Array.from({length:L.n},()=>({ox:0,oy:0,vx:0,vy:0,tl:0}))),mx=Math.min(sp*.34,24);
      for(let i=0;i<L.n;i++){const e=E[i],r=((i*53+li*29)%17)/17,rr0=Math.max(9,10.5*k);
        // 충돌 모형: 전자는 직선으로 가다가 불규칙한 시간마다 아무 방향으로 튕겨 속도가 바뀐다(열운동). 그 위에 일정한 평균 이동(드리프트)이 겹친다.
        e.tl-=dt;if(e.tl<=0){e.tl=.18+Math.random()*.5;const a=Math.random()*PI2,v=35+Math.random()*95;e.vx=Math.cos(a)*v;e.vy=Math.sin(a)*v;}
        e.ox=Math.max(-mx,Math.min(mx,e.ox+e.vx*dt-e.ox*.5*dt));e.oy=Math.max(-hh*.45,Math.min(hh*.45,e.oy+e.vy*dt-e.oy*.5*dt));
        const xi=x0+((i*sp+d*t+wd)%wd)+e.ox,yi=cy+Math.max(-hh*.72,Math.min(hh*.72,(r-.5)*2*hh*.5))+e.oy;
        chg(ctx,Math.max(x0+rr0,Math.min(x0+wd-rr0,xi)),yi,-1,rr0);}
      ctx.save();ctx.setLineDash([9,7]);ctx.strokeStyle='#1F7A6C';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(xp,cy-hh-14*k);ctx.lineTo(xp,cy+hh+14*k);ctx.stroke();ctx.restore();
      txt(ctx,'단면',xp,cy-hh-34*k,24,'#1F7A6C','center',800);
      txt(ctx,'1초 동안 단면을 지나는 전자 '+L.c+'개',x0+wd,cy+hh+34*k,25,C_NEG,'right',900);});
    if(ph>=2)pill(ctx,'전류의 세기의 단위 : A (암페어)',W*.5,H*.875,30,'#B4540F');
    else txt(ctx,'단면을 지나가는 전하가 많을수록 전류가 세다.',W*.5,H*.875,26,TH.ink,'center',800);
    txt(ctx,'※ 초록 칸 = 1초 동안 전자가 이동하는 거리 · 수·속도·위치는 모식이다.',W*.5,H*.955,22,TH.sub,'center',700);};};

/* ---------- STAGE 3 (빈칸: 펌프) — 물통 두 개 ---------- */
ANIMS.tanks=o=>{const S={hL:.85,hR:.35,ph:-1,q:0,dr:0};
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=cfTick(o),ph=o.phase;
    if(ph!==S.ph){if(ph===0){S.hL=.85;S.hR=.35;}if(ph===2){S.hL=S.hR=(S.hL+S.hR)/2;}S.ph=ph;}
    const c=.28,p=ph>=2?.085:0;S.q=ph>=1?c*(S.hL-S.hR):0;
    if(ph>=1){S.hL+=(p-S.q)*dt;S.hR+=(S.q-p)*dt;}S.dr+=dt*(S.q*420+p*520);S.dc=(S.dc||0)+dt*S.q*420;S.dp=(S.dp||0)+dt*p*1500;   // 흐르는 양(유량)에 비례해 물방울이 움직인다: 연결관=q, 펌프관=p (정상 상태에서 q=p)
    const k=CFK(o),tw=W*.2,th=H*.5,ty=H*.24,tx1=W*.155,tx2=W*.515,by=ty+th;
    const tank=(x,h)=>{ctx.fillStyle='rgba(49,169,189,.55)';ctx.fillRect(x,by-th*h,tw,th*h);ctx.save();ctx.strokeStyle='#8FD0DC';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,by-th*h);ctx.lineTo(x+tw,by-th*h);ctx.stroke();ctx.restore();
      ctx.save();ctx.strokeStyle=CF_WATER_D;ctx.lineWidth=8;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x,ty-10);ctx.lineTo(x,by);ctx.lineTo(x+tw,by);ctx.lineTo(x+tw,ty-10);ctx.stroke();ctx.restore();};
    tank(tx1,S.hL);tank(tx2,S.hR);
    // 아래쪽 연결관(ph≥1)
    if(ph>=1){const py=by-26;ctx.fillStyle='rgba(49,169,189,.7)';ctx.fillRect(tx1+tw,py-10,tx2-tx1-tw,20);ctx.strokeStyle=CF_WATER_D;ctx.lineWidth=5;ctx.strokeRect(tx1+tw,py-10,tx2-tx1-tw,20);
      if(S.q>.004)for(let i=0;i<5;i++){const x=tx1+tw+((i*(tx2-tx1-tw)/5+S.dc)%(tx2-tx1-tw));ctx.beginPath();ctx.arc(x,py,6,0,PI2);ctx.fillStyle='#fff';ctx.fill();}
      if(S.q>.004)arrow(ctx,tx1+tw+16,py-30,tx2-16,py-30,CF_GREEN,6,18);}
    // 높이차 표시
    const yL=by-th*S.hL,yR=by-th*S.hR;
    if(Math.abs(yL-yR)>6){ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle='#B4540F';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tx2+tw+8,yL);ctx.lineTo(tx2+tw+60,yL);ctx.moveTo(tx2+tw+8,yR);ctx.lineTo(tx2+tw+60,yR);ctx.stroke();ctx.restore();
      arrow(ctx,tx2+tw+50,(yL+yR)/2,tx2+tw+50,yL,'#B4540F',5,15);arrow(ctx,tx2+tw+50,(yL+yR)/2,tx2+tw+50,yR,'#B4540F',5,15);txt(ctx,'높이차',tx2+tw+66,(yL+yR)/2,26,'#B4540F','left',900);}
    // 펌프(ph≥2): 오른쪽 물통 → 위로 → 왼쪽 물통
    if(ph>=2){const ax=tx2+tw*.5,bx=tx1+tw*.5,ytop=ty-52,mouth=ty+4,surf=by-th*S.hL;
      ctx.save();ctx.strokeStyle=CF_WIRE;ctx.lineWidth=14;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(ax,by-th*S.hR+4);ctx.lineTo(ax,ytop);ctx.lineTo(bx,ytop);ctx.lineTo(bx,mouth);ctx.stroke();
      ctx.strokeStyle='#9ADBE7';ctx.lineWidth=7;ctx.stroke();ctx.restore();
      for(let i=0;i<6;i++){const u=((i/6+S.dp/700)%1),L1=by-th*S.hR-ytop,L2=ax-bx,L3=mouth-ytop,tot=L1+L2+L3,d=u*tot;let x,y;if(d<L1){x=ax;y=by-th*S.hR-d;}else if(d<L1+L2){x=ax-(d-L1);y=ytop;}else{x=bx;y=ytop+(d-L1-L2);}
        ctx.beginPath();ctx.arc(x,y,6,0,PI2);ctx.fillStyle=CF_WATER;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();}
      // 관 끝에서 나온 물은 자유낙하한다: 속도 v=v0+g·t (점점 빨라짐) → 연속의 원리로 물줄기는 아래로 갈수록 가늘어진다.
      const Lf=Math.max(20,surf-mouth-6),g=900,v0=95,T=(-v0+Math.sqrt(v0*v0+2*g*Lf))/g,vAt=y=>Math.sqrt(v0*v0+2*g*Math.max(0,y)),wd0=9;
      ctx.save();ctx.fillStyle='rgba(49,169,189,.42)';ctx.beginPath();const N=14;
      for(let i=0;i<=N;i++){const y=Lf*i/N,w=wd0*Math.sqrt(v0/vAt(y))+1.2;i?ctx.lineTo(bx-w,mouth+4+y):ctx.moveTo(bx-w,mouth+4);}
      for(let i=N;i>=0;i--){const y=Lf*i/N,w=wd0*Math.sqrt(v0/vAt(y))+1.2;ctx.lineTo(bx+w,mouth+4+y);}
      ctx.closePath();ctx.fill();ctx.restore();
      for(let i=0;i<8;i++){const a=((t/T+i/8)%1)*T,y=v0*a+.5*g*a*a,sp=v0+g*a,ln=Math.min(34,6+sp*.03);ctx.save();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx,mouth+4+y-ln);ctx.lineTo(bx,mouth+4+y);ctx.stroke();ctx.restore();}
      for(let i=0;i<2;i++){const f=((t/T*2+i*.5)%1);ctx.save();ctx.globalAlpha=.8*(1-f);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(bx,surf,10+f*34,3+f*8,0,0,PI2);ctx.stroke();ctx.restore();}
      rr(ctx,(ax+bx)/2-30,ytop-24,60,48,10);ctx.fillStyle='#E3EAEE';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=CF_WIRE;ctx.stroke();ctx.save();ctx.translate((ax+bx)/2,ytop);ctx.rotate(t*3);ctx.strokeStyle=CF_WIRE;ctx.lineWidth=4;for(let i=0;i<3;i++){ctx.rotate(PI2/3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(14,0);ctx.stroke();}ctx.restore();
      pill(ctx,'펌프',(ax+bx)/2,ytop-52,28,'#55646A');}
    const msg=ph===0?'물의 높이가 서로 다르다 (아직 연결하지 않았다)':ph===1?(S.q>.006?'높이차가 있어 물이 흐른다':'높이가 같아져서 더 이상 흐르지 않는다'):'펌프가 높이차를 유지한다 → 물이 계속 흐른다';
    txt(ctx,msg,W*.5,H*.9,30,ph===2?'#1F7A6C':TH.ink,'center',800);};};

/* ---------- STAGE 3 (빈칸 3개: 전지 · 전압 · V) ---------- */
ANIMS.volt=o=>{const S=cfSt();o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=cfTick(o),{k,R}=cfBase(o),G=cfLoop(W*.18,H*.42,W*.67,H*.38,k),ph=o.phase,yb=G.y+G.h/2;
  cfStep(S,dt,0,0,R,k);cfCircuit(ctx,G,{open:S.open,pos:S.pos,lv:S.fl,t,hl:ph===1?{bat:'#1F7A6C'}:null});
  if(ph>=1)pill(ctx,'전지 = 펌프처럼 전압을 유지한다',W*.5,H*.1,30,'#1F7A6C');
  if(ph>=2){pill(ctx,'전압 (원인)',W*.30,H*.25,28,'#B4540F');arrow(ctx,W*.30+86,H*.25,W*.60-86,H*.25,'#B4540F',7,20);pill(ctx,'전류가 흐른다 (결과)',W*.74,H*.25,28,'#55646A');}
  if(ph>=3)pill(ctx,'단위 : V (볼트)',G.x+G.w*.5,yb,28,'#B4540F');
  cfCap(o,ph<2?'전지는 전기 회로에서 어떤 일을 할까?':'전압이 유지되면 전류는 지속적으로 흐를 수 있다');};};

/* ---------- 물 흐름 모형 ↔ 전기 회로 (STAGE 4 표 · 짝짓기 시뮬) ---------- */
const CF_NM=[['물의 흐름','전류'],['물레방아','전구'],['펌프','전지'],['물의 높이차','전압'],['밸브','스위치']];
function cfModel(o,S,both,wOnly){   // both: 짝 전체를 표시(두 쪽 강조 + 이름표) / wOnly: 물 모형 쪽만 깜빡이게 강조(전기 회로 쪽은 아직 비밀)
  wOnly=wOnly||[];const {ctx,W,t}=o,H=o.Hu||o.H,k=Math.min(W/820,H/660)*.68*1.34,G1=cfLoop(W*.21,H*.17,W*.5,H*.2,k),G2=cfLoop(W*.21,H*.55,W*.5,H*.2,k),has=i=>both.indexOf(i)>=0,hw_=i=>has(i)||wOnly.indexOf(i)>=0;
  const hw={},hc={};if(hw_(2))hw.pump=CF_PAIR[2];if(hw_(1))hw.wheel=CF_PAIR[1];if(hw_(4))hw.valve=CF_PAIR[4];if(has(2))hc.bat=CF_PAIR[2];if(has(1))hc.bulb=CF_PAIR[1];if(has(4))hc.sw=CF_PAIR[4];
  cfWater(ctx,G1,{valve:S.open,pos:S.wpos,wheel:S.wheel,t,hl:hw});cfCircuit(ctx,G2,{open:S.open,pos:S.pos,lv:S.fl,t,noLab:true,hl:hc});
  txt(ctx,'(가) 물',G1.x-62*k,G1.y+G1.h/2,26,CF_WATER_D,'right',900);txt(ctx,'(나) 전기',G2.x-62*k,G2.y+G2.h/2,26,TH.ink,'right',900);
  const pulse=.55+.45*Math.sin(t*6);
  if(hw_(0)){const c=CF_PAIR[0];ctx.save();ctx.globalAlpha=has(0)?1:pulse;arrow(ctx,G1.x+G1.w*.12,G1.y-34*k,G1.x+G1.w*.34,G1.y-34*k,c,8,22);ctx.restore();if(has(0))arrow(ctx,G2.x+G2.w*.12,G2.y-34*k,G2.x+G2.w*.34,G2.y-34*k,c,8,22);}
  if(hw_(3)){const c=CF_PAIR[3],xx=G1.x+G1.w+100*k;ctx.save();ctx.globalAlpha=has(3)?1:pulse;cfHeight(ctx,G1,xx,c,'높이차');ctx.restore();if(has(3))cfHeight(ctx,G2,xx,c,'전압');}
  const posn=[[G1.x+G1.w*.5,G1.y+G1.h/2,G2.x+G2.w*.5,G2.y+G2.h/2],[G1.x+G1.w,G1.y-84*k,G2.x+G2.w,G2.y+G2.h+54*k],[G1.x,G1.y+G1.h+54*k,G2.x,G2.y+G2.h+54*k],[0,0,0,0],[G1.x+G1.w*.5,G1.y-62*k,G2.x+G2.w*.5,G2.y-62*k]];
  [0,1,2,4].forEach(i=>{const q=posn[i],c=CF_PAIR[i];if(!hw_(i))return;pill(ctx,CF_NM[i][0],q[0],q[1],24,c);if(has(i))pill(ctx,CF_NM[i][1],q[2],q[3],24,c);});
  return {G1,G2};}
ANIMS.model=o=>{const S=cfSt();o.frame=()=>{const {ctx,W,H}=o;clear(o);const dt=cfTick(o),ph=o.phase,R=60,k=CFK(o)*.68;
  cfStep(S,dt,0,0,R,k);const pr=[],rv=[];for(let i=0;i<Math.min(5,ph);i++){pr.push(i);rv.push(i);}
  cfModel(o,S,pr,[]);
  if(ph===0)txt(o.ctx,'같은 자리의 부품이 서로 짝이다 — 하나씩 찾아보자',W*.5,H*.95,26,TH.ink,'center',800);
  else cfCap(o,CF_NM[Math.min(4,ph-1)][0]+' ↔ '+CF_NM[Math.min(4,ph-1)][1],CF_PAIR[Math.min(4,ph-1)]);};};

/* ---------- STAGE 4 (빈칸 2개: 사라지지 · 같다) — 전구 앞뒤의 전류
   전자를 같은 간격으로 놓고 일정한 속도(1초에 2개가 한 점을 지난다)로 움직여 A·B 두 점에서 늘 같은 수를 센다 → 숫자가 깜빡이지 않는다. ---------- */
ANIMS.conserve=o=>{const S=cfSt();
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=cfTick(o),ph=o.phase,k=CFK(o),R=60,G=cfLoop(W*.12,H*.24,W*.5,H*.5,k),n=34,sp=G.per/n;
    cfStep(S,dt,0,0,R,k);S._p=(S._p||0)-dt*S.fl*2*sp;S.pos=S._p;   // 한 점을 1초에 2개씩 지나간다
    cfCircuit(ctx,G,{open:S.open,pos:S.pos,lv:S.fl,t,N:n,noLab:true});
    [['A점 (전구 앞)',.2],['B점 (전구 뒤)',.8]].forEach(a=>{const q=cfPos(G,G.w+G.h*a[1]);
      ctx.save();ctx.strokeStyle='#1F7A6C';ctx.lineWidth=5;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(q.x-48*k,q.y);ctx.lineTo(q.x+48*k,q.y);ctx.stroke();ctx.restore();
      const cx=W*.82,cy=q.y;ctx.save();ctx.strokeStyle='#8FA29D';ctx.lineWidth=2.5;ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(q.x+50*k,q.y);ctx.lineTo(cx-100,cy);ctx.stroke();ctx.restore();
      txt(ctx,a[0],cx,cy-34,24,'#1F7A6C','center',900);txt(ctx,'1초 동안 2개',cx,cy,28,C_NEG,'center',900);});
    if(ph>=1)pill(ctx,'전구를 지나도 전자는 사라지지 않는다',W*.42,H*.1,28,'#1F7A6C');
    if(ph>=2)pill(ctx,'A점 = B점 : 전류의 세기가 같다',W*.5,H*.88,30,'#B4540F');
    else txt(ctx,'전구 앞 A점과 뒤 B점을 1초 동안 지나가는 전자를 세어 보자',W*.5,H*.88,26,TH.ink,'center',800);
    txt(ctx,'※ 전자의 수는 모식이다',W*.5,H*.96,22,TH.sub,'center',700);};};

/* ---------- 선택: 과일 전지 (스위치를 열고 닫을 수 있다 — CFL.open) ---------- */
ANIMS.lemon=o=>{const S=cfSt();S.open=CFL.open;o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=cfTick(o),k=CFK(o),R=60,G=cfLoop(W*.16,H*.33,W*.68,H*.42,k*1.05);
  const v=cfStep(S,dt,CFL.open,0,R,k);cfCircuit(ctx,G,{open:S.open,pos:S.pos,lv:S.fl,t,src:'lemon',lk:1.0});
  pill(ctx,CFL.open?'스위치가 열려 있다 → 전구가 꺼져 있다':'과일이 전지 역할을 한다 → 전구에 불이 켜진다',W*.5,H*.17,28,CFL.open?'#7A8A87':'#1F7A6C');
  cfCap(o,'서로 다른 두 금속판을 꽂은 과일 (모식) — 스위치를 열고 닫아 보자');};};

/* ================= 시뮬레이션 ① 전기 회로 가상 실험 (id: cc) — 교과서 '디지털+해 보기'를 모식 시뮬레이션으로 대신한다 =================
   순서: 1 예상 고르기 → 2 스위치 닫기/열기 → 3 전지 방향 뒤집기.  전자 수·속도는 모식. 전류의 방향은 늘 (+)극 → (−)극, 전자는 반대. */
const SPC=SIMSPEC.define({id:'cc',
  vars:[{id:'pred',label:'예상',choice:[[-1,'모름'],[0,'안 켜진다'],[1,'켜진다']],def:null}],
  reads:[{id:'bulb',label:'전구'},{id:'el',label:'전선 속 전자'},{id:'cur',label:'전류의 방향'},{id:'cmp',label:'예상과 비교'},{id:'drift',label:'전자의 실제 이동 속도 (교과서 밖)',beyond:true}],
  flow:[{label:'예상: 스위치를 닫으면 전구는?',var:'pred'},
        {label:'스위치 닫기 · 열기',act:'sw',btn:'스위치 닫기'},
        {label:'전지의 방향을 뒤집어 보기',act:'flip',btn:'전지 뒤집기'}],
  extra:[{id:'sw',label:'스위치 닫기',onClick:sp=>{const D=sp.data;if(D.init){D.openT=D.openT?0:1;D.used=1;}}},
         {id:'flip',label:'전지 뒤집기',onClick:sp=>{const D=sp.data;if(D.init&&D.used){D.flipT=D.flipT?0:1;D.flipped=1;}}}],
  pace:.5,compact:true,
  scale:{mode:'schematic',note:'전자 수·속도·크기는 비율 없이 그린 모식도'},motion:true});
ANIMS.sim_cc=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o,false);
  let D=SPC.data;if(!D.init)Object.assign(D,{init:1,S:cfSt(),openT:1,flipT:0,used:0,flipped:0,tt:0,sig:''});
  const v=SPC.v,dt=SPC.dt(o.t);D.tt+=dt;const t=D.tt,S=D.S;
  const Hu=H-SPC.readsHeight(24)-(o.legendGap||30)-6,k=Math.min(W/820,Hu/640)*.95,R=Math.min(W*.115,Hu*.15),cy=R+22,G=cfLoop(W*.16,cy+R+Hu*.1,W*.68,Hu*.36,k);
  const vel=cfStep(S,dt,D.openT,D.flipT,R,k);
  cfCircuit(ctx,G,{open:S.open,pos:S.pos,lv:S.fl,flip:D.flipT,t});
  cfLens(ctx,G,{cx:G.x+G.w*.46,cy,R,u:G.w*.2,t,vel,lp:S.lp,arrows:true});
  // 전자(안쪽, 파랑)는 (−)극에서 나와 (+)극으로, 전류(바깥쪽, 주황)는 그 반대로 — 방향이 바뀔 때는 화살표를 잠깐 지운다
  const sgE=S.dirv<0?-1:1,al=S.fl*Math.min(1,Math.abs(S.dirv)*1.6);
  cfFlowArrows(ctx,G,{sg:sgE,col:C_NEG,side:-1,rev:1,tr:S.tr,alpha:al,n:6});cfFlowArrows(ctx,G,{sg:-sgE,col:C_POS,side:1,rev:1,tr:S.tr,alpha:al,n:6});
  if(al>.5)txt(ctx,'주황 = 전류의 방향 · 파랑 = 전자의 이동 방향',W*.5,Hu*.97,22,TH.ink,'center',800);
  const on=S.fl>.6,off=S.fl<.2;
  Object.assign(SPC.r,{bulb:off?'꺼져 있다':(on?'켜져 있다':'…'),el:off?'여러 방향으로 불규칙하게 움직인다':(on?'전지의 (−)극에서 (+)극 쪽으로 이동한다':'움직이기 시작한다'),
    cur:off?'흐르지 않는다':(on?'전지의 (+)극에서 (−)극 쪽으로 흐른다':'…'),
    cmp:D.used&&on?(v.pred<0?'예상을 고르지 않았다':(v.pred===1?'예상과 같다!':'예상과 달리 켜졌다! 왜일까?')):'-',drift:'매우 느리다 (보통 1 mm/s 이하) — 그래도 스위치를 닫으면 전구는 거의 즉시 켜진다'});
  SPC.btnText('sw',D.openT?'스위치 닫기':'스위치 열기');SPC.btnText('flip',D.flipT?'전지 되돌리기':'전지 뒤집기');
  const sig=[v.pred>=0,D.used,D.flipped].join('|');if(sig!==D.sig){D.sig=sig;SPC.setFlow({pred:v.pred>=0?'done':'now',sw:v.pred>=0?'now':'',flip:D.used?'now':'lock'});}
  readsAt(SPC,o);};};

/* ================= 시뮬레이션 ② 물 흐름 모형 짝짓기 (id: wm) — 교과서 '해 보기' =================
   물 흐름 모형의 한 부분이 깜빡이면 → 전기 회로에서 짝을 고른다(맞으면 두 쪽이 같은 색으로 연결, 틀리면 힌트). 다 맞히면 밸브(스위치)를 닫았다 열어 보며 두 모형이 함께 멈추는 것을 확인한다. */
const CF_ASK=[2,1,4,0,3];   // 묻는 순서: 펌프 → 물레방아 → 밸브 → 물의 흐름 → 물의 높이차
const CF_HINT={2:'펌프는 물을 끌어 올려 높이차를 유지했어. 전기 회로에서 전압을 유지하는 것은?',1:'물레방아는 물이 흐르면 돌아가. 전기 회로에서 전류가 흐르면 일을 하는 것은?',4:'밸브를 닫으면 물이 멈췄어. 전기 회로에서 전류를 멈추게 하는 것은?',0:'물이 흐르는 것과 같은 것은 전기 회로에서 무엇이 흐르는 것일까?',3:'물이 흐르게 하는 원인은 높이차였어. 전기 회로에서 전류가 흐르게 하는 원인은?'};
const CF_OKM={2:'펌프 = 전지 : 둘 다 흐름을 계속 이어 주는 높이차(전압)를 유지한다.',1:'물레방아 = 전구 : 물이 흐르면 물레방아가 돌고, 전류가 흐르면 전구에 불이 켜진다.',4:'밸브 = 스위치 : 닫으면 물도 전류도 멈춘다.',0:'물의 흐름 = 전류 : 흐르는 것이 짝이다.',3:'물의 높이차 = 전압 : 흐르게 하는 원인이 짝이다.'};
const SPW=SIMSPEC.define({id:'wm',
  vars:[{id:'guess',label:'전기 회로에서 짝은?',choice:[[0,'전류'],[1,'전구'],[2,'전지'],[3,'전압'],[4,'스위치']],def:null}],
  reads:[{id:'q',label:'깜빡이는 부분'},{id:'fb',label:'결과'},{id:'pg',label:'맞힌 짝'}],
  flow:[{label:'밸브(스위치)를 닫았다 열어 보자 → 두 회로가 어떻게 될까?',act:'valve',btn:'밸브 닫기'},{label:'깜빡이는 물 모형 부분과 같은 역할을 하는 전기 회로 부분은?',var:'guess'}],
  extra:[{id:'valve',label:'밸브 닫기',onClick:sp=>{const D=sp.data;if(!D.init)return;D.openT=D.openT?0:1;if(D.openT)D.closed=1;else if(D.closed)D.cyc=1;}}],
  pace:.5,compact:true,
  scale:{mode:'schematic',note:'물 모형과 전기 회로를 같은 크기·같은 자리에 그린 모식도'},motion:true});
ANIMS.sim_wm=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o,false);
  let D=SPW.data;if(!D.init)Object.assign(D,{init:1,S:cfSt(),openT:0,closed:0,cyc:0,ask:0,done:[],msg:'',wrong:0,hold:0,tt:0,sig:''});
  const v=SPW.v,dt=SPW.dt(o.t);D.tt+=dt;const S=D.S;o.Hu=H-SPW.readsHeight(24)-(o.legendGap||30)-8;cfStep(S,dt,D.openT,0,60,CFK(o)*.68);
  if(D.hold>0){D.hold-=dt;if(D.hold<=0){D.ask++;D.msg=D.ask>=5?'모두 맞혔다! 밸브를 다시 눌러 두 회로가 함께 움직이는지 확인해 보자.':'';}}
  if((v.guess!=null&&v.guess>=0)&&D.cyc&&D.ask<5&&D.hold<=0){const T=CF_ASK[D.ask];
    if(v.guess===T){D.done.push(T);D.msg='✓ 정답! '+CF_OKM[T];D.hold=1.6;}else{D.wrong++;D.msg='✗ 아니야. '+CF_HINT[T];}
    SPW.set('guess',null);}
  else if((v.guess!=null&&v.guess>=0))SPW.set('guess',null);
  o.t=D.tt;
  const T=D.ask<5?CF_ASK[D.ask]:-1,wOnly=(D.cyc&&T>=0&&D.hold<=0)?[T]:[];
  cfModel(o,S,D.done,wOnly);
  if(!D.cyc)Object.assign(SPW.r,{q:'먼저 밸브부터',fb:D.openT?'밸브를 닫았다 → 물이 멈췄다. 전기 회로도 스위치가 열려 전류가 멈췄다. 다시 열어 보자!':'밸브를 눌러 닫아 보자. 물 회로와 전기 회로가 어떻게 될까?',pg:'0 / 5'});
  else Object.assign(SPW.r,{q:T>=0?(D.hold>0?'(맞혔다)':CF_NM[T][0]):'모두 맞혔다',fb:D.msg||(T>=0?(D.ask===0?'두 회로가 똑같이 움직였다! 그럼 짝은? 깜빡이는 부분부터 찾아보자':'깜빡이는 부분과 같은 역할을 하는 전기 회로 부분을 골라 보자'):(D.openT?'밸브가 닫혀 물이 멈춘다 ↔ 스위치가 열려 전류가 멈춘다':'밸브가 열려 물이 흐른다 ↔ 스위치가 닫혀 전류가 흐른다')),pg:D.done.length+' / 5'});
  if(D.ask>=5&&!D.msg)D.msg='';
  SPW.btnText('valve',D.openT?'밸브 열기':'밸브 닫기');
  const sig=[D.cyc,D.ask>=5].join('|');if(sig!==D.sig){D.sig=sig;SPW.setFlow({valve:'now',guess:!D.cyc?'lock':(D.ask>=5?'done':'now')});}
  readsAt(SPW,o);};};

/* ================= 도전: P점의 방향을 맞혀라 (CH = lib.js) =================
   문제마다 전지의 방향과 점 P 의 자리가 무작위로 바뀐다. 전자의 흐름은 보이지 않는다(정답을 맞히면 보인다). 전류 = (+)극 → (−)극, 전자는 반대. */
ANIMS.chal=o=>{const S=cfSt();o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=cfTick(o),k=CFK(o),G=cfLoop(W*.2,H*.28,W*.6,H*.42,k);
  cfStep(S,dt,0,CH.flip,60,k);
  cfCircuit(ctx,G,{open:0,pos:CH.solved?S.pos:0,lv:1,flip:CH.flip,t,hide:!CH.solved,jit:CH.solved?3:0});
  const sp=CF_SPOTS[CH.spot],e=sp[0],f=sp[1],u={top:G.w*f,right:G.w+G.h*f,bottom:G.w+G.h+G.w*(1-f),left:2*G.w+G.h+G.h*(1-f)}[e],p=cfPos(G,u);
  ctx.beginPath();ctx.arc(p.x,p.y,13*k+3,0,PI2);ctx.fillStyle=TH.ink;ctx.fill();txt(ctx,'P',p.x+p.ty*40,p.y-p.tx*40,36,TH.ink,'center',900);
  if(CH.solved){const sg=CH.flip?-1:1,al=S.fl*Math.min(1,Math.abs(S.dirv)*1.6);cfFlowArrows(ctx,G,{sg:-sg,col:C_NEG,side:-1,rev:1,tr:S.tr,alpha:al,n:6});cfFlowArrows(ctx,G,{sg:sg,col:C_POS,side:1,rev:1,tr:S.tr,alpha:al,n:6});
    txt(ctx,'주황 = 전류 · 파랑 = 전자',W*.5,H*.9,28,TH.ink,'center',800);}
  else{txt(ctx,'전류가 흐르고 있다 — 전자의 흐름은 보이지 않는다',W*.5,H*.12,28,TH.ink,'center',800);txt(ctx,'전지의 극 표시를 보고 점 P에서의 방향을 추리해 보자',W*.5,H*.9,26,TH.sub,'center',700);}
  if(CH.solved)for(let i=0;i<CH.stars;i++)cfStar(ctx,W*.5+(i-(CH.stars-1)/2)*60,H*.1,24,'#F4C33B');};};

/* ---------- Q4 그림: 전지(+ 위쪽) · 스위치 닫힘 · 전구 · 점 P(위) · 점 Q(아래). 전자는 그리지 않는다 (물음의 단서가 아니므로) ---------- */
ANIMS.q4=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const ph=o.phase||0,k=Math.min(W/820,H/430)*1.0,G=cfLoop(W*.17,H*.28,W*.66,H*.44,k);
  cfCircuit(ctx,G,{open:0,pos:0,lv:1,t,hide:true,wireW:2.5});
  [['P','top',.22,-1],['Q','bottom',.55,1]].forEach(a=>{const u=a[1]==='top'?G.w*a[2]:G.w+G.h+G.w*(1-a[2]),p=cfPos(G,u);
    ctx.beginPath();ctx.arc(p.x,p.y,9*k+3,0,PI2);ctx.fillStyle=TH.ink;ctx.fill();txt(ctx,a[0],p.x-(a[0]==='P'?34:0),p.y+a[3]*(a[0]==='P'?-36:46),36,TH.ink,'center',900);
    if(a[0]==='Q'&&ph>=3)txt(ctx,'Q : 1초 동안 6개',p.x+46,p.y+46,30,C_NEG,'left',900);});
  const P=cfPos(G,G.w*.22);
  if(ph>=1)arrow(ctx,P.x+30*k,P.y-34*k,P.x+140*k,P.y-34*k,C_POS,8,22);
  if(ph>=2)arrow(ctx,P.x+140*k,P.y+34*k,P.x+30*k,P.y+34*k,C_NEG,8,22);
  if(ph>=2){   // 전자 이동 모의실험: 굵은 도선(단면이 넓다) → 전자가 세 줄로 많이 들어 있어 같은 전류(1초에 6개)에서도 전자가 더 느리게 이동한다. (I = n·e·A·v)
    const lanes=[-11*k,0,11*k],nl=24,sp=G.per/nl,vel=2*sp,r=Math.max(7,8.4*k),uq=G.w+G.h+G.w*.45,bandLen=vel;   // 한 줄에서 1초에 2개 × 3줄 = 6개
    if(ph>=3){ctx.save();const q0=cfPos(G,uq);ctx.fillStyle='rgba(31,122,108,.2)';ctx.fillRect(q0.x-bandLen,q0.y-24*k,bandLen,48*k);ctx.setLineDash([9,7]);ctx.strokeStyle='#1F7A6C';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(q0.x,q0.y-34*k);ctx.lineTo(q0.x,q0.y+34*k);ctx.stroke();ctx.restore();}
    lanes.forEach((lo,li)=>{const RP=cfRound(G,lo,Math.max(Math.abs(lo),14*k));
      for(let i=0;i<nl;i++){const u=((i*sp+li*sp/3-vel*t)%G.per+G.per)%G.per;
        if(cfDist(G,u,cfUbat(G))<66*k||cfDist(G,u,cfUbulb(G))<48*k||cfDist(G,u,cfUsw(G))<32*k)continue;
        const p=RP.pos(u);chg(ctx,p.x,p.y,-1,r);}});
    if(ph>=3){txt(ctx,'초록 칸 = 1초 동안 가는 거리 → 전자 6개',G.x+G.w*.5,G.y+G.h+84*k,26,'#1F7A6C','center',800);txt(ctx,'굵은 도선: 전자가 많아서 같은 전류에도 천천히 움직인다',G.x+G.w*.5,G.y+G.h+120*k,22,TH.sub,'center',700);}}};};

  <div class="flow"><div class="fstep now"><span class="fnum">1</span><div class="fbody"><div class="flab">점 P에서 <b style="color:#B4540F">전류</b>의 방향은?</div><div class="gkinds" data-g="0">${CFB(0)}</div></div></div>

  <div class="chbar"><button class="cbtn go" data-chact="check">정답 확인</button><button class="cbtn" data-chact="hint">💡 힌트</button><button class="cbtn" data-chact="new">↻ 새 문제</button></div>
  <div class="chmsg" data-chmsg></div><div class="chstar" data-chstar></div></div>`;
function chRender(root){
  root.querySelectorAll('.gkinds').forEach(g=>{const i=+g.dataset.g;g.querySelectorAll('.cbtn').forEach(b=>{const on=CH.ans[i]!==null&&+b.dataset.d===CH.ans[i];
    b.classList.toggle('sel',on&&CH.res[i]==null);b.classList.toggle('ok',on&&CH.res[i]===true);b.classList.toggle('bad',on&&CH.res[i]===false);});});
  const m=root.querySelector('[data-chmsg]');m.textContent=CH.msg;m.className='chmsg'+(CH.cls?' '+CH.cls:'');
  root.querySelector('[data-chstar]').textContent='★ 모은 별 '+CH.total+'개 · 도전 '+CH.round+'번째';
  root.querySelector('[data-chact="check"]').disabled=CH.solved;}
const CH_HINTS=['전지의 긴 쪽 극(+)을 찾아보자. 전류는 어느 극에서 나올까?','전류는 (+)극에서 나와 회로를 한 바퀴 돌아 (−)극으로 들어가. 점 P에서는 어느 쪽을 향할까?','전자는 전류와 반대 방향으로 움직여!'];
function chCheck(){
  if(CH.ans.some(a=>a===null)){CH.msg='전류와 전자의 방향을 모두 골라 줘!';CH.cls='bad';return;}
  CH.res=[CH.ans[0]===CH.curDir(),CH.ans[1]===CH.elDir()];
  if(CH.res.every(Boolean)){CH.solved=true;CH.stars=Math.max(1,3-CH.hints-CH.wrong);CH.total+=CH.stars;CH.cls='ok';
    CH.msg='정답! 별 '+CH.stars+'개를 얻었어. 전류는 (+)극에서 (−)극으로, 전자는 그 반대로 움직여.';return;}
  CH.wrong++;CH.cls='bad';
  CH.msg=(CH.res[0]===false&&CH.res[1]===false&&CH.ans[0]===CH.elDir()&&CH.ans[1]===CH.curDir())?'전류와 전자의 방향을 서로 바꿔 쓴 것 같아. 전류는 어느 극에서 나올까?':(CH.res[0]===false?'전류의 방향을 다시 생각해 보자. 전류는 (+)극에서 나와.':'전자의 방향을 다시 생각해 보자. 전자는 전류와 반대로 움직여.');}
function chEnter(el){
  const root=el.querySelector('.chbox');if(!root)return;CH.shuffle();CH.reset();
  if(!root._b){root._b=1;stopAll(root);
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.blur();
      if(b.dataset.d!=null&&!CH.solved){const i=+b.dataset.g;CH.ans[i]=+b.dataset.d;CH.res[i]=null;}
      else if(b.dataset.chact==='check'&&!CH.solved)chCheck();
      else if(b.dataset.chact==='hint'&&!CH.solved){CH.msg='💡 '+CH_HINTS[Math.min(CH.hints,2)];CH.hints=Math.min(3,CH.hints+1);CH.cls='';}
      else if(b.dataset.chact==='new'){CH.round++;CH.shuffle();CH.reset();}
      chRender(root);});}
  chRender(root);}
