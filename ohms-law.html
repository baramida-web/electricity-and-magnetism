const OH_VOLTS=D.VOLTS;                       // [0,1.5,3,4.5,6]
const OH_RS=D.R_SHORT, OH_RL=D.R_LONG;        // 10 Ω, 20 Ω
const OHK=o=>Math.min(o.W/820,o.H/620);
const ohWC=r=>r===OH_RL?OH.LONG:(r===OH_RS?OH.SHORT:OH.RES);     // 저항 → 그래프 색
const ohFmtA=(a,d)=>{if(d==='a'){d=3;for(let q=1;q<=3;q++)if(Math.abs(a*Math.pow(10,q)-Math.round(a*Math.pow(10,q)))<1e-9){d=q;break;}}return a.toFixed(d==null?3:d)+' A';};   // d: 소수 자릿수. 'a' = 딱 떨어지는 자리까지만(2 → 2.0 A, 0.15 → 0.15 A)
function ohTick(o){const t=o.t,dt=o._pt==null?0:Math.max(0,Math.min(.1,t-o._pt));o._pt=t;return dt;}

/* ---------- 회로(직사각형 고리) 기하: 시계 방향, 왼쪽 위 모서리에서 시작 ---------- */
function ohLoop(x,y,w,h,k){return {x,y,w,h,k,per:2*(w+h)};}
function ohPos(G,u){u=((u%G.per)+G.per)%G.per;
  if(u<G.w)return {x:G.x+u,y:G.y,tx:1,ty:0};u-=G.w;
  if(u<G.h)return {x:G.x+G.w,y:G.y+u,tx:0,ty:1};u-=G.h;
  if(u<G.w)return {x:G.x+G.w-u,y:G.y+G.h,tx:-1,ty:0};u-=G.w;
  return {x:G.x,y:G.y+G.h-u,tx:0,ty:-1};}
const ohDist=(G,a,b)=>{const d=Math.abs(((a-b)%G.per+G.per)%G.per);return Math.min(d,G.per-d);};
const ohUsup=G=>2*G.w+1.5*G.h;     // 전원(왼쪽 가운데)의 경로 좌표
const ohUamm=G=>G.w+G.h+G.w/2;     // 전류계(아래쪽 가운데)
const ohUsw=G=>G.w*.2;             // 스위치(위쪽 왼쪽)

/* ---------- 부품 ---------- */
function ohNichrome(ctx,x0,x1,y,k,th,col){   // 가로 지그재그. th = 굵기(배율)
  const amp=13*k*(.7+.3*th),n=Math.max(3,Math.round((x1-x0)/(24*k))),seg=(x1-x0)/(n*2+2);
  ctx.save();ctx.strokeStyle=col||OH.RES;ctx.lineWidth=Math.max(3,4.2*k*th);ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+seg,y);for(let i=0;i<n*2;i++)ctx.lineTo(x0+seg*(2+i),y+(i%2?-amp:amp));ctx.lineTo(x1-seg,y);ctx.lineTo(x1,y);ctx.stroke();ctx.restore();}
function ohMeter(ctx,x,y,r,label,col,glow,t){
  if(glow){const p=.5+.5*Math.sin((t||0)*5);ctx.save();ctx.strokeStyle=col;ctx.lineWidth=7;ctx.globalAlpha=.5+.4*p;ctx.shadowColor=col;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(x,y,r+9,0,PI2);ctx.stroke();ctx.restore();}
  ctx.beginPath();ctx.arc(x,y,r,0,PI2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=Math.max(4,r*.14);ctx.strokeStyle=col;ctx.stroke();
  txt(ctx,label,x,y+1,r*1.15,col,'center',900);}
function ohSupply(ctx,x,y,k,V,glow,t){    // 직류 전원 장치: 위쪽 단자 (+), 아래쪽 단자 (−)
  const w=60*k,h=80*k;
  if(glow){const p=.5+.5*Math.sin((t||0)*5);ctx.save();ctx.strokeStyle=OH.VOLT;ctx.lineWidth=7;ctx.globalAlpha=.5+.4*p;ctx.shadowColor=OH.VOLT;ctx.shadowBlur=14;rr(ctx,x-w/2-9,y-h/2-9,w+18,h+18,18);ctx.stroke();ctx.restore();}
  rr(ctx,x-w/2,y-h/2,w,h,12*k);ctx.fillStyle='#EDE7F7';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OH.VOLT;ctx.stroke();
  rr(ctx,x-w*.36,y-h*.38,w*.72,h*.34,6*k);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.stroke();
  txt(ctx,V==null?'':V.toFixed(1),x,y-h*.21,Math.max(22,24*k),OH.VOLT,'center',900);
  [[-1,OH.CUR],[1,OH.INK]].forEach(([s,c])=>{ctx.beginPath();ctx.arc(x,y+s*h/2,7*k+1,0,PI2);ctx.fillStyle=c;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.stroke();});
  txt(ctx,'(+)',x+w/2+8,y-h/2+6,22,OH.CUR,'left',900);txt(ctx,'(−)',x+w/2+8,y+h/2-6,22,OH.INK,'left',900);}
function ohSwitch(ctx,x,y,k,closed){const L=44*k,x0=x-L/2,x1=x+L/2,a=closed?0:.5;
  ctx.save();ctx.fillStyle=OH.BG;ctx.fillRect(x0-6,y-10,L+12,20);
  ctx.strokeStyle=OH.WIRE;ctx.lineWidth=8*k;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+L*Math.cos(a),y-L*Math.sin(a));ctx.stroke();
  ctx.fillStyle='#fff';ctx.lineWidth=4;[x0,x1].forEach(px=>{ctx.beginPath();ctx.arc(px,y,6.5*k,0,PI2);ctx.fill();ctx.stroke();});ctx.restore();}

/* 전선: 부품이 있는 자리(경로 좌표 구간)는 비워 둔다 */
function ohWireSeg(ctx,G,u0,u1,col,wd){const pts=[ohPos(G,u0)];
  [G.w,G.w+G.h,2*G.w+G.h].forEach(c=>{if(c>u0&&c<u1)pts.push(ohPos(G,c));});
  const e=ohPos(G,u1);pts.push(e);
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.restore();}
function ohLoopWire(ctx,G,gaps,m){m=m||1;
  // gaps: [[a,b],…] 경로 좌표(0..per) 오름차순, 겹치지 않음
  const edges=[0];gaps.forEach(g=>{edges.push(g[0],g[1]);});edges.push(G.per);
  [[OH.WIRE,13*G.k*m],[OH.WIRE_L,5.5*G.k*m]].forEach(([c,w])=>{for(let i=0;i<edges.length;i+=2)if(edges[i+1]>edges[i])ohWireSeg(ctx,G,edges[i],edges[i+1],c,w);});}

/* ---------- 실험 회로 전체 ----------
   s: { I 전류(A) · V 전압(V) · R 저항(Ω, 길이를 정한다) · th 굵기 배율 · pos 전자가 간 길이 · t · hl {amm,volt,res,sup} · meters · rlab 저항 이름표 · arrows 전류 화살표 · jit 떨림 }
   위쪽에 전압계(병렬), 아래쪽에 전류계(직렬)가 놓인다. 전자는 전지의 (−)극에서 나와 (+)극으로(= 전류의 반대로) 움직인다. */
function ohCircuit(ctx,G,s){const k=G.k,I=s.I||0,hl=s.hl||{},t=s.t||0,yT=G.y,yB=G.y+G.h,xs=ohUsw(G),rl=G.w*Math.min(.4,Math.max(.08,.36*s.R/OH_RL)),th=s.th||1;
  const rLen=s.rLen!=null?s.rLen:rl,nx0=G.x+G.w*.72-rLen/2,nx1=nx0+rLen;
  const uS=ohUsup(G),uA=ohUamm(G),zone=(a,hw)=>[a-hw,a+hw];
  // 전선(부품 자리 비움): 전원 · 스위치 · 전류계 · 니크롬선
  const gaps=[zone(xs,26*k),[nx0-G.x,nx1-G.x],zone(uA,28*k),zone(uS,46*k)].sort((a,b)=>a[0]-b[0]);
  ohLoopWire(ctx,G,gaps,s.wireW);
  // 전자
  if(!s.hideEl){const n=s.N||28,r=Math.max(8,9*k);
    for(let i=0;i<n;i++){const u=i*G.per/n-(s.pos||0);
      if(ohDist(G,u,uS)<50*k||ohDist(G,u,uA)<34*k||ohDist(G,u,xs)<30*k)continue;
      const p=ohPos(G,u),inR=(p.y===yT&&p.x>nx0&&p.x<nx1),j=(inR?(s.jit==null?5:s.jit)*Math.min(1,I*6+.15):2)*k;
      chg(ctx,p.x+Math.sin(t*(1.7+i%5*.31)+i*2.1)*j,p.y+Math.cos(t*(2.1+i%7*.23)+i*1.3)*j,-1,r);}}
  // 부품
  ohSupply(ctx,G.x,G.y+G.h/2,k,s.V,hl.sup,t);
  ohSwitch(ctx,G.x+xs,yT,k,true);
  ohNichrome(ctx,nx0,nx1,yT,k,th,OH.RES);
  if(hl.res){const p=.5+.5*Math.sin(t*5);ctx.save();ctx.strokeStyle=OH.RES;ctx.lineWidth=7;ctx.globalAlpha=.5+.4*p;ctx.shadowColor=OH.RES;ctx.shadowBlur=14;rr(ctx,nx0-14,yT-34*k-6,rLen+28,68*k+12,16);ctx.stroke();ctx.restore();}
  if(s.rlab)txt(ctx,s.rlab,(nx0+nx1)/2,yT+44*k+8,24,OH.RES,'center',900);
  // 전류계(아래, 직렬)
  const ax=G.x+uA-(G.w+G.h),ay=yB;
  ctx.save();ctx.fillStyle=OH.BG;ctx.fillRect(ax-30*k,ay-30*k,60*k,60*k);ctx.restore();
  ohMeter(ctx,ax,ay,26*k+2,'A',OH.CUR,hl.amm,t);
  if(s.meters!==false)txt(ctx,ohFmtA(I,s.dg),ax,ay+46*k+14,26,OH.CUR,'center',900);
  // 전압계(위, 병렬): 니크롬선 양끝에서 위로 올라간 전선
  const vy=yT-74*k-6,vx=(nx0+nx1)/2;
  ctx.save();ctx.strokeStyle=OH.WIRE;ctx.lineWidth=7*k;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(nx0,yT);ctx.lineTo(nx0,vy);ctx.lineTo(vx-28*k,vy);ctx.moveTo(nx1,yT);ctx.lineTo(nx1,vy);ctx.lineTo(vx+28*k,vy);ctx.stroke();
  [nx0,nx1].forEach(px=>{ctx.beginPath();ctx.arc(px,yT,6.5*k,0,PI2);ctx.fillStyle=OH.INK;ctx.fill();});ctx.restore();
  ohMeter(ctx,vx,vy,26*k+2,'V',OH.VOLT,hl.volt,t);
  if(s.meters!==false)txt(ctx,(s.V==null?0:s.V).toFixed(1)+' V',vx+(rLen/2+34*k+2),vy,26,OH.VOLT,'left',900);
  // 전류의 방향(주황, 시계 방향): 전류가 흐를 때만
  if(s.arrows&&I>.002){const a=Math.min(1,.35+I*2.2);
    [G.w*.4,G.w+G.h*.5,G.w+G.h+G.w*.25,2*G.w+G.h+G.h*.84].forEach(u=>{
      const p=ohPos(G,u),ox=p.ty*(34*k),oy=-p.tx*(34*k),L=44*k;ctx.save();ctx.globalAlpha=a;
      arrow(ctx,p.x+ox-p.tx*L/2,p.y+oy-p.ty*L/2,p.x+ox+p.tx*L/2,p.y+oy+p.ty*L/2,OH.CUR,6,17);ctx.restore();});}
  return {nx0,nx1,vx,vy,ax,ay};}

/* ---------- 작은 회로(저항 하나 + 전류계): 비교 장면용 ----------
   box: {x,y,w,h}. s: {V,R,I,pos,t,label,col,th,rLen} */
function ohMini(ctx,box,s){const {x,y,w,h}=box,k=Math.min(w/360,h/200),I=s.I==null?s.V/s.R:s.I,t=s.t||0,L=x+56*k+10,R=x+w-40*k-4,T=y+h*.28,Bt=y+h*.86,col=s.col||OH.RES;
  ctx.save();ctx.strokeStyle=OH.WIRE;ctx.lineWidth=11*k;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(R,T);ctx.lineTo(R,Bt);ctx.lineTo(L,Bt);ctx.lineTo(L,T);ctx.stroke();
  ctx.strokeStyle=OH.WIRE_L;ctx.lineWidth=4.5*k;ctx.stroke();ctx.restore();
  // 전자(반시계)
  const rf=s.rf==null?.44:s.rf,RX0=(L+R)/2-(R-L)*rf/2,RX1=(L+R)/2+(R-L)*rf/2;   // rf: 위쪽 전선에서 저항(지그재그)이 차지하는 비율 — 저항의 크기에 비례하게 준다
  const per=2*((R-L)+(Bt-T)),n=Math.max(10,Math.round(per/(26)));
  for(let i=0;i<n;i++){let u=((i*per/n-(s.pos||0))%per+per)%per,px,py,w1=R-L,h1=Bt-T;
    if(u<w1){px=L+u;py=T;}else if((u-=w1)<h1){px=R;py=T+u;}else if((u-=h1)<w1){px=R-u;py=Bt;}else{u-=w1;px=L;py=Bt-u;}
    const nx=px>RX0&&px<RX1&&py===T;if(nx||(px===L&&Math.abs(py-(T+Bt)/2)<38*k)||(px===R&&Math.abs(py-(T+Bt)/2)<34*k))continue;
    chg(ctx,px+Math.sin(t*2+i)*2,py+Math.cos(t*2.3+i*1.3)*2,-1,8);}
  // 저항(위쪽 가운데)
  const rx0=RX0,rx1=RX1;ctx.save();ctx.fillStyle=OH.BG;ctx.fillRect(rx0-3,T-18*k,rx1-rx0+6,36*k);ctx.restore();
  ohNichrome(ctx,rx0,rx1,T,k,s.th||1,col);
  if(s.label)txt(ctx,s.label,(rx0+rx1)/2,s.labelBelow?T+30*k+16:T-30*k-8,24,col,'center',900);
  // 전원(왼쪽 · 배터리 기호처럼 보라색 상자)
  ctx.save();ctx.fillStyle=OH.BG;ctx.fillRect(L-22*k,(T+Bt)/2-34*k,44*k,68*k);ctx.restore();
  rr(ctx,L-24*k,(T+Bt)/2-34*k,48*k,68*k,10*k);ctx.fillStyle='#EDE7F7';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=OH.VOLT;ctx.stroke();
  txt(ctx,'+',L,(T+Bt)/2-17*k,22,OH.CUR,'center',900);txt(ctx,'−',L,(T+Bt)/2+17*k,22,OH.INK,'center',900);   // 극 표시(v3.26): 위 (+), 아래 (−) — 전자는 (−)에서 나와 회로를 돌아 (+)로 들어간다(반시계)
  txt(ctx,s.V.toFixed(1)+' V',L-24*k-6,(T+Bt)/2,24,OH.VOLT,'right',900);
  // 전류계(오른쪽)
  ctx.save();ctx.fillStyle=OH.BG;ctx.fillRect(R-26*k,(T+Bt)/2-26*k,52*k,52*k);ctx.restore();
  ohMeter(ctx,R,(T+Bt)/2,22*k+2,'A',OH.CUR,false,t);
  if(s.readout!==false){const rx=R+22*k+8,ry=(T+Bt)/2,str=ohFmtA(I,s.dg);
    if(s.fx!=null){   // 값이 나타날 때 '톡' 커졌다 가라앉고, 그 뒤로는 은은하게 빛난다(강조 효과)
      const a=s.fx,sc=1+.55*Math.exp(-a*4.5)*Math.cos(a*9),pl=.5+.5*Math.sin(a*4),w=ctx.measureText?(str.length*17+34):90;
      ctx.save();ctx.translate(rx,ry);ctx.scale(sc,sc);
      const g=ctx.createRadialGradient(w/2,0,4,w/2,0,w*.9);g.addColorStop(0,'rgba(244,195,59,'+(.55+.25*pl)+')');g.addColorStop(1,'rgba(244,195,59,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(w/2,0,w*.9,0,PI2);ctx.fill();
      rr(ctx,-8,-22,w,44,22);ctx.fillStyle='#FFF4D2';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=OH.CUR;ctx.stroke();
      txt(ctx,str,6,1,30,OH.CUR,'left',900);ctx.restore();}
    else txt(ctx,str,rx,ry,24,OH.CUR,'left',900);}
  return {rx0,rx1,T,k};}

/* ---------- 그래프 ----------
   ohGraph(ctx,x,y,w,h,{vmax,imax}) → {X(v), Y(i)} 축·눈금·제목을 그린다 */
function ohGraph(ctx,x,y,w,h,o){o=o||{};const vmax=o.vmax||6,imax=o.imax||.6,ox=x+106,oy=y+10,gw=w-106-26,gh=h-10-62;
  const X=v=>ox+gw*v/vmax,Y=i=>oy+gh*(1-i/imax);
  ctx.save();ctx.strokeStyle='#D5E0DD';ctx.lineWidth=1.5;
  for(let k=1;k<=4;k++){ctx.beginPath();ctx.moveTo(X(vmax*k/4),oy);ctx.lineTo(X(vmax*k/4),oy+gh);ctx.stroke();ctx.beginPath();ctx.moveTo(ox,Y(imax*k/4));ctx.lineTo(ox+gw,Y(imax*k/4));ctx.stroke();}
  ctx.strokeStyle=OH.INK;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(ox,oy-6);ctx.lineTo(ox,oy+gh);ctx.lineTo(ox+gw+8,oy+gh);ctx.stroke();ctx.restore();
  for(let k=1;k<=4;k++){txt(ctx,(vmax*k/4).toFixed(1),X(vmax*k/4),oy+gh+22,22,OH.SUB,'center',700);txt(ctx,(imax*k/4).toFixed(2),ox-12,Y(imax*k/4),22,OH.SUB,'right',700);}
  txt(ctx,'0',ox-14,oy+gh+22,22,OH.SUB,'right',700);   // 원점은 가로·세로 눈금 0 을 따로 쓰지 않고 '0' 한 번만
  txt(ctx,'전압(V)',ox+gw/2,oy+gh+50,24,OH.INK,'center',900);
  ctx.save();ctx.translate(x+14,oy+gh/2);ctx.rotate(-Math.PI/2);txt(ctx,'전류의 세기(A)',0,0,24,OH.INK,'center',900);ctx.restore();
  return {X,Y,ox,oy,gw,gh};}
function ohLine(ctx,G,pts,col,wd,dots){   // pts: [[v,i],…]
  if(!pts.length)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=wd||5;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(G.X(p[0]),G.Y(p[1])):ctx.moveTo(G.X(p[0]),G.Y(p[1])));ctx.stroke();
  if(dots!==false)pts.forEach(p=>{ctx.beginPath();ctx.arc(G.X(p[0]),G.Y(p[1]),8,0,PI2);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();});ctx.restore();}

/* ---------- 선풍기 (표지·도입) ---------- */
function ohFan(ctx,x,y,r,ang){
  ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.arc(0,0,r,0,PI2);ctx.fillStyle='#F3F6F8';ctx.fill();ctx.lineWidth=Math.max(5,r*.07);ctx.strokeStyle=OH.WIRE;ctx.stroke();
  ctx.save();ctx.rotate(ang);for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-r*.28,-r*.18,-r*.3,-r*.74,0,-r*.84);ctx.bezierCurveTo(r*.3,-r*.74,r*.28,-r*.18,0,0);ctx.fillStyle='#7CC6D4';ctx.fill();ctx.lineWidth=Math.max(3,r*.045);ctx.strokeStyle='#1F7A6C';ctx.stroke();}ctx.restore();
  ctx.beginPath();ctx.arc(0,0,r*.12,0,PI2);ctx.fillStyle='#F4C33B';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#8A6A0A';ctx.stroke();ctx.restore();}
/* 바람 줄: 세기(0~1)에 따라 줄 수·길이가 늘고 오른쪽으로 흘러간다 */
/* 바람 줄무늬: wp = 지금까지 누적한 이동 거리(px). 속도가 바뀌어도 줄무늬는 늘 선풍기에서 멀어지는 쪽(오른쪽)으로만 간다
   (예전엔 phase = t×속도(t)로 계산해서, 바람이 약해지는 동안 줄무늬가 거꾸로 가는 것처럼 보였다) */
function ohWind(ctx,x,y,len,str,wp){const n=2+Math.round(str*4),L=34+46*str;
  ctx.save();ctx.strokeStyle=OH.LONG;ctx.lineCap='round';ctx.lineWidth=5;
  for(let i=0;i<n;i++){const yy=y+(i-(n-1)/2)*34,cyc=len+L,pos=((wp+i*97)%cyc+cyc)%cyc,x0=x+pos-L,x1=x0+L;
    const fade=Math.min(1,pos/60,(cyc-pos)/60);ctx.globalAlpha=(.22+.55*str)*Math.max(0,fade);
    ctx.beginPath();ctx.moveTo(Math.max(x,x0),yy);ctx.lineTo(Math.min(x+len,x1),yy);ctx.stroke();}ctx.restore();}

/* ---------- 도전 활동 ‘어느 선의 그래프일까?’ 상태 (anims.js 의 ANIMS.chal 과 slides.js 의 조작부가 함께 쓴다) ----------
   세 니크롬선: (가) 짧고 굵다 · (나) 길고 굵다 · (다) 길고 가늘다 → 저항 (가) < (나) < (다) → 같은 전압에서 전류 (가) > (나) > (다) → 그래프 가파른 순서.
   color[] = 그래프 색 번호 0 빨강 · 1 초록 · 2 파랑 → 선(가,나,다)에 대응하는 색(무작위 순열) */
const OH_CHW=[{n:'(가)',len:.33,th:1,R:10,txt:'짧고 굵다'},{n:'(나)',len:.66,th:1,R:20,txt:'길고 굵다'},{n:'(다)',len:.66,th:.5,R:40,txt:'길고 가늘다'}];
const OH_CHC=[['ㄱ','#D6282B','빨강'],['ㄴ','#1E8449','초록'],['ㄷ','#2F6FB0','파랑']];   // [그래프 기호, 색, 색 이름] — v3.26: 색만으로 구별하지 않게(색각 차이) 그래프마다 ㄱ·ㄴ·ㄷ 기호를 붙인다. 이 색은 그래프 구분용이며 8쪽의 '파랑 = 긴 선' 약속과 무관
const CH={perm:[0,1,2],ans:[null,null,null],res:[null,null,null],wrong:0,hints:0,round:1,total:0,solved:false,stars:0,msg:'',cls:'',
  shuffle(){const prev=this.perm.join('');let p;do{p=[0,1,2];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}}while(p.join('')===prev);this.perm=p;},   // 피셔–예이츠 섞기(sort(random) 은 순열이 고르게 나오지 않는다)   // perm[w] = 선 w 의 그래프 색 번호
  reset(){this.ans=[null,null,null];this.res=[null,null,null];this.wrong=0;this.hints=0;this.solved=false;this.stars=0;this.msg='세 니크롬선에 알맞은 그래프(ㄱ·ㄴ·ㄷ)를 골라 보자. 같은 전압에서 전류가 어느 쪽이 더 클까?';this.cls='';}};
function ohStar(ctx,x,y,r,col){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#B4540F';ctx.stroke();}

/* 애니메이션: ANIMS.이름 = o => { o.frame = () => {…} }.  슬라이드의 anim:'이름' 과 연결.
   o.phase = 현재 단계(빈칸을 하나 공개할 때마다 1 씩 올라간다), P(o,k,초) = 단계 k 진행도.  빈칸 순서 = 단계 번호.
   모든 값(전자 수·속도·크기)은 모식이다. 전류의 세기 I = 전압/저항 은 CIRC.series(engine/sim_circuit.js)로 계산한다. */
const OHKV=95;   // 전자가 움직이는 빠르기(px/s) = OHKV × 전류의 세기(A) × k  (모식)
function ohSt(){return {pos:0,sm:0};}
function ohRun(S,I,dt,k){S.pos+=I*dt*OHKV*(k||1);return S.pos;}
const ohCap=(o,s,col,y)=>txt(o.ctx,s,o.W*.5,y==null?o.H*.94:y,28,col||TH.ink,'center',800);
const ohI=(V,R)=>CIRC.series(V,[R]).I;          // 전류의 세기(A)
/* 표준 실험 회로 자리 */
function ohBase(o,Hu){Hu=Hu||o.H;const k=Math.min(o.W/860,Hu/640);return {k,G:ohLoop(o.W*.14,Hu*.36,o.W*.7,Hu*.32,k)};}

/* ---------- 표지 · 도입 : 선풍기 바람의 세기 ---------- */
/* 선풍기 장면의 전류 세기(0~1): 약함 → 보통 → 세다 → 보통 …  단계마다 4.5초 머물고 마지막 1초 동안 부드럽게 바뀐다(계속 출렁이면 눈이 어지럽다) */
function ohFanLevel(t){const L=[.12,.5,1,.5],T=4.5,k=Math.floor(t/T)%4,f=t%T,e=f>T-1?ease(f-(T-1)):0;return L[k]+(L[(k+1)%4]-L[k])*e;}
function ohFanScene(o,bg){const S={ang:0,w:3,wp:0};
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);const dt=ohTick(o);
    if(bg){ctx.save();rr(ctx,4,4,W-8,H-8,28);ctx.fillStyle=OH.BG;ctx.fill();ctx.restore();}
    const str=ohFanLevel(t),I=.15+.45*str;S.w+=((1.5+13*str)-S.w)*Math.min(1,dt*3);S.ang+=S.w*dt;S.wp+=(60+190*str)*dt;

    ctx.save();ctx.fillStyle='#CBD5DC';rr(ctx,cx-r*.1,cy+r*.9,r*.2,r*.6,8);ctx.fill();rr(ctx,cx-r*.45,cy+r*1.46,r*.9,r*.14,8);ctx.fill();ctx.restore();

    // 전류의 세기 눈금
    const bx=W*.12,by=H*.9,bw=W*.76;ctx.save();rr(ctx,bx,by,bw,26,13);ctx.fillStyle='#E6ECEA';ctx.fill();rr(ctx,bx,by,Math.max(26,bw*str),26,13);ctx.fillStyle=OH.CUR;ctx.fill();ctx.restore();
    txt(ctx,'회로에 흐르는 전류의 세기 '+I.toFixed(2)+' A (모식)',W*.5,by-24,26,OH.CUR,'center',900);
    // 위쪽 글자는 바뀌지 않는다. 약함·보통·강함 세 칸 중 지금 단계만 켜진다(글자가 계속 바뀌어 정신없던 것을 대신).
    txt(ctx,'전류의 세기가 클수록 바람의 세기도 세다',W*.5,H*.045,28,TH.ink,'center',900);
    [['약하다',.12],['보통',.5],['세다',1]].forEach(([nm,lv],k)=>{const on=Math.abs(str-lv)<.22,px=W*.5+(k-1)*W*.24;
      ctx.save();const w=W*.2,h=40;rr(ctx,px-w/2,H*.1-h/2,w,h,h/2);ctx.fillStyle=on?(k===0?'#9DB7D9':k===1?'#5C8FCB':'#2F6FB0'):'#EEF3F4';ctx.fill();ctx.restore();
      txt(ctx,nm,px,H*.1+1,24,on?'#fff':'#8FA29D','center',900);});};}
ANIMS.cover=o=>ohFanScene(o,true);
ANIMS.fan=o=>ohFanScene(o,false);

/* ---------- STAGE 1 : 직렬연결 · 병렬연결 (건전지 2개와 전구) — 빈칸 없음, 단계 3개 ----------
   같은 건전지(1.5 V)·같은 전구. 직렬: 전압 3.0 V → 전류의 세기 2배 → 전구가 더 밝다. 병렬: 전압 1.5 V 그대로 → 전구의 밝기는 1개일 때와 같다(건전지 하나가 내는 전류는 절반 → 더 오래 쓴다).
   (이상적인 건전지로 단순화 — 실제 건전지의 내부 저항·전구 필라멘트 저항의 온도 변화는 다루지 않는다.)  모식. */
function ohEl(ctx,a,b,pos,sp,r,t,skip){const L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(L/sp));   // a→b 방향으로 흐르는 전자(간격 sp, 이동거리 pos). skip(x,y)가 참인 곳(건전지·전구 안)은 그리지 않는다
  for(let e=0;e<n;e++){const u=(((e*L/n+pos)%L)+L)%L,f=u/L,x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f;if(skip&&skip(x,y))continue;chg(ctx,x+Math.sin(t*2+e)*1.2,y+Math.cos(t*2.3+e)*1.2,-1,r);}}
function ohCell(ctx,x,y,col){   // 세로로 선 건전지(v3.26): 위쪽 돌기 = (+)극, 아래 = (−)극. 기호도 위 '+', 아래 '−' (예전엔 몸통이 가로로 누워 있고 '+ −'가 좌우로 적혀 극이 왼쪽·오른쪽처럼 읽혔다)
  ctx.save();const w=26,h=40;rr(ctx,x-w/2,y-h/2,w,h,7);ctx.fillStyle='#EDE7F7';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=col;ctx.stroke();ctx.fillStyle=col;ctx.fillRect(x-6,y-h/2-6,12,6);
  ctx.font='900 19px Pretendard,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',x,y-9);ctx.fillText('−',x,y+10);ctx.restore();}
const OH_CELL_HIT=(x,y,c)=>Math.abs(x-c[0])<16&&y>c[1]-27&&y<c[1]+21;   // 전자를 그리지 않을 건전지 자리
function ohBulb(ctx,x,y,b,t){const g=.35+.65*b,p=.92+.08*Math.sin(t*6);   // b: 밝기 0~1 (모식). 전구 = 원 안에 ×(교과서의 전구 기호와 같은 모양) — 예전 지그재그 필라멘트는 원 안의 'M'(전동기 기호)처럼 읽혔다
  ctx.save();const rg=ctx.createRadialGradient(x,y,4,x,y,70*g*p);rg.addColorStop(0,'rgba(255,214,70,'+(.75*g)+')');rg.addColorStop(1,'rgba(255,214,70,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,70*g*p,0,PI2);ctx.fill();
  ctx.beginPath();ctx.arc(x,y,24,0,PI2);ctx.fillStyle='#FFFDF3';ctx.fill();ctx.fillStyle='rgba(255,226,110,'+(.25+.7*b)+')';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OH.WIRE;ctx.stroke();
  const q=24*.7071;ctx.strokeStyle=b>.7?'#E08A00':'#6B7378';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-q,y-q);ctx.lineTo(x+q,y+q);ctx.moveTo(x+q,y-q);ctx.lineTo(x-q,y+q);ctx.stroke();ctx.restore();}
ANIMS.cells=o=>{const S=[ohSt(),ohSt(),ohSt()];o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=ohTick(o),ph=o.phase,rowH=H*.31;
  const rows=[{nm:'건전지 1개',v:'1.5 V',I:1,b:.5,txt:'기준 밝기',col:OH.INK},
              {nm:'건전지 2개 — 직렬연결 (한 줄로)',v:'3.0 V',I:2,b:1,txt:'더 밝다',col:OH.VOLT,ser:true},
              {nm:'건전지 2개 — 병렬연결 (나란히)',v:'1.5 V',I:1,b:.5,txt:'기준과 같다',col:OH.RES,par:true}];
  rows.forEach((r,i)=>{if(i>ph)return;const y0=H*.02+i*(rowH+H*.015),yT=y0+rowH*.3,yB=y0+rowH*.9,m=(yT+yB)/2,L=W*.1,R=W*.56,jx=L+W*.14;
    S[i].pos+=r.I*dt*55;const pos=S[i].pos;
    txt(o.ctx,r.nm,L-W*.03,y0+16,26,r.col,'left',900);
    // 건전지 위치(전선 위): 직렬 = 한 줄에 2개, 병렬 = 나란히 2개
    const cells=r.ser?[[L,m-(yB-yT)*.25],[L,m+(yB-yT)*.25]]:r.par?[[L,m],[jx,m]]:[[L,m]];
    const inCell=(x,y)=>cells.some(c=>OH_CELL_HIT(x,y,c)),inBulb=(x,y)=>Math.abs(x-R)<27&&Math.abs(y-m)<27;
    const skip=(x,y)=>inCell(x,y)||inBulb(x,y);
    // 전선 — 회로가 한 바퀴 이어진다(왼쪽 세로선 포함)
    ctx.save();ctx.strokeStyle=OH.WIRE;ctx.lineWidth=8;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(L,yT);ctx.lineTo(R,yT);ctx.lineTo(R,yB);ctx.lineTo(L,yB);ctx.closePath();ctx.stroke();
    if(r.par){ctx.beginPath();ctx.moveTo(jx,yT);ctx.lineTo(jx,yB);ctx.stroke();}
    if(r.ser){const a=cells[0][1]+20,b=cells[1][1]-26;ctx.beginPath();ctx.moveTo(L,a);ctx.lineTo(L,b);ctx.stroke();}   // 위 건전지의 (−)와 아래 건전지의 (+)를 이은 도선
    ctx.restore();
    // 전자(전류의 반대 방향 = 반시계): 왼쪽 ↓, 아래 →, 전구 ↑, 위 ←.  전류의 세기 ∝ 속도, 병렬의 가지는 전류를 절반씩 낸다.
    const sp=28,rr_=8,h=r.par?.5:1,A=pos,Hh=pos*.5;

    else{ohEl(ctx,[L,yT],[L,yB],Hh,sp,rr_,t,skip);ohEl(ctx,[jx,yT],[jx,yB],Hh,sp,rr_,t,skip);
      ohEl(ctx,[L,yB],[jx,yB],Hh,sp,rr_,t,skip);ohEl(ctx,[jx,yB],[R,yB],A,sp,rr_,t,skip);ohEl(ctx,[R,yB],[R,yT],A,sp,rr_,t,skip);
      ohEl(ctx,[R,yT],[jx,yT],A,sp,rr_,t,skip);ohEl(ctx,[jx,yT],[L,yT],Hh,sp,rr_,t,skip);}
    cells.forEach(c=>ohCell(ctx,c[0],c[1],OH.VOLT));
    ohBulb(ctx,R,m,r.b,t);
    {const cx_=(L+R)/2+(r.par?20:0);arrow(ctx,cx_-22,yT-20,cx_+22,yT-20,OH.CUR,5,14);}   // 전류는 (+)극에서 나와 위쪽 도선을 오른쪽으로
    const tx=R+W*.1;txt(ctx,'전압 '+r.v,tx,m-34,24,OH.VOLT,'left',900);txt(ctx,'전구의 밝기',tx,m,22,OH.SUB,'left',800);txt(ctx,r.txt,tx,m+32,28,r.b>.7?'#B4540F':OH.INK,'left',900);});
  if(ph===0)ohCap(o,'건전지를 2개 쓰는 방법은 한 가지뿐일까?',OH.SUB,H*.955);};};

/* ---------- STAGE 1 : 도입 — 물 순환 비유 (빈칸 없음, 단계 3개) ----------
   펌프(건전지)가 물을 밀어 올리고, 물은 닫힌 관을 한 바퀴 돌아 펌프로 돌아온다 → 어디서나 지나가는 양이 같다(물이 닳아 없어지지 않는다 = 전류도 소모되지 않는다).
   압력 ↑ → 흐름 ↑ (전압 ↑ → 전류 ↑), 자갈 관(저항) ↑ → 흐름 ↓.  자갈 관은 단면이 그대로라 물의 빠르기가 곳곳에서 같다 — 좁은 관으로 그리면 '좁은 곳에서 더 빠르다'는 별개의 현상이 섞인다. 모식. */
ANIMS.water=o=>{const S={pos:0,Q:1,P:1,Rn:1};o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=ohTick(o),ph=o.phase;
  /* v3.26b: ① 닫힌 관은 물로 가득 차 있다(관 속을 물색으로 칠함, 파란 점 = 흐름을 보이는 표시) → 자갈 앞에 물이 쌓이거나 넘치지 않고, 자갈이 늘면 관 '전체'의 흐름이 한꺼번에 줄어든다.
     ② 자갈 관 앞(③)·뒤(①)·아래(②)에 '1초에 지나는 물 알갱이 수'를 똑같이 보인다(= 저항 앞뒤의 전류가 같다). 수는 모델 흐름 Q 에서 계산(Q=1 → 1초에 4개)하고 점의 빠르기를 정확히 그 값에 맞춘다.
     ③ 아래 짝짓기는 두 열 표(물 흐름 모형 | 전기 회로)로 가운데 정렬. */
  const Pt=ph===1?2:1,Rt=ph===2?2:1,Qt=Pt/Rt,sm=Math.min(1,dt*2.5);S.P+=(Pt-S.P)*sm;S.Rn+=(Rt-S.Rn)*sm;S.Q+=(Qt-S.Q)*sm;
  const L=W*.14,R=W*.86,T=H*.2,B=H*.52,pw=36,mx=(L+R)/2,my=(T+B)/2,gw=W*.2;
  const per=2*((R-L)+(B-T)),n=Math.round(per/30),sp=per/n,RATE=4;S.pos+=RATE*S.Q*sp*dt;   // 1초에 RATE×Q 개가 한 지점을 지난다
  // 관(닫힌 고리) — 속은 물로 가득
  ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#9FB3BD';ctx.lineWidth=pw+8;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(R,T);ctx.lineTo(R,B);ctx.lineTo(L,B);ctx.closePath();ctx.stroke();
  ctx.strokeStyle='#CFE3F6';ctx.lineWidth=pw;ctx.stroke();ctx.restore();
  const pt=u=>{u=((u%per)+per)%per;const a=R-L,b=B-T;if(u<a)return[L+u,T];u-=a;if(u<b)return[R,T+u];u-=b;if(u<a)return[R-u,B];u-=a;return[L,B-u];};
  ctx.save();ctx.fillStyle='#2F6FB0';for(let e=0;e<n;e++){const q=pt(e*sp+S.pos);ctx.beginPath();ctx.arc(q[0],q[1],7.5,0,PI2);ctx.fill();}ctx.restore();
  // 자갈 관(저항): 위쪽 가운데. 자갈이 많을수록 저항이 크다(자갈은 물 알갱이 위에 — 물은 자갈 틈으로 지나간다)
  const gn=Math.round(7+10*(S.Rn-1));ctx.save();
  for(let g=0;g<gn;g++){const gx=mx-gw/2+((g*53)%100)/100*gw,gy=T-pw/2+5+((g*37)%100)/100*(pw-10);ctx.beginPath();ctx.arc(gx,gy,6,0,PI2);ctx.fillStyle='#7B858C';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#fff';ctx.stroke();}ctx.restore();
  ctx.save();ctx.strokeStyle=OH.RES;ctx.lineWidth=4;rr(ctx,mx-gw/2-6,T-pw/2-6,gw+12,pw+12,10);ctx.stroke();ctx.restore();
  txt(ctx,'자갈 관',mx,T-pw/2-24,24,OH.RES,'center',900);
  // 펌프(왼쪽): 압력 화살표 개수 = 펌프의 힘
  ctx.save();rr(ctx,L-38,my-52,76,104,14);ctx.fillStyle='#EDE7F7';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OH.VOLT;ctx.stroke();ctx.restore();
  const na=Math.round(S.P);for(let a=0;a<na;a++){const ay=my+20-a*28;ctx.save();ctx.strokeStyle=OH.VOLT;ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(L-14,ay);ctx.lineTo(L,ay-14);ctx.lineTo(L+14,ay);ctx.stroke();ctx.restore();}
  txt(ctx,'펌프',L,my-34,22,OH.VOLT,'center',900);
  // 관 속 안내
  txt(ctx,'닫힌 관 속은 물로 가득 차 있다',mx-45,my-14,22,OH.SUB,'center',800);txt(ctx,'(파란 점 = 흐름을 보여 주는 표시)',mx-45,my+16,22,OH.SUB,'center',700);   /* ① 의 '1초에 n개'와 겹치지 않게 왼쪽으로 */
  // 같은 양 표지 ①(자갈 뒤) ②(아래) ③(자갈 앞): 1초 동안 지나는 물 알갱이 수 — 모두 같다
  const nps=Math.round(RATE*S.Q),lab='1초에 '+nps+'개',x3=(L+38+mx-gw/2-6)/2;
  const mark=(x,y,c)=>{ctx.save();ctx.beginPath();ctx.arc(x,y,16,0,PI2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=OH.CUR;ctx.stroke();ctx.restore();txt(ctx,c,x,y+1,21,OH.CUR,'center',900);};
  mark(R,my,'①');txt(ctx,lab,R-34,my,22,OH.CUR,'right',900);
  mark(mx,B,'②');txt(ctx,lab,mx,B+40,22,OH.CUR,'center',900);
  mark(x3,T,'③');txt(ctx,lab,x3,T-40,22,OH.CUR,'center',900);
  txt(ctx,'물의 흐름 방향 = 전류의 방향 (전자는 반대 방향으로 움직인다)',mx,B+74,22,OH.SUB,'center',800);
  // 설명줄(단계별)
  const cap=ph===0?'자갈 관 앞(③)·뒤(①)·아래(②)를 1초 동안 지나는 물의 양은 같다':ph===1?'펌프의 압력이 커지면 → 관 어디서나 물의 흐름이 커진다':'자갈이 많아지면 → 관 어디서나 물의 흐름이 똑같이 작아진다';
  txt(ctx,cap,W*.5,H*.045,25,ph===2?OH.RES:(ph===1?OH.VOLT:OH.INK),'center',900);
  // 전기와 짝짓기: 두 열 표(가운데 정렬). '물 알갱이 → 전자'로 짝지으면 방향이 어긋나므로 '물 → 전하'
  const rows=[['물','전하',OH.EL,0],['펌프','건전지',OH.VOLT,0],['물의 흐름','전류의 세기',OH.CUR,0],['펌프의 압력','전압',OH.VOLT,1],['자갈이 많은 관','저항',OH.RES,2]];
  const c1=W*.34,c2=W*.66,y0=H*.70,rh=H*.047,tw=W*.62;
  txt(ctx,'물 흐름 모형',c1,y0,22,OH.SUB,'center',900);txt(ctx,'전기 회로',c2,y0,22,OH.SUB,'center',900);
  ctx.save();ctx.strokeStyle='#C9D4D1';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.5-tw/2,y0+rh*.55);ctx.lineTo(W*.5+tw/2,y0+rh*.55);ctx.stroke();ctx.restore();
  rows.forEach(([a,b,c,at],i)=>{if(ph<at)return;const y=y0+rh*(i+1.15);txt(ctx,a,c1,y,24,c,'center',800);txt(ctx,'→',W*.5,y,24,OH.SUB,'center',800);txt(ctx,b,c2,y,24,c,'center',900);});};};

/* ---------- STAGE 1 : 실험 회로 연결 (빈칸 2개: 직렬 · 병렬) ---------- */
ANIMS.setup=o=>{const S=ohSt();o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=ohTick(o),{k,G}=ohBase(o),ph=o.phase,I=ohI(3,OH_RL);   // 긴 니크롬선 20 Ω · 3.0 V → 0.150 A (표와 같은 값. 예전엔 0.3 으로 고정해 0.300 A 가 보였다)
  ohRun(S,I,dt,k);
  ohCircuit(ctx,G,{I,V:3,R:OH_RL,pos:S.pos,t,arrows:true,hl:{amm:ph===1,volt:ph===2},rlab:'니크롬선'});
  if(ph===1)pill(ctx,'전류계는 회로에 한 줄로 이어 붙인다 → 직렬',W*.5,H*.9,27,OH.CUR);
  else if(ph>=2)pill(ctx,'전압계는 니크롬선의 양 끝에 나란히 이어 붙인다 → 병렬',W*.5,H*.9,27,OH.VOLT);
  else ohCap(o,'전류계와 전압계는 어떻게 연결할까?',OH.SUB);
  txt(ctx,'주황 화살표 = 전류의 방향',W*.5,H*.075,24,OH.CUR,'center',800);};};

/* ---------- 시뮬레이션 ① 저항·전류·전압 관계 가상 실험 (id: ex) ----------
   순서: 1 예상 고르기 → 2 니크롬선 고르기 → 3 전압을 1.5 V씩 올리며 기록(표·그래프에 바로 찍힌다) → 다른 선으로 반복.  값은 모식 자료(긴 선 20 Ω, 짧은 선 10 Ω). */
const SPX=SIMSPEC.define({id:'ex',
  vars:[{id:'pred',label:'예상',choice:[[0,'작아진다'],[1,'변함없다'],[2,'같은 비율로 커진다']],def:null},
        {id:'wire',label:'니크롬선',choice:[[OH_RL,'긴 니크롬선'],[OH_RS,'짧은 니크롬선']],def:OH_RL,
         onChange:(w,sp)=>{const D=sp.data;if(!D.init)return;D.v=0;D.rec[w]=D.rec[w]||[[0,0]];D.pick=1;}}],
  reads:[{id:'v',label:'전압계'},{id:'i',label:'전류계'},{id:'cmp',label:'예상과 비교'}],
  flow:[{label:'예상: 전압을 2배로 높이면 전류의 세기는?',var:'pred'},
        {label:'니크롬선 고르기',var:'wire'},
        {label:'전압을 1.5 V씩 높이며 기록하기',hint:'값은 표와 그래프에 바로 기록돼요',act:'up',btn:'전압 1.5 V 높이기'}],
  extra:[{id:'up',label:'전압 높이기',onClick:sp=>{const D=sp.data;if(!D.init||D.v>=6-1e-9)return;D.v=Math.round((D.v+1.5)*10)/10;D.rec[D.w].push([D.v,ohI(D.v,D.w)]);D.used=1;}}],
  pace:.5,compact:true,
  scale:{mode:'schematic',note:'전자의 수·속도·크기는 비율 없이 그린 모식도이고 측정값은 모식 자료이다'},motion:true});
ANIMS.sim_ex=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);
  let D=SPX.data;if(!D.init)Object.assign(D,{init:1,S:ohSt(),v:0,w:OH_RL,rec:{[OH_RL]:[[0,0]],[OH_RS]:[[0,0]]},used:0,pick:0,tt:0,sig:''});
  const v=SPX.v,dt=SPX.dt(o.t);D.tt+=dt;D.w=v.wire;if(!D.rec[D.w])D.rec[D.w]=[[0,0]];
  const Hu=H-SPX.readsHeight(24)-(o.legendGap||30)-6,k=Math.min(W/880,Hu*.5/330),hc=Hu*.5;
  const I=ohI(D.v,D.w);ohRun(D.S,I,dt,k);
  const G=ohLoop(W*.1,114*k+10,W*.72,118*k,k);
  ohCircuit(ctx,G,{I,V:D.v,R:D.w,pos:D.S.pos,t:D.tt,arrows:true});
  // 그래프(왼쪽) + 표(오른쪽)
  const gx=0,gy=hc+4,gw=W*.6,gh=Hu-hc-4,GR=ohGraph(ctx,gx,gy,gw,gh,{});
  [[OH_RL,OH.LONG],[OH_RS,OH.SHORT]].forEach(([r,c])=>ohLine(ctx,GR,D.rec[r]||[],c,5));
  const last=D.rec[D.w][D.rec[D.w].length-1];if(last&&D.used){ctx.save();ctx.strokeStyle=ohWC(D.w);ctx.lineWidth=4;ctx.globalAlpha=.5+.4*Math.sin(D.tt*6);ctx.beginPath();ctx.arc(GR.X(last[0]),GR.Y(last[1]),15,0,PI2);ctx.stroke();ctx.restore();}
  const tx=W*.63,ty=gy+8,cw=[W*.11,W*.12,W*.12],rh=Math.min(36,(gh-14)/7.4);
  ['전압(V)','긴 선(A)','짧은 선(A)'].forEach((h,j)=>txt(ctx,h,tx+cw.slice(0,j).reduce((a,b)=>a+b,0)+cw[j]/2,ty+rh/2,22,j===1?OH.LONG:(j===2?OH.SHORT:OH.INK),'center',900));
  OH_VOLTS.forEach((V,i)=>{const yy=ty+rh*(i+1.5);const a=D.rec[OH_RL].find(p=>Math.abs(p[0]-V)<1e-9),b=D.rec[OH_RS].find(p=>Math.abs(p[0]-V)<1e-9);
    txt(ctx,V.toFixed(1),tx+cw[0]/2,yy,22,OH.INK,'center',800);txt(ctx,a?a[1].toFixed(3):'',tx+cw[0]+cw[1]/2,yy,22,OH.LONG,'center',800);txt(ctx,b?b[1].toFixed(3):'',tx+cw[0]+cw[1]+cw[2]/2,yy,22,OH.SHORT,'center',800);});
  ctx.save();ctx.strokeStyle='#C9D4D1';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx,ty+rh);ctx.lineTo(tx+cw[0]+cw[1]+cw[2],ty+rh);ctx.stroke();ctx.restore();
  // 예상과 비교: 첫 선에서 3.0 V 를 기록한 뒤
  const r3=Object.values(D.rec).some(a=>a.some(p=>Math.abs(p[0]-3)<1e-9));
  Object.assign(SPX.r,{v:D.v.toFixed(1)+' V',i:ohFmtA(I),cmp:r3?(v.pred==null?'예상을 고르지 않았다 — 전압이 2배가 되자 전류도 2배가 되었다':(v.pred===2?'예상과 같다! 전압이 2배가 되자 전류의 세기도 2배가 되었다':'예상과 달랐다! 전압이 2배가 되자 전류의 세기도 2배가 되었다')):'-'});
  SPX.btnText('up',D.v>=6-1e-9?'최대 전압(6.0 V)에 도달':'전압 1.5 V 높이기');
  const sig=[v.pred!=null,D.used,D.pick].join('|');if(sig!==D.sig){D.sig=sig;SPX.setFlow({pred:v.pred!=null?'done':'now',wire:v.pred!=null?'now':'lock',up:v.pred!=null?'now':'lock'});}
  readsAt(SPX,o);};};

/* ---------- STAGE 1 결과 정리 (빈칸 6개: 2배 · 3배 · 4배 · 커진다 · 비례 · 직선) ---------- */
ANIMS.graph=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const ph=o.phase,gw=W*.595,GR=ohGraph(ctx,10,6,gw,H-12,{});
  [[OH_RL,OH.LONG],[OH_RS,OH.SHORT]].forEach(([r,c])=>ohLine(ctx,GR,OH_VOLTS.map(v=>[v,ohI(v,r)]),c,5));
  // 표(오른쪽)
  const tx=W*.64,ty=22,cw=[W*.1,W*.115,W*.115],rh=40,mk={1:2,2:3,3:4};
  ['전압','긴 선','짧은 선'].forEach((h,j)=>txt(ctx,h,tx+cw.slice(0,j).reduce((a,b)=>a+b,0)+cw[j]/2,ty+rh/2,22,j===1?OH.LONG:(j===2?OH.SHORT:OH.INK),'center',900));
  OH_VOLTS.forEach((V,i)=>{const yy=ty+rh*(i+1.5),hot=(ph>=1&&ph<=3&&Math.abs(V-1.5*mk[ph])<1e-9)||(ph>=1&&ph<=3&&i===1);
    if(hot){ctx.save();ctx.fillStyle='rgba(244,195,59,.28)';rr(ctx,tx-6,yy-rh/2+2,cw[0]+cw[1]+cw[2]+12,rh-4,8);ctx.fill();ctx.restore();}
    txt(ctx,V.toFixed(1),tx+cw[0]/2,yy,22,OH.INK,'center',800);txt(ctx,ohI(V,OH_RL).toFixed(3),tx+cw[0]+cw[1]/2,yy,22,OH.LONG,'center',800);txt(ctx,ohI(V,OH_RS).toFixed(3),tx+cw[0]+cw[1]+cw[2]/2,yy,22,OH.SHORT,'center',800);});
  // 단계 1~3 : 전압 2·3·4배
  for(let s=1;s<=3&&s<=Math.min(ph,3);s++){const V=1.5*(s+1),cur=ph<=3&&s===ph,al=cur?1:.45;
    ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='#8A6A0A';ctx.lineWidth=3;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(GR.X(V),GR.Y(0));ctx.lineTo(GR.X(V),GR.Y(ohI(V,OH_RS)));ctx.stroke();ctx.restore();
    if(cur){const Y1=GR.Y(ohI(V,OH_RS)),Y0=GR.Y(ohI(1.5,OH_RS));
      txt(ctx,'전압 ×'+(s+1),GR.X(V),GR.Y(0)-22,24,'#8A6A0A','center',900);
      pill(ctx,'전압 '+(s+1)+'배 → 전류의 세기 '+(s+1)+'배',GR.ox+GR.gw*.5,GR.oy+30,22,'#8A6A0A');}}
  if(ph>=4&&ph<5){   // 그래프 위의 실선 화살표 대신, 두 축과 나란한 화살표(가로: 전압 커짐, 세로: 전류의 세기 커짐) — 직선과 헷갈리지 않는다
    const ya=GR.Y(0)-34,xa=GR.X(.55),p=.5+.5*Math.sin(t*3);
    arrow(ctx,GR.X(2.2),ya,GR.X(5.6),ya,OH.VOLT,6,20);txt(ctx,'전압 ↑',GR.X(3.9),ya-20,24,OH.VOLT,'center',900);
    arrow(ctx,xa,GR.Y(.12),xa,GR.Y(.52),OH.CUR,6,20);txt(ctx,'전류 ↑',xa+16,GR.Y(.33),24,OH.CUR,'left',900);
    pill(ctx,'전압 ↑  →  전류의 세기 ↑',GR.ox+GR.gw*.42,GR.oy+30,22,OH.CUR);}
  if(ph>=5){pill(ctx,'전류의 세기는 전압에 비례한다',GR.ox+GR.gw*.46,GR.oy+30,22,'#1F7A6C');}
  if(ph>=6){const p=.5+.5*Math.sin(t*5);ctx.save();ctx.strokeStyle='#F4C33B';ctx.lineWidth=7;ctx.globalAlpha=.4+.3*p;ctx.beginPath();ctx.arc(GR.X(0),GR.Y(0),13,0,PI2);ctx.stroke();ctx.restore();
    txt(ctx,'원점을 지나는 직선',GR.X(.25),GR.Y(.48),24,'#8A6A0A','left',900);   /* 점선·그래프 선과 겹치지 않는 왼쪽 위 빈 곳 */}
  };};   /* v3.26: 단계 0 의 아래 자막은 x축 이름과 겹쳐 지웠다(같은 말이 왼쪽 노란 상자에 있다) */

/* ---------- STAGE 2 : 저항 (빈칸 4개: 저항 · Ω · 1 V · 1 A) ---------- */
ANIMS.wires=o=>{const S=[ohSt(),ohSt(),ohSt()];o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=ohTick(o),ph=o.phase,bh=H*.27,bw=W*.84,bx=W*.06;
  // 니크롬선의 길이(지그재그)는 저항에 비례: 짧은 선 10 Ω · 긴 선 20 Ω · 1 Ω 도선(아주 짧게)
  const rows=[{R:OH_RS,V:3,col:OH.SHORT,th:1.2,nm:'짧은 니크롬선',rf:.44*OH_RS/OH_RL},{R:OH_RL,V:3,col:OH.LONG,th:1.2,nm:'긴 니크롬선',rf:.44},{R:1,V:1,col:OH.RES,th:1,nm:'어떤 도선',rf:.08}];
  rows.forEach((r,i)=>{if(i===2&&ph<3)return;const I=ohI(r.V,r.R),k=Math.min(bw/360,bh/200);S[i].pos+=I*dt*OHKV*k*(i===2?.55:1);
    const y=H*.02+i*(bh+H*.03);
    const g=ohMini(ctx,{x:bx,y,w:bw,h:bh},{V:r.V,R:r.R,pos:S[i].pos,t,col:r.col,th:r.th,rf:r.rf,readout:i<2||ph>=4,dg:'a',labelBelow:true,label:ph>=2?(i<2?(i?'20':'10')+' Ω':(ph>=4?'1 Ω':'? Ω')):''});
    if(ph===1&&i<2){ctx.save();ctx.strokeStyle=r.col;ctx.lineWidth=6;ctx.globalAlpha=.5+.4*Math.sin(t*5);rr(ctx,g.rx0-14,g.T-18*g.k-4,g.rx1-g.rx0+28,36*g.k+8,12);ctx.stroke();ctx.restore();}
    if(i<2)txt(ctx,r.nm,(g.rx0+g.rx1)/2,y+bh*.08,26,r.col,'center',900);});   // 전압은 전원 상자에 이미 적혀 있으므로 이름만(세 번째 도선은 이름도 생략)
  if(ph===0)ohCap(o,'같은 전압(3.0 V)을 걸어 주었는데 전류의 세기가 다르다',OH.SUB);
  else if(ph===1)ohCap(o,'전류의 흐름을 방해하는 정도가 다르다 → 저항',OH.RES);
  else if(ph===2)ohCap(o,'저항의 단위 : Ω (옴)',OH.RES);
  else if(ph===3)ohCap(o,'1 V의 전압을 걸었을 때 …',OH.VOLT);
  else ohCap(o,'1 V를 걸었을 때 1 A가 흐르는 도선의 저항 = 1 Ω',OH.CUR);};};

/* ---------- STAGE 2 : 저항이 생기는 원인 (빈칸 1개: 충돌) ---------- */
const OH_AT=[[-.62,-.5],[-.1,-.55],[.5,-.5],[-.8,0],[-.28,0],[.28,0],[.8,0],[-.6,.52],[-.05,.56],[.52,.52]];
ANIMS.cause=o=>{let E=null;o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=ohTick(o),ph=o.phase,cx=W*.5,cy=H*.52,R=Math.min(W*.42,H*.33),ra=R*.12,re=R*.075;
  if(!E){E=Array.from({length:8},(_,i)=>({x:cx+R*.8-Math.random()*R*1.4,y:cy+(Math.random()-.5)*R*1.4,vx:-60,vy:0,fl:0,seed:i}));}
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,PI2);ctx.fillStyle='#F3F6F8';ctx.fill();ctx.lineWidth=7;ctx.strokeStyle=OH.WIRE;ctx.stroke();ctx.clip();
  const atoms=OH_AT.map((a,i)=>({x:cx+a[0]*R*.9+Math.sin(t*3+i)*2.5,y:cy+a[1]*R*.9+Math.cos(t*3.3+i*1.7)*2.5}));
  atoms.forEach(a=>chg(ctx,a.x,a.y,1,ra));
  const step=Math.min(dt,.05);
  E.forEach(e=>{e.vx-=140*step;const sp=Math.hypot(e.vx,e.vy),mx=R*.9;if(sp>mx){e.vx*=mx/sp;e.vy*=mx/sp;}
    e.x+=e.vx*step;e.y+=e.vy*step;e.fl=Math.max(0,e.fl-step*2.2);
    atoms.forEach(a=>{const d=Math.hypot(e.x-a.x,e.y-a.y);if(d<ra+re){const n=Math.atan2(e.y-a.y,e.x-a.x),ang=n+(Math.random()-.5)*1.6,s2=60+Math.random()*80;e.x=a.x+Math.cos(n)*(ra+re+1);e.y=a.y+Math.sin(n)*(ra+re+1);e.vx=Math.cos(ang)*s2;e.vy=Math.sin(ang)*s2;e.fl=1;e.cx=a.x;e.cy=a.y;}});
    if(e.x<cx-R||Math.hypot(e.x-cx,e.y-cy)>R*1.05){e.x=cx+R*.9;e.y=cy+(Math.random()-.5)*R*1.3;e.vx=-80;e.vy=0;}
    if(ph>=1&&e.fl>0){ctx.save();ctx.globalAlpha=e.fl;ctx.strokeStyle=OH.CUR;ctx.lineWidth=5;ctx.beginPath();ctx.arc(e.cx,e.cy,ra+re+8+(1-e.fl)*16,0,PI2);ctx.stroke();ctx.restore();}
    chg(ctx,e.x,e.y,-1,re*1.25);});
  ctx.restore();
  arrow(ctx,cx-R*.5,cy-R-24,cx+R*.5,cy-R-24,OH.CUR,7,22);txt(ctx,'전류의 방향',cx,cy-R-52,24,OH.CUR,'center',900);
  arrow(ctx,cx+R*.5,cy+R+28,cx-R*.5,cy+R+28,OH.EL,7,22);txt(ctx,'전자의 이동 방향',cx,cy+R+56,24,OH.EL,'center',900);
  if(ph>=1)pill(ctx,'전자가 원자와 충돌하여 운동에 방해를 받는다',cx,H*.04,24,OH.CUR);
  else txt(ctx,'전선 속을 확대한 모식도',cx,H*.04,26,OH.SUB,'center',800);};};

/* ---------- STAGE 2 : 길이 · 굵기 (빈칸 2개: 커지고 · 작아진다) ---------- */
/* 니크롬선 단면 모식(옆모습). 같은 전압(V)을 걸었을 때의 전자 모식:
   · 전자의 이동 속도 ∝ 전압/길이 (길수록 느리다 — 같은 전압이 더 긴 선에 나뉘어 걸리므로) · 굵기와는 무관(같다)
   · 단면을 1초에 지나는 전자 수 ∝ 속도 × 단면의 굵기(줄 수) → 전류의 세기. 굵을수록 더 많은 전자가 함께 지나간다.
   rows: 전자 줄 수(굵기), spd: 상대 속도(px 단위 아님), 전자는 전류의 반대(왼쪽)로 움직인다. 값은 모식. */
function ohTube(ctx,x,y,w,rows,u,col,t,spd){
  const h=rows*24*u+10;
  rr(ctx,x,y,w,h,Math.min(14,h/2));ctx.fillStyle='#DCEFEA';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=col;ctx.stroke();
  ctx.save();rr(ctx,x+4,y+4,w-8,h-8,Math.min(12,h/2));ctx.clip();
  const cols=Math.max(2,Math.round(w/46));
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const off=((c+.5)/cols*w-spd*t*60+r*9)%w,px=x+((off%w)+w)%w,py=y+h*(r+1)/(rows+1);chg(ctx,px,py+Math.sin(t*3+c+r)*1.5,-1,9);}
  ctx.restore();return h;}
function ohTubeInfo(ctx,x,w,y,h,lines){lines.forEach((l,i)=>txt(ctx,l[0],x+w/2,y+h+34+i*42,l[2]||22,l[1],'center',900));}
function ohSpeedArrow(ctx,x,w,y,spd,txtS){const L=150*spd,cx=x+w/2;arrow(ctx,cx+L/2,y,cx-L/2,y,OH.EL,6,16);txt(ctx,txtS,cx,y-26,22,OH.EL,'center',800);}
ANIMS.dims=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const ph=o.phase,u=Math.min(W/820,H/640)*1.25;
  // 한 번에 한 가지 비교만 보여 준다: 빈칸 앞(단계 0~1)은 '길이', 빈칸 뒤(단계 2)는 '굵기'.  (두 가지를 한 화면에 넣으면 복잡해진다)
  const len=ph<=1,y=H*.3;

    ohTubeInfo(ctx,xb,wb,y,hA,[['(나) 길다',OH.INK,26]].concat(ph>=1?[['저항 크다',OH.RES,24],['전류의 세기 작다',OH.CUR,24]]:[]));
    if(ph>=1){ohSpeedArrow(ctx,xa,wa,y-16,sA,'전자 이동: 빠름');ohSpeedArrow(ctx,xb,wb,y-16,sB,'느림');}}
  else{const wc=W*.38,xc=W*.08,xd=W*.54,hC=ohTube(ctx,xc,y,wc,4,u,OH.RES,t,.9),hD=ohTube(ctx,xd,y+(hC-(2*24*u+10))/2,wc,2,u,OH.RES,t,.9);

/* ---------- STAGE 2 : 저항이 클수록 (빈칸 1개: 작아진다) ---------- */
ANIMS.cmp=o=>{const S=[ohSt(),ohSt(),ohSt()];o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=ohTick(o),ph=o.phase,bh=H*.25,bw=W*.84,bx=W*.1;

    ohMini(ctx,{x:bx,y,w:bw*.74,h:bh},{V:6,R,pos:S[i].pos,t,col:OH.RES,th:1,rf:.44*R/OH_RL,dg:'a',label:R+' Ω'});   // 같은 굵기 니크롬선 → 길이 ∝ 저항(5 : 10 : 20)
    const bl=W*.18*Math.min(1,I/1.2);ctx.save();rr(ctx,bx+bw*.78,y+bh*.72,W*.18,26,13);ctx.fillStyle='#E6ECEA';ctx.fill();rr(ctx,bx+bw*.78,y+bh*.72,Math.max(26,bl),26,13);ctx.fillStyle=OH.CUR;ctx.fill();ctx.restore();

/* ---------- STAGE 3 : 옴의 법칙 (빈칸 7개: 비례 · 반비례 · 옴의 법칙 · 전압 · 저항 · 전류의 세기 · 저항) ---------- */
function ohTile(ctx,x,y,w,h,col,title,sub,kind){
  rr(ctx,x,y,w,h,18);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=col;ctx.stroke();
  txt(ctx,title,x+w/2,y+34,26,col,'center',900);txt(ctx,sub,x+w/2,y+68,24,OH.INK,'center',800);
  const gx=x+w*.24,gy=y+h-50,gw=w*.58,gh=h-160;ctx.save();ctx.strokeStyle=OH.INK;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(gx,gy-gh-6);ctx.lineTo(gx,gy);ctx.lineTo(gx+gw+6,gy);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();if(kind==='line'){ctx.moveTo(gx,gy);ctx.lineTo(gx+gw,gy-gh);}else{for(let i=0;i<=40;i++){const a=.14+i/40*.86,px=gx+gw*a,py=gy-gh*Math.min(1,.14/a);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}}ctx.stroke();ctx.restore();
  txt(ctx,kind==='line'?'전압':'저항',gx+gw/2,gy+28,22,OH.SUB,'center',700);
  ctx.save();ctx.translate(gx-16,gy-gh/2);ctx.rotate(-Math.PI/2);txt(ctx,'전류의 세기',0,0,22,OH.SUB,'center',700);ctx.restore();}
ANIMS.law=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const ph=o.phase;
  const tw=W*.44,th=H*.4,ty=H*.02;

  if(ph>=2)ohTile(ctx,W*.52,ty,tw,th,OH.RES,'저항 ↑','전류의 세기는 ↓ (반비례)','hyp');
  if(ph===0){txt(ctx,'전류의 세기는 전압, 저항과 어떤 관계일까?',W*.5,H*.2,28,OH.SUB,'center',800);}
  if(ph>=3){pill(ctx,'옴의 법칙',W*.5,H*.485,32,'#8A6A0A');txt(ctx,'독일의 과학자 옴(G. S. Ohm, 1789~1854)이 정리하여 발표했다',W*.5,H*.545,22,OH.SUB,'center',700);}
  // 식 ① 전류의 세기 = 전압 / 저항
  const f1y=H*.66;txt(ctx,'전류의 세기',W*.2,f1y,32,OH.CUR,'center',900);txt(ctx,'=',W*.37,f1y,34,OH.INK,'center',900);
  const a=P(o,4,.6),b=P(o,5,.6);ctx.save();ctx.strokeStyle=OH.INK;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.45,f1y);ctx.lineTo(W*.67,f1y);ctx.stroke();ctx.restore();
  ctx.save();ctx.globalAlpha=ph>=4?1:0;txt(ctx,'전압',W*.56,f1y-26,32,OH.VOLT,'center',900);ctx.restore();ctx.save();ctx.globalAlpha=ph>=5?1:0;txt(ctx,'저항',W*.56,f1y+28,32,OH.RES,'center',900);ctx.restore();

  ctx.save();ctx.globalAlpha=ph>=6?1:0;txt(ctx,'전류의 세기',W*.43,f2y,32,OH.CUR,'center',900);ctx.restore();
  ctx.save();ctx.globalAlpha=ph>=6?1:0;txt(ctx,'×',W*.62,f2y,34,OH.INK,'center',900);ctx.restore();
  ctx.save();ctx.globalAlpha=ph>=7?1:0;txt(ctx,'저항',W*.76,f2y,32,OH.RES,'center',900);ctx.restore();};};

/* ---------- 시뮬레이션 ② 옴의 법칙 확인 (id: ol) ----------
   기준 : 전압 3.0 V · 저항 10 Ω → 0.300 A.  전압을 2배, 저항을 2배로 하면 전류의 세기가 어떻게 변하는지 기준과 비교한다. (모식 — 계산은 CIRC.series) */
const OH_BASE={V:3,R:10};
const ohRatio=x=>{const r=Math.round(x*100)/100;return r===1?'같다':(r>=1?(Number.isInteger(r)?r+'배':r+'배'):(Math.abs(r-.5)<.005?'1/2배':(Math.abs(r-.25)<.005?'1/4배':r+'배')));};
const SPO=SIMSPEC.define({id:'ol',
  vars:[{id:'pred',label:'예상',choice:[[.5,'1/2배'],[1,'그대로'],[2,'2배'],[4,'4배']],def:null},
        {id:'V',label:'전압',min:1.5,max:9,step:1.5,def:3,unit:'V',color:OH.VOLT,stepper:true,digits:1},
        {id:'R',label:'저항',choice:[[5,'5 Ω'],[10,'10 Ω'],[20,'20 Ω']],def:10}],
  reads:[{id:'I',label:'전류의 세기'},{id:'ratio',label:'기준(3.0 V, 10 Ω)과 비교'},{id:'cmp',label:'예상과 비교'}],
  flow:[{label:'예상: 전압만 2배(6.0 V)로 하면 전류의 세기는?',var:'pred'},
        {label:'전압 바꾸기',var:'V'},
        {label:'저항 바꾸기',var:'R'}],
  pace:.5,compact:true,
  scale:{mode:'schematic',note:'전자의 수·속도·크기는 비율 없이 그린 모식도이다'},motion:true});
ANIMS.sim_ol=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);
  let D=SPO.data;if(!D.init)Object.assign(D,{init:1,S:ohSt(),tt:0,sig:'',touched:0,seenV2:0});
  const v=SPO.v,dt=SPO.dt(o.t);D.tt+=dt;const Hu=H-SPO.readsHeight(24)-(o.legendGap||30)-6,k=Math.min(W/860,Hu/640);
  const I=ohI(v.V,v.R),I0=ohI(OH_BASE.V,OH_BASE.R);ohRun(D.S,I,dt,k);
  const G=ohLoop(W*.14,Hu*.36,W*.7,Hu*.32,k);
  ohCircuit(ctx,G,{I,V:v.V,R:v.R,rLen:G.w*.36*v.R/OH_RL,pos:D.S.pos,t:D.tt,arrows:true,rlab:v.R+' Ω'});
  // 전류의 세기 눈금(기준 대비)
  const bx=W*.14,by=Hu*.93,bw=W*.7;ctx.save();rr(ctx,bx,by,bw,22,11);ctx.fillStyle='#E6ECEA';ctx.fill();rr(ctx,bx,by,Math.max(22,bw*Math.min(1,I/1.8)),22,11);ctx.fillStyle=OH.CUR;ctx.fill();
  ctx.strokeStyle=OH.INK;ctx.lineWidth=3;const x0=bx+bw*I0/1.8;ctx.beginPath();ctx.moveTo(x0,by-8);ctx.lineTo(x0,by+30);ctx.stroke();ctx.restore();txt(ctx,'기준 0.300 A',x0,by-20,22,OH.INK,'center',800);
  if(v.V!==OH_BASE.V||v.R!==OH_BASE.R)D.touched=1;
  const rat=I/I0;if(v.V===6&&v.R===10)D.seenV2=1;
  Object.assign(SPO.r,{I:ohFmtA(I),ratio:ohRatio(rat)+(v.V!==OH_BASE.V&&v.R===OH_BASE.R?' (전압 '+ohRatio(v.V/OH_BASE.V)+')':(v.R!==OH_BASE.R&&v.V===OH_BASE.V?' (저항 '+ohRatio(v.R/OH_BASE.R)+')':'')),
    cmp:D.seenV2?(v.pred==null?'예상을 고르지 않았다 — 전압이 2배가 되면 전류의 세기도 2배':(v.pred===2?'예상과 같다! 전압이 2배가 되면 전류의 세기도 2배':'예상과 달랐다! 전압이 2배가 되면 전류의 세기도 2배')):'-'});
  const sig=[v.pred!=null,D.touched].join('|');if(sig!==D.sig){D.sig=sig;SPO.setFlow({pred:v.pred!=null?'done':'now',V:v.pred!=null?'now':'lock',R:v.pred!=null?'now':'lock'});}
  readsAt(SPO,o);};};

/* ---------- STAGE 3 : 계산해 보기 (빈칸 2개: 2 A · 1/2배) ---------- */
ANIMS.calc=o=>{const S=[ohSt(),ohSt()];o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=ohTick(o),ph=o.phase,bh=H*.29,bw=W*.74,bx=W*.1;
  [[5,'5 Ω'],[10,'10 Ω']].forEach(([R,nm],i)=>{if(i&&ph<2)return;const I=ohI(10,R),k=Math.min(bw/360,bh/200),y=H*.02+i*(bh+H*.17);S[i].pos+=I*dt*OHKV*k;const vis=i?true:ph>=1;S[i].age=vis?(S[i].age||0)+dt:0;
     ohMini(ctx,{x:bx,y,w:bw,h:bh},{V:10,R,I,pos:S[i].pos,t,col:OH.RES,th:1,rf:.44*R/10*.5,dg:'a',label:nm,readout:vis,fx:vis?S[i].age:null});
    if(i===0&&ph===0)txt(ctx,'?',bx+bw-6,y+bh*.57,40,OH.CUR,'right',900);
    const fy=y+bh+H*.065;
    if(i===0){if(ph===0)txt(ctx,'전류의 세기 = 전압 / 저항',W*.5,fy,26,OH.SUB,'center',800);else pill(ctx,'10 V / 5 Ω = 2 A',W*.5,fy,28,OH.CUR);}
    else pill(ctx,'10 V / 10 Ω = 1 A',W*.5,fy,28,OH.CUR);});
  if(ph>=2)pill(ctx,'저항 2배 → 전류의 세기 1/2배',W*.5,H*.955,27,OH.RES);};};

/* ---------- STAGE 4 : 도체 · 부도체 · 반도체 (빈칸 3개) ---------- */
/* 금속 모식(충돌 모형): (+) 양이온은 격자 자리에서 제자리 진동만 하고, 자유 전자는 전기장(←로 가속)을 받으며 불규칙하게 움직이다가 양이온과 부딪치면 방향이 흩어진다.
   → 부딪침이 저항의 원인이고, 평균적으로는 천천히 ← 로 밀려간다(drift).  전체 전하는 0 : 양이온 수 = 전자 수.
   도체 = 전자 12개 모두 자유 · 부도체 = 12개 모두 원자에 붙잡힘 · 반도체 = 3개만 자유, 9개는 붙잡힘.  (모식 — 실제 전자는 파동성을 가지며 격자와의 산란으로 설명한다) */
function ohLatSim(mode,cols,rows,w,h,rI,rE,nFree){const L={mode,w,h,rI,rE,ions:[],free:[],bound:[]};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)L.ions.push({x:w*(c+.5)/cols,y:h*(r+.5)/rows,fl:0,id:r*cols+c});
  const n=L.ions.length,nf=nFree!=null?nFree:(mode===0?n:mode===2?Math.round(n/4):0);
  const fr=new Set();if(nf>0&&nf<n){const step=n/nf;for(let q=0;q<nf;q++)fr.add(Math.floor(q*step+step/2)%n);}
  L.ions.forEach((q,k)=>{if(nf>=n||fr.has(k)){if(mode!==1){let x,y,ok=0;for(let a=0;a<60&&!ok;a++){x=rE+Math.random()*(w-2*rE);y=rE+Math.random()*(h-2*rE);ok=L.ions.every(z=>Math.hypot(z.x-x,z.y-y)>rI+rE+2);}
        const a=Math.random()*PI2,sp=60+60*Math.random();L.free.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp});}else L.bound.push(q);}else L.bound.push(q);});
  return L;}
function ohLatStep(L,dt,A,vth){if(dt<=0)return;const n=Math.ceil(dt/.012),d=dt/n,R=L.rI+L.rE;
  for(let s=0;s<n;s++){L.ions.forEach(q=>q.fl=Math.max(0,q.fl-d));
    L.free.forEach(e=>{e.vx-=A*d;e.x+=e.vx*d;e.y+=e.vy*d;
      if(e.x<-L.rE)e.x+=L.w+2*L.rE;else if(e.x>L.w+L.rE)e.x-=L.w+2*L.rE;   // 가로로 이어진 도선(왼쪽으로 나가면 오른쪽에서 들어온다)
      if(e.y<L.rE){e.y=L.rE;e.vy=Math.abs(e.vy);}else if(e.y>L.h-L.rE){e.y=L.h-L.rE;e.vy=-Math.abs(e.vy);}
      for(const q of L.ions){let dx=e.x-q.x;const dy=e.y-q.y;if(Math.abs(dx)>L.w/2)dx-=Math.sign(dx)*L.w;const dd=Math.hypot(dx,dy);
        if(dd<R){const a=Math.atan2(dy,dx)+(Math.random()-.5)*1.6,sp=vth*(.55+.9*Math.random());e.vx=Math.cos(a)*sp;e.vy=Math.sin(a)*sp;e.x=q.x+Math.cos(a)*(R+.5);e.y=q.y+Math.sin(a)*(R+.5);q.fl=.3;break;}}});}}
function ohLatDraw(ctx,L,t,sc){   // (0,0)=격자 왼쪽 위, 단위 = 내부 좌표 × sc
  const k=sc||1;L.ions.forEach(q=>{if(q.fl>0){ctx.save();ctx.globalAlpha=q.fl/.3*.8;ctx.strokeStyle='#F4C33B';ctx.lineWidth=4*k;ctx.beginPath();ctx.arc(q.x*k,q.y*k,(L.rI+6+(.3-q.fl)*30)*k,0,PI2);ctx.stroke();ctx.restore();}
    chg(ctx,q.x*k,q.y*k,1,L.rI*k);});
  L.bound.forEach(q=>{const j=Math.sin(t*5+q.id*1.7)*2.2,m=Math.cos(t*4.3+q.id)*2.2;chg(ctx,(q.x+L.rI+4+j)*k,(q.y-L.rI*.6+m)*k,-1,L.rE*.85*k);});   // 붙잡힌 전자: 원자 곁에서 떨기만 한다
  L.free.forEach(e=>chg(ctx,e.x*k,e.y*k,-1,L.rE*k));}
function ohLattice(ctx,x,y,w,h,L,t){const s=Math.min((w-24)/L.w,(h-24)/L.h);ctx.save();rr(ctx,x+6,y+6,w-12,h-12,14);ctx.clip();ctx.translate(x+(w-L.w*s)/2,y+(h-L.h*s)/2);ohLatDraw(ctx,L,t,s);ctx.restore();}
ANIMS.types=o=>{const SM=[0,1,2].map(m=>ohLatSim(m,4,3,300,230,13,9));o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=ohTick(o),ph=o.phase,cw=W*.3,gap=W*.03,x0=(W-3*cw-2*gap)/2;
  SM.forEach(L=>ohLatStep(L,dt,170,95));
  const info=[['도체',1,OH.RES,'전류가 잘 흐른다'],['부도체',.04,'#8A5A44','전류가 거의 흐르지 않는다'],['반도체',.4,'#7A5BB5','중간 정도']];
  info.forEach(([nm,fl,col,sub],i)=>{const x=x0+i*(cw+gap),y=H*.2,h=H*.34,on=ph>=i+1;
    ctx.save();ctx.globalAlpha=on?1:.55;
    rr(ctx,x,y,cw,h,18);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=on?col:'#B7C4C9';ctx.stroke();
    ohLattice(ctx,x,y,cw,h,SM[i],t);ctx.restore();
    txt(ctx,on?nm:'?',x+cw/2,H*.11,36,on?col:'#8FA29D','center',900);
    const by=y+h+46;ctx.save();ctx.globalAlpha=on?1:.55;rr(ctx,x+cw*.1,by,cw*.8,24,12);ctx.fillStyle='#E6ECEA';ctx.fill();rr(ctx,x+cw*.1,by,Math.max(24,cw*.8*fl),24,12);ctx.fillStyle=OH.CUR;ctx.fill();ctx.restore();
    txt(ctx,'전류의 세기',x+cw/2,by-20,22,OH.CUR,'center',800);if(on)txt(ctx,'저항 '+['작다','크다','중간'][i],x+cw/2,by+58,26,col,'center',900);if(on)txt(ctx,sub,x+cw/2,by+94,22,OH.SUB,'center',700);});
  const ly=H*.935;chg(ctx,W*.06,ly,1,11);txt(ctx,'(+) 양이온(제자리)',W*.06+20,ly,22,OH.SUB,'left',700);
  chg(ctx,W*.36,ly,-1,11);txt(ctx,'전자 : 자유 전자는 부딪치며 ← 로 밀려간다',W*.36+20,ly,22,OH.SUB,'left',700);
  if(ph===0)ohCap(o,'세 물질에 같은 전압을 걸면 전류는 어떻게 흐를까?',OH.SUB,H*.04);};};

/* ---------- STAGE 4 : 이용 (빈칸 3개: 구리 · 부도체 · 전자 제품) ---------- */
ANIMS.use=o=>{let L=null;o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=ohTick(o),ph=o.phase;
  // 전기 도선을 왼쪽 비스듬한 앞에서 본 모습(실제로 한 방향에서 보면 한쪽 끝의 단면만 보인다):
  //  왼쪽 끝 = 잘린 면(단면: 가운데 구리 원판 + 바깥 플라스틱 고리), 오른쪽 끝 = 단면이 뒤쪽이라 안 보이고 둥근 테두리만 보인다. 몸통은 반쯤 잘라 속(구리 심선)을 들여다본 모습.
  const x0=W*.05,x1=W*.95,cy=H*.285,hs=H*.17,hc=H*.1,rx=hs*.3,wd=x1-x0,ex0=x0+rx,ex1=x1-rx;
  const plastic=ph>=2?'#F1E3D8':'#E9EEF0',pEdge=ph>=2?'#8A5A44':'#8FA29D',cuF='#F6C79B',cuE='#B8652E';
  const body=(rY,rXc)=>{ctx.beginPath();ctx.moveTo(ex0,cy-rY);ctx.lineTo(ex1,cy-rY);ctx.ellipse(ex1,cy,rXc,rY,0,-Math.PI/2,Math.PI/2,false);ctx.lineTo(ex0,cy+rY);ctx.closePath();};   // 오른쪽 끝은 타원의 앞쪽 반만 보인다
  body(hs,rx);ctx.fillStyle=plastic;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=pEdge;ctx.lineJoin='round';ctx.stroke();
  // 플라스틱 속: 원자(+)와 붙잡힌 전자(−) — 제자리에서 떨기만 한다
  ctx.save();body(hs-4,rx-4);ctx.clip();
  [-(hs-16),(hs-16)].forEach((dy,b)=>{const n=Math.round((ex1-ex0)/46);for(let i=0;i<n;i++){const ix=ex0+(ex1-ex0)*(i+.5)/n,iy=cy+dy,id=i+b*40;chg(ctx,ix,iy,1,9);chg(ctx,ix+13+Math.sin(t*5+id)*1.8,iy-6+Math.cos(t*4+id)*1.8,-1,6);}});
  ctx.restore();
  // 구리 심선(가운데) — 충돌 모형: 자유 전자는 (+) 구리 이온과 부딪치며 ← 로 밀려간다
  const cx0=ex0+rx*.62+14,cx1=ex1-6,kw=cx1-cx0,kh=hc*2;
  if(!L||Math.abs(L.w-kw)>20)L=ohLatSim(0,9,3,kw,kh,9,7);ohLatStep(L,dt,170,95);
  body(hc,rx*.62);ctx.fillStyle=cuF;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=cuE;ctx.stroke();
  ctx.save();body(hc-2,rx*.62-2);ctx.clip();ctx.translate(cx0,cy-hc);ohLatDraw(ctx,L,t,1);ctx.restore();
  // 왼쪽 단면(타원): 바깥 고리 = 플라스틱, 안쪽 원판 = 구리
  ctx.save();ctx.beginPath();ctx.ellipse(ex0,cy,rx,hs,0,0,PI2);ctx.fillStyle=plastic;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=pEdge;ctx.stroke();
  ctx.beginPath();ctx.ellipse(ex0,cy,rx*.62,hc,0,0,PI2);ctx.fillStyle=cuF;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=cuE;ctx.stroke();ctx.restore();
  if(ph>=1)txt(ctx,'단면',ex0,cy+hs+26,22,OH.SUB,'center',800);
  if(ph>=1){const p=.5+.5*Math.sin(t*5);ctx.save();ctx.strokeStyle='#B8652E';ctx.lineWidth=6;ctx.globalAlpha=.5+.4*p;rr(ctx,x0+10,cy-hc-8,wd-20,hc*2+16,hc*.6+8);ctx.stroke();ctx.restore();pill(ctx,'구리선 (도체) — 전류가 잘 흐른다',W*.5,cy-hs-30,25,'#B8652E');}
  if(ph>=2){const bx=[x0+wd*.2,x0+wd*.5,x0+wd*.78];bx.forEach(x=>{   // 전자가 구리선 밖으로 나가려 해도 플라스틱에서 막힌다: 화살표 + 막대
      arrow(ctx,x,cy-hc-3,x,cy-hc-15,OH.CUR,5,12);ctx.save();ctx.strokeStyle='#C0392B';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-15,cy-hc-22);ctx.lineTo(x+15,cy-hc-22);ctx.stroke();ctx.restore();});
    pill(ctx,'플라스틱 (부도체) — 전류가 밖으로 흐르지 않는다',W*.5,cy+hs+34,25,'#8A5A44');}
  // 반도체 부품
  const px=W*.5,py=H*.69,cw=W*.3,ch=H*.2;
  if(ph>=3){ctx.save();for(let i=0;i<7;i++){const xx=px-cw/2+cw*(i+.5)/7;rr(ctx,xx-9,py-ch/2-26,18,30,4);ctx.fillStyle='#CBD5DC';ctx.fill();rr(ctx,xx-9,py+ch/2-4,18,30,4);ctx.fill();}
    rr(ctx,px-cw/2,py-ch/2,cw,ch,12);ctx.fillStyle='#2B3A42';ctx.fill();ctx.fillStyle='#8FA29D';ctx.beginPath();ctx.arc(px-cw/2+22,py-ch/2+22,8,0,PI2);ctx.fill();ctx.restore();
    txt(ctx,'반도체 소자',px,py,26,'#fff','center',900);pill(ctx,'휴대 전화·컴퓨터 같은 전자 제품의 부품',W*.5,H*.93,26,'#7A5BB5');}
  else txt(ctx,ph<1?'전기 도선은 어떤 물질로 만들까?':'',W*.5,H*.7,28,OH.SUB,'center',800);};};

/* ---------- 도전 : 어느 선의 그래프일까? (CH = lib.js) ---------- */
ANIMS.chal=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const k=Math.min(W/880,H/640),gx=W*.55,GR=ohGraph(ctx,gx,H*.06,W*.45-6,H*.8,{});
  // 그래프(색만 보인다 — 이름은 맞힌 뒤에)
  OH_CHW.forEach((w,i)=>{const c=OH_CHC[CH.perm[i]][1];ohLine(ctx,GR,[[0,0],[6,6/w.R]],c,7,false);
    const lb=OH_CHC[CH.perm[i]][0]+(CH.solved?' = '+w.n:''),lx=GR.X(4.6)-16,ly=GR.Y(4.6/w.R)-22;   // 그래프 기호(ㄱ·ㄴ·ㄷ)는 늘, 맞힌 뒤에는 선 이름도
    ctx.save();ctx.font='900 28px Pretendard,sans-serif';const tw=ctx.measureText(lb).width;ctx.restore();ctx.save();ctx.fillStyle='rgba(255,255,255,.88)';rr(ctx,lx-tw-8,ly-19,tw+16,38,10);ctx.fill();ctx.restore();txt(ctx,lb,lx,ly,28,c,'right',900);});
  // 니크롬선 세 개
  const ty=[H*.14,H*.42,H*.7];txt(ctx,'니크롬선',W*.24,H*.045,26,OH.INK,'center',900);
  OH_CHW.forEach((w,i)=>{const L=W*.31*w.len/.66,h=Math.max(16,52*k*w.th),x=W*.03,y=ty[i];   /* 길이 ∝ len, 굵기 ∝ th → 저항 ∝ 길이/굵기 (10 : 20 : 40) */
    txt(ctx,w.n,x+22,y-22,30,OH.INK,'left',900);
    rr(ctx,x,y,L,h,Math.min(14,h/2));ctx.fillStyle='#DCEFEA';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=OH.RES;ctx.stroke();
    ctx.save();rr(ctx,x+4,y+4,L-8,h-8,Math.min(12,h/2));ctx.clip();const rows=Math.max(1,Math.round(h/30)),cols=Math.max(2,Math.round(L/44));for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)chg(ctx,x+(c+.5)/cols*L,y+h*(r+1)/(rows+1),-1,Math.min(10,h*.17));ctx.restore();
    txt(ctx,w.txt,x+L+12,y+h/2,24,OH.SUB,'left',800);});
  // 별
  for(let i=0;i<3;i++)ohStar(ctx,W*.1+i*52,H*.955,20,i<(CH.solved?CH.stars:3)?'#F4C33B':'#E6ECEA');
  if(CH.solved){const p=.5+.5*Math.sin(t*4);txt(ctx,'정답!',W*.25,H*.955,30,'#1F7A6C','left',900);}};};

sortSlide({id:'ohsort',stageNo:4,chip:'활동 · 분류',title:'물질을 저항의 크기에 따라 분류해 보자',tocName:'[활동] 물질 분류',seed:7,
  bins:{d:['도체','저항이 작아 전류가 잘 흐름'],p:['부도체','저항이 커서 전류가 거의 흐르지 않음'],h:['반도체','중간 정도의 저항']},
  cards:D.SORT,left:`<div class="panel glow"><div class="pt"><div>🎯 은, 구리, 철, 알루미늄, 고무, 플라스틱, 나무, 유리, 규소, 저마늄을 알맞은 칸에 놓아 보자.</div></div></div>`,

TS({stageNo:4,chip:'이용',title:'도체와 부도체는 어디에 쓰일까?',tocName:'도체·부도체·반도체의 이용',anim:'use',max:3,note:NX('s4'),tw:660,
  text:`<div class="panel glow">${LL(B.s4_use)}</div>${ASK('전선은 구리선을 플라스틱으로<br>감싸서 만들어!')}`});

/* ================= 도전 : 어느 선의 그래프일까? ================= */
const CHB=(g)=>OH_CHC.map(([n,c,cn],v)=>`<button class="cbtn" data-d="${v}" data-g="${g}" style="border-left:14px solid ${c}">${n} ${cn}</button>`).join('');
const CHUI=`<div class="simspec chbox" style="display:flex;flex-direction:column;gap:10px">
  <div class="flow">${OH_CHW.map((w,i)=>`<div class="fstep now"><span class="fnum">${i+1}</span><div class="fbody"><div class="flab"><b>${w.n}</b> ${w.txt}</div><div class="gkinds" data-g="${i}">${CHB(i)}</div></div></div>`).join('')}</div>
  <div class="chbar"><button class="cbtn go" data-chact="check">정답 확인</button><button class="cbtn" data-chact="hint">💡 힌트</button><button class="cbtn" data-chact="new">↻ 새 문제</button></div>
  <div class="chmsg" data-chmsg></div><div class="chstar" data-chstar></div></div>`;
function chRender(root){
  root.querySelectorAll('.gkinds').forEach(g=>{const i=+g.dataset.g;g.querySelectorAll('.cbtn').forEach(b=>{const on=CH.ans[i]!==null&&+b.dataset.d===CH.ans[i];
    b.classList.toggle('sel',on&&CH.res[i]==null);b.classList.toggle('ok',on&&CH.res[i]===true);b.classList.toggle('bad',on&&CH.res[i]===false);});});
  const m=root.querySelector('[data-chmsg]');m.textContent=CH.msg;m.className='chmsg'+(CH.cls?' '+CH.cls:'');
  root.querySelector('[data-chstar]').textContent='★ 모은 별 '+CH.total+'개 · 도전 '+CH.round+'번째';
  root.querySelector('[data-chact="check"]').disabled=CH.solved;}
const CH_HINTS=['같은 전압(예: 6.0 V)에서 전류의 세기가 가장 큰 그래프는 어느 선일까? 그래프에서 위쪽에 있는 선이야.','저항이 작을수록 같은 전압에서 전류가 많이 흘러. (가) 짧고 굵은 선과 (나) 길고 굵은 선 중 저항이 더 작은 것은?','(나)와 (다)는 길이가 같지만 굵기가 달라. 가는 선은 굵은 선보다 저항이 커서 전류가 덜 흘러.'];
function chCheck(){
  if(CH.ans.some(a=>a===null)){CH.msg='세 선의 그래프(ㄱ·ㄴ·ㄷ)를 모두 골라 줘!';CH.cls='bad';return;}
  CH.res=OH_CHW.map((w,i)=>CH.ans[i]===CH.perm[i]);
  if(CH.res.every(Boolean)){CH.solved=true;CH.stars=Math.max(1,3-CH.hints-CH.wrong);CH.total+=CH.stars;CH.cls='ok';
    CH.msg='정답! 별 '+CH.stars+'개를 얻었어. 저항이 작을수록(짧고 굵을수록) 같은 전압에서 전류의 세기가 커서 그래프가 가팔라.';return;}
  CH.wrong++;CH.cls='bad';
  const inv=CH.ans[0]!==null&&CH.ans[0]!==CH.perm[0]&&CH.ans[2]===CH.perm[0]&&CH.ans[0]===CH.perm[2];   // (가)와 (다)를 서로 바꿔 고른 경우
  CH.msg=inv?'가파른 그래프(전류가 큰 쪽)를 저항이 큰 선에 짝지은 것 같아. 같은 전압에서 전류가 큰 쪽은 저항이 클까, 작을까?':'아직 맞지 않은 선이 있어(빨강 표시). 같은 전압에서 전류가 클수록 저항이 작다는 것을 떠올려 보자.';}
function chEnter(el){
  const root=el.querySelector('.chbox');if(!root)return;CH.shuffle();CH.reset();
  if(!root._b){root._b=1;stopAll(root);
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.blur();
      if(b.dataset.d!=null&&!CH.solved){const i=+b.dataset.g;CH.ans[i]=+b.dataset.d;CH.res[i]=null;}
      else if(b.dataset.chact==='check'&&!CH.solved)chCheck();
      else if(b.dataset.chact==='hint'&&!CH.solved){CH.msg='💡 '+CH_HINTS[Math.min(CH.hints,2)];CH.hints=Math.min(3,CH.hints+1);CH.cls='';}
      else if(b.dataset.chact==='new'){CH.round++;CH.shuffle();CH.reset();}
      chRender(root);});}
  chRender(root);}
S({stageNo:4,rows:true,chip:'도전 · 추리',title:'도전! 어느 선의 그래프일까?',tocName:'[도전] 어느 선의 그래프?',note:NX('chal'),
  body:`<div class="col" style="flex:0 0 470px;gap:10px;justify-content:flex-start">${CHUI}</div><div class="col">${A('chal',760)}</div>`,

   ${r.table.map(row=>`<tr>${row.map(c=>`<td>${T(c)}</td>`).join('')}</tr>`).join('')}</table></div>
   <div class="panel">${LL(r.lines)}</div>`}));

QOX(3,D.Q3_Q,D.Q3,D.Q3_NOTE,{note:NX('q'),hints:D.Q3_HINTS});

  <div class="qlist" style="flex:1">${D.Q4.map(([t,an],i)=>`<div class="qitem" style="flex-wrap:wrap"><span class="mk">(${i+1})</span><span class="txt">${t}</span><span class="bl" style="margin-left:auto;min-width:130px;text-align:center">${an}</span></div>`).join('')}</div></div>`,D.Q4_NOTE,{note:NX('q')});
QD(5,D.Q5_Q,D.Q5_MODEL,D.Q5_KEYS,null,{sub:'서술형 · ★ 도전',note:NX('q')});

S({ch:'E',chName:'마무리',chip:'스스로 점검',title:'오늘 배운 내용을 점검해 봅시다',tocName:'스스로 점검',
  body:`<div class="panel glow">${D.SELF_CHECK.map(t=>`<div class="step" style="font-size:34px;font-weight:700;margin:12px 0">☐ &nbsp;${t}</div>`).join('')}</div>
   <div class="bubbleRow"><img class="mascot" src="${MASCOT_HAPPY}" alt="탐이"><div class="bubble">모두 체크했다면 오늘 수업 성공!<br>수고했어요!</div></div>`});

/* 선택 표시 */
['[활동] 물질 분류','[도전] 어느 선의 그래프?'].forEach(n=>{const d=SLIDES.find(x=>x.tocName===n);if(d){d.chip=(d.chip||'').replace(/ · 선택$/,'')+' · 선택';d.tocName=n+' (선택)';}});

assignStages();buildDeck();fit();setMode(/self/i.test(location.hash),true);go(0,0);
