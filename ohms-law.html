*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* ---- THEME: 단원에 맞게 아래 변수만 바꿔 쓰세요.
     --ans 는 '공개된 정답' 색이므로 다른 색과 확실히 구분되게 유지합니다. ---- */
  --navy:#071426; --navy2:#0d2340; --navy3:#14395f;
  --ice:#8fe3ff; --water:#3fa9ff; --vapor:#dbeeff;
  --ans:#ffe14d; --ansGlow:rgba(255,225,77,.55);
  --gold:#ffd166; --mint:#5ef2c4; --heat:#ff8c42; --cool:#5ec8ff;
  --line:rgba(143,227,255,.28);
}
html,body{height:100%;overflow:hidden;background:#04101f;font-family:Pretendard,'Malgun Gothic','맑은 고딕',sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}

/* ============ STAGE ============
   Fixed 1600x900 design surface, CSS-scaled to fit any window/projector
   by fit(). Never lay out slide content against the
   live viewport size — always against this 1600x900 canvas. */
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;
  flex:none; /* v3.26: body 가 flex 라서 이것이 없으면 화면 폭이 1600 보다 좁을 때 무대가 먼저 줄어(1280 폭 → 1280px) 그림 칸만 좁아지고 좌우에 빈 띠가 생겼다. 무대는 늘 1600×900 그대로 두고 fit() 의 scale 로만 줄인다 */
  background:radial-gradient(1200px 700px at 20% 0%,#0f4a52 0%,#0a2a3a 45%,#04121c 100%);
  overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.8)}
#bgfx{position:absolute;inset:0;z-index:0;opacity:.5}
#bgGlow{position:absolute;inset:0;z-index:0;
  background:radial-gradient(700px 500px at 85% 90%,rgba(63,169,255,.16),transparent 70%),
             radial-gradient(600px 400px at 10% 85%,rgba(94,242,196,.10),transparent 70%)}

/* ============ SLIDE ============ */
.slide{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;padding:34px 54px 64px}
.slide.active{display:flex;animation:slideIn .45s cubic-bezier(.2,.8,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(22px) scale(.995)}to{opacity:1;transform:none}}

/* header */
.shead{display:flex;align-items:center;gap:18px;flex:0 0 auto;margin-bottom:22px}
.chip{font-size:22px;font-weight:800;letter-spacing:.5px;padding:9px 20px;border-radius:999px;
  background:linear-gradient(135deg,rgba(143,227,255,.20),rgba(63,169,255,.12));
  border:1.5px solid var(--line);color:var(--ice);white-space:nowrap}
.stitle{font-size:46px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.15;
  text-shadow:0 4px 26px rgba(63,169,255,.35)}
.stitle .sub{font-size:30px;font-weight:700;color:var(--vapor);opacity:.75;margin-left:12px}
.shead::after{content:'';flex:1;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--line),transparent)}

/* body */
.sbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:20px;font-size:33px;color:#eaf6ff;line-height:1.5}
.sbody.row{flex-direction:row;gap:34px;align-items:stretch}
.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:18px}
.center{align-items:center;justify-content:center}

/* text bits */
.lead{font-size:38px;font-weight:800;color:#fff}
.dash{display:flex;gap:14px;align-items:flex-start}
.dash::before{content:'';flex:0 0 auto;width:14px;height:14px;margin-top:16px;border-radius:4px;
  background:linear-gradient(135deg,var(--ice),var(--water));box-shadow:0 0 12px rgba(143,227,255,.6)}
.num{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:42px;height:42px;border-radius:12px;font-size:24px;font-weight:900;color:#062033;
  background:linear-gradient(135deg,var(--ice),var(--water));margin-right:12px}
.small{font-size:27px}
.tiny{font-size:23px;opacity:.8}
.hl{color:var(--gold);font-weight:800}
.q{color:var(--mint);font-weight:800}

/* panel */
.panel{background:linear-gradient(160deg,rgba(20,57,95,.55),rgba(10,30,54,.5));
  border:1.5px solid var(--line);border-radius:22px;padding:24px 28px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 34px rgba(0,0,0,.3)}
.panel.tight{padding:16px 20px}
.panel.glow{border-color:rgba(143,227,255,.5);box-shadow:0 0 40px rgba(63,169,255,.18),inset 0 1px 0 rgba(255,255,255,.08)}

/* ============ BLANK / ANSWER ============
   This is the heart of the "teacher's-edition reveal" UX: .bl starts
   with transparent text (a blank), .bl.on reveals it in --ans color
   with a pop animation. See buildDeck()/render() for
   how .bl elements are auto-numbered and toggled by click/space. */
.bl{display:inline-block;position:relative;padding:2px 14px;margin:0 3px;border-radius:10px;
  font-weight:800;color:transparent;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.07));
  box-shadow:inset 0 0 0 2px rgba(143,227,255,.30);
  transition:color .28s ease,background .35s ease,box-shadow .35s ease,transform .3s cubic-bezier(.2,1.6,.4,1)}
.bl.on{color:var(--ans);background:rgba(255,225,77,.10);
  box-shadow:inset 0 0 0 2px rgba(255,225,77,.35),0 0 22px rgba(255,225,77,.22);
  animation:pop .42s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
td .bl,th .bl{margin:0}

/* generic step reveal (fade-in blocks that aren't fill-in-the-blank,
   e.g. bullet points, extra explanation panels) */
.step{opacity:0;transform:translateY(14px);transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.3,1)}
.step.on{opacity:1;transform:none}
.step.nofly{transform:none}

/* ============ TABLE ============ */
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:29px;
  border:2px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(8,26,46,.5)}
table.t th{background:linear-gradient(180deg,rgba(63,169,255,.28),rgba(63,169,255,.14));
  color:#fff;font-weight:800;padding:14px 12px;font-size:30px}
table.t td{padding:13px 14px;text-align:center;border-top:1.5px solid rgba(143,227,255,.18);
  border-left:1.5px solid rgba(143,227,255,.14);color:#eaf6ff}
table.t td:first-child,table.t th:first-child{border-left:none}
table.t td.lbl{background:rgba(143,227,255,.10);font-weight:800;color:var(--ice);font-size:28px}
table.t td.left{text-align:left}
table.t.sm{font-size:25px}
table.t.sm td{padding:9px 10px}
table.t.sm th{font-size:26px;padding:10px}

/* ============ FIGURE / CANVAS ============ */
.fig{position:relative;border-radius:20px;overflow:hidden;background:rgba(4,16,31,.55);
  border:1.5px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.fig canvas,.fig svg{display:block;width:100%;height:100%}
.figcap{position:absolute;left:0;right:0;bottom:0;padding:8px 16px;font-size:23px;font-weight:700;
  color:var(--ice);background:linear-gradient(0deg,rgba(4,16,31,.9),transparent);text-align:center}
.badge{position:absolute;top:12px;left:14px;font-size:24px;font-weight:800;color:#062033;
  padding:5px 16px;border-radius:999px;background:linear-gradient(135deg,var(--ice),var(--water))}
.badge.r{left:auto;right:14px;background:linear-gradient(135deg,#ffb0bf,var(--ans));color:#3a0512}
.badge.heat{background:linear-gradient(135deg,#ffd166,var(--heat));color:#3a1c00}
.badge.cool{background:linear-gradient(135deg,#bfe9ff,var(--cool));color:#04263a}

/* ============ TITLE SLIDE ============ */
.cover{align-items:center;justify-content:center;text-align:center;gap:0}
.cover .big{font-size:104px;font-weight:900;color:#fff;letter-spacing:-3px;
  text-shadow:0 10px 60px rgba(63,169,255,.5)}
.cover .mid{font-size:52px;font-weight:800;margin-top:14px;
  background:linear-gradient(90deg,var(--ice),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .goal{margin-top:38px;font-size:31px;color:var(--vapor);max-width:1100px;line-height:1.6}
.cover .hint{margin-top:44px;font-size:25px;color:var(--ice);opacity:.75}

/* ============ QUIZ / CONCEPT-CHECK ============ */
.qhead{display:flex;gap:16px;align-items:flex-start;font-size:34px;font-weight:800;color:#fff;line-height:1.4}
.qno{flex:0 0 auto;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#062033;background:linear-gradient(135deg,var(--mint),var(--ice));margin-top:2px}
.qlist{display:flex;flex-direction:column;gap:12px;font-size:31px;margin-top:6px}
.qitem{display:flex;gap:14px;align-items:flex-start;padding:11px 20px;border-radius:14px;
  background:rgba(143,227,255,.07);border:1.5px solid rgba(143,227,255,.16);transition:all .35s ease}
.qitem .mk{flex:0 0 auto;font-weight:800;color:var(--ice);min-width:34px}
.qitem .ansbox{margin-left:auto;flex:0 0 auto;min-width:96px;text-align:center;font-weight:900;
  color:transparent;background:rgba(255,255,255,.10);border-radius:10px;padding:0 12px;
  box-shadow:inset 0 0 0 2px rgba(143,227,255,.28);transition:all .3s ease}
.qitem.on .ansbox{color:var(--ans);background:rgba(255,225,77,.12);box-shadow:inset 0 0 0 2px rgba(255,225,77,.4)}
.qitem.ans{opacity:1;transform:none}
.qitem.ans.on{background:rgba(255,225,77,.14);border-color:rgba(255,225,77,.55);
  box-shadow:0 0 30px rgba(255,225,77,.18);transform:translateX(6px)}
.qitem.ans.on .mk,.qitem.ans.on .txt{color:var(--ans);font-weight:800}
.qitem .txt{flex:1}
.qnote{font-size:27px;color:var(--gold);font-weight:700;padding:12px 20px;border-radius:14px;
  background:rgba(255,209,102,.10);border:1.5px solid rgba(255,209,102,.3)}
.slide.dense .qlist{font-size:26px}
.slide.dense .qitem{padding:7px 16px}
.slide.dense table.t.sm{font-size:23px}
.qbox{font-size:29px;padding:16px 22px;border-radius:14px;background:rgba(8,26,46,.6);
  border:1.5px dashed rgba(143,227,255,.4);line-height:1.6}

/* ============ HUD / NAV ============ */
#hud{position:absolute;left:0;right:0;bottom:0;height:46px;z-index:9;display:flex;align-items:center;
  gap:16px;padding:0 22px;font-size:20px;color:rgba(219,238,255,.55);
  background:linear-gradient(0deg,rgba(4,16,31,.85),transparent)}
#prog{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.10);overflow:hidden}
#progbar{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--ice),var(--mint));transition:width .35s ease}
#hud b{color:var(--ice)}
.navbtn{pointer-events:auto;cursor:pointer;padding:3px 12px;border-radius:9px;border:1.5px solid var(--line);
  background:rgba(143,227,255,.10);color:var(--vapor);font-size:19px;font-weight:700}
.navbtn:hover{background:rgba(143,227,255,.24)}
#toc{position:absolute;inset:0;z-index:20;display:none;background:rgba(4,12,24,.96);padding:50px 60px;overflow:auto}
#toc.show{display:block}
#toc h3{font-size:38px;color:#fff;margin-bottom:20px}
.tocgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tocitem{padding:10px 14px;border-radius:12px;background:rgba(143,227,255,.08);border:1.5px solid var(--line);
  color:var(--vapor);font-size:20px;cursor:pointer;line-height:1.3}
.tocitem:hover{background:rgba(143,227,255,.25);color:#fff}
.tocitem.ch{grid-column:1/-1;background:linear-gradient(90deg,rgba(63,169,255,.3),transparent);
  font-size:26px;font-weight:900;color:var(--ice);border:none}
#toast{position:absolute;top:24px;left:50%;transform:translateX(-50%);z-index:30;padding:10px 26px;
  border-radius:999px;background:rgba(4,16,31,.9);border:1.5px solid var(--line);color:var(--ice);
  font-size:22px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* ============ MISC ANIM HELPERS ============ */
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.arrowR{font-size:40px;color:var(--ice)}
.eqrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

/* ===== 체세포 분열 덱 추가 스타일 ===== */
.pt{display:flex;gap:14px;align-items:flex-start;font-size:31px;line-height:1.55;margin:4px 0}
.pt::before{content:'';flex:0 0 auto;width:14px;height:14px;margin-top:17px;border-radius:50%;
  background:linear-gradient(135deg,var(--ice),var(--water));box-shadow:0 0 12px rgba(143,227,255,.6)}
.def{font-size:36px;font-weight:800;color:#fff;line-height:1.55}
.stlist{display:flex;flex-direction:column;gap:10px}
.stitem{display:flex;gap:16px;align-items:center;padding:10px 18px;border-radius:14px;font-size:27px;
  background:rgba(143,227,255,.06);border:1.5px solid rgba(143,227,255,.14);transition:all .3s ease;color:#cfe6f5}
.stitem b{flex:0 0 auto;min-width:150px;font-size:30px;color:var(--ice)}
.stitem.cur{background:rgba(255,225,77,.14);border-color:rgba(255,225,77,.6);color:#fff;transform:translateX(8px);box-shadow:0 0 26px rgba(255,225,77,.18)}
.stitem.cur b{color:var(--ans)}
.ctrl{display:flex;gap:10px;justify-content:center;margin-top:6px}
.cbtn{cursor:pointer;padding:8px 20px;border-radius:12px;border:1.5px solid var(--line);background:rgba(143,227,255,.10);
  color:var(--vapor);font-size:23px;font-weight:800}
.cbtn.on{background:rgba(255,225,77,.18);border-color:rgba(255,225,77,.6);color:var(--ans)}
.key{color:var(--gold);font-weight:800}
.ph{display:inline-block;padding:2px 14px;border-radius:10px;font-weight:900;background:rgba(143,227,255,.14);color:var(--ice);margin:0 4px}

/* ===== 수정본 추가 스타일 ===== */
.sbody,.pt,.panel,.qitem,.qnote,.qbox,.def{word-break:keep-all}
.chip.stg{background:linear-gradient(135deg,#ffd166,#ff8c42);color:#3a1c00;border:none}
.mascot{filter:drop-shadow(0 8px 22px rgba(63,169,255,.35))}
.bubbleRow{display:flex;align-items:center;gap:18px;margin-top:26px}
.bubbleRow .mascot{width:128px;height:auto}
.bubble{position:relative;font-size:27px;font-weight:700;line-height:1.5;color:#fff;padding:14px 24px;border-radius:22px;
  background:rgba(255,140,66,.16);border:2px solid rgba(255,140,66,.65)}
.bubble::before{content:'';position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:rgba(255,140,66,.65);border-left:0}
/* 목차: 항목이 늘어도 한 화면에 최대한 들어가도록 촘촘하게 */
#toc{background:#04101f;padding:18px 46px}
#toc h3{font-size:28px;margin-bottom:8px}
.tocgrid{grid-template-columns:repeat(5,1fr);gap:5px}
.tocitem{padding:4px 12px;font-size:18px;line-height:1.25}
.tocitem.ch{font-size:20px;padding:3px 14px}
/* 자습 모드: 버튼을 크게, 빈칸은 눌러서 확인 */
body.self{cursor:default}
body.self #hud{height:64px;gap:18px;padding:0 24px}
body.self .navbtn{font-size:24px;padding:6px 22px;border-radius:13px}
body.self .slide{padding-bottom:72px}
body.self .bl{cursor:pointer}
body.self .bl:not(.on){animation:tapHint 2.4s ease-in-out infinite}
@keyframes tapHint{0%,100%{box-shadow:inset 0 0 0 2px rgba(143,227,255,.30)}50%{box-shadow:inset 0 0 0 2.5px rgba(255,225,77,.75)}}
/* ============ 교사 메모 (N 키) ============ */
#tnote{position:absolute;right:22px;top:22px;z-index:25;width:620px;padding:20px 24px;border-radius:18px;display:none;
  background:rgba(20,16,2,.95);border:2px solid var(--gold);color:#ffeccc;font-size:22px;line-height:1.6;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#tnote.show{display:block}
#tnote h4{font-size:22px;color:var(--gold);margin-bottom:6px}

/* ============ 서술형 · 카드 분류 · 슬라이더 (engine/widgets.js) ============ */
.kw{display:inline-block;margin:4px 6px;padding:4px 16px;border-radius:999px;font-size:25px;font-weight:800;color:#062a17;background:var(--ice)}
.model{font-size:29px;line-height:1.65}
.model b.hl{color:var(--gold)}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:10px;border-radius:16px;border:2px dashed rgba(166,240,198,.35)}
.card{cursor:pointer;font-size:24px;font-weight:800;padding:8px 16px;border-radius:12px;background:#f3fbf6;color:#13402b;
  box-shadow:0 4px 0 #8fc9a6;transition:transform .25s,background .25s;user-select:none}
.card:hover{transform:translateY(-3px)}
.card.ok{background:#c8ffd9;box-shadow:0 4px 0 #3ecf8e}
.card.fix{background:#ffe2b8;box-shadow:0 4px 0 #e0a040}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.bins{display:flex;gap:16px}
.bin{flex:1;border-radius:18px;padding:12px 14px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.bin h4{font-size:25px;font-weight:900;margin-bottom:4px}
.bin h4 small{font-size:20px;opacity:.8;font-weight:700}
.bin.b1{background:rgba(255,224,102,.10);border:2.5px solid rgba(255,224,102,.6)}.bin.b1 h4{color:#ffe066}
.bin.b2{background:rgba(95,212,255,.08);border:2.5px solid rgba(95,212,255,.5)}.bin.b2 h4{color:#8fe3ff}
.bin.b3{background:rgba(255,140,170,.08);border:2.5px solid rgba(255,140,170,.5)}.bin.b3 h4{color:#ff9db5}
.slider{display:flex;align-items:center;gap:18px;font-size:26px;font-weight:800;padding:10px 18px;border-radius:16px;background:rgba(0,0,0,.25);border:1.5px solid var(--line)}
.slider input[type=range]{flex:1;height:34px;accent-color:#ffe066;cursor:pointer}
.slider .val{min-width:150px;text-align:center;color:#ffe066;font-size:30px}

/* 카드 끌어서 분류 (sortSlide) */
.card{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.card.dragging{transition:none!important;will-change:transform;cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.bin.over,.pool.over{outline:4px solid #F4C33B;outline-offset:2px}
.sortbtns{display:flex;gap:12px}
.sortbtns .cbtn{font-size:26px;padding:8px 26px}

/* O/X 직접 고르기(자습 모드 전용, QOX 의 opt.hints) — 어두운·밝은 테마 모두에서 읽히도록 자체 배경을 쓴다 */
.self-only{display:none}
body.self .oxpick.self-only{display:inline-flex;gap:8px;margin-left:auto}
body.self .oxh.self-only:not(:empty){display:block}
.oxb{min-width:56px;min-height:48px;font-size:28px;font-weight:900;border-radius:12px;border:3px solid #8FA29D;background:#fff;color:#1F2D2B;cursor:pointer}
.oxb.good{background:#1F7A6C;border-color:#14594F;color:#fff}.oxb.wrong{background:#B4540F;border-color:#8A3F06;color:#fff}
.oxh{flex:0 0 100%;font-size:26px;line-height:1.3;padding:8px 14px;font-weight:700;border-radius:10px}
.oxh.wrong{background:#FFF1DF;color:#8A3F06}.oxh.good{background:#E2F5F0;color:#14594F}
.qitem.hx{flex-wrap:wrap}
body.self .qitem.hx .oxpick+.bl{margin-left:12px!important}

/* ---------- 접근성(v3.25k) : 키보드 포커스 표시 · 스크린 리더 전용 영역 · 움직임 줄이기 ---------- */
:focus-visible{outline:3px solid #F4C33B;outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#btnMotion[aria-pressed="true"]{background:rgba(244,195,59,.25);border-color:#F4C33B}
/* 운영체제의 '동작 줄이기' 설정이거나 🐢 천천히 버튼(D 키)을 켰을 때: 화면 전환·깜박임·펄스 끄기(그림 애니메이션은 0.3배속) */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.reduce *,body.reduce *::before,body.reduce *::after{animation:none!important;transition:none!important}
/* =====================================================================
   테마 'clean' — '직소 모형 안내 슬라이드(공유용)'의 톤앤매너
   · 밝은 바탕(#FBFDFC) + 짙은 먹색 글자(#1D2B2A) + 청록(#1F7A6C) 포인트, 강조 띠는 노랑(#F4C33B)
   · 그림자·글로우·그라데이션 없이 얇은 테두리의 흰 카드, 표지·정리 질문만 짙은 바탕
   · 색 의미 4색(청록·보라·주황·파랑)은 단원 안에서 한 가지 뜻으로 고정한다
   data.py 에 THEME = "clean" 이 있을 때만 engine.css 뒤에 붙는다 (옛 단원은 바다 톤 그대로).
   ===================================================================== */
:root{
  --navy:#1D2B2A; --navy2:#4A5A58; --navy3:#D3E2DE;
  --ice:#1F7A6C; --water:#1F7A6C; --vapor:#4A5A58;
  --ans:#B4540F; --ansGlow:rgba(180,84,15,.25);
  --gold:#B4540F; --mint:#1F7A6C; --heat:#B4540F; --cool:#2F6FB0;
  --line:#D3E2DE;
  /* 슬라이드 4색 + 강조 */
  --c-teal:#1F7A6C; --c-purple:#7A5BB5; --c-orange:#B4540F; --c-blue:#2F6FB0; --yellow:#F4C33B;
  --t-teal:#E3F0ED; --t-purple:#ECE6F5; --t-orange:#F7DFCB; --t-blue:#DCE7F3;
  --ink:#1D2B2A; --sub:#4A5A58; --paper:#FBFDFC; --mist:#EAF3F0; --card:#FFFFFF;
}
html,body{background:#E4ECE9}
#stage{background:var(--paper);box-shadow:0 0 0 1px #cfdcd8}
#bgfx,#bgGlow{display:none}
.slide{padding:40px 64px 66px}
.slide.active{animation:slideIn .3s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 머리말 : 칩 + 제목, 장식 선 없음 */
.shead{gap:16px;margin-bottom:26px}
.shead::after{display:none}
.chip{font-size:22px;font-weight:800;letter-spacing:0;padding:7px 18px;border-radius:999px;
  background:var(--t-teal);border:none;color:var(--c-teal)}
.chip.stg{background:var(--c-teal);color:#fff}
.stitle{font-size:46px;font-weight:800;color:var(--ink);letter-spacing:-.5px;text-shadow:none}
.stitle .sub{font-size:30px;font-weight:600;color:var(--sub);opacity:1}

/* 본문 */
.sbody{color:var(--ink)}
.lead{color:var(--ink)}
.hl{color:var(--c-orange)}
.q{color:var(--c-teal)}
.key{color:var(--c-orange)}
.num{color:#fff;background:var(--c-teal);border-radius:50%}
.dash::before,.pt::before{background:var(--c-teal);box-shadow:none}
.def{color:var(--ink)}
.tiny{opacity:1;color:var(--sub)}
.arrowR{color:var(--ink)}
.ph{background:var(--t-teal);color:var(--c-teal)}

/* 카드(panel) : 흰 바탕 + 얇은 테두리 */
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;box-shadow:none}
.panel.glow{border-color:var(--c-teal);box-shadow:none}

/* 빈칸·정답 : 정답은 주황 글씨 + 연한 주황 칸(학습지 교사용과 같은 약속) */
.bl{background:#EEF3F1;box-shadow:inset 0 -3px 0 #A9BCB7;border-radius:8px}
.bl.on{color:var(--c-orange);background:var(--t-orange);box-shadow:inset 0 -3px 0 var(--c-orange);animation:pop .3s ease-out}
body.self .bl:not(.on){animation:tapHint 2.4s ease-in-out infinite}
@keyframes tapHint{0%,100%{box-shadow:inset 0 -3px 0 #A9BCB7}50%{box-shadow:inset 0 -3px 0 var(--yellow)}}

/* 표 */
table.t{border:1.5px solid var(--line);background:var(--card);border-radius:14px}
table.t th{background:var(--ink);color:#fff}
table.t td{color:var(--ink);border-top:1.5px solid var(--line);border-left:1.5px solid var(--line)}
table.t td.lbl{background:var(--t-teal);color:var(--c-teal)}

/* 그림 틀 */
.fig{background:var(--card);border:1.5px solid var(--line);box-shadow:none;border-radius:18px}
.figcap{color:var(--sub);background:linear-gradient(0deg,rgba(255,255,255,.95),transparent)}
.badge{color:#fff;background:var(--c-teal)}
.badge.r{background:var(--c-orange);color:#fff}
.badge.heat{background:var(--c-orange);color:#fff}
.badge.cool{background:var(--c-blue);color:#fff}

/* 표지 : 짙은 바탕, 흰 글자, 노랑 소제목 */
.slide:has(.sbody.cover){background:var(--ink);margin:0}
.slide:has(.sbody.cover) .fig{background:transparent}
.cover .big{color:#fff;text-shadow:none;letter-spacing:-2px}
.cover .mid{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--yellow);font-weight:700}
.cover .goal{color:#D3E2DE}
.cover .hint{color:#A9BCB7;opacity:1}
.slide:has(.sbody.cover) .bubble{color:var(--ink)}

/* 퀴즈 */
.qhead{color:var(--ink)}
.qno{background:var(--c-teal);color:#fff;border-radius:50%}
.qitem{background:var(--card);border:1.5px solid var(--line)}
.qitem .mk{color:var(--c-teal)}
.qitem .ansbox{background:#EEF3F1;box-shadow:inset 0 -3px 0 #A9BCB7}
.qitem.on .ansbox{color:var(--c-orange);background:var(--t-orange);box-shadow:inset 0 -3px 0 var(--c-orange)}
.qitem.ans.on{background:var(--t-orange);border-color:var(--c-orange);box-shadow:none;transform:none}
.qitem.ans.on .mk,.qitem.ans.on .txt{color:var(--c-orange)}
/* 강조 띠(슬라이드의 노란 한 줄 요약) */
.qnote,.callout{font-size:30px;color:var(--ink);font-weight:800;padding:14px 26px;border-radius:14px;background:var(--yellow);border:none}
.qbox{background:var(--card);border:1.5px dashed #A9BCB7}

/* 진행 표시줄·내비게이션 */
#hud{color:var(--sub);background:transparent}
#prog{background:#D3E2DE}
#progbar{background:var(--c-teal)}
#hud b{color:var(--c-teal)}
.navbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.navbtn:hover{background:var(--t-teal)}
#toc{background:var(--paper)}
#toc h3{color:var(--ink)}
.tocitem{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.tocitem:hover{background:var(--t-teal);color:var(--ink)}
.tocitem.ch{background:var(--ink);color:#fff}
#toast{background:var(--ink);border:none;color:#fff}
#ansCnt{color:var(--c-orange)!important}

/* 단계 표시·버튼 */
.stitem{background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.stitem b{color:var(--c-teal)}
.stitem.cur{background:var(--t-orange);border-color:var(--c-orange);color:var(--ink);transform:none;box-shadow:none}
.stitem.cur b{color:var(--c-orange)}
.cbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.cbtn.on{background:var(--t-orange);border-color:var(--c-orange);color:var(--c-orange)}

/* 마스코트·말풍선 */
.mascot{filter:none}
.bubble{color:var(--ink);background:#fff;border:2px solid var(--c-orange)}
.bubble::before{border-right-color:var(--c-orange)}

/* 교사 메모 */
#tnote{background:#fff;border:2px solid var(--yellow);color:var(--ink);box-shadow:0 8px 28px rgba(29,43,42,.18)}
#tnote h4{color:var(--c-orange)}

/* 서술형·카드 분류·슬라이더 (widgets.js) */
.kw{color:#fff;background:var(--c-teal)}
.model b.hl{color:var(--c-orange)}
.pool{border:2px dashed #A9BCB7}
.card{background:#fff;color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.card:hover{transform:none;border-color:var(--c-teal)}
.card.ok{background:var(--t-teal);border-color:var(--c-teal);box-shadow:none}
.card.fix{background:var(--t-orange);border-color:var(--c-orange);box-shadow:none}
.bin.b1{background:var(--t-teal);border:2px solid var(--c-teal)}.bin.b1 h4{color:var(--c-teal)}
.bin.b2{background:var(--t-blue);border:2px solid var(--c-blue)}.bin.b2 h4{color:var(--c-blue)}
.bin.b3{background:var(--t-purple);border:2px solid var(--c-purple)}.bin.b3 h4{color:var(--c-purple)}
.slider{background:var(--card);border:1.5px solid var(--line)}
.slider input[type=range]{accent-color:var(--c-teal)}
.slider .val{color:var(--c-teal)}

/* 새 부품 : 슬라이드의 흰 카드 3장 + 화살표, 노란 띠, 색 이름표 */
.cards3{display:flex;align-items:stretch;gap:18px}
.cards3 .cd{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px 26px;font-size:30px;line-height:1.5}
.cards3 .cd h4{font-size:34px;font-weight:800;margin-bottom:6px}
.cards3 .cd .tm{display:inline-block;margin-top:10px;padding:2px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:24px;font-weight:800}
.cards3 .ar{align-self:center;font-size:44px;color:var(--c-teal);font-weight:900}
.tag-t,.tag-p,.tag-o,.tag-b{display:inline-block;padding:2px 16px;border-radius:8px;color:#fff;font-weight:800;margin:0 4px}
.tag-t{background:var(--c-teal)}.tag-p{background:var(--c-purple)}.tag-o{background:var(--c-orange)}.tag-b{background:var(--c-blue)}
/* 단원 전용 학습지 스타일. 공통 스타일은 worksheet.css — 여기서는 덮어쓸 것만 적는다 */
body{font-size:12pt}
.page{gap:3.4mm;padding:9mm 11mm 13mm}
.box{flex:0 0 auto!important;padding:3.2mm 5mm}
.box h3{font-size:13.6pt;margin-bottom:1.6mm}
.ln{line-height:1.7;margin:.8mm 0}
h1{font-size:25pt}
.figc{margin:1mm auto}
.tnote{background:#FDF3CF;border:.3mm solid #F4C33B;border-radius:2.6mm;padding:1.6mm 3mm;font-size:9.2pt;color:#1D2B2A}
.tnote b{background:#1D2B2A;color:#F4C33B;border-radius:2mm;padding:.1mm 2mm;margin-right:2mm;font-size:8.6pt}
.draw{background:#F4F8F7;border-radius:2.4mm;padding:1.6mm 3mm;font-size:10.4pt}
.safe{background:#FDEDEC;border:.3mm solid #E6A39B;border-radius:2.6mm;padding:1.6mm 3mm;font-size:10pt;color:#7A2418}
.safe b{color:#C0392B;margin-right:1.6mm}
table.to th,table.to td{text-align:center;font-size:10.6pt;padding:1.4mm 1.4mm}
table.dt th{font-size:10pt;background:#E7F2EF;width:34mm}
table.dt td{font-size:11pt}
table.q4t{margin:1.6mm auto;width:150mm}
table.q4t th{background:#E7F2EF}
.fml{background:#FFF8E1;border:.3mm solid #F4C33B;border-radius:2.4mm;padding:.8mm 4mm;margin:1.4mm 0;text-align:center}
.fml .ln{font-size:13.4pt;font-weight:800}
.sorth{display:flex;flex-wrap:wrap;gap:2mm;justify-content:center;margin:1.2mm 0 2mm}
.sc{display:inline-block;padding:.8mm 3.2mm;border:.4mm solid #1F7A6C;border-radius:3mm;background:#fff;font-weight:800;font-size:10.8pt}
.sbins{display:flex;gap:2.6mm}
.sbin{flex:1;border:.3mm dashed #8FA29D;border-radius:2.4mm;padding:1.6mm 2.2mm;font-size:9.8pt;line-height:1.35;min-height:15mm}
.sbin b{display:block;color:#1F7A6C;margin-bottom:1mm}
.sbin .sw .an{font-size:10.4pt}
.slide table.to th,.slide table.to td{font-size:32px;padding:10px 14px}.slide table.to{border-collapse:collapse}.slide table.to th,.slide table.to td{border-bottom:2px solid #c9d4d1}
/* 웹앱 전용(터치 크기) */
.simspec .cbtn,.chbox .cbtn,.simspec [data-act],.simspec .stbtn .cbtn{min-height:70px;min-width:76px;display:inline-flex;align-items:center;justify-content:center}
.simspec .flow .cbtn{padding-top:4px;padding-bottom:4px}
.q .ln,.q .oxr{margin:.3mm 0}
table.q4t th,table.q4t td{padding:.8mm 1mm;font-size:10pt}
.box .fig{align-self:center}
.selfchk{margin-top:1.4mm}.selfchk .chk{font-size:10pt}.q{margin-bottom:.8mm}
.selfchk>div{display:grid;grid-template-columns:1fr 1fr;gap:.4mm 4mm}.selfchk .chk{font-size:9.6pt;line-height:1.35}
.q .qh{margin-bottom:.4mm}.q{padding-top:2mm;padding-bottom:2mm}.selfchk{padding:1.6mm 3mm}
/* 웹앱 · 도전 활동(어느 선의 그래프일까?) 조작부 */
.chbox .gkinds{flex:1;display:flex;gap:6px}
.chbox .cbtn{flex:1;font-size:26px;padding:8px 4px;white-space:nowrap}
.chbox .cbtn.sel{background:#FBE9DC;border-color:#B4540F;color:#B4540F}
.chbox .cbtn.ok{background:#DDF3E8;border-color:#1F7A6C;color:#1F7A6C}
.chbox .cbtn.bad{background:#FADBD8;border-color:#C0392B;color:#C0392B}
.chbox .chmsg{font-size:24px;font-weight:800;line-height:1.35;min-height:110px;padding:8px 12px;border-radius:12px;background:#F4F8F7;color:#1D2B2A}
.chbox .chmsg.ok{background:#DDF3E8;color:#1F7A6C}.chbox .chmsg.bad{background:#FDEDEC;color:#C0392B}
.chbox .chbar{display:flex;gap:8px}.chbox .chbar .cbtn{flex:1;font-size:22px;padding:9px 6px}
.chbox .chstar{font-size:26px;font-weight:900;color:#B4540F;text-align:center}
.bin h4 small{font-size:22px}
.slide .sortbtns .cbtn{min-height:70px !important;min-width:120px;padding:8px 26px !important}

.ln.tip{font-size:.86em;color:#4A5A58;margin-top:2px}

const D={"B": {"s1_obs": ["니크롬선에 걸리는 전압이 2배, 3배, 4배로 커지면 니크롬선에 흐르는 전류의 세기도 [[2배]], [[3배]], [[4배]]로 커진다.", "이처럼 전기 회로에서 전압이 커지면 전류의 세기도 [[커진다]]. 즉, 전류의 세기는 전압에 [[비례]]한다."], "s1_graph": ["전압과 전류의 세기 관계를 그래프로 나타내면 원점을 지나는 [[직선]]이 된다."], "s2_def": ["전류의 흐름을 방해하는 정도를 전기 [[저항]]이라고 하며, 단위로는 [[Ω]](옴)을 사용한다.", "1 Ω은 [[1 V]]의 전압을 걸었을 때 [[1 A]]의 전류가 흐르는 도선의 저항값이다."], "s2_cause": ["전선 속에서 이동하는 전자가 원자와 [[충돌]]하여 운동에 방해를 받기 때문에 저항이 생긴다."], "s2_len": ["니크롬선의 저항은 길이가 길수록 [[커지고]], 굵기가 굵을수록 [[작아진다]]."], "s2_cmp": ["전기 회로에 같은 전압이 걸릴 때 저항이 클수록 전류의 세기는 [[작아진다]]."], "s3_law": ["전기 회로에 흐르는 전류의 세기는 전압에 [[비례]]하고 저항에 [[반비례]]하는데, 이를 [[옴의 법칙]]이라고 한다."], "s3_formula": ["전류의 세기 = [[전압]]/[[저항]]", "전압 = [[전류의 세기]] × [[저항]]"], "s3_calc": ["저항이 5 Ω인 니크롬선에 10 V의 전압을 걸어 주면 전류의 세기는 10 V / 5 Ω = [[2 A]]이다.", "전압이 일정할 때 저항이 2배로 커지면 전류의 세기는 [[1/2배]]가 된다."], "s4_type": ["저항이 작아서 전류가 잘 흐르는 물질을 [[도체]]라고 한다.", "저항이 커서 전류가 거의 흐르지 않는 물질을 [[부도체]]라고 한다.", "저항이 도체와 부도체의 중간 정도인 물질을 [[반도체]]라고 한다."], "s4_use": ["전기 도선은 전류가 잘 흐르는 [[구리]]로 만들고, 도선을 감싸는 부분은 [[부도체]]인 플라스틱으로 만들어 전류가 구리선 밖으로 흐르는 것을 막는다.", "반도체는 휴대 전화나 컴퓨터와 같은 [[전자 제품]]의 부품으로 많이 쓰인다."]}, "CREDIT": "내용 참고 : 중학교 과학 2 교과서 Ⅶ-2-02 옴의 법칙 (240~243쪽) · 수업용 학습지로 재구성 · 그림은 새로 제작", "ENGINES": ["spec", "chargedraw", "circuit"], "EXPLAIN_MODEL": ["전압이 같을 때 짧은 니크롬선의 전류의 세기가 긴 니크롬선보다 크다. 그래프에서 짧은 니크롬선의 직선이 더 가파르다.", "전압이 2배, 3배, 4배로 커지면 전류의 세기도 2배, 3배, 4배로 커진다. 즉 전류의 세기는 전압에 비례한다.", "전압이 같을 때 니크롬선의 길이가 길수록 전류의 세기가 작다. (길이가 길수록 저항이 커서 전류가 잘 흐르지 못한다.)"], "EXPLAIN_Q": ["긴 니크롬선과 짧은 니크롬선의 전압에 따른 전류의 세기 그래프를 비교해 보자.", "니크롬선에 걸리는 전압과 전류의 세기 사이에는 어떤 관계가 있는지 설명해 보자.", "두 니크롬선에 걸리는 전압이 같을 때 니크롬선의 길이와 전류의 세기 사이에는 어떤 관계가 있는지 설명해 보자."], "FILE_PREFIX": "옴의법칙", "GRADE": 2, "GRAPH_Q": "표의 값을 그래프에 점으로 찍고, 두 니크롬선의 결과를 각각 선으로 이어 보자.", "MASCOT_SAY": ["안녕! 나는 탐이야.", "전압·전류·저항의 관계를 알아보자!"], "MISSIONS": ["전압, 전류의 세기, 저항 사이의 관계를 옴의 법칙으로 설명할 수 있다.", "저항이 물질에 따라 다름을 도체, 부도체, 반도체로 구분하여 설명할 수 있다."], "Q1": [["답", "0.5 A"]], "Q1_NOTE": "전류의 세기 = 전압/저항 = 5 V / 10 Ω = 0.5 A", "Q1_Q": "저항이 10 Ω인 니크롬선에 5 V의 전압을 걸어 주었을 때, 니크롬선에 흐르는 전류의 세기는 몇 A인가?", "Q2": [["답", "도체"]], "Q2_NOTE": null, "Q2_Q": "( 도체, 부도체, 반도체 )는 저항이 작아서 전류가 잘 흐르는 물질이다. 알맞은 말을 쓰시오.", "Q3": [["저항이 일정할 때 전압이 2배가 되면 전류의 세기도 2배가 된다.", "O"], ["전압이 일정할 때 저항이 커지면 전류의 세기도 커진다.", "X"], ["니크롬선은 굵기가 굵을수록 저항이 커진다.", "X"], ["저항의 단위는 Ω(옴)이다.", "O"], ["고무와 플라스틱은 저항이 작아서 전류가 잘 흐른다.", "X"]], "Q3_HINTS": ["실험 결과를 떠올려 보자. 전압을 1.5 V, 3.0 V, 4.5 V로 높였을 때 전류의 세기는 어떻게 변했지?", "저항은 전류의 흐름을 ‘방해하는’ 정도였어. 방해가 커지면 전류가 더 잘 흐를까, 덜 흐를까?", "물이 지나가는 관을 생각해 보자. 굵은 관과 가는 관 중 물이 더 잘 흐르는 것은? 굵을수록 전자가 지나갈 길이 넓어져.", "전압의 단위는 V(볼트), 전류의 세기의 단위는 A(암페어)였지. 저항의 단위는 무엇이었을까?", "전기 도선을 감싸는 부분은 전류가 밖으로 흐르지 않도록 해야 해. 고무와 플라스틱은 도체와 부도체 중 어느 쪽일까?"], "Q3_NOTE": "(2) 저항이 클수록 전류의 세기는 작아진다 (3) 굵을수록 저항이 작다 (5) 고무·플라스틱은 저항이 커서 전류가 거의 흐르지 않는다.", "Q3_Q": "옳은 설명은 O, 옳지 않은 설명은 X를 쓰시오.", "Q4": [["저항이 더 큰 니크롬선", "B"], ["길이가 더 긴 니크롬선", "B"], ["니크롬선 B의 저항", "15 Ω"]], "Q4_NOTE": "같은 전압에서 전류가 작은 B의 저항이 더 크고, 굵기가 같으므로 B가 더 길다. B의 저항 = 3.0 V / 0.2 A = 15 Ω (A는 5 Ω).", "Q4_Q": "표는 굵기와 재질이 같고 길이만 다른 니크롬선 A, B에 전압을 걸어 주면서 흐르는 전류의 세기를 측정한 결과(모식 자료)이다. 다음 물음에 답하시오. (A, B 중에서 골라 쓴다.)", "Q4_TABLE": {"head": ["전압(V)", "A의 전류의 세기(A)", "B의 전류의 세기(A)"], "rows": [["3.0", "0.6", "0.2"], ["6.0", "1.2", "0.4"]]}, "Q5_KEYS": ["전압이 일정할 때", "전류의 세기는 저항에 반비례", "저항을 작게"], "Q5_MODEL": "전류의 세기는 전압에 비례하고 저항에 반비례하므로, 전압이 일정할 때 센 전류가 흐르게 하려면 전기 회로의 저항이 작아져야 한다.", "Q5_Q": "헤드셋의 소리를 크게 하려면 센 전류가 흘러야 한다. 헤드셋에 걸리는 전압이 일정할 때, 이를 위해 전기 회로의 저항은 어떻게 변해야 하는지 옴의 법칙과 관련지어 설명하시오.", "REVIEW": [{"title": "미션 ① 확인 : 전압, 전류의 세기, 저항의 관계", "head": ["", "전압", "저항"], "table": [["전류의 세기와의 관계", "[[비례]]", "[[반비례]]"]], "lines": ["이러한 전압, 전류의 세기, 저항의 관계를 [[옴의 법칙]]이라고 한다.", "전류의 세기 = [[전압]]/[[저항]] → 전압 = [[전류의 세기]] × [[저항]]", "니크롬선의 저항은 길이가 길수록 [[커지고]], 굵기가 굵을수록 [[작아진다]]."]}, {"title": "미션 ② 확인 : 물질에 따른 저항", "head": ["저항이 작아 전류가 잘 흐름", "저항이 커서 전류가 거의 흐르지 않음", "중간 정도의 저항"], "table": [["[[도체]]", "[[부도체]]", "[[반도체]]"]], "lines": ["전기 도선은 [[구리]]로 만들고, 겉은 [[부도체]]인 플라스틱으로 감싼다.", "반도체는 [[전자 제품]]의 부품으로 많이 쓰인다."]}], "R_LONG": 20, "R_SHORT": 10, "SAFETY": ["뜨거워진 니크롬선을 맨손으로 만지지 않는다.", "젖은 손이나 젖은 물건으로 전기 회로를 만지지 않는다."], "SELF_CHECK": ["전압과 전류의 세기 사이의 관계를 실험 결과와 그래프로 설명할 수 있다.", "저항의 뜻과 단위를 말하고, 길이와 굵기에 따라 저항이 달라짐을 설명할 수 있다.", "옴의 법칙을 이용하여 전류의 세기, 전압, 저항의 관계를 설명할 수 있다.", "도체, 부도체, 반도체를 저항의 크기에 따라 구분할 수 있다."], "SERIES_TIP": "직렬연결: 부품을 한 줄로 이어 연결하는 것 · 병렬연결: 부품의 양 끝에 나란히 이어 연결하는 것", "SORT": [["은", "d"], ["구리", "d"], ["철", "d"], ["알루미늄", "d"], ["고무", "p"], ["플라스틱", "p"], ["나무", "p"], ["유리", "p"], ["규소", "h"], ["저마늄", "h"]], "SORT_NAME": {"d": "도체", "p": "부도체", "h": "반도체"}, "STAGES": {"1": "전압이 커지면 전류의 세기는 어떻게 변할까?", "2": "같은 전압을 걸어도 전류의 세기가 다른 까닭은?", "3": "전류의 세기, 전압, 저항은 어떤 관계일까?", "4": "저항은 물질에 따라 다를까?"}, "STEPS": ["긴 니크롬선에 직류 전원 장치, 스위치, 전류계, 전압계를 연결한다. 전류계는 니크롬선에 [[직렬]]로, 전압계는 니크롬선에 [[병렬]]로 연결한다.", "스위치를 닫고 직류 전원 장치의 전압을 1.5 V씩 높이면서 니크롬선에 걸리는 전압과 흐르는 전류의 세기를 측정한다.", "긴 니크롬선을 짧은 니크롬선으로 바꾸어 위의 과정을 반복한다."], "SUBJECT": "중학교 과학 2 · Ⅶ. 전기와 자기 · 2. 전류와 전기 에너지", "TABLE_LONG": ["0.000", "0.075", "0.150", "0.225", "0.300"], "TABLE_SHORT": ["0.000", "0.150", "0.300", "0.450", "0.600"], "TABLE_VOLT": ["0.0", "1.5", "3.0", "4.5", "6.0"], "TAGLINE": "전기 회로에서 무엇을 조절해야 선풍기 바람의 세기를 바꿀 수 있을까?", "TEACHER_EXTRA": {"sim1": "(교과서 밖) 실제 니크롬선은 전류가 흐르면 뜨거워지고 온도가 올라가면 저항이 조금 커지므로 큰 전류에서 그래프가 직선에서 약간 벗어날 수 있다. 중2 수업에서는 ‘거의 직선’으로 말한다.", "s3": "[짝짓기 ②] 옴의 법칙 확인 시뮬레이션에서 저항을 5 Ω → 10 Ω → 20 Ω으로 바꾸어 보며 전류의 세기가 반으로 줄어드는 것을 확인한다.", "setup": "(교과서 밖) 화면의 전자 이동 속도는 모식이다. 실제 금속 도선 속 전자의 평균 이동(드리프트) 속도는 1 mm/s 이하로 매우 느리고, 회로의 전기 에너지는 빛에 가까운 속도로 전해진다. 그래서 스위치를 닫으면 전구가 곧바로 켜진다. 학생이 ‘전자가 이렇게 빨리 달리나요?’ 하고 물으면 이 점을 알려 준다.", "s4": "[모식] 금속 속 (+) 입자는 줄지어 제자리에 있고, 그 줄 사이 길을 자유 전자가 움직인다. 도체는 움직일 수 있는 자유 전자가 많고, 부도체는 전자가 모두 원자에 붙잡혀 있어 움직일 전자가 거의 없으며, 반도체는 자유 전자가 조금 있다. 자유 전자 한 개의 이동 빠르기는 같게 그렸고, 움직일 수 있는 전자의 수가 전류의 세기를 정한다. 실제 (+) 입자는 금속 양이온이며 원자 수·간격은 모식이다.", "s2": "[길이·굵기 모식] 같은 전압을 걸었을 때 길이가 길면 전자의 이동이 느려지고(전기장 = 전압/길이), 굵기는 이동 속도에는 영향이 없지만 단면을 지나는 전자의 수가 달라져 전류의 세기가 달라진다. 굵기는 옆모습의 줄 수(2 : 1)로 나타냈다. 5 Ω · 10 Ω · 20 Ω 그림의 니크롬선은 굵기가 같고 길이 비가 1 : 2 : 4이다(저항은 길이에 비례). 이 단원의 ‘굵기’는 단면의 넓이(단면적)를 뜻한다: 그림은 옆모습이라 굵은 선을 높이 2배로 그렸지만, 실제로 지름이 2배이면 단면적은 4배가 된다 — 그림·도전 활동의 ‘굵기 2배 → 저항 1/2배’는 ‘단면적 2배’로 읽는다. ‘전기 저항’ 쪽의 세 번째 회로(1 V, 1 Ω, 1 A)는 화면에서 너무 빨라지지 않게 전자 속도를 0.55배로 줄여 그렸으므로, 이 회로의 전자 빠르기는 위 두 회로와 비교하지 않는다(위 두 회로끼리는 전류의 세기에 비례). 같은 까닭으로 1 Ω 지그재그도 ‘길이 ∝ 저항’ 규칙(10 Ω 의 1/10)보다 길게 그렸다(규칙대로면 너무 짧아 보이지 않는다)."}, "TEACHER_NOTES": {"time": "시간 배분(45분): 도입 2 · STAGE 1 12(가상 실험 포함) · STAGE 2 8 · STAGE 3 8(시뮬 포함) · STAGE 4 6(카드 분류) · 점검 문제 7 · 정리 2. 시간이 모자라면 ★도전 Q4·Q5를 과제로 하고 [도전] 활동·카드 분류를 건너뛴다. 오개념 진단: ‘전압이 커지면 저항도 커진다’, ‘저항이 크면 전류가 잘 흐른다’, ‘전류가 굵은 선에서 더 약하다’, ‘부도체에는 전류가 전혀 흐르지 않는다(교과서는 ‘거의’ 흐르지 않는다)’, ‘전자가 저항에서 소모되어 없어진다’를 O/X 힌트와 도전 활동으로 다룬다.", "intro": "교과서 도입(선풍기 바람의 세기를 바꾸려면?)과 연결한다. 바람의 세기는 전동기(모터)의 회전 빠르기에 따라 달라지고, 이는 선풍기 회로에 흐르는 전류의 세기에 따라 달라진다. 웹앱 그림은 모식도이다(선풍기 날개의 회전 빠르기 ∝ 전류의 세기라고 단순화). 학생에게 ‘전류의 세기를 바꾸려면 회로에서 무엇을 바꿔야 할까?’를 먼저 예상해 보게 한 뒤 탐구로 확인한다.", "setup": "교과서 탐구 ‘저항, 전류, 전압 사이의 관계 탐구하기’의 과정 1(회로 연결). 전류계(또는 전류 센서)는 회로에 직렬로, 전압계(전압 센서)는 니크롬선에 병렬로 연결한다. 센서 분석 앱이 없는 학교는 이 웹앱의 가상 실험으로 대신하고, 실제 측정값이 있으면 그 값을 그래프에 찍어 비교해도 좋다. 안전 지킴이: 뜨거워진 니크롬선을 맨손으로 만지지 않고, 젖은 손으로 회로를 만지지 않는다.", "sim1": "[가상 실험 ①] 교과서 탐구 과정 2~4를 웹앱의 모식 시뮬레이션으로 대신한다. 순서: 니크롬선 고르기 → 전압 올리기(1.5 V씩) → 값 기록(표·그래프에 점이 찍힘) → 다른 니크롬선으로 반복. 값은 모식 자료이다: 긴 니크롬선 20 Ω, 짧은 니크롬선 10 Ω(길이 비 2 : 1, 굵기·재질 같음)로 두고 전류의 세기 = 전압/저항으로 계산했다. 실제 측정값은 계기 오차·니크롬선의 온도 변화(전류가 클수록 저항이 조금 커짐, 교과서 밖)로 이 값과 조금 다를 수 있으므로 학생이 측정한 값으로 바꿔 논의해도 좋다. 전압을 0 V로 되돌리면 전류도 0 A가 된다(그래프는 원점을 지난다).", "s1": "교과서 그림 Ⅶ-7: 전압이 2배, 3배, 4배가 되면 전류의 세기도 2배, 3배, 4배가 된다 → 전류의 세기는 전압에 비례(‘전압이 증가하면 전류의 세기도 증가한다’). 그래프가 원점을 지나는 직선이면 비례 관계임을 안내한다. 그래프에서 기울기가 큰 쪽(짧은 니크롬선)이 같은 전압에서 전류가 더 크다 — 저항이 더 작다. 기울기의 역수가 저항이라는 말(교과서 밖)은 하지 않아도 된다.", "s2": "교과서: ‘전류의 흐름을 방해하는 정도를 전기 저항 또는 저항이라고 하며 단위는 Ω(옴)’, ‘1 Ω은 1 V의 전압을 걸었을 때 1 A의 전류가 흐르는 도선의 저항값’. 저항이 생기는 원인은 교과서 옆 설명(‘전자가 원자와 충돌하여 운동에 방해를 받는다’)대로 다룬다. 웹앱의 확대 그림은 모식도이다((+)는 움직이지 않는 원자 — 원자는 중성이므로 정확히는 자유 전자를 내놓은 양이온이다(화면·학습지에 ‘원자(양이온)’로 적었다) —, (−)는 전자이며 개수·크기·속도는 실제와 다르다). 교과서 밖: 저항은 도선의 ‘길이’에 비례하고 ‘단면적’에 반비례하며 재질에 따라 다르다(고등학교에서 R = ρL/S). 전자는 충돌해도 사라지지 않는다. 전자의 수가 줄어서가 아니라, 충돌로 이동이 방해받아 느려지기 때문에 1초 동안 한 단면을 지나는 전자의 수(= 전류의 세기)가 줄어든다고 설명한다(저항이 크면 전류의 세기가 작아진다 — 옴의 법칙과 같은 말).", "s3": "교과서: ‘전류의 세기는 전압에 비례하고 저항에 반비례’, 식: 전류의 세기 = 전압/저항 ⇒ 전압 = 전류의 세기 × 저항. 단위는 전류 A, 전압 V, 저항 Ω(1 A = 1 V/Ω). 학습지·웹앱에서는 문자 기호(I, V, R)를 쓰지 않고 낱말로 쓴다(교과서와 같음). 저항을 구하는 식 ‘저항 = 전압/전류의 세기’는 전압 = 전류의 세기 × 저항을 변형한 것이며 ★ 도전 문제에서 쓴다. 웹앱 ‘옴의 법칙 확인’ 시뮬레이션은 전압(1.5~9 V, 1.5 V씩)과 저항(5, 10, 20 Ω)을 바꾸어 전류의 세기를 계산해 보여 준다(모식). 저항이 2배가 되면 전류가 1/2배로 줄어드는 것은 ‘반비례’의 구체적 모습이다.", "s4": "교과서 그림 Ⅶ-8·9: 도체(은, 구리, 철, 알루미늄), 부도체(고무, 플라스틱, 나무, 유리), 반도체(규소, 저마늄). 분류 활동의 카드는 모두 교과서에 나온 물질이다. 교과서 밖: 부도체도 아주 센 전압에서는 전류가 흐를 수 있고(절연 파괴), 반도체는 온도·불순물에 따라 저항이 크게 변한다. 도선은 구리선을 플라스틱(부도체)으로 감싸 전류가 밖으로 새거나 사람이 감전되는 것을 막는다.", "chal": "도전 활동 ‘어느 선의 그래프일까?’(3분, 건너뛸 수 있다): 길이와 굵기가 다른 세 니크롬선 (가), (나), (다)가 있고 전압–전류 그래프 세 개(빨강·초록·파랑)가 있다. 학생은 각 선에 알맞은 그래프를 고른다. 핵심: 같은 전압에서 전류가 클수록(그래프가 가파를수록) 저항이 작다 → 짧고 굵은 선(가)이 가장 가파르고, 길고 가는 선(다)이 가장 완만하다. 오개념 진단: 그래프가 가파를수록 저항이 크다고 생각하는 경우(힌트에서 ‘같은 전압에서 전류가 큰 쪽은?’을 되묻는다). 별(★) 수는 힌트·틀린 횟수만큼 줄어든다. 그래프는 색과 함께 ㄱ·ㄴ·ㄷ 기호로 구별한다(색각 차이 배려). 이 활동의 색은 그래프 구분용이며 ‘결과 정리’ 쪽의 ‘파랑 = 긴 선’ 약속과 상관없다.", "q": "Q1·Q2는 교과서 ‘스스로 확인하기’ 1·2번, Q5는 ‘과학 가치·태도 기르기’(헤드셋)를 바탕으로 했다. Q3·Q4는 새로 만든 문항이다. Q4의 표는 모식 자료이며 저항을 구하는 계산(전압/전류의 세기)은 옴의 법칙의 변형이다. 모든 문항은 교과서 범위 안에서 만들었다. 헤드셋 문제의 모범 답은 ‘전압이 일정할 때 저항을 작게’이다(전압을 높이는 방법도 있으나 문제에서 전압을 고정했다).", "water": "[도입] 물 순환 비유 — 펌프(건전지)가 물을 밀면 물이 닫힌 관을 한 바퀴 돈다. ①과 ②에서 같은 시간에 지나가는 물의 양이 같다 → 전류도 회로 어디서나 같고 '소모되지 않는다'(전류 소모설 오개념 방지: 에너지가 쓰이는 것이지 전하가 닳는 것이 아니다). 펌프의 압력 = 전압, 물의 흐름 = 전류, 자갈이 많은 관 = 저항. 압력이 커지면 흐름이 커지고, 자갈이 많으면 흐름이 줄어든다. 좁은 관 대신 자갈 관을 쓴 까닭: 좁은 관은 '좁은 곳에서 물이 더 빨라지는' 현상이 섞여 오해를 부른다(자갈 관은 단면이 같아 곳곳의 빠르기가 같다). 물 ↔ 전하로만 짝짓고 '물 알갱이 = 전자'라고 하지 않는다: 그림의 물은 전류의 방향(시계 방향)으로 돌지만 전자는 그 반대로 움직이기 때문이다(화면에 '전자는 반대 방향'이라고 적었다). 앞 차시(전하의 이동)에서는 '물의 높이차 = 전압, 물레방아 = 전구' 모형을 썼다 — 펌프가 물을 높은 곳으로 올려 높이차(압력 차)를 만든다는 점에서 같은 모형이라고 연결해 준다. 한계: 물의 비유는 전하의 보존·전압(전위차)의 이해를 돕는 모식이며, 실제 전자의 이동 속도·에너지 전달 방식과 같지는 않다. 이 쪽은 빈칸이 없는 단계 슬라이드(학습지에는 싣지 않음). [모형 평가·발문(v3.26b)] ‘자갈 관 앞에 물이 밀려 쌓이거나 넘치지 않을까?’ — 열린 수로라면 그렇다. 그래서 이 모형은 ‘물로 가득 찬 닫힌 관’이어야 한다: 물은 거의 압축되지 않으므로 어느 한 곳이 느려지면 관 전체가 한꺼번에 느려지고, 자갈 앞(③)·뒤(①)·아래(②)를 1초 동안 지나는 물의 양은 언제나 같다(화면 숫자). 이것이 ‘저항 앞에서 전류가 더 세다/저항에서 전류가 줄어든다’는 오개념을 바로잡는 핵심이며, 전기 회로에서도 전선 속 전하가 쌓이지 않고 회로 전체의 전류가 함께 변한다. 자갈 관을 쓴 또 다른 까닭: 자갈 틈을 지나는 느린 흐름은 압력 차에 비례해(다르시 법칙, 교과서 밖) ‘압력 2배 → 흐름 2배’가 옴의 법칙과 같은 꼴이 된다. 모형의 한계: 펌프의 압력이 관 어디에서 얼마나 줄어드는지(자갈 관 양 끝의 압력 차 = 저항에 걸린 전압)는 이 그림에 나타내지 않았다(필요하면 ‘자갈 관 앞의 압력이 뒤보다 크다’를 말로 덧붙인다).", "cells": "[알아 두기] 직렬·병렬 연결 — 다음 쪽에서 전류계·전압계 연결(직렬·병렬)을 쓰기 전에 낱말을 먼저 익힌다. 실물이 있으면 건전지 2개를 한 줄로(직렬) 또는 나란히(병렬) 이어 같은 전구의 밝기를 비교한다. 같은 건전지·같은 전구에서 직렬은 전압이 2배(3.0 V)가 되어 전구가 더 밝고, 병렬은 전압이 그대로(1.5 V)여서 1개일 때와 밝기가 거의 같다(병렬은 건전지 한 개가 내는 전류가 절반이라 더 오래 쓴다). 이때 전구를 지나는 전류는 건전지 1개일 때와 같다 — 나뉘는 것은 두 건전지 가지 사이이고, 한 줄로 이어진 부품(전구·전선)에는 어디서나 같은 전류가 흐른다. ‘병렬이면 전류가 나뉜다’를 ‘전구의 전류가 줄어든다’로 일반화하지 않게 짚어 준다. 모식 단순화: 건전지의 내부 저항, 전구 필라멘트 저항의 온도 변화는 다루지 않는다. 화면의 전자 속도는 전류의 세기에 비례하게 모식으로 그렸다."}, "THEME": "clean", "TITLE": "옴의 법칙", "UNIT_ID": "ohm_law", "VOLTS": [0, 1.5, 3.0, 4.5, 6.0], "WS_NOTES": {"s1": "표의 값은 모식 자료이다(긴 선 20 Ω, 짧은 선 10 Ω). 직접 측정한 값이 있으면 그 값으로 그려도 좋다.", "s2": "저항의 원인(전자와 원자의 충돌)은 모식도로 설명한다. 길이가 2배이면 저항도 2배(굵기가 같을 때)임을 표의 값으로 확인할 수 있다(20 Ω : 10 Ω).", "s34": "식은 문자 기호 없이 낱말로 쓴다. ‘저항 = 전압/전류의 세기’는 전압 = 전류의 세기 × 저항의 변형이다(★Q4).", "q": "Q1·Q2는 ‘스스로 확인하기’, Q5는 ‘과학 가치·태도 기르기’를 바탕으로 했고 Q3·Q4는 새 문항이다. 시간이 모자라면 ★는 과제로 한다."}};

/* =====================================================================
   수업용 슬라이드 엔진 (단원과 무관한 공통 부분)
   ===================================================================== */
const deckEl = document.getElementById('deck');
const SLIDES = [];
const ANIMS  = {};

/* ---------- 공통 드로잉 헬퍼 ---------- */
const TAU = Math.PI*2;
/* ---------- 테마 : prelude 의 const THEME='clean' 이면 '맑은 학습 슬라이드' 톤(밝은 바탕·평면 도형), 아니면 옛 바다 톤 ---------- */
const CLEAN = (typeof THEME!=='undefined' && THEME==='clean');
const TH = CLEAN
  ? {glass:'#4A5A58',glass2:'rgba(74,90,88,.35)',bg0:'rgba(255,255,255,0)',bg1:'rgba(255,255,255,0)',chipBg:'#FFFFFF',
     axis:'#4A5A58',tick:'#4A5A58',lbl:'#1D2B2A',curve:'#B4540F',dot:'#1D2B2A',slider:'#1F7A6C',ink:'#1D2B2A',sub:'#4A5A58'}
  : {glass:'rgba(190,225,255,.85)',glass2:'rgba(190,225,255,.35)',bg0:'rgba(12,36,62,.55)',bg1:'rgba(5,18,34,.65)',chipBg:'rgba(6,20,38,.92)',
     axis:'rgba(220,240,255,.85)',tick:'#bcd7ea',lbl:'#dff2ff',curve:'#ff8aa0',dot:'#ffffff',slider:'#ffe066',ink:'#ffffff',sub:'#bcd7ea'};
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ball(ctx,x,y,r,c,hi){
  if(CLEAN){ctx.save();ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    ctx.lineWidth=Math.max(1.5,r*.08);ctx.strokeStyle=shade(c.charAt(0)==='#'&&c.length===7?c:'#808080',-45);ctx.stroke();ctx.restore();return;}
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
  g.addColorStop(0,hi||'rgba(255,255,255,.95)');g.addColorStop(.45,c);g.addColorStop(1,shade(c,-38));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
}
function glowBall(ctx,x,y,r,c,a){
  ctx.save();ctx.globalAlpha=a==null?1:a;if(!CLEAN){ctx.shadowColor=c;ctx.shadowBlur=r*2.2;}ball(ctx,x,y,r,c);ctx.restore();
}
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+p));g=Math.max(0,Math.min(255,g+p));b=Math.max(0,Math.min(255,b+p));
  return `rgb(${r},${g},${b})`;
}
function txt(ctx,s,x,y,size,color,align,weight){
  ctx.save();ctx.font=`${weight||800} ${size}px Pretendard,sans-serif`;ctx.fillStyle=color;
  ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,c,w,head){
  const a=Math.atan2(y2-y1,x2-x1),hl=head||12;
  ctx.save();ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w||3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*hl*.8,y2-Math.sin(a)*hl*.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-Math.cos(a-.42)*hl,y2-Math.sin(a-.42)*hl);
  ctx.lineTo(x2-Math.cos(a+.42)*hl,y2-Math.sin(a+.42)*hl);
  ctx.closePath();ctx.fill();ctx.restore();
}
function curveArrow(ctx,x1,y1,cx,cy,x2,y2,c,w,hl){
  ctx.save();ctx.strokeStyle=c;ctx.lineWidth=w||4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();
  const a=Math.atan2(y2-cy,x2-cx),h=hl||14;ctx.fillStyle=c;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-Math.cos(a-.42)*h,y2-Math.sin(a-.42)*h);
  ctx.lineTo(x2-Math.cos(a+.42)*h,y2-Math.sin(a+.42)*h);ctx.closePath();ctx.fill();ctx.restore();
}
function beaker(ctx,x,y,w,h,lw){
  ctx.save();ctx.strokeStyle=TH.glass;ctx.lineWidth=lw||4;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w,y);ctx.stroke();
  ctx.strokeStyle=TH.glass2;ctx.lineWidth=2;
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(x+2,y+h-h*i/4);ctx.lineTo(x+22,y+h-h*i/4);ctx.stroke();}
  ctx.restore();
}
function clear(o,bg){
  const {ctx,W,H}=o;ctx.clearRect(0,0,W,H);
  if(bg!==false){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,TH.bg0);g.addColorStop(1,TH.bg1);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
}
function ease(t){return t<0?0:t>1?1:t*t*(3-2*t);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rand(a,b){return a+Math.random()*(b-a);}


function bowArrow(ctx,x1,y1,x2,y2,R,bow,color,lw,hl){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  const sx=x1+ux*R,sy=y1+uy*R,ex=x2-ux*R,ey=y2-uy*R;
  const mx=(sx+ex)/2+nx*bow,my=(sy+ey)/2+ny*bow;
  curveArrow(ctx,sx,sy,mx,my,ex,ey,color,lw||4,hl||13);
  return [0.25*sx+0.5*mx+0.25*ex, 0.25*sy+0.5*my+0.25*ey];
}
function chipTxt(ctx,s,x,y,size,color,bg,bw){
  const w=bw||(s.length*size*0.62+26),h=size*1.5;
  ctx.save();rr(ctx,x-w/2,y-h/2,w,h,10);ctx.fillStyle=bg||TH.chipBg;ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();ctx.restore();
  txt(ctx,s,x,y,size,color);
}

/* ---------- 애니메이션 컨트롤러 ---------- */
let liveAnims=[];
function mkAnim(cv,name){
  const ctx=cv.getContext('2d');
  const w=Math.round(cv.clientWidth),h=Math.round(cv.clientHeight);
  if(!w||!h) return null;
  cv.width=w*2;cv.height=h*2;ctx.setTransform(2,0,0,2,0,0);
  /* (v3.26 참고) 그림 칸이 화면마다 좁아지던 진짜 원인은 #stage 가 flex 안에서 줄어든 것이었다(engine.css flex:none 으로 해결). 이제 칸 크기는 모든 화면에서 같으므로
     고정 무대는 '칸이 설계 크기보다 조금 작을 때(예: 글 칸 700px → 그림 칸 736px) 비율을 지켜 가운데에 놓는' 안전장치로만 남는다.
     고정 무대(옵트인: 단원이 window.ANIM_STAGE=true 로 켠다). 화면 크기에 따라 그림 칸의 가로폭이 달라져(노트북·태블릿에서 좁아짐) 그림이 한쪽으로 치우치거나 잘리던 문제를
     단원마다 좌표를 고치지 않고 해결한다: 애니메이션은 늘 같은 '설계 크기'(보통 776×638, 큰 칸은 966×713)로 그리고, 칸이 더 작으면 비율을 유지해 줄여 가운데에 놓는다(키우지는 않는다). */
  const stg=!!window.ANIM_STAGE,cvr=name.startsWith('cover');   // 표지 그림은 정사각(640×640) 설계
  const DW=stg?(cvr?640:(w>850?966:776)):w,DH=stg?(cvr?640:(h>650?713:638)):h,sc=stg?Math.min(1,w/DW,h/DH):1,ox=stg?(w-DW*sc)/2:0,oy=stg?(h-DH*sc)/2:0;
  const o={cv,ctx,W:DW,H:DH,t:0,pt:0,phase:0,stopped:false,d:{},name};
  cv.setAttribute('role','img');   // 스크린 리더용 그림 설명: 단원이 window.ANIM_ALT={이름:'설명'} 을 주면 그것을, 없으면 슬라이드 제목을 쓴다
  cv.setAttribute('aria-label',(window.ANIM_ALT&&window.ANIM_ALT[name])||(((SLIDES[cur]&&(SLIDES[cur].title||SLIDES[cur].tocName))||'').replace(/<[^>]+>/g,'')+' 그림'));
  o.setPhase=function(k){if(k===o.phase)return;o.phase=k;o.pt=o.t;if(o.onPhase)o.onPhase(k);};
  o.frame=function(){};
  if(ANIMS[name]) ANIMS[name](o);
  let last=performance.now(),tt=0;   // 애니메이션 시계: '움직임 줄이기'가 켜지면 0.3배속
  (function loop(now){if(o.stopped)return;const dd=Math.min(.1,Math.max(0,(now-last)/1000));last=now;tt+=dd*(window.REDUCE_MOTION&&!name.startsWith('cover_')?.3:1);o.t=tt;
    try{
      if(stg){ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,w,h);ctx.setTransform(2*sc,0,0,2*sc,2*ox,2*oy);}
      o.frame(o);
    }catch(e){console.error(name,e);o.stopped=true;}requestAnimationFrame(loop);})(performance.now());
  liveAnims.push(o);
  return o;
}
function stopAnims(){liveAnims.forEach(a=>a.stopped=true);liveAnims=[];}


/* ---------- STAGE 구분 ----------
   단원 파일이 UNIT.stageNames = {1:'…',2:'…'} 를 정의하고, 각 슬라이드에 stageNo 를 적으면
   학습지의 STAGE n 과 같은 이름이 머리말·목차에 붙는다. (boss:true → BOSS, review:true → 복습) */
function assignStages(){
  const NAME=(window.UNIT&&UNIT.stageNames)||{};
  SLIDES.forEach(d=>{
    if(d.stageNo){const n=d.stageNo;d.stg='STAGE '+n;d.ch='S'+n;d.chName='STAGE '+n+' · '+NAME[n];}
    else if(d.review){d.stg='복습';d.ch='R';d.chName='복습';}
    else if(d.noteSlide){d.stg='NOTE';d.ch='N';d.chName='NOTE · 정리 노트';}
    else if(d.boss){d.ch='B';d.chName=(window.UNIT&&UNIT.bossName)||'BOSS · 개념 확인 퀘스트';}   /* v3.0: 단원이 UNIT.bossName 으로 구역 이름을 바꿀 수 있다(예: '점검 문제') */
    if(/^\d+$/.test(d.chip||''))d.chip='';
  });
}

/* ---------- 슬라이드 빌드 ---------- */
function buildDeck(){
  SLIDES.forEach((def,i)=>{
    const el=document.createElement('section');
    el.className='slide '+(def.cls||'');
    el.dataset.i=i;
    if(def.cover){
      el.innerHTML=`<div class="sbody cover">${def.body}</div>`;
    }else{
      el.innerHTML=`<div class="shead">${def.stg?`<span class="chip stg">${def.stg}</span>`:''}${def.chip?`<span class="chip">${def.chip}</span>`:''}
        <div class="stitle">${def.title||''}${def.sub?`<span class="sub">${def.sub}</span>`:''}</div></div>
        <div class="sbody ${def.rows?'row':''}">${def.body}</div>`;
    }
    deckEl.appendChild(el);
    // 단계 부여
    let s=0;
    el.querySelectorAll('.bl,.step').forEach(it=>{
      if(it.classList.contains('wp')&&s>0){it.dataset.s=s;}
      else{s++;it.dataset.s=s;}
    });
    def._max=Math.max(s,def.extra||0);
    def._el=el;
  });
  document.getElementById('pgAll').textContent=SLIDES.length;
  buildToc();
}
function buildToc(){
  const g=document.getElementById('tocgrid');let lastCh=null;
  SLIDES.forEach((d,i)=>{
    if(d.ch!==lastCh){lastCh=d.ch;const h=document.createElement('div');h.className='tocitem ch';h.textContent=d.chName||('제 '+d.ch+' 부');g.appendChild(h);}
    const it=document.createElement('div');it.className='tocitem';it.setAttribute('role','button');it.tabIndex=0;
    it.textContent=(i+1)+'. '+(d.tocName||d.title||'표지').replace(/<[^>]+>/g,'');
    it.onclick=(e)=>{e.stopPropagation();go(i,0);document.getElementById('toc').classList.remove('show');};
    g.appendChild(it);
  });
}

/* ---------- 진행 ---------- */
let SELF=false;           // 자습 모드 여부
let cur=0,step=0;
function render(){
  const def=SLIDES[cur],el=def._el;
  el.querySelectorAll('.bl,.step').forEach(it=>{
    const on=(SELF&&it.classList.contains('bl'))?it.dataset.rev==='1':+it.dataset.s<=step;
    it.classList.toggle('on',on);
  });
  el.querySelectorAll('.bl').forEach((b,i)=>{b.setAttribute('role','button');if(!b.hasAttribute('tabindex'))b.tabIndex=0;b.setAttribute('aria-label',b.classList.contains('on')?('정답: '+b.textContent.trim()):('빈칸 '+(i+1)+(SELF?' — 눌러서 정답 보기':'')));});
  { const now=[...el.querySelectorAll('.bl.on,.step.on')],prev=def._ann;   // 새로 공개된 것만 스크린 리더에 읽어 준다
    if(prev){const fresh=now.filter(x=>!prev.has(x)).map(x=>x.textContent.replace(/\s+/g,' ').trim()).filter(Boolean);if(fresh.length)announce(fresh.join(' '));}
    def._ann=new Set(now); }
  if(SELF){const all=el.querySelectorAll('.bl').length,on=el.querySelectorAll('.bl.on').length;
    document.getElementById('ansCnt').textContent=all?('정답 '+on+'/'+all):'';}
  // 자습 모드에서는 '공개된 빈칸 중 가장 뒤 번호'를 단계로 삼아 그림도 함께 움직인다
  let eff=step;
  if(SELF){eff=0;el.querySelectorAll('.bl.on').forEach(b=>{eff=Math.max(eff,+b.dataset.s);});}
  if(def.step) try{def.step(eff,el);}catch(e){console.error(e);}
  const tn=document.getElementById('tnote');   // 교사 메모 (슬라이드의 note 필드, N 키)
  if(tn)tn.innerHTML=def.note?`<h4>📌 교사 메모 (N 키로 닫기)</h4>${def.note}`:`<h4>📌 교사 메모</h4>이 슬라이드에는 메모가 없습니다.`;
  document.getElementById('pgNow').textContent=cur+1;
  document.getElementById('progbar').style.width=((cur+ (def._max?step/def._max:1))/SLIDES.length*100)+'%';
}
function announce(m){const l=document.getElementById('live');if(!l)return;l.textContent='';setTimeout(()=>{l.textContent=m;},30);}
function go(i,st,keep){
  if(i<0||i>=SLIDES.length)return;
  stopAnims();
  SLIDES.forEach(d=>d._el.classList.remove('active'));
  cur=i;step=st==null?0:st;
  if(!keep&&!step)SLIDES[cur]._el.querySelectorAll('.bl').forEach(b=>{b.dataset.rev='';});
  const def=SLIDES[cur],el=def._el;
  el.classList.add('active');
  def._ann=null;announce((cur+1)+'쪽. '+((def.title||def.tocName||'')+'').replace(/<[^>]+>/g,''));
  el._a={};
  requestAnimationFrame(()=>{
    el.querySelectorAll('canvas[data-a]').forEach(cv=>{
      const a=mkAnim(cv,cv.dataset.a);if(a)el._a[cv.dataset.a]=a;
    });
    if(def.enter) try{def.enter(el);}catch(e){console.error(e);}
    render();
  });
  render();
}
function next(){
  const def=SLIDES[cur];
  if(step<def._max){step++;render();}
  else if(cur<SLIDES.length-1) go(cur+1,0);
}
function prev(){
  if(step>0){step--;render();}
  else if(cur>0){go(cur-1,SLIDES[cur-1]._max);}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1400);}

document.addEventListener('click',e=>{
  if(e.target.closest('#hud')||e.target.closest('#toc'))return;
  if(document.getElementById('toc').classList.contains('show')){document.getElementById('toc').classList.remove('show');return;}
  if(SELF){            // 자습 모드: 빈칸을 직접 눌러 정답 확인 (화면을 눌러도 넘어가지 않음)
    const b=e.target.closest('.bl');
    if(b){b.dataset.rev=b.dataset.rev==='1'?'':'1';render();}
    return;
  }
  next();
});
document.addEventListener('contextmenu',e=>{e.preventDefault();prev();});
document.addEventListener('keydown',e=>{
  const k=e.key,fa=document.activeElement,tg=fa&&fa.tagName;
  if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;   // 슬라이더·입력칸은 화살표·Enter 를 자기가 쓴다(키보드 접근성)
  if((k==='Enter'||k===' ')&&fa&&fa!==document.body&&fa.matches&&fa.matches('[role=button],button')){e.preventDefault();fa.click();return;}
  if(k==='d'||k==='D'){setMotion(!window.REDUCE_MOTION);return;}
  if(k===' '||k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k==='Enter'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev();}
  else if(k==='Home'){go(0,0);}
  else if(k==='End'){go(SLIDES.length-1,0);}
  else if(k==='r'||k==='R'){go(cur,0);toast('이 슬라이드를 처음부터');}
  else if(k==='a'||k==='A'){toggleAll();}
  else if(k==='m'||k==='M'){setMode(!SELF);}
  else if(k==='n'||k==='N'){const tn=document.getElementById('tnote');if(tn)tn.classList.toggle('show');}
  else if(k==='t'||k==='T'||k==='Escape'){document.getElementById('toc').classList.toggle('show');}
  else if(k==='f'||k==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
});
document.getElementById('btnNext').onclick=e=>{e.stopPropagation();next();};
document.getElementById('btnPrev').onclick=e=>{e.stopPropagation();prev();};
document.getElementById('btnToc').onclick=e=>{e.stopPropagation();document.getElementById('toc').classList.toggle('show');};
document.getElementById('btnReset').onclick=e=>{e.stopPropagation();go(cur,0);};
document.getElementById('btnAns').onclick=e=>{e.stopPropagation();toggleAll();};
document.getElementById('btnMode').onclick=e=>{e.stopPropagation();setMode(!SELF);};
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[role=button]');if(t&&e.detail>0&&t.blur)setTimeout(()=>t.blur(),0);},true);   // 마우스·터치로 누른 뒤에는 초점을 풀어, 스페이스·Enter 가 계속 '다음 쪽'으로 동작하게 한다(키보드로 이동한 초점은 유지)
/* 움직임 줄이기: 운영체제의 '동작 줄이기' 설정을 따르고, 🐢 버튼(D)으로 직접 켜고 끈다(선택은 이 브라우저에 기억) */
function setMotion(on){window.REDUCE_MOTION=!!on;document.body.classList.toggle('reduce',!!on);const b=document.getElementById('btnMotion');if(b)b.setAttribute('aria-pressed',on?'true':'false');try{localStorage.setItem('reduceMotion',on?'1':'0');}catch(e){}toast(on?'움직임 줄이기: 켬':'움직임 줄이기: 끔');}
(function(){let v=null;try{v=localStorage.getItem('reduceMotion');}catch(e){}const os=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;window.REDUCE_MOTION=v==null?os:v==='1';document.body.classList.toggle('reduce',window.REDUCE_MOTION);const b=document.getElementById('btnMotion');if(b){b.setAttribute('aria-pressed',window.REDUCE_MOTION?'true':'false');b.onclick=e=>{e.stopPropagation();setMotion(!window.REDUCE_MOTION);};}})();

/* 정답 모두 보기 / 가리기 */
function toggleAll(){
  const def=SLIDES[cur],el=def._el;
  if(!SELF){step=def._max;render();toast('정답 모두 보기');return;}
  const bls=[...el.querySelectorAll('.bl')];
  const allOn=bls.length>0&&bls.every(b=>b.dataset.rev==='1');
  bls.forEach(b=>{b.dataset.rev=allOn?'':'1';});
  step=allOn?0:def._max;render();toast(allOn?'정답 가리기':'정답 모두 보기');
}
/* 수업 모드(교사 진행) ↔ 자습 모드(학생이 직접 확인) */
function setMode(on,init){
  SELF=!!on;
  document.body.classList.toggle('self',SELF);
  document.getElementById('btnMode').textContent=SELF?'👩‍🏫 수업 모드':'🧑‍🎓 자습 모드';
  ['btnAns','ansCnt'].forEach(id=>{document.getElementById(id).style.display=SELF?'':'none';});
  try{history.replaceState(null,'',SELF?'#self':'#class');}catch(e){}
  if(!init){go(cur,0);toast(SELF?'자습 모드: 빈칸을 눌러 정답 확인':'수업 모드: 화면을 눌러 진행');}
}
/* 터치 스와이프: 왼쪽 → 다음, 오른쪽 → 이전 */
(function(){let x0=null,y0=null;
  document.addEventListener('touchstart',e=>{const t=e.changedTouches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
  document.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0)next();else prev();}},{passive:true});
})();

/* ---------- 스테이지 스케일 ---------- */
function fit(){
  const s=Math.min(window.innerWidth/1600,window.innerHeight/900);
  document.getElementById('stage').style.transform=`scale(${s})`;
}
/* v3.26: 창 크기가 바뀌면(F 전체 화면·프로젝터 연결·태블릿 회전) 무대 배율만 다시 맞춘다. 무대 안 배치는 늘 1600×900 이라 캔버스 크기가 변하지 않으므로
   슬라이드를 다시 열 필요가 없다. 예전에는 go() 를 다시 불러 enter() 가 실행되어 가상 실험 기록이 지워지고 도전 문제가 다시 섞였다. */
window.addEventListener('resize',fit);

/* ---------- 배경 입자 ---------- */
(function(){
  const cv=document.getElementById('bgfx'),ctx=cv.getContext('2d');
  cv.width=1600;cv.height=900;
  if(CLEAN){cv.style.display='none';return;}
  const P=[...Array(46)].map(()=>({x:rand(0,1600),y:rand(0,900),r:rand(1.5,4.5),vx:rand(-.25,.25),vy:rand(-.3,.1),a:rand(.15,.5)}));

    ctx.clearRect(0,0,1600,900);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-10)p.y=910;if(p.x<-10)p.x=1610;if(p.x>1610)p.x=-10;
      ctx.globalAlpha=p.a;ball(ctx,p.x,p.y,p.r,'#8fe3ff');});

/* ---------- 단원 공용 도우미 (단원 lib.js 가 같은 이름으로 다시 정의해도 된다) ---------- */
function P(o,k,dur){ if(o.phase>k)return 1; if(o.phase<k)return 0; return clamp((o.t-o.pt)/(dur||.8),0,1); } // 단계 진행도 0→1
function popK(t){ if(t<=0)return 0; if(t>=1)return 1; const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); } // 톡 튀어나오는 효과

/* =====================================================================
   공통 부품 모음 (모든 단원에서 쓸 수 있는 슬라이드 부품)
   - 문제 슬라이드: QOX(O/X) · QSA(단답/설계) · QMC(객관식) · QD(서술형: 모범 답안 + 채점 핵심어)
   - 카드 분류 활동: sortSlide(...)   예) 조절 변인 / 통제 변인 분류
   - 슬라이더 시뮬레이션: sliderHTML(...) + bindSlider(...)
   - 그래프 그리기 도우미: plotAxes / plotCurve / plotDot  (캔버스 애니메이션 안에서 사용)
   - 교사 메모: 슬라이드에 note:'…' 를 쓰면 N 키로 열린다 (core.js)
   슬라이드 본문에 글자를 넣기 전에 FMT(글) 를 거친다. 유전자 기호 같은 단원 전용 서식이 필요하면
   단원 slides.js 에서  function FMT(s){…}  로 다시 정의하면 된다.
   ===================================================================== */
function FMT(s){return s;}
const stopAll=node=>['click','mousedown','pointerdown','keydown','contextmenu','touchstart'].forEach(ev=>node.addEventListener(ev,e=>e.stopPropagation()));
const plain=s=>String(s).replace(/<[^>]+>/g,'');

/* ---------- 문제 슬라이드 ---------- */
function QT(no,type,q,body,note,opt){
  SLIDES.push(Object.assign({boss:true,chip:'점검 문제',title:`문제 ${no}`,sub:type,
    tocName:`[문제 ${no}] ${plain(q).slice(0,18)}`,
    body:`<div class="qhead"><span class="qno">${no}</span><div>${FMT(q)}</div></div>`+body+(note?`<div class="qnote step">${FMT(note)}</div>`:'')},opt||{}));
}
/* items: [[문장, 'O'|'X'], …]
   opt.hints: 문장별 '틀렸을 때' 개념 힌트 배열(선택). 주면 자습 모드에서 학생이 O/X 를 직접 골라 보고,
   틀리면 정답을 바로 알려 주는 대신 오개념을 짚는 힌트가 나온다(수업 모드 화면은 그대로). 힌트는 되묻는 말투로 쓴다. */
function QOX(no,q,items,note,opt){
  const hs=opt&&opt.hints;
  QT(no,'O/X',q,`<div class="qlist">`+items.map(([t,a],i)=>`<div class="qitem${hs?' hx':''}" data-ans="${a}"><span class="mk">(${i+1})</span><span class="txt">${FMT(t)}</span>
    ${hs?`<span class="oxpick self-only"><button class="oxb" data-pick="O">O</button><button class="oxb" data-pick="X">X</button></span>`:''}
    <span class="bl" style="margin-left:auto;min-width:74px;text-align:center">${a}</span>${hs?`<div class="oxh self-only" data-hint="${String(hs[i]||'').replace(/"/g,'&quot;')}"></div>`:''}</div>`).join('')+`</div>`,note,opt);
}
/* 자습 모드 O/X 고르기: 맞으면 ✓ 와 정답 공개, 틀리면 힌트(정답은 숨김 — 다시 골라 볼 수 있다) */
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.oxb');if(!b||!document.body.classList.contains('self'))return;
  e.stopPropagation();const it=b.closest('.qitem'),h=it.querySelector('.oxh'),ok=b.dataset.pick===it.dataset.ans;
  it.querySelectorAll('.oxb').forEach(x=>x.classList.remove('good','wrong'));b.classList.add(ok?'good':'wrong');
  h.className='oxh self-only '+(ok?'good':'wrong');
  if(ok){h.textContent='✓ 맞아요!';const bl=it.querySelector('.bl');if(bl){bl.dataset.rev='1';render();}}
  else h.textContent='💡 '+(h.dataset.hint||'다시 한번 생각해 보자.');
},true);
/* items: [[항목, 정답], …]  — 단답 또는 실험 설계. extra: 항목 위에 넣을 HTML(그림 등) */
function QSA(no,q,items,note,w,extra,opt){
  QT(no,'단답형',q,(extra||'')+`<div class="qlist">`+items.map(([t,a],i)=>`<div class="qitem"><span class="mk">(${i+1})</span><span class="txt">${FMT(t)}</span>
    <span class="bl" style="margin-left:auto;min-width:${w||200}px;text-align:center">${a}</span></div>`).join('')+`</div>`,note,opt);
}
/* choices: 보기 배열, ans: 정답 번호(0부터) */
function QMC(no,q,choices,ans,note,opt){
  QT(no,'객관식',q,`<div class="qlist">`+choices.map((t,i)=>`<div class="qitem ${i===ans?'ans step':''}"><span class="mk">${'①②③④⑤'[i]}</span><span class="txt">${FMT(t)}</span></div>`).join('')+`</div>`,note,opt);
}
/* 서술형: model = 모범 답안, keys = 채점 핵심어 배열 */
function QD(no,q,model,keys,note,opt){
  QT(no,'서술형',q,`<div class="panel step model"><b class="hl">모범 답안</b><br>${FMT(model)}</div>
    <div class="step" style="text-align:center"><span class="tiny">채점 핵심어 </span>${keys.map(k=>`<span class="kw">${FMT(k)}</span>`).join('')}</div>`+'',note,opt);
}

/* ---------- 카드 분류 활동 ----------
   sortSlide({id, chip, title, cards:[[라벨,'a'|'b'|'c'],…], bins:{a:['제목','(작은 글씨)'], b:[…]},
              left:'왼쪽 HTML(그림·설명)', hint:'안내 글', done:'정답 공개 뒤 보이는 HTML', seed:숫자, extra:{슬라이드 필드}})
   카드를 누를 때마다 처음 자리 → a → b → (c) → 처음 자리. 클릭(스페이스)하면 정답이 공개되고 맞힌 카드는 초록, 옮겨진 카드는 주황. */
const SORTSTATE={};
function sortOrder(n,seed){const a=[...Array(n).keys()];let s=seed||7;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sortRender(el,cfg,reveal){
  const keys=Object.keys(cfg.bins);const st=SORTSTATE[cfg.id]||(SORTSTATE[cfg.id]=cfg.cards.map(()=> 'pool'));
  const box={pool:el.querySelector('[data-pool]')};keys.forEach(k=>box[k]=el.querySelector(`[data-bin="${k}"]`));
  if(!box.pool)return;Object.values(box).forEach(b=>b.innerHTML='');
  sortOrder(cfg.cards.length,cfg.seed).forEach(i=>{
    const [label,ans]=cfg.cards[i];const where=reveal?ans:st[i];
    const c=document.createElement('div');c.className='card';c.textContent=label;c.dataset.i=i;
    if(reveal)c.classList.add(st[i]===ans?'ok':'fix');
    box[where].appendChild(c);
  });
}
function sortSlide(cfg){
  const keys=Object.keys(cfg.bins);
  const reveal=(el,on)=>{sortRender(el,cfg,on);el._rev=on;const pn=el.querySelector('.panel.step');if(pn)pn.classList.toggle('on',on);};
  SLIDES.push(Object.assign({stageNo:cfg.stageNo,chip:cfg.chip,title:cfg.title,tocName:cfg.tocName||cfg.title,rows:true,
    body:`<div class="col" style="flex:.85">${cfg.left||''}</div>
    <div class="col" style="flex:1.15;justify-content:flex-start;gap:12px">
      <div class="hint">카드를 끌어서 알맞은 칸에 놓아 보자 (짧게 누르면 칸이 차례로 바뀝니다)${cfg.hint?'<br>'+cfg.hint:''}</div>
      <div class="pool" data-pool></div>
      <div class="bins">${keys.map((k,i)=>`<div class="bin b${i+1}" data-binbox="${k}"><h4>${cfg.bins[k][0]} <small>${cfg.bins[k][1]||''}</small></h4><div class="cards" data-bin="${k}"></div></div>`).join('')}</div>
      <div class="sortbtns"><button class="cbtn" data-sort-ans>정답 확인</button><button class="cbtn" data-sort-reset>초기화</button></div>
      <div class="panel step small" style="line-height:1.6">정답 공개! 초록 = 맞힌 카드, 주황 = 옮겨진 카드${cfg.done?'<br>'+cfg.done:''}</div>
    </div>`,
    enter(el){
      if(!el._bound){el._bound=true;
        el.querySelectorAll('.pool,.bins,.sortbtns').forEach(stopAll);   // 카드·버튼 클릭이 슬라이드 넘김으로 번지지 않게
        // 끌어서 놓기(마우스·터치 공통). 거의 움직이지 않고 떼면 '누르기'로 보고 칸을 차례로 바꾼다.
        el.addEventListener('pointerdown',e=>{
          const c=e.target.closest('.card');if(!c||SLIDES[cur]._el!==el||el._rev||e.button>0)return;
          const i=+c.dataset.i,st=SORTSTATE[cfg.id],r=c.getBoundingClientRect(),sc=document.getElementById('stage').getBoundingClientRect().width/1600;
          const g={i,x0:e.clientX,y0:e.clientY,moved:false,clone:null,dx:e.clientX-r.left,dy:e.clientY-r.top,r};
          const mv=ev=>{
            if(!g.moved&&Math.hypot(ev.clientX-g.x0,ev.clientY-g.y0)>6){g.moved=true;
              g.clone=c.cloneNode(true);g.clone.className='card dragging';
              g.clone.style.cssText=`position:fixed;left:0;top:0;z-index:9999;pointer-events:none;transform-origin:0 0;transform:translate(${r.left}px,${r.top}px) scale(${sc});width:${r.width/sc}px;`;
              document.body.appendChild(g.clone);c.style.opacity='.3';}
            if(g.moved){g.clone.style.transform=`translate(${ev.clientX-g.dx}px,${ev.clientY-g.dy}px) scale(${sc})`;   // 카드는 마우스 위치를 바로 따라간다(지연 없음)
              if(!g.raf){g.raf=requestAnimationFrame(()=>{g.raf=0;   // 칸 강조는 프레임당 한 번만 계산
                const t=document.elementFromPoint(ev.clientX,ev.clientY),bx=t&&t.closest('.bin'),pl=t&&t.closest('.pool');
                el.querySelectorAll('.bin,.pool').forEach(n=>n.classList.toggle('over',n===bx||n===pl));});}}
          };
          const up=ev=>{
            window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
            el.querySelectorAll('.bin,.pool').forEach(n=>n.classList.remove('over'));
            if(g.clone){g.clone.remove();
              const t=document.elementFromPoint(ev.clientX,ev.clientY),bx=t&&t.closest('.bin'),pl=t&&t.closest('.pool');
              if(bx)st[i]=bx.dataset.binbox;else if(pl)st[i]='pool';
            }else if(ev.type==='pointerup'){const order=['pool',...keys];st[i]=order[(order.indexOf(st[i])+1)%order.length];}
            sortRender(el,cfg,false);
          };
          window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
          e.preventDefault();
       },true);
        el.querySelector('[data-sort-ans]').addEventListener('click',()=>{
          if(!SELF){step=SLIDES[cur]._max;render();}else reveal(el,true);});
        el.querySelector('[data-sort-reset]').addEventListener('click',()=>{
          SORTSTATE[cfg.id]=cfg.cards.map(()=>'pool');if(!SELF&&step){step=0;render();}reveal(el,false);});
      }
      if(!SELF&&!step)reveal(el,false);
    },
    step(n,el){if(SELF&&!n)return;reveal(el,n>=1);}},cfg.extra||{}));
}

/* ---------- 슬라이더 시뮬레이션 ----------
   본문 HTML 안에 sliderHTML(...) 을 넣고, 슬라이드의 enter(el) 에서 bindSlider(el, 아이디, 값 표시 함수, 값이 바뀔 때 호출할 함수) 를 부른다. */
function sliderHTML(id,label,min,max,stepv,value,color,fmtTxt){
  return `<div class="slider" data-sl="${id}"><span style="color:${color||TH.slider}">${label}</span><input type="range" min="${min}" max="${max}" step="${stepv}" value="${value}"><span class="val">${fmtTxt?fmtTxt(value):value}</span></div>`;
}
function bindSlider(el,id,fmtTxt,onChange){
  const box=el.querySelector(`[data-sl="${id}"]`);if(!box||box._bound)return;box._bound=true;stopAll(box);
  const r=box.querySelector('input'),v=box.querySelector('.val');
  r.addEventListener('input',()=>{const x=parseFloat(r.value);v.textContent=fmtTxt?fmtTxt(x):x;if(onChange)onChange(x);});
  return +r.value;
}

/* ---------- 그래프 그리기 도우미 (캔버스) ----------
   g = {x,y,w,h, x0,x1,y0,y1, xl:'가로축 이름', yl:'세로축 이름', xt:[눈금…], yt:[…]}  (x,y,w,h 는 그래프 영역의 화면 좌표) */
function plotAxes(ctx,g,color){
  ctx.save();ctx.strokeStyle=color||TH.axis;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.lineTo(g.x,g.y+g.h);ctx.lineTo(g.x+g.w,g.y+g.h);ctx.stroke();ctx.restore();
  // 원점: 가로·세로 눈금이 둘 다 0 이면 '0' 을 한 번만(축 바깥 왼쪽 아래) 쓴다 — 0 과 0.0 이 겹쳐 지저분해지는 것을 막는다
  const zx=(g.xt||[]).indexOf(0)>=0&&g.x0===0,zy=(g.yt||[]).indexOf(0)>=0&&g.y0===0,one=zx&&zy;
  if(one)txt(ctx,'0',g.x-10,g.y+g.h+20,18,TH.tick,'right',700);
  (g.xt||[]).forEach(v=>{if(one&&v===0)return;const px=plotX(g,v);txt(ctx,String(v),px,g.y+g.h+20,18,TH.tick,'center',700);});
  (g.yt||[]).forEach(v=>{if(one&&v===0)return;const py=plotY(g,v);txt(ctx,String(v),g.x-10,py,18,TH.tick,'right',700);});
  if(g.xl)txt(ctx,g.xl,g.x+g.w/2,g.y+g.h+48,22,TH.lbl,'center',800);
  if(g.yl){ctx.save();ctx.translate(g.x-62,g.y+g.h/2);ctx.rotate(-Math.PI/2);txt(ctx,g.yl,0,0,22,TH.lbl,'center',800);ctx.restore();}
}
const plotX=(g,v)=>g.x+(v-g.x0)/(g.x1-g.x0)*g.w, plotY=(g,v)=>g.y+g.h-(v-g.y0)/(g.y1-g.y0)*g.h;
/* fn(x)->y 곡선을 progress(0~1)만큼 그린다 */
function plotCurve(ctx,g,fn,progress,color,lw){
  const n=80,m=Math.max(1,Math.round(n*(progress==null?1:progress)));
  ctx.save();ctx.strokeStyle=color||TH.curve;ctx.lineWidth=lw||4;ctx.lineJoin='round';ctx.beginPath();
  for(let i=0;i<=m;i++){const x=g.x0+(g.x1-g.x0)*i/n,y=fn(x);const px=plotX(g,x),py=plotY(g,y);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.stroke();ctx.restore();

function plotDot(ctx,g,x,y,color,r){ball(ctx,plotX(g,x),plotY(g,y),r||8,color||TH.dot);}

/* ============ 공통 부품 (engine/common.js) ============
   여러 단원에 똑같이 복사되어 있던 함수를 한 곳으로 모은 것. 단원 파일(lib.js, anims.js)에 같은 이름을 다시 만들지 않는다.

const seriesAt=(cols,q)=>{const n=cols.length-1,x=Math.min(n-1e-9,Math.max(0,q)*n),i=Math.floor(x);return mixHex(cols[i],cols[i+1],x-i);};
const svgOf=o=>o.cv.parentElement.querySelector('svg');

function drawHand(ctx,kind,x,y,s,rot,flip){
  let h=_HIMG[kind];
  if(!h){const d=FIG_HANDS[kind],im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(d.svg);h=_HIMG[kind]={im,d};}

}
const seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);
function gArrow(ctx,x,y1,y2,col,lw,head){if(Math.abs(y2-y1)<4)return;arrow(ctx,x,y1,x,y2,col||CG,lw||9,head||22);}
function band(ctx,s,x,y,size){
  ctx.save();ctx.font=`800 ${size}px Pretendard,sans-serif`;const w=ctx.measureText(s).width+40,h=size*1.7;
  rr(ctx,x-w/2,y-h/2,w,h,12);ctx.fillStyle=YEL;ctx.fill();ctx.restore();txt(ctx,s,x,y+1,size,INK);

function drop(ctx,x,y,s,col){

function cloud(ctx,x,y,s){

  const cs=[[-70,6,32],[-28,-22,42],[30,-16,38],[72,8,30]];
  ctx.fillStyle='#A9BCB7';cs.forEach(([cx,cy,r])=>{ctx.beginPath();ctx.arc(cx,cy,r+3.5,0,TAU);ctx.fill();});ctx.fillRect(-70,6,142,36);

const _pt=(p,a,l)=>[p[0]+Math.sin(a*Math.PI/180)*l,p[1]+Math.cos(a*Math.PI/180)*l];
function _limb(ctx,L,w,col,ol){

function drawHuman(ctx,x,y,s,pose,opt){

  const T=P.T,tr=T*Math.PI/180,hip=[0,-47],up=[Math.sin(tr),-Math.cos(tr)],n=[Math.cos(tr),Math.sin(tr)];

/* =====================================================================
   전기와 자기 시뮬레이션 엔진 (engine/sim_circuit.js) — 2022 개정 [9과14-01]~[9과14-04]
   · 모델(물리 계산)은 DOM 없이 Node 에서도 돌아가며 tools/test_engines.js 가 숫자로 검증한다. 그리기 도우미는 맨 아래.
   · 교육과정이 막은 것: 합성 저항의 정량 계산, 혼합 연결 → 이 엔진은 계산할 수 있지만 슬라이드에서는 beyond(교과서 밖 심화)로만 보여 준다.

  'use strict';

     2) 일반 회로 풀이 (수정 마디 해석).  netlist: 마디 0 = 접지(0 V).

        if (e.a > 0 && e.b > 0) { A[idx(e.a)][idx(e.b)] -= g; A[idx(e.b)][idx(e.a)] -= g; }
