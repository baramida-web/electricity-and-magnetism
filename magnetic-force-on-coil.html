/* ---------- 계산(엔진) ---------- */
/* 전기 그네: 코일(엔진 부호 I·세기)에 자석의 near('N'|'S') 극을 오른쪽에서 가까이 → {nEnd: 코일 N극 끝(−1 왼쪽, +1 오른쪽), F: 축 방향 힘(+ = 자석 쪽)} */
const CF_SWC={};
function cfSwing(I,near,mag){const key=I+near+(mag||1);if(CF_SWC[key])return CF_SWC[key];const c=D.SW_COIL,m=D.SW_MAG;
  const coil=MAG.coil({cx:0,L:c.L,R:c.R,N:c.N,I:I}),bar=MAG.bar({cx:m.gap,L:m.L,W:m.W,N:m.N,nEnd:near==='N'?-1:1,strength:mag||1});
  return CF_SWC[key]={nEnd:I?MAG.nEnd(coil):0,F:I?MAG.axialForce([bar],coil):0};}
const CF_F0=Math.abs(cfSwing(1,'N',1).F);   /* 보통 전류·보통 자석의 힘(기준) — 그네가 기울어지는 정도의 눈금 */

/* ---------- 부품: 극 표지 · 화살표 ---------- */
function cfPole(ctx,x,y,r,p,o){o=o||{};qaPush('pole',{p,x,y});if(p==='?'){ctx.save();ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(x,y,r,0,PI2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#33404A';ctx.stroke();ctx.restore();txt(ctx,'?',x,y+1,r*1.1,CF.SUBT,'center',900);return;}
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,PI2);ctx.fillStyle=p==='N'?CF.N:CF.S;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();txt(ctx,p,x,y+1,r*1.15,'#fff','center',900);}
function cfForce(ctx,x,y,dir,len,lab){const x1=x+dir*len;arrow(ctx,x,y,x1,y,CF.force,9,24);if(lab)txt(ctx,lab,x1+dir*14,y,24,CF.force,dir>0?'left':'right',900);}
function cfMove(ctx,x,y,dir,len,lab,below){arrow(ctx,x,y,x+dir*len,y,CF.MOVE,7,20);if(lab){if(below)cfPill(ctx,lab,x+dir*len/2,y+34,24,CF.MOVE);else txt(ctx,lab,x+dir*(len+14),y,24,CF.MOVE,dir>0?'left':'right',900);}}

/* ---------- 코일(옆에서 본 고리 여러 겹) ----------
   (cx,cy) = 가운데, ry = 고리 반지름(세로), n 겹, pitch = 겹 사이. I: 0 이면 전류 화살표 없음. 뒤쪽 반(오른쪽 반 타원)을 먼저 그리고 앞쪽 반을 나중에. 돌려주는 값 = {x0,x1,top} */
function cfCoil(ctx,cx,cy,ry,n,pitch,I,o){o=o||{};const rx=ry*.34,x0=cx-(n-1)*pitch/2,lw=o.lw||7;
  ctx.save();ctx.lineCap='round';
  for(let i=0;i<n;i++){const x=x0+i*pitch;ctx.beginPath();ctx.ellipse(x,cy,rx,ry,0,-Math.PI/2,Math.PI/2);ctx.strokeStyle='rgba(138,75,30,.78)';ctx.lineWidth=lw*.8;ctx.stroke();}
  if(o.mid)o.mid();   /* 코일 안을 지나는 것(자석·철심)을 뒤쪽 반과 앞쪽 반 사이에 */
  for(let i=0;i<n;i++){const x=x0+i*pitch;ctx.beginPath();ctx.ellipse(x,cy,rx,ry,0,Math.PI/2,Math.PI*1.5);ctx.strokeStyle=CF.CU2;ctx.lineWidth=lw+3;ctx.stroke();ctx.strokeStyle=CF.cu;ctx.lineWidth=lw;ctx.stroke();
    ctx.strokeStyle='rgba(255,225,190,.5)';ctx.lineWidth=lw*.28;ctx.beginPath();ctx.ellipse(x-lw*.2,cy,rx,ry,0,Math.PI*.6,Math.PI*1.4);ctx.stroke();}
  ctx.restore();
  if(I&&o.arrows!==false){const idx=o.aidx||[Math.floor(n/2)-1,Math.floor(n/2)+1];idx.forEach(i=>{const x=x0+i*pitch-rx*.97,y0=cy+(I>0?1:-1)*ry*.4,y1=cy-(I>0?1:-1)*ry*.4;
    ctx.save();arrow(ctx,x,y0,x,y1,'#fff',(o.aw||6)+5,(o.aw||6)*3.6+4);arrow(ctx,x,y0,x,y1,CF.cur,o.aw||6,(o.aw||6)*3.6);ctx.restore();});}
  return {x0:x0-rx,x1:x0+(n-1)*pitch+rx,xa:x0,xb:x0+(n-1)*pitch,top:cy-ry,bot:cy+ry};}

/* ---------- 막대자석(가로): xn = 코일을 마주 보는 끝, 오른쪽으로 L 만큼. near = 마주 보는 극. strong = 센 자석(두껍게 + 이름표) ---------- */
function cfMagnet(ctx,xn,cy,L,W,near,o){o=o||{};const far=near==='N'?'S':'N',cn=near==='N'?CF.N:CF.S,cf=near==='N'?CF.S:CF.N;
  ctx.save();ctx.lineWidth=3;ctx.strokeStyle='#33404A';ctx.fillStyle=cn;ctx.fillRect(xn,cy-W/2,L/2,W);ctx.strokeRect(xn,cy-W/2,L/2,W);ctx.fillStyle=cf;ctx.fillRect(xn+L/2,cy-W/2,L/2,W);ctx.strokeRect(xn+L/2,cy-W/2,L/2,W);
  if(o.strong){ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(xn,cy-W/2,L,W*.22);}ctx.restore();
  txt(ctx,near,xn+L/4,cy+1,W*.58,'#fff','center',900);txt(ctx,far,xn+L*.75,cy+1,W*.58,'#fff','center',900);}

/* ---------- 직류 전원 장치(작게): 전압 칸 2개, (−) 왼쪽 · (+) 오른쪽. 돌려주는 값 = 단자 위치 ---------- */
function cfSupply(ctx,x,y,w,h,lv,on){ctx.save();rr(ctx,x,y,w,h,14);ctx.fillStyle='#2E3A40';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#1D2B2A';ctx.stroke();ctx.restore();
  txt(ctx,'직류 전원 장치',x+w/2,y+24,24,'#fff','center',900);
  ctx.save();rr(ctx,x+12,y+44,w-24,40,8);ctx.fillStyle='#14221E';ctx.fill();ctx.restore();txt(ctx,'전압',x+26,y+64,24,'#CFE8DF','left',900);
  for(let i=0;i<2;i++){const bx=x+92+i*((w-112)/2),bw=(w-112)/2-8;ctx.save();rr(ctx,bx,y+52,bw,24,4);ctx.fillStyle=i<=lv&&on?'#F4C33B':(i<=lv?'#8C7A3E':'#3C4A48');ctx.fill();ctx.restore();}
  const P=[x+w*.72,y+h-30],Q=[x+w*.28,y+h-30];
  txt(ctx,'(+)',P[0],P[1]-32,24,'#FFB4A8','center',900);txt(ctx,'(−)',Q[0],Q[1]-32,24,'#E4EAEC','center',900);
  [[P,CF.WIRE_R,'+'],[Q,'#1D2B2A','−']].forEach(([c,col,s])=>{ctx.save();ctx.beginPath();ctx.arc(c[0],c[1],16,0,PI2);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#C9D3D8';ctx.stroke();ctx.restore();txt(ctx,s,c[0],c[1]+1,24,'#fff','center',900);});
  return {P,Q};}
function cfWire(ctx,p0,p1,col,c1,c2){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],p1[0],p1[1]);ctx.stroke();ctx.restore();
  [p0,p1].forEach(p=>{ctx.save();ctx.beginPath();ctx.arc(p[0],p[1],6,0,PI2);ctx.fillStyle='#55646A';ctx.fill();ctx.restore();});}

/* ---------- 전기 그네(옆에서 본 모식) ----------
   st = {I(엔진 부호·세기 포함, 0=전원 꺼짐), near:'N'|'S'|null, mx: 자석이 다가온 정도 0~1, ph: 그네 기울기(라디안, + = 오른쪽=자석 쪽), lv, strong, swap, poles:true}
   돌려주는 값 = {cx,cy, coil, magX} */
function cfSwingRig(o,st,box){const {ctx}=o,[bx,by,bw,bh]=box,cp=!!st.compact;
  /* compact: 받침·기둥 없이 걸이 막대와 코일·자석만 크게(작은 비교 칸용) */
  const s=cp?Math.min(bw/480,bh/260):Math.min(bw/760,bh/520),px=bx+bw*(cp?.4:.46),py=by+(cp?bh*.04:bh*.14),Lp=cp?bh*.5:bh*.42,ry=(cp?80:88)*s;
  let posts=null;
  if(!cp){ctx.save();ctx.fillStyle='#B9C2C8';ctx.strokeStyle='#33404A';ctx.lineWidth=3;rr(ctx,px-210*s,by+bh*.86,420*s,22*s,6);ctx.fill();ctx.stroke();
    [px-190*s,px+190*s].forEach(x=>{ctx.fillStyle='#8E9AA2';ctx.fillRect(x-7*s,py-6,14*s,by+bh*.86-py+6);ctx.strokeRect(x-7*s,py-6,14*s,by+bh*.86-py+6);});
    ctx.fillStyle='#8E9AA2';rr(ctx,px-200*s,py-16*s,400*s,16*s,6);ctx.fill();ctx.stroke();ctx.restore();
    if(st.label!==false)txt(ctx,'전기 그네 실험 장치',px-200*s,py-44*s,24,CF.SUBT,'left',800);
    posts=[[px-190*s,by+bh*.8],[px+190*s,by+bh*.8]];}
  else{ctx.save();ctx.fillStyle='#8E9AA2';ctx.strokeStyle='#33404A';ctx.lineWidth=2.5;rr(ctx,px-90*s,py-12*s,180*s,12*s,5);ctx.fill();ctx.stroke();ctx.restore();}
  /* 그네: 걸이 점 두 개 → 코일 위 */
  const ph=st.ph||0,cx=px+Math.sin(ph)*Lp,cy=py+Math.cos(ph)*Lp;
  ctx.save();ctx.strokeStyle=CF.cu;ctx.lineWidth=cp?4:5;[-1,1].forEach(k=>{ctx.beginPath();ctx.moveTo(px+k*16*s,py);ctx.lineTo(cx+k*16*s,cy-ry);ctx.stroke();});ctx.restore();
  const magL=(cp?150:230)*s,magW=(cp?50:54)*s,far=bx+bw+40,near0=cx+ry*.34+34*s,mX=st.near?far+(near0+40*s-far)*(st.mx||0):far;
  const coil=cfCoil(ctx,cx,cy,ry,7,(cp?13:15)*s,st.I?Math.sign(st.I):0,{lw:Math.max(4,8*s),aw:Math.max(4,6*s)});
  if(st.near){ctx.save();ctx.beginPath();ctx.rect(bx,by-60,bw,bh+120);ctx.clip();cfMagnet(ctx,mX,cy,magL,magW,st.near,{strong:st.strong});ctx.restore();}
  if(st.near&&st.strong&&st.mx>.5)txt(ctx,'센 자석',mX+magL/2,cy+magW/2+24,24,CF.ink,'center',900);
  if(st.poles&&st.I){const ne=cfSwing(Math.sign(st.I),'N').nEnd,lp=ne<0?'N':'S',rp=ne<0?'S':'N',r=Math.max(18,22*s);cfPole(ctx,coil.x0-r-6,cy,r,lp);const gx=st.near?(coil.x1+mX)/2:coil.x1+r+6;(st.near&&mX-coil.x1<2*r+8)?cfPole(ctx,coil.x1+r*.3,cy-ry-r*.6,r,rp):cfPole(ctx,gx,cy,r,rp);}   /* 극 표시는 코일 끝 바로 옆(자석과의 틈) */
  if(window.QA_ON){const ne=st.I?cfSwing(Math.sign(st.I),'N').nEnd:0;qaPush('rig',{I:st.I?Math.sign(st.I):0,near:st.near||null,mx:st.near?(st.mx||0):0,ph:ph,poles:!!(st.poles&&st.I),lp:st.I?(ne<0?'N':'S'):null,rp:st.I?(ne<0?'S':'N'):null,mag:st.strong?2:1,cx,cy});}   /* 자동 검사: 그린 극·기울기 */
  return {cx,cy,coil,magX:mX,px,py,s,ry,posts};}
/* 전원 장치 → 그네 기둥 아래(기둥·걸이 막대가 금속이라 전류가 흐른다). 두 전선이 장치를 가로지르지 않게 받침 아래로 돈다 */
function cfRigWires(ctx,sup,R,swap,on){if(!R.posts)return;const [pL,pR]=R.posts,a=swap?sup.P:sup.Q,b=swap?sup.Q:sup.P,low=Math.max(pL[1],pR[1])+60;
  cfWire(ctx,a,pL,swap?CF.WIRE_R:CF.WIRE_K,[a[0],low],[pL[0]-60,low]);cfWire(ctx,b,pR,swap?CF.WIRE_K:CF.WIRE_R,[b[0],low+30],[pR[0],low+40]);}

/* ---------- 전동기(교과서 그림처럼 위에서 본 모식) ----------
   고정자: 왼쪽 N(빨강) · 오른쪽 S(파랑) 자석, 안쪽은 둥글게 파인 면. 회전자 = 쇠 몸통 + 양 끝에 감은 코일 + 가운데 정류자(반쪽 고리 둘) + 브러시. */
function cfStator(ctx,cx,cy,R,H){const w=R*.62;ctx.save();ctx.lineWidth=3;ctx.strokeStyle='#33404A';
  [[-1,CF.N,'N'],[1,CF.S,'S']].forEach(([sg,col,l])=>{ctx.beginPath();const xo=cx+sg*(R+w),xi=cx+sg*R*1.02;ctx.moveTo(xo,cy-H/2);ctx.lineTo(xi,cy-H/2);ctx.quadraticCurveTo(cx+sg*R*.78,cy,xi,cy+H/2);ctx.lineTo(xo,cy+H/2);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.stroke();
    txt(ctx,l,cx+sg*(R+w*.55),cy+2,40,'#fff','center',900);});ctx.restore();}
function cfRotor(ctx,cx,cy,r,th,pole,I,o){o=o||{};const ux=Math.cos(th),uy=-Math.sin(th),px=-uy,py=ux,L=r*.9,w=r*.32;
  ctx.save();ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(cx+ux*L+px*w,cy+uy*L+py*w);ctx.lineTo(cx+ux*L-px*w,cy+uy*L-py*w);ctx.lineTo(cx-ux*L-px*w,cy-uy*L-py*w);ctx.lineTo(cx-ux*L+px*w,cy-uy*L+py*w);ctx.closePath();
  ctx.fillStyle=CF.IRON;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#33404A';ctx.stroke();
  [1,-1].forEach(sg=>{for(let k=0;k<6;k++){const d=sg*L*(.34+k*.1),ax=cx+ux*d,ay=cy+uy*d;ctx.beginPath();ctx.moveTo(ax+px*w*1.12,ay+py*w*1.12);ctx.lineTo(ax-px*w*1.12,ay-py*w*1.12);ctx.strokeStyle=CF.CU2;ctx.lineWidth=Math.max(5,r*.07)+2;ctx.lineCap='round';ctx.stroke();ctx.strokeStyle=CF.cu;ctx.lineWidth=Math.max(5,r*.07);ctx.stroke();}});
  /* 정류자(반쪽 고리 둘 — 몸통과 같이 돈다) */
  const cr=r*.2;ctx.lineWidth=Math.max(6,r*.07);ctx.lineCap='butt';[0,Math.PI].forEach((a0,i)=>{ctx.beginPath();ctx.arc(cx,cy,cr,-th+a0+Math.PI/2+.25,-th+a0+Math.PI*1.5-.25);ctx.strokeStyle=o.hiComm?CF.ans:(i?'#D9B56A':'#C9A04A');ctx.stroke();});
  ctx.beginPath();ctx.arc(cx,cy,cr*.42,0,PI2);ctx.fillStyle='#55646A';ctx.fill();ctx.restore();
  if(I&&o.arrows!==false){const s=pole>0?1:-1;   /* 보이는 쪽 도선의 전류 = N극 방향에서 시계 방향 90°(앞 단원 규칙: 윗면 전류 +y → N극 −x) — 감은 방향이 같아 양 끝 코일 모두 같은 쪽 */
    if(window.QA_ON)qaPush('rotor',{th,pole,curAng:Math.atan2(-(py*s),px*s),nAng:pole>0?th:th+Math.PI});   /* 그린 전류 화살표 방향(수학 각)과 N극 각 */
    [1,-1].forEach(sg=>{const d=sg*L*.58,ax=cx+ux*d,ay=cy+uy*d,dd=w*1.0*s;
    arrow(ctx,ax-px*dd,ay-py*dd,ax+px*dd,ay+py*dd,'#fff',9,24);arrow(ctx,ax-px*dd,ay-py*dd,ax+px*dd,ay+py*dd,CF.cur,5,18);});}
  if(o.poles&&I){const n1=pole>0?'N':'S',n2=pole>0?'S':'N',rr_=L*.8;   /* 몸통 끝 위(화살표·고정자와 겹치지 않게) */cfPole(ctx,cx+ux*rr_,cy+uy*rr_,r*.15,n1);cfPole(ctx,cx-ux*rr_,cy-uy*rr_,r*.15,n2);}}
/* 브러시 + 전원 연결(아래로). 브러시는 고정, 정류자에 닿는다 */
function cfBrush(ctx,cx,cy,r,on){const cr=r*.2,bw=r*.1;ctx.save();[-1,1].forEach(sg=>{const x=cx+sg*(cr+bw*.5);   /* 브러시(정류자 양옆) → 아래로 전선 — 회전자보다 먼저 그려 회전자 밑으로 지나간다 */
  ctx.strokeStyle=sg<0?CF.WIRE_R:'#1D2B2A';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,cy);ctx.lineTo(x,cy+r*1.55);ctx.stroke();ctx.fillStyle='#3B4A50';ctx.fillRect(x-bw/2,cy-bw*.7,bw,bw*1.4);});ctx.restore();
  txt(ctx,'(+)',cx-cr-bw*.5,cy+r*1.55+26,24,CF.ink,'center',900);txt(ctx,'(−)',cx+cr+bw*.5,cy+r*1.55+26,24,CF.ink,'center',900);}
/* 돌아가는 방향 화살표(보라 곡선) */
function cfSpin(ctx,cx,cy,R,dir,a0){const a=a0||0;qaPush('spin',{dir});ctx.save();ctx.strokeStyle=CF.force;ctx.lineWidth=6;ctx.lineCap='round';
  [0,Math.PI].forEach(o=>{const s=-Math.PI/2+o+a,e=s+(dir>0?.9:-.9);ctx.beginPath();ctx.arc(cx,cy,R,Math.min(s,e),Math.max(s,e));ctx.stroke();
    const ex=cx+R*Math.cos(e),ey=cy+R*Math.sin(e),tx=-Math.sin(e)*(dir>0?1:-1),ty=Math.cos(e)*(dir>0?1:-1);ctx.fillStyle=CF.force;ctx.beginPath();ctx.moveTo(ex+tx*16,ey+ty*16);ctx.lineTo(ex-ty*10,ey+tx*10);ctx.lineTo(ex+ty*10,ey-tx*10);ctx.closePath();ctx.fill();});ctx.restore();}

/* 자기장 속에서 코일이 받는 힘 — 애니메이션. 코일이 받는 힘의 방향·크기 = MAG.axialForce(엔진), 전동기 = MOTOR(엔진).
   빈칸 공개 단계(o.phase) = 학습지 빈칸 순서. 결과를 보여 주는 장면은 빈칸을 열 때 움직인다(처음부터 움직여 있지 않게). */

/* 그네 기울기: 힘 → 기울어질 각(진자: 기울기 ≈ 힘 / 복원). 보통 전류·보통 자석 = 0.12 rad */
const CF_K=.12/CF_F0;
const cfTilt=F=>Math.max(-.34,Math.min(.34,F*CF_K));
/* 진자 한 걸음: 목표 기울기 쪽으로 흔들리다 멈춘다 */
function cfPend(st,target,dt){st.ph=st.ph||0;st.w=st.w||0;const n=Math.max(1,Math.ceil(dt/.01)),h=dt/n;for(let i=0;i<n;i++){st.w+=(-9*(st.ph-target)-1.7*st.w)*h;st.ph+=st.w*h;}return st.ph;}

/* ================= 표지 : 돌아가는 전동기 ================= */
ANIMS.cover=o=>{const m=MOTOR.state({th:Math.PI/4,w:-MOTOR.terminal({I:1,B:1})});   /* 처음부터 일정한 빠르기로(자동 검사: 4초에 반 바퀴 넘게) */o.frame=()=>{const {ctx,W,H}=o;clear(o,false);cfBg(o,CF.BG);const dt=cfTick(o);
  MOTOR.step(m,{I:1,B:1,comm:true,dir:1},dt*1.3);qaState(o,{acc:m.acc});
  const cx=W/2,cy=H*.46,R=Math.min(W,H)*.25;txt(ctx,'전류가 흐르면 코일이 돈다',cx,H*.08,30,CF.ink,'center',900);
  cfStator(ctx,cx,cy,R,R*1.7);cfRotor(ctx,cx,cy,R*.86,m.th,m.pole,1,{poles:true});cfSpin(ctx,cx,cy,R*1.08,1,0);
  txt(ctx,'자석',cx-R*1.25,cy+R*1.05,26,CF.ink,'center',900);txt(ctx,'코일',cx,cy+R*1.32,26,CF.cu,'center',900);
  cfCap(o,'코일(전자석)과 자석이 밀고 당긴다 (모식)',CF.force,H*.92);};};

/* ================= 도입 : 선풍기 안의 자석과 코일 ================= */
ANIMS.intro=o=>{let a=0;o.frame=()=>{const {ctx,W,H}=o;clear(o);cfBg(o);const dt=cfTick(o),ph=o.phase;a+=dt*(ph>=0?3.2:0);
  const cx=W*.36,cy=H*.4,R=Math.min(W,H)*.25;
  /* 선풍기(앞에서 본 모습): 망 · 날개 3장 · 가운데 */

  ctx.beginPath();ctx.arc(cx,cy,R*.16,0,PI2);ctx.fillStyle='#55646A';ctx.fill();ctx.restore();
  ctx.save();ctx.fillStyle='#B9C2C8';ctx.strokeStyle='#33404A';ctx.lineWidth=3;ctx.fillRect(cx-14,cy+R*1.05,28,H*.3);ctx.strokeRect(cx-14,cy+R*1.05,28,H*.3);rr(ctx,cx-R*.7,H*.86,R*1.4,24,8);ctx.fill();ctx.stroke();ctx.restore();
  /* 확대: 뒤쪽 몸통 속 — 자석과 코일 */
  const zx=W*.78,zy=H*.42,zr=Math.min(W*.18,H*.24);ctx.save();ctx.setLineDash([8,7]);ctx.strokeStyle=CF.ans;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+R*.18,cy);ctx.lineTo(zx-zr,zy);ctx.stroke();ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(zx,zy,zr,0,PI2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=CF.ans;ctx.stroke();ctx.clip();

/* ================= 해 보기 과정(결과는 가상 실험에서) ================= */
ANIMS.lab=o=>{const st={ph:0,mx:0};o.frame=()=>{const {ctx,W,H}=o;clear(o);cfBg(o);const dt=cfTick(o),ph=o.phase;
  const near=ph===2?'N':ph===3?'S':ph===4?'N':null;st.mx=cfSm(st.mx,!!near&&ph>=2,dt,1.2);

  if(ph>=1)cfRigWires(ctx,sup,R,ph===4);
  if(ph>=2&&st.mx>.9)cfPill(ctx,'코일은 어떻게 움직일까? → 가상 실험에서 확인',W*.6,H*.06,24,CF.ans,'#FFF3E6');
  cfCap(o,['장치를 준비한다','1 전기 그네에 코일을 걸고 직류 전원 장치와 연결한다','2 자석의 N극을 코일에 가까이 가져간다','3 자석의 S극을 코일에 가까이 가져간다','4 2에서 두 전선의 위치를 서로 바꾼다'][Math.min(4,ph)],ph?CF.ans:CF.SUBT,H*.95);};};

/* ================= 가상 실험 ① 전기 그네 (id: sw) ================= */
const CF_EX={1:{near:'N',swap:false,lv:0,nm:'과정 2 · N극을 가까이'},2:{near:'S',swap:false,lv:0,nm:'과정 3 · S극을 가까이'},3:{near:'N',swap:true,lv:0,nm:'과정 4 · 두 전선을 바꾸고 N극'},4:{near:'N',swap:false,lv:1,nm:'더 해 보기 · 전압을 높이고 N극'}};
const CF_ANS={1:1,2:1,3:1};
function cfSwRun(sp,e){const d=sp.data;if(!d.init)return;if(sp.v['p'+e]==null){d.msg='먼저 결과를 예상해 골라 보자!';d.cls='';return;}const c=CF_EX[e];Object.assign(d,{ex:e,near:c.near,swap:c.swap,lv:c.lv,on:true,t0:0,phase:'in',msg:c.nm+' — 자석을 가까이 가져간다…',cls:''});}
const SPSW=SIMSPEC.define({id:'sw',
  vars:[{id:'p1',label:'예상 ①',choice:[[0,'자석 쪽으로 끌려온다'],[1,'자석에서 밀려난다'],[2,'움직이지 않는다']],def:null},
        {id:'p2',label:'예상 ②',choice:[[0,'①과 같은 쪽'],[1,'①과 반대쪽']],def:null},
        {id:'p3',label:'예상 ③',choice:[[0,'①과 같은 쪽'],[1,'①과 반대쪽']],def:null},
        ],
  flow:[{label:'예상: 자석의 N극을 가까이 하면 코일은?',var:'p1'},{label:'과정 2 N극을 가까이',act:'e1',btn:'실험'},
        {label:'예상: S극을 가까이 하면 ①과 비교해?',var:'p2'},{label:'과정 3 S극을 가까이',act:'e2',btn:'실험'},
        {label:'예상: 두 전선을 바꾸고 N극이면 ①과 비교해?',var:'p3'},{label:'과정 4 두 전선을 바꾸고 N극',act:'e3',btn:'실험'}],
  extra:[{id:'e1',label:'실험',onClick:sp=>cfSwRun(sp,1)},{id:'e2',label:'실험',onClick:sp=>cfSwRun(sp,2)},{id:'e3',label:'실험',onClick:sp=>cfSwRun(sp,3)},{id:'e4',label:'전압 높이고 N극',onClick:sp=>{const d=sp.data;if(d.init&&d.rec[1]){const c=CF_EX[4];Object.assign(d,{ex:4,near:c.near,swap:c.swap,lv:c.lv,on:true,t0:0,phase:'in',msg:'전압을 높이고(전류가 셈) N극을 가까이 — ①과 비교해 보자…',cls:''});}else if(d.init){d.msg='먼저 과정 2(①)를 해 보자.';d.cls='';}}},
         {id:'off',label:'전원 끄고 해 보기',onClick:sp=>{const d=sp.data;if(d.init)Object.assign(d,{ex:0,near:'N',swap:false,lv:0,on:false,t0:0,phase:'in',msg:'전원을 끄고(전류 0) N극을 가까이 가져간다…',cls:''});}},
         ],
  pace:1,compact:true,clickDriven:true,scale:{mode:'schematic',note:'전기 그네·자석은 보기 쉽게 그린 모식이고 전압은 보통·높음(숫자 없음)이다'},motion:true});
ANIMS.swingsim=o=>{cvHitInit(o);o.frame=()=>{const {ctx,W,H}=o;clear(o,false);o._hits=[];const sp=SPSW,d=sp.data,v=sp.v;
  if(!d.init)Object.assign(d,{init:1,ex:0,near:null,swap:false,lv:0,on:false,mx:0,t0:0,phase:'',st:{ph:0,w:0},rec:{},msg:'',cls:'',tt:0,poles:false});
  const dt=sp.dt(o.t);d.tt+=dt;o._tt=d.tt;cfBg(o);
  const I=d.on?(d.swap?-1:1)*D.SW_BASE_I*cfLv(d.lv):0;
  if(d.phase==='in'){d.t0+=dt;d.mx=Math.min(1,d.mx+dt/1.2);if(d.t0>4.2){d.phase='rec';}}
  else if(d.phase==='out'){d.mx=Math.max(0,d.mx-dt/1.2);if(d.mx<=0){d.phase='';d.near=null;}}
  const F=d.near&&I?cfSwing(Math.sign(I),d.near,1).F*Math.abs(I)*Math.pow(d.mx,3):0;cfPend(d.st,cfTilt(F),dt);
  if(d.phase==='rec'){const e=d.ex;if(e&&!d.rec[e]){d.rec[e]={mv:Math.sign(cfSwing(Math.sign(I),d.near,1).F),big:Math.abs(I)>1};const ok=e===4?true:CF_ANS[e]===v['p'+e];
      d.msg=(e===4?'':ok?'예상 적중! ':'예상과 달랐어. ')+['코일이 자석에서 밀려났다.','①과 반대 — 코일이 자석 쪽으로 끌려왔다.','①과 반대 — 코일이 자석 쪽으로 끌려왔다.','①과 같은 쪽으로 더 크게 밀려났다(전류가 셀수록 힘이 크다).'][e-1];d.cls=ok?'ok':'bad';}
    else if(!e){d.msg='전류가 흐르지 않으면 코일은 움직이지 않는다(코일이 전자석이 아니다).';d.cls='ok';}
    d.phase='hold';d.t0=0;}
  else if(d.phase==='hold'){d.t0+=dt;if(d.t0>2.2)d.phase='out';}
  const sup=cfSupply(ctx,W*.03,H*.42,W*.2,180,d.lv,d.on);
  const Rg=cfSwingRig(o,{I,near:d.near,mx:d.mx,ph:d.st.ph,poles:d.poles||d.phase==='hold'},[W*.26,H*.15,W*.72,H*.66]);
  cfRigWires(ctx,sup,Rg,d.swap);
  if(d.swap)cfPill(ctx,'두 전선을 바꿈',W*.13,H*.38,24,CF.ans,'#FFF3E6');if(d.lv)cfPill(ctx,'전압 높음',W*.13,H*.38-(d.swap?44:0),24,CF.ans,'#FFF3E6');
  if(d.near&&I&&Math.abs(d.st.ph)>.03){const dir=Math.sign(d.st.ph);cfMove(ctx,Rg.cx-35*dir,Rg.cy+Rg.ry+24,dir,70,dir>0?'자석 쪽으로':'자석에서 멀리',true);}

  [1,2,3,4].forEach((e,i)=>{const cx=x0+40+i*W*.17,cy=y+44;txt(ctx,'①②③④'[i],cx-22,cy,28,CF.ans,'center',900);const r=d.rec[e];
    if(r){const L=r.big?64:40;arrow(ctx,cx+34-r.mv*L/2,cy,cx+34+r.mv*L/2,cy,CF.MOVE,7,18);}else{ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle='#8FA29D';ctx.lineWidth=3;ctx.strokeRect(cx+2,cy-16,64,32);ctx.restore();}});
  txt(ctx,'→ = 자석 쪽',W*.96,y,22,CF.SUBT,'right',800);
  if(d.ex&&d.phase&&d.phase!=='out'){d.tmax=d.tmax||{};d.tmax[d.ex]=Math.max(d.tmax[d.ex]||0,Math.abs(d.st.ph));}
  qaState(o,{phase:d.phase,ex:d.ex,on:d.on,rec:JSON.parse(JSON.stringify(d.rec)),tilt:d.st.ph,tmax:Object.assign({},d.tmax||{})});
  sp.setFlow({p1:v.p1==null?'now':'done',e1:v.p1==null?'lock':(d.rec[1]?'done':'now'),p2:!d.rec[1]?'lock':(v.p2==null?'now':'done'),e2:(!d.rec[1]||v.p2==null)?'lock':(d.rec[2]?'done':'now'),
    p3:!d.rec[2]?'lock':(v.p3==null?'now':'done'),e3:(!d.rec[2]||v.p3==null)?'lock':(d.rec[3]?'done':'now')});
  cfMsg(o,d.msg||(v.p1==null?'전기 그네에 코일을 걸고 전원 장치에 연결했다. N극을 가까이 하면 코일은? 예상해 고르자.':''),d.cls);};};

/* ================= 해 보기 결과 정리 (빈칸 4: 움직인다 · 반대 · 반대 · 전류) ================= */
function cfMini(o,box,I,near,show,cap,o2){o2=o2||{};const {ctx}=o,st={I,near,mx:1,ph:show?cfTilt(cfSwing(Math.sign(I),near,o2.mag||1).F*Math.abs(I)):0,poles:o2.poles,strong:o2.strong,compact:true};
  ctx.save();rr(ctx,box[0],box[1],box[2],box[3],14);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=CF.LINE;ctx.stroke();ctx.restore();
  const R=cfSwingRig(o,st,[box[0]+6,box[1]+box[3]*.16,box[2]-12,box[3]*.62]);txt(ctx,cap,box[0]+box[2]/2,box[1]+24,24,CF.ink,'center',900);
  if(show){const dir=Math.sign(st.ph);cfMove(ctx,R.cx-28*dir,R.cy+R.ry+26,dir,56);}
  return R;}
ANIMS.result=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o);cfBg(o);cfTick(o);const ph=o.phase,b=D.SW_BASE_I,pw=(W-48)/3;
  [[b,'N','과정 2 · N극'],[b,'S','과정 3 · S극'],[-b,'N','과정 4 · 전선 바꿈']].forEach(([I,near,nm],j)=>{const show=ph>=[1,2,3][j];cfMini(o,[16+j*(pw+8),H*.06,pw,H*.62],I,near,show,nm);
    if(show)txt(ctx,cfSwing(Math.sign(I),near).F>0?'자석 쪽으로 끌려옴':'자석에서 밀려남',16+j*(pw+8)+pw/2,H*.72,24,CF.MOVE,'center',900);});
  if(ph>=2)cfPill(ctx,'자석의 극을 바꾸면 → 반대',W*.34,H*.8,24,CF.ans,'#FFF3E6');
  if(ph>=3)cfPill(ctx,'전류의 방향을 바꾸면 → 반대',W*.72,H*.8,24,CF.ans,'#FFF3E6');
  cfCap(o,ph>=4?'코일이 움직이는 방향 ← 자석(자기장)의 방향 · 전류의 방향':'가상 실험 결과(모식) — 파란 화살표 = 코일이 움직인 방향',ph>=4?CF.ans:CF.SUBT,H*.94);};};

/* ================= 코일은 왜 힘을 받을까? (빈칸 3: 전자석 · 끌어당기는 · 밀어 내는) ================= */
ANIMS.why=o=>{const st={ph:0,w:0};let ph0=-1,tph=0;cvHitInit(o);o.frame=()=>{const {ctx,W,H,t}=o;clear(o);cfBg(o);o._hits=[];const dt=cfTick(o),ph=o.phase;if(ph!==ph0){ph0=ph;tph=t;st.ph=0;st.w=0;}const pt=t-tph;
  const I=1,near=ph>=3?'S':'N',mx=ph>=2?Math.min(1,pt/1.2):0;
  const F=ph>=2?cfSwing(I,near).F*Math.pow(mx,3):0;cfPend(st,cfTilt(F),dt);
  const R=cfSwingRig(o,{I,near:ph>=2?near:null,mx,ph:st.ph,poles:ph>=1,label:false},[W*.1,H*.04,W*.84,H*.7]);
  if(ph>=1){const y=R.py-40;arrow(ctx,R.coil.x1+10,y,R.coil.x0-30,y,CF.fld,8,22);txt(ctx,'엄지손가락 → N극 쪽',R.coil.x0-40,y,24,CF.fld,'right',900);}   /* 오른손 엄지(코일 안 자기장) — 걸이 막대 위에 */
  if(ph>=2&&mx>=1){const dir=Math.sign(F);cfForce(ctx,R.cx-45*dir,H*.71,dir,90,'코일이 받는 힘');
    cfPill(ctx,dir>0?'S극(코일)과 N극(자석) — 서로 다른 극 → 끌어당김':'S극(코일)과 S극(자석) — 같은 극 → 밀어 냄',W/2,H*.82,24,CF.ans,'#FFF3E6');}
  if(ph>=2)cfReplay(o,W*.88,H*.1,()=>{tph=o.t;st.ph=0;st.w=0;});
  cfCap(o,['앞쪽 도선의 빨간 화살표 = 전류의 방향','전류가 흐르는 코일 = 전자석 — 양 끝에 N극과 S극(오른손으로 찾기)','자석의 N극을 가까이 → 코일의 S극과 마주 본다','자석의 S극을 가까이 → 코일의 S극과 마주 본다'][Math.min(3,ph)],ph?CF.ink:CF.SUBT,H*.94);};};

/* ================= 자기장·전류의 방향을 바꾸면 (빈칸 2: 반대 · 같은) ================= */
ANIMS.cases=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o);cfBg(o);cfTick(o);const ph=o.phase,b=D.SW_BASE_I,pw=(W-40)/2,ph2=(H*.84)/2;
  const C=[[b,'S','처음',0],[b,'N','자기장의 방향만 바꿈',1],[-b,'S','전류의 방향만 바꿈',1],[-b,'N','둘 다 바꿈',2]];   /* 교과서 그림 Ⅶ-17 과 같은 처음 상태: 코일 N극 ↔ 자석 S극(끌어당김) */
  C.forEach(([I,near,nm,need],j)=>{const bx=16+(j%2)*(pw+8),by=H*.03+Math.floor(j/2)*(ph2+6),show=ph>=need;const R=cfMini(o,[bx,by,pw,ph2],I,near,show,nm,{poles:show});
    if(show){const f=cfSwing(Math.sign(I),near).F;cfForce(ctx,bx+pw*.72,by+ph2*.88,Math.sign(f),60);txt(ctx,f>0?'끌어당김':'밀어 냄',bx+pw*.2,by+ph2*.88,24,CF.force,'center',900);}
    else{ctx.save();ctx.setLineDash([7,6]);ctx.strokeStyle='#8FA29D';ctx.lineWidth=3;ctx.strokeRect(bx+pw*.36,by+ph2*.8,pw*.28,40);ctx.restore();txt(ctx,'?',bx+pw/2,by+ph2*.8+21,28,CF.SUBT,'center',900);}});
  cfCap(o,ph>=2?'하나만 바꾸면 반대 · 둘 다 바꾸면 처음과 같다':ph>=1?'하나만 바꾸면 → 힘의 방향이 반대':'보라 = 코일이 받는 힘 · 파랑 = 코일이 움직이는 방향',ph?CF.ans:CF.SUBT,H*.95);};};

/* ================= 힘의 크기 (빈칸 2: 세기 · 자기장) ================= */
ANIMS.size=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o);cfBg(o);cfTick(o);const ph=o.phase,b=D.SW_BASE_I,pw=(W-40)/2,h2=(H*.84)/2;
  const rows=[[[b*cfLv(0),'전류 보통',1],[b*cfLv(1),'전류 셈',1]],[[b,'보통 자석',cfMg(0)],[b,'센 자석',cfMg(1)]]];
  rows.forEach((row,r)=>row.forEach(([I,nm,mag],j)=>{const bx=16+j*(pw+8),by=H*.03+r*(h2+6),show=ph>=r+1;
    ctx.save();rr(ctx,bx,by,pw,h2,14);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=CF.LINE;ctx.stroke();ctx.restore();
    const tilt=show?cfTilt(cfSwing(Math.sign(I),'N',mag).F*Math.abs(I)):0;const R=cfSwingRig(o,{I,near:'N',mx:1,ph:tilt,strong:mag>1,compact:true},[bx+6,by+h2*.14,pw-12,h2*.6]);
    txt(ctx,nm,bx+pw/2,by+24,24,CF.ink,'center',900);if(show){const dir=Math.sign(tilt);cfMove(ctx,R.cx-28*dir,R.cy+R.ry+26,dir,Math.abs(tilt)*420);}}));
  if(ph>=1)cfPill(ctx,'전류가 셀수록 → 더 크게',W*.5,H*.03+h2-14,24,CF.ans,'#FFF3E6');
  if(ph>=2)cfPill(ctx,'자기장이 셀수록 → 더 크게',W*.5,H*.03+2*h2-8,24,CF.ans,'#FFF3E6');
  cfCap(o,'크기는 숫자 없이 — 그네가 기울어진 정도로 비교(모식)',CF.SUBT,H*.95);};};

/* ================= 도전 : 코일은 어느 쪽으로? ================= */
const CFCH={S:null,pick:{},wrong:0,hints:0,round:1,total:0,solved:false,stars:0,msg:'',cls:'',

/* ================= 전동기의 원리 (빈칸 5: 상호작용 · 끌어당기는 · 정류자 · 밀어 내는 · 같은) ================= */
ANIMS.prin=o=>{const m=MOTOR.state({th:Math.PI/4});let ph0=-1,tph=0,flash=0;o.frame=()=>{const {ctx,W,H,t}=o;clear(o);cfBg(o);const dt=cfTick(o),ph=o.phase;if(ph!==ph0){ph0=ph;tph=t;if(ph<=2){m.th=Math.PI/4;m.w=0;}}const pt=t-tph;

  if(ph===2)th=(45-40*Math.min(1,pt/2.4))*D2R;            /* 끌어당김: 45° → 5° */
  else if(ph===3)th=(5-10*Math.min(1,pt/1.6))*D2R;        /* 정류자: 5° → −5°(반 바퀴 지점을 지남) */
  else if(ph===4)th=(-5-40*Math.min(1,pt/2.4))*D2R;       /* 밀어 냄: −5° → −45° */
  else if(ph>=5){if(Math.abs(m.w)<.1)m.w=-MOTOR.terminal({I:1,B:1});MOTOR.step(m,{I:1,B:1,comm:true,dir:1},dt*1.3);th=m.th;}

  const cx=W*.5,cy=H*.42,R=Math.min(W,H)*.23;cfStator(ctx,cx,cy,R,R*1.7);cfBrush(ctx,cx,cy,R*.86,on);cfRotor(ctx,cx,cy,R*.86,th,pole,on?1:0,{poles:on,hiComm:ph===3});
  if(ph>=2&&ph<=4){const L=R*.86*1.1,ux=Math.cos(th),uy=-Math.sin(th);const nEnd=pole>0?[cx+ux*L,cy+uy*L]:[cx-ux*L,cy-uy*L],sEnd=pole>0?[cx-ux*L,cy-uy*L]:[cx+ux*L,cy+uy*L];
    if(ph===2){arrow(ctx,nEnd[0],nEnd[1],cx+R*1.02,nEnd[1]+18,CF.force,6,18);arrow(ctx,sEnd[0],sEnd[1],cx-R*1.02,sEnd[1]-18,CF.force,6,18);cfPill(ctx,'끌어당김 — 코일 N극 ↔ 자석 S극',cx,H*.08,24,CF.force);}

  cfCap(o,['전류가 흐르지 않을 때 — 코일은 돌지 않는다','전류가 흐르면 코일이 전자석이 된다','① 끌어당기는 힘 → 코일이 돈다','② 반 바퀴쯤 — 정류자가 전류의 방향을 바꾼다','③ 밀어 내는 힘 → 같은 방향으로 계속 돈다','계속 같은 방향으로 회전 (모식)'][Math.min(5,ph)],ph?CF.ink:CF.SUBT,H*.95);};};

/* ================= 가상 실험 ② 전동기 실험실 (id: mo) ================= */

        {label:'예상: 정류자를 빼면(전류 방향이 그대로면)?',var:'q2'},{label:'② 정류자 없음',act:'e2',btn:'실험'},
        {label:'예상: 두 전선을 바꾸면 회전 방향은?',var:'q3'},{label:'③ 두 전선을 바꿈',act:'e3',btn:'실험'}],

         {id:'mg',label:'센 자석으로',onClick:sp=>{const d=sp.data;if(d.init){d.strong=!d.strong;if(d.cfg)d.cfg.B=d.strong?2:1;}}}],
  pace:1,compact:true,clickDriven:true,scale:{mode:'schematic',note:'전동기는 코일 하나·자석 한 쌍으로 그린 모식이고 빠르기는 숫자 없이 비교한다'},motion:true});
ANIMS.motorsim=o=>{cvHitInit(o);o.frame=()=>{const {ctx,W,H}=o;clear(o,false);o._hits=[];const sp=SPMO,d=sp.data,v=sp.v;

  const cfg=d.cfg||{comm:true,dir:1,I:0,B:1},on=d.run&&cfg.I;
  const cx=W*.55,cy=H*.42,R=Math.min(W*.24,H*.27);cfStator(ctx,cx,cy,R,R*1.7);if(d.strong)cfPill(ctx,'센 자석',cx-R*1.4,cy-R*.95-24,24,CF.ink);if(d.cfg&&d.cfg.I>1)cfPill(ctx,'전류 셈',cx+R*1.4,cy-R*.95-24,24,CF.cur);

/* ================= STAGE 3 : 스피커 (빈칸 1: 진동판) ================= */

  ctx.save();ctx.strokeStyle='#8FA29D';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x0+130*s,cy-210*s);ctx.lineTo(x0+130*s+290*s,cy-210*s);ctx.moveTo(x0+130*s,cy+210*s);ctx.lineTo(x0+130*s+290*s,cy+210*s);ctx.stroke();ctx.restore();

  if(k===4){ctx.fillStyle='#F4C33B';rr(ctx,-30,-6,60,24,6);ctx.fill();ctx.stroke();ctx.save();ctx.translate(10,-6);ctx.rotate(-.6+Math.sin(a)*.3);ctx.fillStyle='#8E9AA2';ctx.fillRect(0,-6,52,12);ctx.strokeRect(0,-6,52,12);ctx.restore();wheel(-18,24,10);wheel(18,24,10);}
  if(k===5){ctx.fillStyle='#E4ECEF';rr(ctx,-40,8,80,22,6);ctx.fill();ctx.stroke();ctx.save();ctx.translate(0,8);ctx.rotate(-1.2+Math.sin(a*1.3)*.25);ctx.fillStyle='#B9C2C8';ctx.fillRect(0,-5,46,10);ctx.strokeRect(0,-5,46,10);ctx.translate(46,0);ctx.rotate(1.6+Math.sin(a)*.2);ctx.fillRect(0,-4,34,8);ctx.strokeRect(0,-4,34,8);ctx.restore();}
  ctx.restore();}
ANIMS.uses=o=>{let a=0;o.frame=()=>{const {ctx,W,H}=o;clear(o);cfBg(o);const dt=cfTick(o),ph=o.phase;a+=dt*(ph>=1?2.4:0);
  const cols=3,cw=(W-60)/cols,chh=H*.38;D.MOTOR_USES.forEach((nm,i)=>{const cx=30+cw*(i%cols)+cw/2,cy=H*.06+chh*Math.floor(i/cols)+chh*.42;
    ctx.save();rr(ctx,cx-cw/2+8,cy-chh*.4,cw-16,chh*.86,14);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=ph>=1?CF.force:CF.LINE;ctx.stroke();ctx.restore();
    cfIcon(ctx,i,cx,cy-chh*.06,Math.min(cw,chh)/170,a);txt(ctx,nm,cx,cy+chh*.34,24,CF.ink,'center',900);
    if(ph>=1){ctx.save();ctx.beginPath();ctx.arc(cx+cw*.34,cy-chh*.26,18,0,PI2);ctx.fillStyle=CF.force;ctx.fill();ctx.restore();txt(ctx,'M',cx+cw*.34,cy-chh*.26+1,22,'#fff','center',900);}});
  cfCap(o,ph>=1?'보라 동그라미 = 전동기가 들어 있는 곳 — 회전·직선 운동을 만든다':'전기로 움직이는 장치들 — 공통으로 들어 있는 것은?',ph?CF.force:CF.SUBT,H*.95);};};

/* ================= 간이 전동기 (선택) ================= */
ANIMS.simple=o=>{const m=MOTOR.state({th:Math.PI/2,w:0});let tt=0;o.frame=()=>{const {ctx,W,H}=o;clear(o);cfBg(o);const dt=cfTick(o);tt+=dt;
  /* 반만 벗긴 끝: 반 바퀴는 전류가 흐르고(힘) 반 바퀴는 끊긴다(관성으로 돈다) — 정류자 대신. 코일 면을 옆에서 본 모습 */
  const on=Math.sin(m.th)>0;MOTOR.step(m,{I:on?1.6:0,B:1,comm:false,dir:1,fric:.02,b:.25},dt);qaState(o,{acc:m.acc});   /* 코일 N극이 위쪽 반일 때만 전류 → 늘 시계 방향 돌림힘 */
  const cx=W*.5,cy=H*.36,R=Math.min(W,H)*.17,sq=Math.abs(Math.cos(m.th));
  ctx.save();ctx.fillStyle='#55646A';ctx.strokeStyle='#33404A';ctx.lineWidth=3;rr(ctx,cx-R*1.3,cy+R*1.55,R*2.6,R*.45,10);ctx.fill();ctx.stroke();ctx.fillStyle='#8E9AA2';ctx.fillRect(cx-R*.9,cy+R*1.2,R*1.8,R*.35);ctx.strokeRect(cx-R*.9,cy+R*1.2,R*1.8,R*.35);ctx.restore();
  txt(ctx,'건전지 위 자석',cx,cy+R*2.35,24,CF.SUBT,'center',800);
  ctx.save();ctx.strokeStyle='#B07A10';ctx.lineWidth=6;[-1,1].forEach(k=>{ctx.beginPath();ctx.moveTo(cx+k*R*1.25,cy+R*1.55);ctx.lineTo(cx+k*R*1.25,cy);ctx.stroke();});ctx.restore();
  ctx.save();ctx.lineWidth=7;ctx.strokeStyle=on?CF.cu:'#B98A5E';ctx.beginPath();ctx.ellipse(cx,cy-R*(.12+.88*sq)*0,R,R*(.1+.9*sq),0,0,PI2);ctx.stroke();ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx-R*1.25,cy);ctx.lineTo(cx-R,cy);ctx.moveTo(cx+R,cy);ctx.lineTo(cx+R*1.25,cy);ctx.stroke();ctx.restore();   /* 가로 축(양옆 받침) 둘레로 도는 고리: 앞에서 보면 세로 폭이 바뀐다 */
  cfPill(ctx,on?'전류가 흐르는 반 바퀴 → 힘을 받는다':'벗기지 않은 반쪽 → 전류가 끊긴다(관성으로 돈다)',cx,H*.08,24,on?CF.force:CF.SUBT);
  cfCap(o,'에나멜선 한쪽 끝은 완전히, 다른 쪽은 반만 벗긴다 — 정류자 대신(모식)',CF.SUBT,H*.95);};};

/* ================= 도입 질문 풀기 ================= */
ANIMS.intro3=o=>{let a=0;const m=MOTOR.state({th:Math.PI/4});o.frame=()=>{const {ctx,W,H}=o;clear(o);cfBg(o);const dt=cfTick(o),ph=o.phase;MOTOR.step(m,{I:ph>=1?1:0,B:1,comm:true,dir:1},dt);a+=-m.w*dt;
  const cx=W*.32,cy=H*.42,R=Math.min(W,H)*.22;
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R*1.05,0,PI2);ctx.fillStyle='#EEF5F3';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#8FA29D';ctx.stroke();
  for(let i=0;i<3;i++){ctx.save();ctx.translate(cx,cy);ctx.rotate(a+i*PI2/3);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(R*.3,-R*.55,R*.95,-R*.42,R*.9,-R*.08);ctx.bezierCurveTo(R*.7,R*.08,R*.3,R*.05,0,0);ctx.fillStyle='#7FC7B8';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#33404A';ctx.stroke();ctx.restore();}
  ctx.beginPath();ctx.arc(cx,cy,R*.16,0,PI2);ctx.fillStyle='#55646A';ctx.fill();ctx.restore();
  const zx=W*.76,zy=H*.42,zr=Math.min(W*.2,H*.27);cfStator(ctx,zx,zy,zr*.5,zr*1.2);cfRotor(ctx,zx,zy,zr*.44,m.th,m.pole,ph>=1?1:0,{poles:ph>=1});
  txt(ctx,'몸통 속 전동기(모식)',zx,zy+zr*.85,24,CF.ans,'center',900);
  [['전류가 흐른다',1],['코일이 전자석이 되어 자석과 밀고 당긴다',2],['정류자 → 같은 방향으로 계속 회전 → 날개가 돈다',3]].forEach(([s,k],i)=>{if(ph>=k)cfPill(ctx,s,W*.5,H*.7+i*52,24,i===2?CF.force:CF.ink);});
  cfCap(o,ph>=3?'선풍기 속 전동기가 날개를 돌린다':'선풍기 안에 자석과 코일이 있는 까닭은?',ph>=3?CF.force:CF.SUBT,H*.95);};};

ANIMS.q4=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o,false);cfBg(o);const ph=o.phase,I=D.Q4_I;

const CF_HINTS=['앞쪽 도선의 빨간 화살표 쪽으로 오른손 네 손가락을 감아쥐면 엄지손가락 쪽이 코일의 N극이다.','자석을 마주 보는 코일 끝(오른쪽 끝)의 극을 먼저 정하자. 그 극과 자석의 극이 같은지 다른지 보자.','서로 다른 극 → 끌어당김, 같은 극 → 밀어 냄.'];
function chRender(){const root=document.querySelector('.slide.active .chbox');if(!root)return;const m=root.querySelector('[data-chmsg]');m.textContent=CFCH.msg;m.className='chmsg'+(CFCH.cls?' '+CFCH.cls:'');
  root.querySelectorAll('[data-chp]').forEach(b=>{b.classList.toggle('sel',CFCH.pick[+b.dataset.chp]===+b.dataset.v);b.disabled=CFCH.solved;});
  root.querySelector('[data-chstar]').textContent='★ 모은 별 '+CFCH.total+'개 · 도전 '+CFCH.round+'번째';root.querySelector('[data-chact="check"]').disabled=CFCH.solved;}
window.chRender=chRender;
function chCheck(){if([0,1,2].some(i=>CFCH.pick[i]==null)){CFCH.msg='A, B, C 모두 골라야 확인할 수 있어.';CFCH.cls='';return;}
  const bad=[0,1,2].filter(i=>CFCH.pick[i]!==cfChAns(i)).length;
  if(!bad){CFCH.solved=true;CFCH.stars=Math.max(1,3-CFCH.hints-CFCH.wrong);CFCH.total+=CFCH.stars;CFCH.cls='ok';CFCH.msg='정답! 별 '+CFCH.stars+'개. 코일의 극을 찾고 마주 보는 자석의 극과 비교하면 된다.';return;}
  CFCH.wrong++;CFCH.cls='bad';CFCH.msg='아직 맞지 않는 것이 '+bad+'개 있어. 오른손으로 코일의 N극부터 다시 찾아보자.';}
function chEnter(el){const root=el.querySelector('.chbox');if(!root)return;if(!CFCH.S)CFCH.shuffle();CFCH.reset();
  if(!root._b){root._b=1;stopAll(root);root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(e.detail>0)b.blur();
    if(b.dataset.chp!=null&&!CFCH.solved){CFCH.pick[+b.dataset.chp]=+b.dataset.v;}
    else if(b.dataset.chact==='check'&&!CFCH.solved)chCheck();
    else if(b.dataset.chact==='hint'&&!CFCH.solved){CFCH.msg='💡 '+CF_HINTS[Math.min(CFCH.hints,2)];CFCH.hints=Math.min(3,CFCH.hints+1);CFCH.cls='';}
    else if(b.dataset.chact==='new'){CFCH.round++;CFCH.shuffle();CFCH.reset();}
    chRender();});}
  chRender();}

  body:`<div class="panel"><div class="pt"><div>모둠별로 장치를 하나 골라 <b>구조</b>(자석·코일이 있는 곳)와 <b>원리</b>를 조사하고, 정보 그림 자료로 만들어 발표해 보자. 카드를 누르면 핵심이 보인다.</div></div></div>${DEVUI}`,
  enter(el){const r=el.querySelector('.cfdev');if(r&&!r._b){r._b=1;stopAll(r);r.addEventListener('click',e=>{const b=e.target.closest('[data-dev]');if(!b)return;if(e.detail>0)b.blur();b.classList.toggle('open');});}}});

TS({stageNo:3,chip:'세상과 이어 주는 과학',title:'움직이는 장치에는 무엇이 쓰일까?',tocName:'전동기가 쓰이는 곳',anim:'uses',max:1,note:NT.uses,tw:520,
  text:`<div class="panel glow">${LL(B.s3_use)}</div>${NOTE('※ 전동기가 바퀴를 돌려 차가 앞으로 나아가게 하거나 프로펠러를 돌린다.')}`});

TS({stageNo:3,chip:'과학 역량 기르기',title:'간이 전동기 만들기',tocName:'간이 전동기 만들기',anim:'simple',max:0,note:NT.simple,tw:520,
  text:`<div class="panel"><div class="pt"><div>누리망에서 간이 전동기를 만드는 방법을 찾아 준비물과 만드는 과정을 정리하고, 직접 만들어 회전하는 원리를 설명해 보자.</div></div></div>
   <div class="panel glow mfsm"><div class="pt"><div>에나멜선 코일의 한쪽 끝은 완전히, 다른 쪽 끝은 <b>반만</b> 벗기면 반 바퀴마다 전류가 끊긴다 — 정류자와 같은 역할을 한다.</div></div></div>`});

TS({stageNo:3,chip:'과학 가치·태도',title:'가전제품 속 전동기',tocName:'생각 넓히기 : 가전제품 속 전동기',anim:'uses',max:1,extra:1,note:NT.value,tw:560,
  text:`<div class="panel glow"><div class="pt"><div>${D.VALUE_Q}</div></div></div>${ASK('우리 집 세탁기·냉장고·<br>청소기 속에는?')}`});

TS({stageNo:3,chip:'도입 질문 풀기',title:'선풍기 안에 자석과 코일이 있는 까닭은?',tocName:'도입 질문 풀기',anim:'intro3',max:3,extra:3,note:NT.intro3,tw:560,
  text:`${STEPS('전류가 흐르면 코일이 <b>전자석</b>이 된다.')}${STEPS('코일과 자석이 서로 <b>밀고 당기는</b> 힘을 받는다.')}${STEPS('정류자 덕분에 코일이 <b>같은 방향으로 계속</b> 회전해 날개를 돌린다.')}`});

/* ================= 복습 (미션당 1장) ================= */
D.REVIEW.forEach((r,i)=>S({review:true,chip:'미션 '+'①②③'[i]+' 확인',title:r.title,tocName:'복습 '+'①②③'[i]+' '+r.title.split(': ')[1],
  body:`<div class="qnote" style="font-size:28px">미션 ${'①②③'[i]} ${D.MISSIONS[i]}</div><div class="panel">${LL(r.lines)}</div>`}));

/* ================= BOSS ================= */
QSA(1,D.Q1_Q,D.Q1,D.Q1_NOTE,220,null,{note:NT.q});
QSA(2,D.Q2_Q,D.Q2,D.Q2_NOTE,220,null,{note:NT.q});
QOX(3,D.Q3_Q,D.Q3,D.Q3_NOTE,{note:NT.q,hints:D.Q3_HINTS});
QT(4,'단답형 · ★ 도전',D.Q4_Q,`<div style="display:flex;gap:18px;align-items:center"><div style="flex:0 0 640px"><div class="fig" style="height:470px;flex:none"><canvas data-a="q4"></canvas></div></div>
  <div class="qlist" style="flex:1;min-width:0">${D.Q4.map(([t,an],i)=>`<div class="qitem"><span class="mk">(${i+1})</span><span class="txt">${t}</span><span class="bl" style="margin-left:auto;min-width:110px;text-align:center">${an}</span></div>`).join('')}</div></div>`,D.Q4_NOTE,{note:NT.q,step:syncA('q4',3)});
QD(5,D.Q5_Q,D.Q5_MODEL,D.Q5_KEYS,null,{sub:'서술형 · ★ 도전',note:NT.q});

S({ch:'E',chName:'마무리',chip:'스스로 점검',title:'오늘 배운 내용을 점검해 보자',tocName:'스스로 점검',
  body:`<div class="panel glow">${D.SELF_CHECK.map(t=>`<div class="step" style="font-size:32px;font-weight:700;margin:12px 0">☐ &nbsp;${t}</div>`).join('')}</div>
   <div class="bubbleRow"><img class="mascot" src="${CF_MASCOT}" alt="탐이"><div class="bubble">모두 체크했다면 오늘 수업 성공!<br>우리 집 전동기를 찾아보자.</div></div>`});

/* 선택 표시 */
['[도전] 코일은 어느 쪽으로?','간이 전동기 만들기','생각 넓히기 : 가전제품 속 전동기'].forEach(n=>{const d=SLIDES.find(x=>x.tocName===n);if(d){d.chip=(d.chip||'').replace(/ · 선택$/,'')+' · 선택';d.tocName=n+' (선택)';}});

/* ---------- 시작 (자동 추가 — 단원 파일에 쓰지 않는다) ---------- */
assignStages();buildDeck();fit();setMode(/self/i.test(location.hash),true);go(0,0);
</script></body></html>
