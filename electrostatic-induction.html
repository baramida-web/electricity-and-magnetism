/* 도전 활동 '비밀 막대의 정체' 상태 (anims.js 의 ANIMS.chal 과 slides.js 의 조작부가 함께 쓴다)
   types[i] = 막대 i 의 정체: −1 (−)대전체 · +1 (+)대전체 · 0 전하를 띠지 않음.  새 문제마다 무작위로 섞는다. */
const CH={types:[-1,1,0],sel:-1,ans:[null,null,null],res:[null,null,null],wrong:0,hints:0,round:1,total:0,solved:false,stars:0,msg:'',cls:'',
  shuffle(){const prev=this.types.join();let a;do{a=[-1,1,0];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}}while(a.join()===prev);this.types=a;},
  reset(){this.sel=-1;this.ans=[null,null,null];this.res=[null,null,null];this.wrong=0;this.hints=0;this.solved=false;this.stars=0;this.msg='막대를 하나씩 금속 구에 가까이 가져가 보자. 금속 구는 어떻게 될까?';this.cls='';}};
function starShape(ctx,x,y,r,col){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#B4540F';ctx.stroke();}

/* 애니메이션: ANIMS.이름 = o => { o.frame = () => {…} }.  o.phase = 현재 단계(빈칸 공개 수), P(o,k,초) = 단계 진행도.  한 번 누르는 것(빈칸 하나) = 한 단계 */
const sm=x=>x<0?0:x>1?1:x*x*(3-2*x);
const NEARC=(p)=>p>0?C_POS:C_NEG;

/* ---------- 문고리 장면 (표지·STAGE 1·STAGE 4 공통) ----------
   ap: 손이 다가간 정도 0~1 · spark: 방전 불꽃(표지·STAGE 1에서만 — 찌릿한 느낌 그 자체) · hq: 손의 (−)전하 수 · mC: 문고리 속(확대) 전자가 쏠린 줄 수(−1이면 확대 원 없음) */
function knobScene(o,s){
  const {ctx,W,H,t}=o,k=Math.min(W/760,H/640)*(s.big||1.45),dx=s.dx||0,tc=s.dark?'#DCE8E5':TH.sub;
  const doorW=W*.20,doorX=W*.78+dx,kx=doorX,ky=H*(s.ky||.46),r=38*k;
  ctx.fillStyle='#E6EBEF';rr(ctx,doorX,H*.04,doorW,H*(s.doorH||.80),14);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#8FA29D';ctx.stroke();
  ctx.fillStyle='#F4F7F9';rr(ctx,doorX+14,H*.04+14,doorW-28,H*(s.doorH||.80)-28,10);ctx.fill();
  ctx.fillStyle='#CBD5DC';rr(ctx,kx-14*k,ky-11*k,34*k,22*k,8);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=I_METAL;ctx.stroke();
  metalBall(ctx,kx-r*.9,ky,r);
  txt(ctx,'금속 문고리',doorX+doorW/2,ky-r-34,24,'#34423F','center',800);
  // 손(소매 → 팔 → 손바닥 → 손가락 · 엄지): ap 로 다가온다.  tip = 가운뎃손가락 끝
  const tip=lerp(W*.20,kx-r*1.9-(s.gap||0),s.ap),hy=ky,hs=k*.78,bx=kx-r*.9;
  // ① 손의 (−)가 가까워지면 문고리 속 전자가 먼 쪽으로 밀려나 가까운 쪽에 (+), 먼 쪽에 (−)가 유도된다(정전기 유도). 방전(불꽃) 뒤에는 유도된 전하가 사라진다
  const ind=s.discharged?0:(s.ind==null?sm((s.ap-.3)/.7):s.ind);
  // 처음(손이 멀 때)에도 문고리는 (+)와 (−)가 같은 수로 번갈아 있는 중성이다.
  // 손의 (−)가 가까워지면 자유 전자 전체가 (돌지 않고) 손의 반대쪽(오른쪽)으로 조금 밀려 가고, (+)(원자핵)는 제자리에 있다 → 왼쪽(가까운 쪽)에 (+), 오른쪽(먼 쪽)에 (−)가 드러난다. 전자 기호는 (+)보다 작게(모식)
  {const rr0=r*.55,lim=r*.8;
   for(let i=0;i<6;i++){const a0=i*Math.PI/3;chg(ctx,bx+Math.cos(a0)*rr0,ky+Math.sin(a0)*rr0,1,r*.24);}
   for(let i=0;i<6;i++){const a0=Math.PI/6+i*Math.PI/3;let ex=Math.cos(a0)*rr0+r*.32*ind,ey=Math.sin(a0)*rr0;const d=Math.hypot(ex,ey);if(d>lim){ex*=lim/d;ey*=lim/d;}
     chg(ctx,bx+ex,ky+ey,-1,r*.24);}}
  reachHand(ctx,tip,hy,hs);
  const nq=s.discharged?(s.hqAfter||9):(s.hq||0);
  if(nq>0){for(let i=0;i<nq&&i<reachHand.back.length;i++){const q=reachHand.back[i];chg(ctx,tip+q[0]*hs,hy+q[1]*hs,-1,16*hs);}}
  if(s.label!==false)txt(ctx,'손',tip-60*hs,hy-96*hs,24,tc,'center',800);
  // ② 닿기 직전: 손끝과 문고리 사이 '공기'를 (−)가 뛰어넘는 방전(불꽃) — 닿아서 흐르는 것이 아니다
  if(s.spark){const f=Math.sin(t*38)>-.2,sx=tip+10*hs,ex=bx-r-2,sy=hy,p=s.sp==null?(t*3)%1:s.sp;
    if(f){ctx.save();ctx.strokeStyle='#F2B33D';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#F2B33D';ctx.shadowBlur=18;
      ctx.beginPath();ctx.moveTo(sx,sy);const n=5;for(let i=1;i<=n;i++){ctx.lineTo(lerp(sx,ex,i/n),sy+(i<n?(i%2?-1:1)*9*k:0));}ctx.stroke();ctx.restore();}
    for(let i=0;i<3;i++){const q=(p+i/3)%1;chg(ctx,lerp(sx,ex,q),sy+Math.sin(q*9+i)*5*k,-1,r*.26);}}
  return {tip,hy,kx,ky,r,k,bx:kx-r*.9};
}

/* 문고리 장면의 단계 설명: 가까워짐(정전기 유도) → 닿기 직전 공기 중 방전 → 전하 중화 */
function knobCap(ctx,x,y,u,uS,uE,col){const m=u<uS?'① 정전기 유도: 가까운 쪽 (+), 먼 쪽 (−)':(u<uE?'② 닿기 직전 공기 중 방전 (따끔!)':'③ 방전 뒤: 손의 전하↓ · 유도 전하 사라짐');
  txt(ctx,m,x,y,25,col,'center',800);}
/* ---------- 표지: 손으로 금속 문고리를 잡으려는 순간 ‘따끔!’ (오늘의 질문) ---------- */
ANIMS.cover=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);
    const u=t%8,ap=sm(u/3.2),spark=u>3.2&&u<4.6;
    const g=knobScene(o,{ap,spark,discharged:u>=4.6&&u<6.6,hq:ap>.1?16:0,hqAfter:9,gap:34,dark:true,ky:.40});
    if(spark)pill(ctx,'앗, 따끔!',W*.40,H*.18,40,'#C0392B');
    if(u>5.2&&u<8){ctx.save();ctx.globalAlpha=sm((u-5.2)/.8);pill(ctx,'손과 문고리 사이에 무슨 일이?',W*.37,H*.70,28,'#1F7A6C');ctx.restore();}
    knobCap(ctx,W*.42,H*.82,u,3.2,4.6,'#F2D7A0');
    legend(ctx,W*.16,H-24);
    txt(ctx,'※ 전하는 손뿐 아니라 몸 표면에 퍼져 있다 (부호·수는 모식)',W*.42,H-60,22,'#B9C9C5','center',700);
  };
};

/* ---------- STAGE 1 (빈칸 1개: 정전기) : 손이 문고리에 다가간다 — 손에 머물러 있던 전하 ---------- */
ANIMS.knob=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const u=(t%9),ap=sm(Math.min(1,u/3)),spark=u>3&&u<4.2,a=P(o,1,.8);
    knobScene(o,{ap,spark,discharged:u>=4.2&&u<7.5,hq:16,hqAfter:9,gap:34,ky:.40});
    if(spark)pill(ctx,'앗, 따끔!',W*.40,H*.17,38,'#C0392B');
    knobCap(ctx,W*.45,H*.71,u,3,4.2,TH.sub);
    if(a<=0)txt(ctx,'손과 문고리 사이에 어떤 일이 일어났을까?',W*.45,H*.80,28,TH.ink,'center',800);
    else{ctx.save();ctx.globalAlpha=a;pill(ctx,'손에 머물러 있던 전하 = 정전기',W*.45,H*.80,32,C_POS);ctx.restore();
      txt(ctx,'전선을 따라 흐르지 않고 한곳에 머물러 있는 전기',W*.45,H*.89,24,TH.sub,'center',700);}
    txt(ctx,'※ 전하는 손뿐 아니라 몸 표면에 퍼져 있다 (부호·수는 모식)',W*.45,H-18,22,TH.sub,'center',700);
  };
};

/* ---------- 정전기 유도 장면 (STAGE 3 · STAGE 4) ----------
   cfg.kind: 'minus' 빨대 / 'plus' 유리 막대.  cfg.move: 전자가 이동하는 단계 · cfg.near/far: 가까운/먼 쪽 이름표가 나오는 단계 · cfg.force: 끌려 오는 단계
   cfg.def: 정의 슬라이드(이동이 끝난 모습에서 시작). 막대 끝까지의 거리 D, 이동 줄 수 mC 는 모식 값이다. */
function induceAnim(cfg){return o=>{
  const S={mv:IND.mover(IL),th:0,D:cfg.def?2.4:2.4,lt:null};if(cfg.def)S.mv.settle(3,cfg.kind==='plus'?-1:1);
  const kind=cfg.kind,dir=kind==='plus'?-1:1,nearSign=kind==='plus'?-1:1;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const dt=S.lt==null?0:Math.min(.05,t-S.lt);S.lt=t;
    const ph=o.phase,movOn=cfg.def||ph>=cfg.move,forceOn=!cfg.def&&cfg.force&&ph>=cfg.force;
    S.mv.step(dt*(movOn&&ph===cfg.move&&!cfg.def?1:1.6),movOn?3:0,dir);   // 모든 줄이 동시에, 전자마다 다른 때에 이동(천천히)
    const Dt=forceOn?1.9:2.4;S.D+=(Dt-S.D)*Math.min(1,dt*2.5);
    const e=IND.pend(S.D,1),tht=forceOn?e.theta:0;S.th+=(tht-S.th)*Math.min(1,dt*3);
    const G=indReal(o,{kind,D:S.D,theta:S.th,E:3,top:H*.045,sx:W*.73});
    const R=Math.min(W*.15,H*.17),zx=W*.50,zy=H*.585;
    zoomLines(ctx,G.bx,G.by,G.u,zx,zy,R);
    sphereDisc(ctx,zx,zy,R,dir,0,{mv:S.mv});
    bodyStub(ctx,zx,zy,R,kind,3,t,G.u);
    txt(ctx,'금속 구 속',zx+R+14,zy-R*.62,24,TH.sub,'left',800);txt(ctx,'(확대)',zx+R+14,zy-R*.62+28,24,TH.sub,'left',800);
    const done=S.mv.amount()>2.6;
    if(cfg.def){
      zonePills(ctx,zx,zy,R,nearSign,ph>=1,ph>=2,'다른 종류','같은 종류');
      if(ph>=3){pill(ctx,'정전기 유도',zx,zy+R+46,34,TH.curve);}
    }else{
      zonePills(ctx,zx,zy,R,nearSign,ph>=cfg.near&&done,ph>=cfg.far&&done);
      if(ph>=1&&!movOn){      // 이동 전: 전자가 받는 힘의 방향 (대전체에서 멀어지는 쪽)
        const ay=zy+R+34;arrow(ctx,zx-dir*R*.6,ay,zx+dir*R*.6,ay,'#C0392B',8,18);txt(ctx,'전자가 받는 힘 — 대전체에서 멀어지는 쪽',zx,ay+34,24,'#C0392B','center',800);}
    }
    if(forceOn){const F=iF(1,Math.hypot(S.D-IND.DEF.L*Math.sin(S.th),IND.DEF.L*(1-Math.cos(S.th))));indForce(o,G,F.F,'구가 받는 전기력');}
    const cap=cfg.def?'':(ph===0?'처음: 금속 구 속의 (+)와 (−)는 같은 수 — 중성':(forceOn?'금속 구와 막대 사이에 끌어당기는 전기력이 작용한다':(done?'가까운 쪽과 먼 쪽이 서로 다른 전하를 띤다':(kind==='plus'?'전자가 (+)대전체 쪽으로 이동한다':'전자가 (−)대전체에서 먼 쪽으로 이동한다'))));
    if(cap)txt(ctx,cap,zx,H*.845,26,TH.ink,'center',800);
    legend(ctx,zx-140,H-44);
    txt(ctx,'※ 전하의 수·이동한 줄 수·거리는 모식',zx,H-16,22,TH.sub,'center',700);
  };
};}
ANIMS.induce=induceAnim({kind:'minus',move:1,near:3,far:4,force:5});       // 빈칸 순서: 전자 · 먼 · (+) · (−) + 끌려 옴
ANIMS.induce_def=induceAnim({kind:'minus',def:true});                      // 다른 · 같은 · 정전기 유도
ANIMS.induce_plus=induceAnim({kind:'plus',move:1,near:2,far:3,force:4});   // 가까운 · (−) · (+) + 끌려 옴

/* ---------- STAGE 4 : 문고리를 다시 생각해 보기 (찌릿함 없이 — 손이 가까워질 때 문고리 속) ---------- */
ANIMS.knob2=o=>{
  const S={mv:IND.mover(IL),lt:null};
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const dt=S.lt==null?0:Math.min(.05,t-S.lt);S.lt=t;const ph=o.phase;
    S.mv.step(dt*1.6,ph>=1?3:0,1);
    const g=knobScene(o,{ap:.78,hq:16,gap:30,ky:.46,doorH:.62,big:1.3});
    const R=Math.min(W*.13,H*.14),zx=W*.52,zy=H*.725;
    zoomLines(ctx,g.bx,g.ky,g.r,zx,zy,R);
    sphereDisc(ctx,zx,zy,R,1,0,{mv:S.mv});
    txt(ctx,'문고리 속',zx+R+14,zy-R*.62,24,TH.sub,'left',800);txt(ctx,'(확대)',zx+R+14,zy-R*.62+28,24,TH.sub,'left',800);
    const done=S.mv.amount()>2.6;
    if(ph>=1)zonePills(ctx,zx,zy,R,1,done,done,null,null,{capN:'손과 가까운 쪽',capF:'먼 쪽'});
    if(ph>=2){const a=sm(P(o,2,.8)),len=100*a,y1=g.ky-g.r*3.0;ctx.save();ctx.globalAlpha=a;ctx.lineJoin='round';
      ctx.setLineDash([4,5]);ctx.strokeStyle=I_GREEN;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(g.bx,g.ky-g.r-3);ctx.lineTo(g.bx,y1);ctx.stroke();ctx.setLineDash([]);
      arrow(ctx,g.bx,y1,g.bx-len,y1,I_GREEN,9,20);ctx.restore();
      txt(ctx,'문고리가 받는 전기력',g.bx+10,y1-30,26,I_GREEN,'right',900);}
    txt(ctx,ph===0?'손(대전체)이 문고리에 가까이 다가간다':(ph===1?'문고리 속 전자가 손에서 먼 쪽으로 이동한다':'손과 문고리 사이에 끌어당기는 전기력이 작용한다'),W*.5,H*.925,26,TH.ink,'center',800);
    txt(ctx,'※ 손이 띤 전하는 손뿐 아니라 몸 표면에 퍼져 있다 (부호·수는 모식)',W*.5,H-14,22,TH.sub,'center',700);
  };
};

/* ---------- 선택: 비행기가 번개를 맞으면 (교과서 ‘세상과 이어 주는 과학’) ---------- */
ANIMS.plane=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const u=t%7,k=Math.min(W/760,H/560)*.8,cx=W*.5,cy=H*.5;
    ctx.save();ctx.translate(cx,cy);ctx.scale(k,k);
    ctx.fillStyle='#E8EEF2';ctx.strokeStyle='#6F818C';ctx.lineWidth=5;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(-250,0);ctx.quadraticCurveTo(-240,-52,-130,-56);ctx.lineTo(180,-50);ctx.quadraticCurveTo(250,-44,280,-12);ctx.lineTo(280,12);ctx.quadraticCurveTo(250,40,180,44);ctx.lineTo(-130,54);ctx.quadraticCurveTo(-240,50,-250,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-120,-56);ctx.lineTo(-30,-170);ctx.lineTo(10,-170);ctx.lineTo(-30,-56);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-120,54);ctx.lineTo(-30,170);ctx.lineTo(10,170);ctx.lineTo(-30,54);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(190,-48);ctx.lineTo(250,-110);ctx.lineTo(268,-110);ctx.lineTo(240,-42);ctx.fill();ctx.stroke();
    ctx.fillStyle='#BFD9E8';[-170,-120,-70,-20,30,80,130].forEach(x=>{rr(ctx,x,-26,30,22,6);ctx.fill();});
    ctx.restore();
    const hit=u>1.4&&u<2.2,flow=sm((u-2.2)/2.2);
    if(u>.6&&u<2.2){ctx.save();ctx.strokeStyle='#F2B33D';ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#F2B33D';ctx.shadowBlur=20;const nx=cx-250*k,ny=cy;
      const b=sm((u-.6)/.8);ctx.beginPath();ctx.moveTo(nx-130*k,ny-H*.45);ctx.lineTo(nx-90*k+b*0,ny-H*.33);ctx.lineTo(nx-110*k,ny-H*.25);ctx.lineTo(nx-30*k,ny-H*.12*b);ctx.lineTo(nx-6*k,ny-6*k);ctx.stroke();ctx.restore();}
    if(u>2.2&&u<6.6){ctx.save();ctx.fillStyle='#F2B33D';for(let i=0;i<9;i++){const f=(flow*1.1+i/9)%1,x=cx+(-250+530*f)*k,y=cy-52*k*(1-Math.abs(f-.5)*.2);ctx.beginPath();ctx.arc(x,y,7*k,0,PI2);ctx.fill();}ctx.restore();
      txt(ctx,'전류가 기체 표면을 따라 흐른다',W*.5,H*.10,26,'#B4540F','center',800);}
    if(u>4.6&&u<6.8){const a=sm((u-4.6)/.8);ctx.save();ctx.globalAlpha=a;pill(ctx,'날개 끝 정전기 방출기로 전하가 공기 중으로 흩어진다',cx,H*.9,28,'#1F7A6C');ctx.restore();}
    // 날개 끝 정전기 방출기(static discharger): 끝이 뾰족한 가는 심지 — 뾰족한 끝에서는 전하가 좁은 곳에 몰려 주변 공기로 조금씩 새어 나간다(코로나 방전)
    const tips=[[-30,-172,-.35],[-30,172,.35],[262,-112,-.75]];   // [x,y,바깥 방향(rad, 위쪽이 −)] — 모식
    tips.forEach(([tx,ty,ang],ti)=>{const px=cx+tx*k,py=cy+ty*k;
      const ux=-.35,uy=ty<0?-1:1,ex=ti===2?.55:ux,ey=ti===2?-1:uy,el=Math.hypot(ex,ey),nx=ex/el,ny=ey/el;
      ctx.save();ctx.strokeStyle='#4A5B66';ctx.lineWidth=5*k+1;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+nx*26*k,py+ny*26*k);ctx.stroke();ctx.restore();   // 심지
      if(u>2.6&&u<6.8){const on=sm((u-2.6)/1.2),a0=px+nx*26*k,b0=py+ny*26*k;
        for(let i=0;i<6;i++){const f=((t*.55+i/6+ti*.13)%1),sx=Math.sin(i*2.7+ti)*.9,x=a0+(nx+sx*ny)*f*58*k,y=b0+(ny-sx*nx)*f*58*k;
          ctx.save();ctx.globalAlpha=on*(1-f)*.95;chg(ctx,x,y,-1,13*k+3);ctx.restore();}}});
    if(u>3.2&&u<6.8){txt(ctx,'정전기 방출기(날개 끝)',cx-30*k-34,cy-172*k-16*k,22,'#1F7A6C','right',800);}
    txt(ctx,'※ 모식도 (기체·번개의 크기와 모양은 실제와 다름)',cx,H-14,22,TH.sub,'center',700);
  };
};

/* ---------- 선택: 풍선으로 종이 인형 세우기 (교과서 ‘과학 문화 향유’) ----------
   풍선(−)이 움직이면 종이 인형이 풍선 쪽으로 끌려 일어서고, 풍선이 이리저리 움직이면 인형의 머리도 풍선을 따라 기울어진다. 풍선이 멀어지면 도로 눕는다. 풍선이 어느 거리 안으로 가까워졌을 때에만 끌린다(그 밖에서는 가만히 있는다).
   인형은 발이 책상에 붙어 있고, 풍선 쪽으로 향하는 정도(끌림)는 풍선과의 거리로 정한다(모식). 인형은 풍선보다 조금 늦게 따라온다(스프링). */
ANIMS.doll=o=>{
  const S={e:0,lt:null};
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=S.lt==null?0:Math.min(.05,t-S.lt);S.lt=t;
    const k=Math.min(W/760,H/560),gx=W*.20,gy=H*.84,L=230*k,bw=44*k,hr=bw*.55,u=t%12,rx=62*k,ry=76*k;
    // 풍선의 움직임: 멀리서 천천히 다가와(0~4초) → 인형 바로 위에서 오가고(4~9초) → 멀어진다(9~12초)
    const far={x:W*.84,y:gy-L*1.5},mid={x:gx+L*.62,y:gy-L*.8};
    let bx,by;
    if(u<4){const f=sm(u/4);bx=lerp(far.x,mid.x,f);by=lerp(far.y,mid.y,f);}
    else if(u<9){const f=(u-4)/5;bx=mid.x+Math.sin(f*Math.PI*2)*L*.42;by=mid.y+Math.sin(f*Math.PI*2)*L*.05;}
    else{const f=sm((u-9)/3);bx=lerp(mid.x,far.x,f);by=lerp(mid.y,far.y,f);}
    by+=Math.sin(t*2.1)*4*k;                                               // 풍선이 살짝 흔들린다
    // 끌림: 풍선 아랫면과 (지금 모습의) 종이 인형 사이의 '틈'이 좁아질 때에만 생긴다.
    // 분극에 의한 힘은 거리가 늘면 급격히 약해지므로(모식) 인형 길이의 약 절반보다 가까워져야 움직이기 시작한다.
    const bx0=gx,by0=gy-bw/2,hx=gx+(L+hr)*Math.cos(S.e),hy=gy-bw/2-(L+hr)*Math.sin(S.e);
    const tt=Math.max(0,Math.min(1,((bx-bx0)*(hx-bx0)+(by-by0)*(hy-by0))/((hx-bx0)**2+(hy-by0)**2))),
          dseg=Math.hypot(bx-(bx0+(hx-bx0)*tt),by-(by0+(hy-by0)*tt)),gap=dseg-ry,
          att=sm((L*.55-gap)/(L*.3)),ang=Math.atan2(gy-by,bx-gx);
    let target=att*Math.min(ang,Math.PI*.46);                               // 풍선 쪽으로 향하는 각도(풍선과 겹치지 않게 줄인다)
    const sl=36*k,okGap=(e)=>{                                              // 인형(몸통·머리)이 풍선·실과 겹치지 않는지 — 2차원 그림이므로 틈을 확실히 남긴다
      const ca=Math.cos(e),sa=Math.sin(e);
      for(let i=0;i<=10;i++){const d=(L+hr)*i/10,px=gx+d*ca,py=gy-bw/2-d*sa,rad=i==10?hr:bw/2;
        if(Math.hypot(bx-px,by-py)<ry+rad+30*k)return false;
        if(Math.hypot(bx-px,by+ry+sl-py)<rad+20*k)return false;}
      return true;};
    for(let n=0;n<80&&target>0&&!okGap(target);n++)target-=.03;
    S.e+=(Math.max(0,target)-S.e)*Math.min(1,dt*3.2);
    for(let n=0;n<80&&S.e>0&&!okGap(S.e);n++)S.e=Math.max(0,S.e-.03);
    // 책상
    ctx.fillStyle='#C9B79A';rr(ctx,W*.06,gy,W*.88,18,6);ctx.fill();
    // 종이 인형: 발(왼쪽 아래)이 책상에 붙어 있고, 풍선 쪽으로 일어선다
    ctx.save();ctx.translate(gx,gy);ctx.rotate(-S.e);ctx.lineJoin='round';
    ctx.fillStyle='#FFF5D6';ctx.strokeStyle='#B79A5B';ctx.lineWidth=4;rr(ctx,0,-bw,L,bw,8);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(L+bw*.55,-bw/2,bw*.55,0,PI2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#4A5A58';[-1,1].forEach(q=>{ctx.beginPath();ctx.arc(L+bw*.7,-bw/2+q*bw*.17,3.2*k,0,PI2);ctx.fill();});
    ctx.restore();
    // 풍선(−): 머리카락 등으로 문지른 뒤 움직인다
    ctx.strokeStyle='#8A8F8E';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by+ry+16*k);ctx.quadraticCurveTo(bx+Math.sin(t*1.7)*5*k,by+ry+26*k,bx,by+ry+36*k);ctx.stroke();
    ctx.fillStyle='#F28BA0';ctx.strokeStyle='#C45D75';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(bx,by,rx,ry,0,0,PI2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx,by+ry);ctx.lineTo(bx-8*k,by+ry+16*k);ctx.lineTo(bx+8*k,by+ry+16*k);ctx.closePath();ctx.fill();
    [[-26,-30],[10,-40],[28,-6],[-18,12],[6,34],[-34,34],[30,32]].forEach(([x,y])=>chg(ctx,bx+x*k,by+y*k,-1,9*k+1));
    txt(ctx,'풍선',bx,by-ry-56*k-6,26,C_NEG,'center',900);txt(ctx,'(문질러서 (−)전하를 띰)',bx,by-ry-26*k,22,C_NEG,'center',800);
    pill(ctx,S.e>.12?'풍선이 닿지 않아도 종이 인형이 끌려 일어선다':(u<9?'풍선이 종이 인형에 천천히 다가간다':'풍선이 멀어지면 인형은 도로 눕는다'),W*.5,H*.915,28,'#1F7A6C');
    txt(ctx,'※ 모식도',W*.5,H-12,22,TH.sub,'center',700);
  };
};

/* ================= 시뮬레이션 ① 금속 구 가상 실험 (id: ex) — 교과서 ‘해 보기’를 모식 시뮬레이션으로 대신한다 =================
   순서: 1 예상 고르기 → 2 문지르지 않은 빨대를 가까이(움직임 없음) → 3 털가죽으로 문지르기(맞닿은 면 확대: 전자가 빨대로 이동) → 4 문지른 빨대를 가까이(금속 구가 끌려 온다).
   · 문지르지 않은 빨대와 금속 구 사이의 힘은 0 으로 두었다(교과서 밖: 실제로는 아주 약한 힘이 있을 수 있다 — 교사 메모). 중성인 금속 구도 대전체에 끌린다는 것이 이 단원의 핵심이다.
   · 이동하는 전자 수(3개), 구가 움직이는 거리·각도, 거리 눈금은 모식 값이다. 구는 빨대에 닿기 직전(간격 rmin)에서 멈춘다(실제로는 일정 거리보다 가까워지면 순식간에 끌려 붙는다). */
const EX_A=[.4,1.2,2.0],EX_END=4.4;
const SPX=SIMSPEC.define({id:'ex',
  vars:[{id:'pred',label:'예상',choice:[[-1,'모름'],[0,'안 움직임'],[1,'끌려 옴'],[2,'밀려 남']],def:-1},
        {id:'near',label:'가까이 가져가기',min:0,max:10,step:1,def:0,stepper:true,stepLabels:['멀리','가까이'],fmt:v=>'가까이 '+v+' / 10',
         onChange:(v,sp)=>{const D=sp.data;if(D.init&&D.stage!==1)D.appT=v/10;}}],
  reads:[{id:'mv',label:'금속 구의 움직임'},{id:'cmp',label:'예상과 비교'},{id:'F',label:'전기력의 상대 크기(모식)',digits:2,beyond:true}],
  flow:[{label:'예상: 문지른 빨대를 가까이 가져가면?',var:'pred'},
        {label:'문지르지 않은 빨대 가까이',act:'near0',btn:'가까이 가져가기'},
        {label:'털가죽으로 빨대 문지르기',act:'rub',btn:'문지르기'},
        {label:'문지른 빨대 가까이',var:'near'}],
  extra:[{id:'near0',label:'가까이 가져가기',onClick:sp=>{const D=sp.data;if(D.init&&D.stage===0){D.appT=D.appT>.5?0:1;}}},
         {id:'rub',label:'문지르기',onClick:sp=>{const D=sp.data;if(D.init&&D.stage===0){D.stage=1;D.tm=0;D.ia=0;D.appT=0;sp.set('near',0,true);}}}],
  pace:.5,compact:true,
  scale:{mode:'schematic',note:'기울어진 각도·거리·전하 수는 비율 없이 그린 모식도'},motion:true});
ANIMS.sim_ex=o=>{
  if(!o.cv._bound){o.cv._bound=1;o.cv.style.touchAction='none';       // 빨대를 좌우로 끌어 가까이/멀리
    const pos=e=>{const b=o.cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*o.W,(e.clientY-b.top)/b.height*o.H];};
    o.cv.addEventListener('pointerdown',e=>{const D=SPX.data,h=D.hit;if(!D.init||D.stage===1||!h)return;const[x,y]=pos(e);if(x>h.x0&&x<h.x1&&Math.abs(y-h.y)<70){D.drag={x0:x,a0:D.appT};o.cv.setPointerCapture(e.pointerId);e.stopPropagation();}});
    o.cv.addEventListener('pointermove',e=>{const D=SPX.data;if(!D.init||!D.drag||!D.hit)return;const[x]=pos(e);const a=Math.max(0,Math.min(1,D.drag.a0+(x-D.drag.x0)/D.hit.trav));D.appT=a;SPX.set('near',Math.round(a*10),true);});
    const up=()=>{const D=SPX.data;if(D.init)D.drag=null;};o.cv.addEventListener('pointerup',up);o.cv.addEventListener('pointercancel',up);o.cv.addEventListener('click',e=>e.stopPropagation());}
  o.frame=()=>{const {ctx,W,H}=o;clear(o,false);
    let D=SPX.data;if(!D.init)Object.assign(D,{mv:IND.mover(IL),init:1,stage:0,tm:0,ia:0,fly:[],sa:0,app:0,appT:0,th:0,mC:0,tt:0,hit:null,drag:null,sig:''});
    const v=SPX.v,dt=SPX.dt(o.t);D.tt+=dt;const t=D.tt;
    if(D.stage===1){D.tm+=dt*1.3;
      while(D.ia<EX_A.length&&D.tm>=EX_A[D.ia]){D.fly.push({f:0,k:D.ia});D.ia++;}
      if(D.tm>=EX_END&&!D.fly.length){D.stage=2;D.appT=0;}}
    D.fly.forEach(f=>{f.f+=dt/.9;});D.fly=D.fly.filter(f=>{if(f.f>=1){D.sa++;return false;}return true;});
    D.app+=Math.max(-1,Math.min(1,(D.appT-D.app)*8))*dt/2.2;D.app=Math.max(0,Math.min(1,D.app));
    const Q=Math.min(1,D.sa/3),Dd=5-3*D.app,e=IND.pend(Dd,Q);
    D.th+=(e.theta-D.th)*Math.min(1,dt*6);
    const L=IND.DEF.L,uu=Math.min(W/36,H*.043),xs=L*Math.sin(D.th),ys=L*(1-Math.cos(D.th)),rr_=Math.hypot(Dd-xs,ys),F=iF(Q,rr_).F;
    const lvl=Q>0?IND.level(1,1,rr_,1.35):0;D.mv.step(dt*2.5,I_MMAX*Q*lvl,1);D.mC=D.mv.amount();
    // ---- 실제 장면 (위) ----
    const G=indReal(o,{kind:'minus',D:Dd,theta:D.th,E:D.sa,top:H*.085,sx:W*.73,hand:true});
    const u=G.u;D.hit={x0:G.x0,x1:G.tipx+10,y:G.sy,trav:3*u*1.2};
    o.cv.style.cursor=D.stage===1?'default':'ew-resize';
    if(!(D.stage===1&&D.tm<EX_END))txt(ctx,'빨대',G.tipx-u*7.5,G.sy+u*1.9,26,C_STRAW,'center',900);txt(ctx,'금속 구',G.bx+u+10,G.by,24,TH.sub,'left',800);
    // 털가죽: 문지르는 동안 빨대 위를 오간다 (다른 손이 오른쪽 위에서 털가죽을 쥔다)
    const onRub=D.stage===1&&D.tm<EX_END;
    if(onRub){const px=G.x0+u*3.6+(G.tipx-G.x0-u*7.4)*(.5-.5*Math.cos(D.tm/EX_END*Math.PI*6)),py=G.sy-u*.95-24;
      furPad(ctx,px,py,128,46);gripHand(ctx,px+44,py-4,.44*u/19,{flip:true,len:185});
      const pu=.5+.5*Math.sin(D.tt*6);ctx.save();ctx.shadowColor='#F2B33D';ctx.shadowBlur=14;ctx.strokeStyle='#F2B33D';ctx.lineWidth=5;ctx.globalAlpha=.6+.4*pu;ctx.beginPath();ctx.arc(px,G.sy,u*.95+4*pu,0,PI2);ctx.stroke();ctx.restore();
      D.px=px;}
    else if(D.stage===0){const fx=W*.13,fy=H*.40;furPad(ctx,fx,fy,110,44);txt(ctx,'털가죽',fx+86,fy+4,24,'#7A5230','left',900);}
    // 힘 화살표: 길이 ∝ 힘의 크기
    const flen=indForce(o,G,F,'구가 받는 전기력',SPX.beyond);
    // ---- 확대 원 (아래) ----
    const rdsH=SPX.readsHeight(24),readsTop=H-rdsH-30,bandT=G.sy+u+80,bandB=readsTop-84,R=Math.max(54,Math.min(W*.15,(bandB-bandT)/2)),zy=(bandT+bandB)/2;
    const z1=W*.27,z2=W*.70;
    if(D.stage>=1){contactZoom(ctx,z1,zy,R,t,{E:D.sa,fly:D.fly,shift:D.stage===1?Math.sin(D.tm*5):0,bot:'straw',compact:true});
      if(onRub){ctx.save();ctx.strokeStyle='#F2B33D';ctx.lineWidth=5;ctx.globalAlpha=.5+.4*Math.sin(D.tt*6);ctx.beginPath();ctx.arc(z1,zy,R+8,0,PI2);ctx.stroke();ctx.restore();zoomLines(ctx,D.px,G.sy,u*.9,z1,zy,R,'#F2B33D');}
      txt(ctx,'맞닿은 면 (확대)',z1,zy-R-26,24,onRub?'#B4540F':TH.sub,'center',onRub?900:800);
      if(D.sa>0&&!onRub){pill(ctx,'털가죽 (+)',z1+68,zy+R+30,22,C_POS);pill(ctx,'빨대 (−)',z1-68,zy+R+30,22,C_NEG);}}
    else{ctx.save();ctx.setLineDash([8,8]);ctx.strokeStyle=TH.axis;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(z1,zy,R,0,PI2);ctx.stroke();ctx.restore();
      txt(ctx,'문지르면 여기에',z1,zy-26,22,TH.sub,'center',700);txt(ctx,'확대한 모습이',z1,zy+2,22,TH.sub,'center',700);txt(ctx,'나타난다',z1,zy+30,22,TH.sub,'center',700);}
    zoomLines(ctx,G.bx,G.by,u,z2,zy,R);
    sphereDisc(ctx,z2,zy,R,1,0,{mv:D.mv});
    txt(ctx,'금속 구 속 (확대)',z2,zy+R+28,24,TH.sub,'center',800);
    const done=D.mC>2.2;zonePills(ctx,z2,zy,R,1,done,done);
    if(D.stage>=2&&D.mC>.3)txt(ctx,'전체 전하의 합 = 0',z2,zy+R+58,24,TH.ink,'center',800);
    if(onRub)txt(ctx,'털가죽의 전자(−)가 빨대로 옮겨 간다',z1,zy+R+30,22,'#B4540F','center',900);
    // 읽기
    const moved=L*Math.sin(D.th),mv=D.app<.5?(D.stage===0?'빨대를 가까이 가져가 보자':'문지른 빨대를 가까이 가져가 보자'):(Q===0?'움직이지 않는다':(moved>.15?'빨대 쪽으로 끌려 온다':'거의 움직이지 않는다 (더 가까이)'));
    const pr=v.pred,act=1,cmp=(D.stage===2&&D.app>.75&&moved>.15)?(pr<0?'예상을 고르지 않았다':(pr===act?'예상과 같다!':(pr===0?'움직이지 않을 줄 알았는데 끌려 왔다! 왜일까? 다음 쪽에서':'밀려 나지 않고 끌려 왔다! 왜일까? 다음 쪽에서'))):'-';
    Object.assign(SPX.r,{mv,cmp,F:F});
    SPX.btnText('near0',D.appT>.5&&D.stage===0?'멀리 치우기':'가까이 가져가기');
    const sig=[D.stage,v.pred>=0,D.app>.5,D.app>.02].join('|');if(sig!==D.sig){D.sig=sig;
      SPX.setFlow({pred:v.pred>=0?'done':'now',near0:D.stage>0?'done':(v.pred>=0?'now':''),rub:D.stage===0?(D.app>.5?'now':''):(D.stage===1?'now':'done'),near:D.stage<2?'lock':'now'});}
    readsAt(SPX,o);
  };
};

/* ================= 시뮬레이션 ② 정전기 유도 탐구 (id: ib) =================
   대전체((−) 빨대 / (+) 유리 막대)를 고르고 거리를 바꿔 가며 금속 구 속 전하를 본다. 힘은 대전체의 부호와 관계없이 끌어당긴다.
   모델: engine/sim_induct.js.  이동 줄 수(최대 5줄)·각도·거리는 모식 값이다. 심화 상자의 화살표 길이는 힘의 크기에 비례한다(교과서 밖). */
const SPB=SIMSPEC.define({id:'ib',
  vars:[{id:'body',label:'대전체',choice:[[-1,'(−)대전체 · 빨대'],[1,'(+)대전체 · 유리 막대']],def:-1},
        {id:'near',label:'가까이 가져가기',min:0,max:10,step:1,def:6,stepper:true,stepLabels:['멀리','가까이'],fmt:v=>'가까이 '+v+' / 10'}],
  reads:[{id:'qz',label:'대전체와 가까운 쪽 / 먼 쪽'},{id:'tot',label:'금속 구 전체 전하의 합'},{id:'mv',label:'금속 구의 움직임'},{id:'Fnet',label:'알짜힘 = 당김 − 밂 (모식)',digits:2,beyond:true}],
  flow:[{label:'대전체 고르기',var:'body'},{label:'가까이 가져가기',hint:'버튼이나 막대를 좌우로 끌어요',var:'near'}],
  pace:.5,pause:false,
  scale:{mode:'schematic',note:'전하 수·이동한 줄 수·거리는 비율 없이 그린 모식도'},motion:false});
ANIMS.sim_ib=o=>{
  if(!o.cv._bound){o.cv._bound=1;o.cv.style.touchAction='none';
    const pos=e=>{const b=o.cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*o.W,(e.clientY-b.top)/b.height*o.H];};

/* ================= 도전: 비밀 막대의 정체를 밝혀라 (CH = lib.js) =================
   막대 A·B·C 중 하나는 (−)대전체, 하나는 (+)대전체, 하나는 전하를 띠지 않았다(무작위). 종이로 싸서 전하를 볼 수 없다.
   (+)대전체도 (−)대전체도 금속 구를 끌어당기므로 끌려 오는 것만으로는 부호를 알 수 없고, 금속 구 속에서 막대와 가까운 쪽의 전하를 보아야 한다. */
ANIMS.chal=o=>{
  const S={D:5,th:0,mv:IND.mover(IL),mC:0,lt:null,prev:-2,sp:0};
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const dt=S.lt==null?0:Math.min(.05,t-S.lt);S.lt=t;
    const sel=CH.sel,ty=sel>=0?CH.types[sel]:0,Q=ty!==0?1:0;
    if(sel!==S.prev){S.prev=sel;S.D=5;S.th=0;}                  // 다른 막대를 고르면 멀리서 다시 다가온다
    S.D+=((sel>=0?1.9:5)-S.D)*Math.min(1,dt*2.2);
    const e=IND.pend(S.D,Q);S.th+=(e.theta-S.th)*Math.min(1,dt*5);
    const L=IND.DEF.L,xs=L*Math.sin(S.th),ys=L*(1-Math.cos(S.th)),r=Math.hypot(S.D-xs,ys),f=iF(Q,r),lvl=Q?IND.level(1,1,r,1.35):0;
    S.mv.step(dt*1.6,I_MMAX*lvl,ty>0?-1:1);
    const G=indReal(o,{kind:'minus',hidden:true,letter:sel>=0?'ABC'[sel]:'?',D:S.D,theta:S.th,top:H*.07,sx:W*.73});
    const u=G.u;
    txt(ctx,'금속 구',G.bx+u+10,G.by,24,TH.sub,'left',800);
    indForce(o,G,f.F,'구가 받는 전기력');
    const R=Math.min(W*.15,H*.17),zx=W*.5,zy=H*.605;
    zoomLines(ctx,G.bx,G.by,u,zx,zy,R);
    sphereDisc(ctx,zx,zy,R,ty>0?-1:1,0,{mv:S.mv});
    txt(ctx,'금속 구 속 (확대)',zx+R+14,zy-R*.62,24,TH.sub,'left',800);txt(ctx,'막대와 가까운 쪽은 왼쪽',zx+R+14,zy-R*.62+28,22,TH.sub,'left',700);
    const cap=sel<0?'막대 A · B · C 중 하나를 골라 보자':(S.D>2.4?'막대 '+'ABC'[sel]+'가 다가온다…':(Q?'금속 구가 끌려 온다':'금속 구가 움직이지 않는다'));
    txt(ctx,cap,zx,H*.845,26,TH.ink,'center',800);
    legend(ctx,zx-140,H-44);txt(ctx,'※ 전하의 수·이동한 줄 수·거리는 모식',zx,H-16,22,TH.sub,'center',700);
    if(CH.solved){S.sp+=dt;for(let k=0;k<CH.stars;k++){const p=.8+.2*Math.sin(S.sp*5+k);starShape(ctx,W*.08+k*W*.085,H*.60,W*.033*p,'#F7C948');}
      pill(ctx,'정답!',W*.08+W*.085,H*.71,30,'#1F7A6C');}else S.sp=0;
  };
};

const CH_HINTS=['움직이지 않는 막대는 어떤 막대일까? 교과서 해 보기의 문지르지 않은 빨대를 떠올려 보자.',

    CH.msg='정답! 별 '+CH.stars+'개를 얻었어. 끌려 오는 것만으로는 (+)인지 (−)인지 알 수 없고, 금속 구 속 가까운 쪽 전하가 막대와 다른 종류라는 것을 이용했구나.';return;}
  CH.wrong++;CH.cls='bad';const i=CH.res.findIndex(r=>!r),tr=CH.types[i],an=CH.ans[i],nm='ABC'[i];
  CH.msg=tr===0?nm+'는 금속 구를 움직이지 못했어. 전하를 띠지 않은 막대는 어떨까?':an===0?nm+'는 금속 구를 끌어당겼어. 전하를 띠지 않은 막대가 금속 구를 끌어당길 수 있을까?':nm+'는 끌려 오는 막대야. (+)와 (−)를 서로 바꿔 생각한 건 아닐까? 금속 구 속 막대와 가까운 쪽 전하를 보고, 막대는 그것과 다른 종류로 골라 봐!';
}
function chEnter(el){
  const root=el.querySelector('.chbox');if(!root)return;CH.shuffle();CH.reset();
  if(!root._b){root._b=1;stopAll(root);
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.blur();
      if(b.dataset.rod!=null){CH.sel=CH.sel===+b.dataset.rod?-1:+b.dataset.rod;if(!CH.solved){CH.msg=CH.sel<0?'막대를 하나씩 금속 구에 가까이 가져가 보자.':'막대 '+'ABC'[CH.sel]+'를 가까이 가져갔어. 금속 구와 금속 구 속 전하를 관찰해 보자.';CH.cls='';}}
      else if(b.closest('[data-ans]')&&!CH.solved){const i=+b.closest('[data-ans]').dataset.ans;CH.ans[i]=+b.dataset.v;CH.res[i]=null;}
      else if(b.dataset.chact==='check'&&!CH.solved)chCheck();
      else if(b.dataset.chact==='hint'&&!CH.solved){CH.msg='💡 '+CH_HINTS[Math.min(CH.hints,2)];CH.hints=Math.min(3,CH.hints+1);CH.cls='';}
      else if(b.dataset.chact==='new'){CH.round++;CH.shuffle();CH.reset();}
      chRender(root);});}
  chRender(root);
}
