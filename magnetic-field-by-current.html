    ctx.save();ctx.fillStyle='#55646A';[a,b].forEach(q=>{ctx.beginPath();ctx.ellipse(q[0],q[1],lw*.75,lw*.5,0,0,PI2);ctx.fill();});
    ctx.lineCap='round';ctx.strokeStyle=MF.CU2;ctx.lineWidth=lw+3;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    ctx.strokeStyle=MF.cu;ctx.lineWidth=lw;ctx.stroke();ctx.strokeStyle='rgba(255,225,190,.55)';ctx.lineWidth=lw*.28;ctx.beginPath();ctx.moveTo(a[0]-lw*.15,a[1]);ctx.lineTo(b[0]-lw*.15,b[1]);ctx.stroke();ctx.restore();}
  /* 전류 화살표는 도선 위에, 도선과 나란히(도선을 따라 흐른다). I>0 = 아래 구멍 → 위 구멍(화면 위쪽) */
  if(I&&o.arrows!==false){const idx=o.aidx||[2,4,6],s=I>0?1:-1;
    idx.forEach(i=>{const x=-L/2+i*p,a=M(x-p*.22,-R),b=M(x+p*.22,R),f0=s>0?a:b,f1=s>0?b:a;mfArrowOn(ctx,f0,f1,.18,.86,Math.max(5,lw*.6));});
    if(o.label!==false){const q=M(-L/2-1.3,2.45);mfPill(ctx,'전류',q[0],q[1],o.lsz||24,MF.cur);}}}
/* 선분 p0→p1 위의 [f0,f1] 구간에 붉은 전류 화살표(선과 나란히) */
function mfArrowOn(ctx,p0,p1,f0,f1,w){const x0=p0[0]+(p1[0]-p0[0])*f0,y0=p0[1]+(p1[1]-p0[1])*f0,x1=p0[0]+(p1[0]-p0[0])*f1,y1=p0[1]+(p1[1]-p0[1])*f1;
  ctx.save();ctx.globalAlpha=.95;arrow(ctx,x0,y0,x1,y1,'#fff',w+4,w*3.4+4);arrow(ctx,x0,y0,x1,y1,MF.cur,w,w*3.4);ctx.restore();}
/* 베지에 전선 위에 전류 방향 화살촉(흐르는 쪽, 멈춘 화살 — 무엇이 흘러나오는 것처럼 움직이지 않게) */
function mfBez(p0,c1,c2,p1,t){const u=1-t;return [u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p1[0],u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p1[1]];}
function mfFlowHeads(ctx,P,dir,ts){(ts||[.5]).forEach(t=>{const a=mfBez(P[0],P[1],P[2],P[3],t-.02*dir),b=mfBez(P[0],P[1],P[2],P[3],t+.02*dir);const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),h=16;
  ctx.save();ctx.translate(b[0],b[1]);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(-h,-h*.62);ctx.lineTo(-h,h*.62);ctx.closePath();ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle=MF.cur;ctx.fill();ctx.restore();});}
/* ---------- 오른손(art.py 의 SVG 이미지: 기본 = 네 손가락 위쪽, 엄지 왼쪽) ---------- */
const MF_IMG={};Object.keys(MF_ART).forEach(k=>{const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MF_ART[k]);MF_IMG[k]=im;});
function mfHand(ctx,x,y,s,rot,alpha){const im=MF_IMG.hand;if(!im||!im.complete||!im.naturalWidth)return;ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y);ctx.rotate(rot||0);ctx.drawImage(im,-110*s,-100*s,200*s,220*s);ctx.restore();}   /* (x,y) = 손등 가운데(그림의 110,100) */

/* ---------- 직류 전원 장치(위에서 본 모습) · 스위치 · 집게 전선 ---------- */
function mfSupply(ctx,x,y,w,h,lv,on){ctx.save();rr(ctx,x,y,w,h,14);ctx.fillStyle='#2E3A40';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#1D2B2A';ctx.stroke();ctx.restore();
  txt(ctx,'직류 전원 장치',x+w/2,y+24,24,'#fff','center',900);
  ctx.save();rr(ctx,x+12,y+44,w-24,h*.3,8);ctx.fillStyle='#14221E';ctx.fill();ctx.restore();
  txt(ctx,'전압',x+24,y+44+h*.15,24,'#CFE8DF','left',900);
  for(let i=0;i<3;i++){const bx=x+84+i*((w-108)/3),bw=(w-108)/3-8;ctx.save();rr(ctx,bx,y+52,bw,h*.3-16,4);ctx.fillStyle=i<=lv?(on?'#F4C33B':'#C9A64A'):'#3C4A48';ctx.fill();ctx.restore();}
  const P=[x+w*.72,y+h*.8],Q=[x+w*.28,y+h*.8];   /* (−)단자 왼쪽 · (+)단자 오른쪽 — 전선이 서로 엇갈리지 않게 */
  txt(ctx,'(+)단자',P[0],P[1]-32,24,'#FFB4A8','center',900);txt(ctx,'(−)단자',Q[0],Q[1]-32,24,'#E4EAEC','center',900);
  [[P,MF.WIRE_R,'+'],[Q,'#1D2B2A','−']].forEach(([c,col,s])=>{ctx.save();ctx.beginPath();ctx.arc(c[0],c[1],17,0,PI2);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#C9D3D8';ctx.stroke();ctx.restore();txt(ctx,s,c[0],c[1]+1,26,'#fff','center',900);});
  return {P,Q};}
/* 칼날 스위치: on 0(열림)~1(닫힘). a,b = 양쪽 단자 */
function mfSwitch(ctx,x,y,w,on){ctx.save();rr(ctx,x-w/2-14,y-26,w+28,52,10);ctx.fillStyle='#F6FAFC';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#8FA29D';ctx.stroke();ctx.restore();
  const a=[x-w/2,y],b=[x+w/2,y];[a,b].forEach(q=>{ctx.save();ctx.beginPath();ctx.arc(q[0],q[1],9,0,PI2);ctx.fillStyle='#8E9AA2';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#33404A';ctx.stroke();ctx.restore();});
  const ang=(1-on)*-.62,ex=a[0]+Math.cos(ang)*w,ey=a[1]+Math.sin(ang)*w;ctx.save();ctx.lineCap='round';ctx.strokeStyle='#33404A';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.strokeStyle='#C9D3D8';ctx.lineWidth=5;ctx.stroke();ctx.restore();ctx.save();ctx.beginPath();ctx.arc(ex,ey,8,0,PI2);ctx.fillStyle='#E0402F';ctx.fill();ctx.restore();
  return {a,b,hx:x,hy:y-12};}
/* 전선(집게 달린 전선): 부드러운 곡선 + 끝 집게 */
function mfWire(ctx,p0,p1,col,sag,c1,c2,dots){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p0[0],p0[1]);
  const q1=c1||[p0[0],p0[1]+(sag||60)],q2=c2||[p1[0],p1[1]+(sag||60)];ctx.bezierCurveTo(q1[0],q1[1],q2[0],q2[1],p1[0],p1[1]);ctx.stroke();ctx.restore();
  if(dots)[p0,p1].forEach(q=>{ctx.save();ctx.beginPath();ctx.arc(q[0],q[1],7,0,PI2);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();});
  return [p0,q1,q2,p1];}   /* 집게 점은 단자에 물릴 때만(dots) — 도선이 이어지는 곳에 점을 찍지 않는다(v3.29b) */
/* 북쪽 표시 */
function mfNorth(ctx,x,y,s){s=s||34;   /* 방위표(지도 기호): 세로선 N–S, 가로선 W–E, 북쪽 끝 반쪽 화살촉. (x,y) = 가운데 */
  ctx.save();rr(ctx,x-s-26,y-s-34,2*s+52,2*s+68,14);ctx.fillStyle='rgba(255,255,255,.94)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#C9D4D1';ctx.stroke();
  ctx.strokeStyle='#33404A';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x,y+s);ctx.moveTo(x-s*.75,y);ctx.lineTo(x+s*.75,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x-s*.75,y);ctx.stroke();ctx.restore();   /* '4' 모양 — N 끝에서 W 끝으로 비스듬한 선(안은 비움) */
  txt(ctx,'N',x,y-s-17,24,'#1D2B2A','center',900);txt(ctx,'S',x,y+s+17,24,'#1D2B2A','center',900);txt(ctx,'W',x-s*.75-14,y,22,'#1D2B2A','center',900);txt(ctx,'E',x+s*.75+13,y,22,'#1D2B2A','center',900);}

/* ---------- 철 클립(위에서 본 모습) · 철심(못) ---------- */
function mfClip(ctx,x,y,rot,s){s=s||1;ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.scale(s,s);ctx.strokeStyle='#6B7B82';ctx.lineWidth=3.2;rr(ctx,-17,-7,34,14,7);ctx.stroke();rr(ctx,-11,-3.5,24,7,3.5);ctx.lineWidth=2.4;ctx.stroke();ctx.restore();}
function mfNail(ctx,x0,y,x1,h){ctx.save();ctx.fillStyle=MF.IRON;ctx.strokeStyle='#33404A';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x0,y-h/2);ctx.lineTo(x1-h*1.4,y-h/2);ctx.lineTo(x1,y);ctx.lineTo(x1-h*1.4,y+h/2);ctx.lineTo(x0,y+h/2);ctx.closePath();ctx.fill();ctx.stroke();
  rr(ctx,x0-16,y-h*.95,18,h*1.9,4);ctx.fillStyle='#9AA6AD';ctx.fill();ctx.stroke();ctx.restore();}
function mfWound(ctx,x0,x1,y,h,n,lw){const p=(x1-x0)/(n-1);for(let i=0;i<n;i++){const x=x0+i*p;ctx.save();ctx.lineCap='round';ctx.strokeStyle=MF.CU2;ctx.lineWidth=(lw||7)+3;ctx.beginPath();ctx.moveTo(x-p*.22,y+h/2+5);ctx.lineTo(x+p*.22,y-h/2-5);ctx.stroke();ctx.strokeStyle=MF.cu;ctx.lineWidth=lw||7;ctx.stroke();ctx.restore();}}
/* 건전지(위에서 본 원통) — (+)쪽 돌기와 + 글자가 같은 쪽(README 전기 기호 약속) */
function mfCell(ctx,x,y,w,h,plusRight){ctx.save();rr(ctx,x,y-h/2,w,h,8);ctx.fillStyle='#2F6FB0';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#1D2B2A';ctx.stroke();
  const px=plusRight?x+w:x-10;ctx.fillStyle='#C9D3D8';ctx.fillRect(px,y-h*.18,10,h*.36);ctx.strokeRect(px,y-h*.18,10,h*.36);ctx.restore();
  txt(ctx,'+',plusRight?x+w-18:x+18,y+1,26,'#fff','center',900);txt(ctx,'−',plusRight?x+18:x+w-18,y+1,28,'#fff','center',900);
  return {P:plusRight?[x+w+10,y]:[x-10,y],Q:plusRight?[x,y]:[x+w,y]};}

/* ---------- 전자석(위에서 본 책상): 철심 + 감은 코일 + 건전지 + 스위치 ----------
   감긴 도선: 철심 위로 넘어가는 반쪽은 보이고(비스듬히), 아래 반쪽은 철심 밑으로 숨는다(양 가장자리에서 말려 들어감).
   이끌림 도선은 코일 양 끝 바깥에서 아래로 빠져나와 건전지·스위치로 간다. 전류: (+) → 스위치 → 오른쪽 이끌림 → 코일 → 왼쪽 이끌림 → (−).
   돌려주는 I 는 MAG.coil 과 같은 부호(I>0 = 보이는 도선의 전류가 화면 위쪽). */
function mfEM(ctx,x0,x1,y,h,on,rev,o){o=o||{};const L=x1-x0,c0=x0+L*.14,c1=x0+L*.72,n=o.n||13,p=(c1-c0)/(n-1),lw=o.lw||8;
  mfNail(ctx,x0,y,x1,h);
  const plusRight=!rev,I=on?(plusRight?-1:1):0;
  for(let i=0;i<n;i++){const xb=c0+i*p-p*.22,xt=c0+i*p+p*.22,yb=y+h/2,yt=y-h/2;
    ctx.save();ctx.lineCap='round';ctx.strokeStyle=MF.CU2;ctx.lineWidth=lw+3;ctx.beginPath();ctx.moveTo(xb,yb+3);ctx.quadraticCurveTo(xb-1,yb-2,xb+(xt-xb)*.1,yb-4);ctx.lineTo(xt-(xt-xb)*.1,yt+4);ctx.quadraticCurveTo(xt+1,yt+2,xt,yt-3);ctx.stroke();
    ctx.strokeStyle=MF.cu;ctx.lineWidth=lw;ctx.stroke();ctx.strokeStyle='rgba(255,225,190,.55)';ctx.lineWidth=lw*.3;ctx.beginPath();ctx.moveTo(xb+(xt-xb)*.15-2,yb-6);ctx.lineTo(xt-(xt-xb)*.15-2,yt+6);ctx.stroke();ctx.restore();}
  const by=y+h*2.9,cw=Math.min(170,L*.36),cx=x0+L*.1,cell=mfCell(ctx,cx,by,cw,50,plusRight),sw=mfSwitch(ctx,x0+L*.84,by,Math.min(80,L*.16),on?1:(o.k||0));
  const lA=[c0-p*.22,y+h/2+4],lB=[c1+p*.5,y+h/2+4];   /* 이끌림 도선이 철심 밑에서 나오는 곳(코일 양 끝 바깥) */
  const left=plusRight?cell.Q:cell.P,right=plusRight?cell.P:cell.Q;
  const W1=mfWire(ctx,lA,left,MF.cu,0,[lA[0]-30,lA[1]+40],[left[0]-50,left[1]-10]);
  const W2=mfWire(ctx,right,sw.a,'#55646A',0,[right[0]+40,right[1]],[sw.a[0]-40,sw.a[1]]);
  const W3=mfWire(ctx,sw.b,lB,MF.cu,0,[sw.b[0]+40,sw.b[1]-30],[lB[0]+30,lB[1]+50]);
  if(I){/* 전류 방향: 도선 위 화살표 */const down=I<0;
    for(const i of [2,6,10]){if(i>=n)continue;const xb=c0+i*p-p*.22,xt=c0+i*p+p*.22;mfArrowOn(ctx,down?[xt,y-h/2]:[xb,y+h/2],down?[xb,y+h/2]:[xt,y-h/2],.15,.85,5);}
    /* 바깥 회로: plusRight 이면 (+)오른쪽 → W2(→스위치) → W3(→오른쪽 이끌림) → 코일 → W1(→ 왼쪽 단자 (−)) */
    const f=plusRight?1:-1;mfFlowHeads(ctx,W2,f,[.5]);mfFlowHeads(ctx,W3,f,[.55]);mfFlowHeads(ctx,W1,f,[.55]);}
  return {sw,tip:[x1,y],head:[x0-16,y],I,cell};}

/* 애니메이션: ANIMS.이름 = o => { o.frame = () => {…} }.  o.phase = 공개한 단계(빈칸 번호), 빈칸 순서 = 단계 번호.
   바늘 방향·선 모양은 MAG(engine/sim_magfield.js)로 계산한다. 시뮬레이션의 그림 시간은 sp.dt 를 누적한 d.tt(잠시 멈춤이면 멈춤 — v3.28). */
const MF_COIL=I=>MAG.coil({L:MF_C.L,R:MF_C.R,N:MF_C.N,I:I});
const MF_BAR=()=>MAG.bar({L:D.BAR.L,W:D.BAR.W,nEnd:1,N:D.BAR.N});
const MF_BARRECT=[-D.BAR.L/2,-D.BAR.W/2,D.BAR.L/2,D.BAR.W/2];
/* 코일의 자기장 선 = 교과서식 모식(MAG.schem — 교과서 그림 Ⅶ-15 처럼 축 위 선·양 끝에서 퍼지는 선·코일을 감싸는 닫힌 고리).
   계산선(MAG.line)은 이 코일에서 위·아래로 길쭉한 고리 + 도선 근처 구불거림이 되어 어지러웠다(교사 점검 5차). 선은 판(그림 틀) 가장자리에서 끝난다.
   방향·위상은 tests_magfield 가 실제 B 와 대조(나침반 자리에서 선과 바늘이 나란함 포함) */
const MF_FRAME=[-MF_C.L/2-4.6,-MF_C.R-3.5,MF_C.L/2+4.6,MF_C.R+3.5];   /* = mfBoard 판 */
const mfCoilLines=I=>{const key='sch'+I;if(!MF_LCACHE[key])MF_LCACHE[key]=MAG.schem(MF_C,I,MF_FRAME);return MF_LCACHE[key];};
const MF_BSEEDS=[[0,2.2],[0,3.1],[0,4.2],[0,5.6],[0,-2.2],[0,-3.1],[0,-4.2],[0,-5.6],[9,0],[-9,0],[6.2,.55],[6.2,-.55],[-6.2,.55],[-6.2,-.55]];
const mfBarLines=box=>mfLinesOf('bar:'+box.join(','),[MF_BAR()],MF_BSEEDS,{box,step:.1,maxLen:110,stopWire:false,stopRect:MF_BARRECT});
/* 바늘 목표 각과 세기(흔들리는 빠르기용). Be = 지구 자기장(없으면 0) */
function mfTarget(srcs,x,y,Be){const b=MAG.B(srcs,x,y),by=b[1]+(Be||0);return {a:Math.atan2(by,b[0]),s:Math.hypot(b[0],by)/(MF_EARTH||.35)};}

/* ---------- 코일 장면 배치(그림 칸 크기에 맞춰) ---------- */
function mfCoilM(o,cx,cy,wfrac){const k=Math.min(o.W*(wfrac||.9)/19.6,o.H*.62/11.4);return mfMap(cx==null?o.W/2:cx,cy==null?o.H*.45:cy,k);}

/* ================= 표지 ================= */
ANIMS.cover=o=>{const nd=D.COMPASS6.map(()=>({}));o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);mfBg(o,MF.BG);const dt=mfTick(o);
  const cyc=t%9,on=cyc>1.2,M=mfMap(W/2,H*.5,23);
  txt(ctx,on?'코일에 전류가 흐르면…':'코일에 전류가 흐르지 않을 때',W/2,H*.08,30,MF.ink,'center',900);
  mfBoard(ctx,M);const L=mfCoilLines(1);
  if(on){const a=Math.min(1,(cyc-3)/1.5);if(a>0)mfDrawLines(ctx,M,L,{alpha:a*.85,lw:3,every:110});}
  mfCoil(ctx,M,on?1:0,{lsz:20});
  const src=[MF_COIL(on?1:0)];D.COMPASS6.forEach(([x,y],i)=>{const tg=mfTarget(src,x,y,MF_EARTH),[X,Y]=M(x,y);mfCompass(ctx,X,Y,25,mfNeedle(nd[i],tg.a,tg.s,dt));});
  txt(ctx,on?'나침반 바늘이 돌아간다 → 자기장이 생겼다!':'나침반 바늘은 모두 북쪽',W/2,H*.92,26,on?MF.fld:MF.SUBT,'center',900);};};

/* ================= STAGE 1 ================= */
/* 도입: 막대자석과 전자석 */
function mfEMDraw(ctx,x0,x1,y,h,on,lv,rev,t){return mfEM(ctx,x0,x1,y,h,on>=1,rev,{k:on});}
ANIMS.intro=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);mfBg(o);
  txt(ctx,'막대자석',W*.25,H*.1,28,MF.ink,'center',900);txt(ctx,'전자석',W*.72,H*.1,28,MF.ink,'center',900);
  const M=mfMap(W*.24,H*.4,W*.032);mfBar(ctx,M,10,2.2,1);
  mfEMDraw(ctx,W*.52,W*.93,H*.4,30,0,0,false,t);
  ctx.save();ctx.strokeStyle='#C9D4D1';ctx.setLineDash([8,8]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.47,H*.17);ctx.lineTo(W*.47,H*.8);ctx.stroke();ctx.restore();
  const b=1+.06*Math.sin(t*3);txt(ctx,'?',W*.47,H*.5,Math.round(70*b),MF.ans,'center',900);
  mfCap(o,'둘 다 자석일까? 무엇이 다를까? (모식 그림)',MF.SUBT,H*.92);};};

/* 자기력: 끌어당김 · 밀어냄 (빈칸 1: 자기력) */
ANIMS.force=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);mfBg(o);const ph=o.phase,cyc=(t%4)/4,e=ease(Math.min(1,cyc*1.6));
  const rows=[H*.2,H*.5,H*.79],mw=W*.26,mh=46;
  const mag=(x,y,nRight)=>{const M=mfMap(x,y,mw/10);mfBar(ctx,M,10,mh/(mw/10),nRight?1:-1);};
  // ① 자석 — 철 클립
  mag(W*.22,rows[0],true);const cx=W*.22+mw/2+16+(1-e)*W*.3;mfClip(ctx,cx+18,rows[0],0,1.3);
  txt(ctx,'자석 ↔ 쇠붙이(철 클립)',W*.06,rows[0]-mh-18,24,MF.ink,'left',900);
  // ② 다른 극: 끌어당김
  const g2=(1-e)*W*.1;mag(W*.24-g2,rows[1],true);mag(W*.24+mw+12+g2,rows[1],true);
  txt(ctx,'다른 극끼리(N ↔ S)',W*.06,rows[1]-mh-18,24,MF.ink,'left',900);
  // ③ 같은 극: 밀어냄
  const g3=e*W*.1;mag(W*.24-g3,rows[2],true);mag(W*.24+mw+16+g3,rows[2],false);
  txt(ctx,'같은 극끼리(N ↔ N)',W*.06,rows[2]-mh-18,24,MF.ink,'left',900);
  const lx=W*.84;[[rows[0],'끌어당김'],[rows[1],'끌어당김'],[rows[2],'밀어냄']].forEach(([y,s])=>{mfPill(ctx,s,lx,y,24,s==='밀어냄'?MF.S:MF.N);});
  if(ph>=1)mfPill(ctx,'모두 자기력 — 떨어져 있어도 작용한다',W*.5,H*.95,24,MF.ans,'#FFF3E6');
  else mfCap(o,'자석은 무엇을 끌어당기고, 무엇을 밀어낼까?',MF.SUBT,H*.95);};};

/* ---------- 가상 실험 ① 막대자석 주위에 나침반 놓기 (id: bm) ---------- */
const MF_D8=MF_DIR8.map(([s,i])=>[i,s]);
const SPBM=SIMSPEC.define({id:'bm',
  vars:[{id:'pa',label:'(가)',choice:MF_D8,def:null},{id:'pb',label:'(나)',choice:MF_D8,def:null}],
  flow:[{label:'예상: (가)에 놓은 나침반 바늘의 N극은 어느 쪽을 가리킬까?',var:'pa'},
        {label:'나침반을 (가)에 놓기 (점선 원을 눌러도 된다)',act:'ga',btn:'(가)에 놓기'},
        {label:'예상: (나)에서는?',var:'pb'},
        {label:'나침반을 (나)에 놓기',act:'na',btn:'(나)에 놓기'},
        {label:'빈 곳을 눌러 놓고, 끌어 옮겨 보자',act:'clr',btn:'나침반 치우기'},
        {label:'자기장의 모양 보기(모식)',act:'ln',btn:'선 보기'}],
  extra:[{id:'ga',label:'(가)에 놓기',onClick:sp=>mfBmPlace(sp,'ga')},{id:'na',label:'(나)에 놓기',onClick:sp=>mfBmPlace(sp,'na')},
         {id:'ln',label:'선 보기',onClick:sp=>{const d=sp.data;if(d.init)d.lines=!d.lines;}},{id:'clr',label:'나침반 치우기',onClick:sp=>{const d=sp.data;if(d.init)d.free=[];}}],
  pace:1,compact:true,scale:{mode:'schematic',note:'나침반은 보기 쉽게 크게 그린 모식이고, 지구 자기장은 무시했다(교과서 그림과 같음)'},motion:true});
function mfBmPlace(sp,w){const d=sp.data;if(!d.init)return;const pv=w==='ga'?sp.v.pa:sp.v.pb;
  if(pv==null){d.msg='먼저 바늘의 N극이 가리킬 방향을 예상해 골라 보자!';d.cls='';return;}
  if(w==='na'&&!d.ga){d.msg='(가)부터 놓아 보자.';return;}
  d[w]=true;const p=w==='ga'?D.BAR_GA:D.BAR_NA,tg=mfTarget([MF_BAR()],p[0],p[1],0),ans=mfDir8(tg.a),nm=w==='ga'?'(가)':'(나)',ok=pv===ans;
  d.msg=(ok?'예상 적중! ':'예상과 달랐어. ')+nm+'에서 바늘의 N극은 '+MF_DIR8[7-((7-ans))][0]+' ('+MF_DIRNAME[ans]+') — '+(w==='ga'?'S극 쪽을 가리킨다.':'N극에서 멀어지는 쪽을 가리킨다.');d.cls=ok?'ok':'bad';}
ANIMS.barsim=o=>{cvHitInit(o);
  /* 놓은 나침반을 끌어 옮기기: 누른 채 움직이면 바늘이 그 자리의 자기장 방향으로 계속 돈다 */
  const pick=e=>{const d=SPBM.data;if(!d.init||!d.M||!o._toD)return null;const [x,y]=o._toD(e),M=d.M,mx=(x-M.cx)/M.k,my=-(y-M.cy)/M.k;return d.free.find(q=>Math.hypot(q.x-mx,q.y-my)<1.2)||null;};
  o.cv.addEventListener('pointerdown',e=>{const q=pick(e);if(!q)return;e.stopPropagation();const d=SPBM.data;d.drag=q;d.moved=false;try{o.cv.setPointerCapture(e.pointerId);}catch(_){}});
  o.cv.addEventListener('pointermove',e=>{const d=SPBM.data;if(!d.drag)return;const [x,y]=o._toD(e),M=d.M;let mx=(x-M.cx)/M.k,my=-(y-M.cy)/M.k;
    mx=Math.max(-15,Math.min(15,mx));my=Math.max(-9.4,Math.min(9.4,my));if(Math.abs(mx)<D.BAR.L/2+1.1&&Math.abs(my)<D.BAR.W/2+1.1)return;d.drag.x=mx;d.drag.y=my;d.moved=true;d.msg='나침반을 옮기면 바늘이 그곳의 자기장 방향으로 돈다.';d.cls='';});
  const up=()=>{const d=SPBM.data;if(d.drag){d.drag=null;d.justDragged=d.moved;}};o.cv.addEventListener('pointerup',up);o.cv.addEventListener('pointercancel',up);
  o.onFree=(x,y)=>{const d=SPBM.data;if(d.justDragged){d.justDragged=false;return true;}if(!d.init||!d.na)return false;const M=d.M;if(!M)return false;
    const mx=(x-M.cx)/M.k,my=-(y-M.cy)/M.k;if(Math.abs(mx)<D.BAR.L/2+1.1&&Math.abs(my)<D.BAR.W/2+1.1){d.msg='자석 위에는 놓을 수 없어 — 자석 바깥에 놓아 보자.';d.cls='';return true;}
    if(Math.abs(mx)>15.2||Math.abs(my)>9.6)return true;
    if([D.BAR_GA,D.BAR_NA].concat(d.free.map(q=>[q.x,q.y])).some(q=>Math.hypot(q[0]-mx,q[1]-my)<2.3))return true;
    if(d.free.length>=12)d.free.shift();d.free.push({x:mx,y:my,st:{a:Math.PI/2,w:0}});d.msg='바늘의 N극이 가리키는 방향을 이어 보면 어떤 모양이 될까?';d.cls='';return true;};
  o.frame=()=>{const {ctx,W,H}=o;clear(o,false);o._hits=[];const sp=SPBM,d=sp.data,v=sp.v;
  if(!d.init)Object.assign(d,{init:1,ga:false,na:false,lines:false,free:[],sa:{a:Math.PI/2,w:0},sb:{a:Math.PI/2,w:0},msg:'',cls:'',tt:0});
  const dt=sp.dt(o.t);d.tt+=dt;o._tt=d.tt;mfBg(o);
  const k=Math.min(W/31.5,(H-150)/20),M=mfMap(W/2,H*.43,k);d.M=M;const src=[MF_BAR()],box=[-15.4,-9.8,15.4,9.8];
  if(d.lines)mfDrawLines(ctx,M,mfBarLines(box),{alpha:.8,lw:3,every:120});
  mfBar(ctx,M,D.BAR.L,D.BAR.W,1);
  const r=k*1.15;
  [[D.BAR_GA,'ga','(가)',d.sa,-1],[D.BAR_NA,'na','(나)',d.sb,1]].forEach(([p,w,nm,st,s])=>{const [X,Y]=M(p[0],p[1]);
    if(d[w]){const tg=mfTarget(src,p[0],p[1],0);mfCompass(ctx,X,Y,r,mfNeedle(st,tg.a,tg.s,dt),{ring:MF.ans});}
    else{mfCompass(ctx,X,Y,r,null,{kind:'ghost',ring:MF.ans});const can=w==='ga'||d.ga;if(can)cvHit(o,X,Y,r*1.3,()=>mfBmPlace(sp,w));}
    txt(ctx,nm,X+s*(r+30),Y-s*(r*.2)-(s<0?8:-8),28,MF.ans,'center',900);});
  d.free.forEach(q=>{const tg=mfTarget(src,q.x,q.y,0),[X,Y]=M(q.x,q.y);mfCompass(ctx,X,Y,r*.85,mfNeedle(q.st,tg.a,tg.s,dt));});
  /* 흐름 상태 */
  sp.setFlow({pa:v.pa==null?'now':'done',ga:v.pa==null?'lock':(d.ga?'done':'now'),pb:!d.ga?'lock':(v.pb==null?'now':'done'),na:(!d.ga||v.pb==null)?'lock':(d.na?'done':'now'),clr:d.na?'now':'lock',ln:d.na?'now':'lock'});
  sp.btnText('ln',d.lines?'선 숨기기':'선 보기');
  txt(ctx,'나침반 바늘: 빨간 쪽 = N극, 파란 쪽 = S극',24,H-96,24,MF.SUBT,'left',800);if(d.lines)txt(ctx,'초록 선 = 자기장의 모양(모식)',W-24,H-96,24,MF.fld,'right',800);
  const m=d.msg||(!d.ga?'① 예상을 고른 뒤 ② (가)의 점선 원을 눌러 나침반을 놓아 보자.':'');
  if(m){ctx.save();rr(ctx,20,H-74,W-40,58,14);ctx.fillStyle=d.cls==='ok'?'#DDF3E8':d.cls==='bad'?'#FDEDEC':'#F4F8F7';ctx.fill();ctx.restore();mfCapIn(ctx,m,W/2,H-45,W-60,d.cls==='ok'?MF.fld:d.cls==='bad'?'#A93226':MF.ink);}};};
function mfCapIn(ctx,s,x,y,maxW,col){let z=26;ctx.save();for(;z>23;z--){ctx.font='800 '+z+'px Pretendard,sans-serif';if(ctx.measureText(s).width<=maxW)break;}ctx.restore();
  if(z<24){/* 두 줄로(24 px) */const words=s.split(' '),h=Math.ceil(words.length/2);txt(ctx,words.slice(0,h).join(' '),x,y-13,24,col,'center',800);txt(ctx,words.slice(h).join(' '),x,y+13,24,col,'center',800);return;}
  txt(ctx,s,x,y,z,col,'center',800);}

/* 자기장의 뜻 (빈칸 3: 자석 · 자기장 · N극) */
ANIMS.field=o=>{const nd=[];o.frame=()=>{const {ctx,W,H,t}=o;clear(o);mfBg(o);const ph=o.phase,dt=mfTick(o);
  const k=Math.min(W/27,H/19.5),M=mfMap(W*.56,H*.5,k),src=[MF_BAR()];
  if(ph>=2){const [X,Y]=M(0,0),g=ctx.createRadialGradient(X,Y,k*3,X,Y,k*10.5);g.addColorStop(0,'rgba(46,125,50,.20)');g.addColorStop(1,'rgba(46,125,50,0)');ctx.save();ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(X,Y,k*11.5,k*8,0,0,PI2);ctx.fill();ctx.restore();
    mfPill(ctx,'자기장 : 자기력이 작용하는 공간',M(0,-6.6)[0],M(0,-6.6)[1],24,MF.fld);}
  mfBar(ctx,M,D.BAR.L,D.BAR.W,1);
  const P=[[-7.6,3.4],[0,4.2],[7.6,3.4],[-7.6,-3.4],[0,-4.2],[7.6,-3.4]];
  P.forEach(([x,y],i)=>{nd[i]=nd[i]||{};const tg=mfTarget(src,x,y,0),[X,Y]=M(x,y),hi=ph>=3;mfCompass(ctx,X,Y,k*1.15,mfNeedle(nd[i],tg.a,tg.s,dt),{ring:hi?MF.ans:null});
    if(hi){const a=nd[i].a,L=k*2.5,g=Math.min(1,(o.t-(o.pt||0))*1.5-i*.18);if(g>0){ctx.save();ctx.globalAlpha=g;arrow(ctx,X+Math.cos(a)*k*1.2,Y-Math.sin(a)*k*1.2,X+Math.cos(a)*L,Y-Math.sin(a)*L,MF.ans,5,16);ctx.restore();}}});   /* 모든 나침반에서 N극 쪽 = 자기장 방향(차례로 나타남) */
  
  // 나침반 바늘 = 작은 자석 (확대 상자)
  const bx=24,by=24,bw=W*.32,bh=H*.2;ctx.save();rr(ctx,bx,by,bw,bh,16);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=ph>=1?MF.ans:'#C9D4D1';ctx.stroke();ctx.restore();
  mfCompass(ctx,bx+bh*.48,by+bh*.5,bh*.36,Math.PI/2+.25*Math.sin(t*1.2));
  const tx0=bx+bh*.98;if(ph>=1){txt(ctx,'바늘도',tx0,by+bh*.36,24,MF.ink,'left',900);txt(ctx,'작은 자석!',tx0,by+bh*.66,26,MF.ans,'left',900);}
  else{txt(ctx,'바늘은',tx0,by+bh*.36,24,MF.SUBT,'left',900);txt(ctx,'왜 돌까?',tx0,by+bh*.66,24,MF.SUBT,'left',900);}
  mfCap(o,ph>=3?'어느 곳이든 바늘의 N극(빨간 쪽)이 가리키는 방향 = 그곳의 자기장 방향':'자석 주위에 놓은 나침반 (모식 · 지구 자기장은 생각하지 않음)',ph>=3?MF.ans:MF.SUBT,H*.95);};};

/* 막대자석 주위 자기장의 방향 (빈칸 2: N극 · S극) */
ANIMS.barfield=o=>{const nd=[];let ph0=-1,tph=0;o.frame=()=>{const {ctx,W,H,t}=o;clear(o);mfBg(o);const ph=o.phase,dt=mfTick(o);if(ph!==ph0){ph0=ph;tph=t;}const pt=t-tph;
  const k=Math.min(W/31,H/19),M=mfMap(W/2,H*.47,k),src=[MF_BAR()],box=[-15,-8.6,15,8.6];
  /* 단계 0: 나침반으로 찾기 · 단계 1: 나침반을 치우고 선 위에 화살표가 N극 쪽부터 차례로(멈춘 화살표 — 무엇이 흘러나오는 것이 아니다) · 단계 2: S극으로 들어감 강조 */
  const rv=ph===0?null:(ph===1?Math.min(1,pt/3.5):1);
  mfDrawLines(ctx,M,mfBarLines(box),{alpha:ph>=1?.95:.55,lw:3,every:80,head:12,chev:ph>=1,reveal:rv==null?0:rv});
  mfBar(ctx,M,D.BAR.L,D.BAR.W,1);
  const fade=ph===0?1:Math.max(0,1-(ph===1?pt:9)*1.2);
  if(fade>0){const P=[[-3.6,3.3],[3.6,3.3],[0,4.9],[-3.6,-3.3],[3.6,-3.3],[0,-4.9],[-7.4,-1.3],[7.4,1.3],[D.BAR_GA[0],D.BAR_GA[1]],[D.BAR_NA[0],D.BAR_NA[1]]];
    ctx.save();ctx.globalAlpha=fade;P.forEach(([x,y],i)=>{nd[i]=nd[i]||{};const tg=mfTarget(src,x,y,0),[X,Y]=M(x,y);mfCompass(ctx,X,Y,k*(i>=8?1.15:.9),mfNeedle(nd[i],tg.a,tg.s,dt),{ring:i>=8?MF.ans:null});});
    const [gx,gy]=M(D.BAR_GA[0],D.BAR_GA[1]),[nx,ny]=M(D.BAR_NA[0],D.BAR_NA[1]);txt(ctx,'(가)',gx,gy-k*1.9,26,MF.ans,'center',900);txt(ctx,'(나)',nx,ny+k*1.9,26,MF.ans,'center',900);ctx.restore();}
  const p=.5+.5*Math.sin(t*4);
  if(ph>=1){const [X,Y]=M(D.BAR.L/2,0);ctx.save();ctx.strokeStyle=`rgba(216,56,43,${.4+.5*p})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(X,Y,k*1.6,-Math.PI/2,Math.PI/2);ctx.stroke();ctx.restore();mfPill(ctx,'N극에서 나와서',M(5.6,-7.3)[0],M(5.6,-7.3)[1],26,MF.N);}
  if(ph>=2){const [X,Y]=M(-D.BAR.L/2,0);ctx.save();ctx.strokeStyle=`rgba(47,95,176,${.4+.5*p})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(X,Y,k*1.6,Math.PI/2,Math.PI*1.5);ctx.stroke();ctx.restore();mfPill(ctx,'S극으로 들어간다',M(-5.6,7.3)[0],M(-5.6,7.3)[1],26,MF.S);}
  mfCap(o,ph>=1?'초록 선 = 자기장의 모양(모식), 화살표 = 자기장의 방향':'선 위의 나침반 바늘을 보고 자기장의 방향을 찾아보자',ph>=1?MF.fld:MF.SUBT,H*.95);};};

/* ================= STAGE 2 ================= */
/* 도입 2: 철심 코일에 클립 (빈칸 1: 자기장) */
function mfClipsInit(n,tip,sc){const out=[];for(let i=0;i<n;i++){const a=i*2.39996,r=40+22*Math.sqrt(i);out.push({hx:tip[0]+90+Math.cos(a)*r*1.4,hy:tip[1]+8+Math.sin(a)*r*.9,hr:a,x:null,y:null,r:a,k:0});}return out;}
function mfClipsStep(cl,tip,nOn,dt){/* 앞쪽 nOn 개는 끝(tip)에 모여 붙고, 나머지는 놓인 자리. 붙은 것이 떨어지면 끝 가까이에 흩어진다 */
  cl.forEach((c,i)=>{if(c.x==null){c.x=c.hx;c.y=c.hy;}const on=i<nOn;const sx=tip[0]+18+((i%3)*22),sy=tip[1]+(Math.floor(i/3)%2?14:-10)+(i%3-1)*14;
    if(on){c.k=Math.min(1,c.k+dt*2.2);c.x+=(sx-c.x)*Math.min(1,dt*9);c.y+=(sy-c.y)*Math.min(1,dt*9);c.r+=((i%2?.6:-.4)-c.r)*Math.min(1,dt*6);}
    else{if(c.k>0){c.k=0;c.hx=tip[0]+60+((i*37)%90);c.hy=tip[1]+((i*53)%120)-50;}c.x+=(c.hx-c.x)*Math.min(1,dt*5);c.y+=(c.hy-c.y)*Math.min(1,dt*5);}});}
ANIMS.intro2=o=>{let cl=null;o.frame=()=>{const {ctx,W,H,t}=o;clear(o);mfBg(o);const ph=o.phase,dt=mfTick(o);const on=ph>=1?1:0;
  const em=mfEMDraw(ctx,W*.12,W*.6,H*.36,34,on,0,false,t);if(!cl)cl=mfClipsInit(6,em.tip);mfClipsStep(cl,em.tip,on?5:0,dt);cl.forEach(c=>mfClip(ctx,c.x,c.y,c.r,1.3));
  txt(ctx,'철심',W*.18,H*.36-48,24,MF.SUBT,'center',900);txt(ctx,'코일',W*.36,H*.36-56,24,MF.cu,'center',900);txt(ctx,'철 클립',W*.78,H*.18,24,MF.SUBT,'center',900);
  if(on)mfPill(ctx,'전류가 흐르는 코일 주위에도 자기장!',W*.5,H*.07,24,MF.fld);
  mfCap(o,on?'스위치를 닫아 전류가 흐르자 철 클립이 달라붙었다 (모식)':'철심에 감은 코일에 전류를 흐르게 하면? (모식)',on?MF.fld:MF.SUBT,H*.95);};};

/* ---------- 탐구 장치(위에서 본 모습) — 과정 쪽·가상 실험 공통 ----------
   st = {sw:0~1, swap, lv(0~2), nd:[바늘 상태 6], lines, hi:'sw'|'term'|'lv'|''}.  돌려주는 값 = 누르는 곳 위치 */
function mfApparatus(o,st,dt){const {ctx,W,H}=o;const k=Math.min(W*.6/19.6,H*.5/11.4),M=mfMap(W*.65,H*.43,k);
  const sx=W*.03,sy=H*.04,sw_=W*.25,sh=Math.max(H*.27,196),sup=mfSupply(ctx,sx,sy,sw_,sh,st.lv,st.sw>=1);
  const bd=mfBoard(ctx,M);
  const closed=st.sw>=1,I=closed?(st.swap?-1:1)*mfLv(st.lv):0;
  if(st.lines&&I)mfDrawLines(ctx,M,mfCoilLines(I>0?1:-1),{alpha:.7,lw:3,every:110});
  /* 코일 실험 장치의 단자(판 아래 가장자리 두 개) — 코일 도선의 두 끝이 판 위를 지나 단자에 이어진다 */
  const tL=M(-MF_C.L/2-1.4,-MF_C.R-2.6),tR=M(MF_C.L/2+1.4,-MF_C.R-2.6),ce=mfCoilEnds(M),rb=M(MF_C.L/2+.55,-MF_C.R);
  const lw=Math.max(6,k*.32);ctx.save();ctx.lineCap='round';[[ce.L,tL],[rb,tR]].forEach(([a,b])=>{ctx.strokeStyle=MF.CU2;ctx.lineWidth=lw+3;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.strokeStyle=MF.cu;ctx.lineWidth=lw;ctx.stroke();});ctx.restore();
  /* 스위치: 판 아래(오른쪽 단자 ↔ (−) 쪽 전선 사이) */
  const swx=W*.5,swy=H*.82,sw=mfSwitch(ctx,swx,swy,W*.09,st.sw);txt(ctx,'스위치',swx,swy+46,24,MF.ink,'center',900);
  /* 전선 두 가닥: ㉮ 빨강 — 전원 장치 → 코일 왼쪽 단자,  ㉯ 검정 — 코일 오른쪽 단자 → 스위치 → 전원 장치.  '두 전선 바꾸기' = 전원 장치 쪽 두 끝을 서로 바꿔 끼움 */
  const endA=st.swap?sup.Q:sup.P,endB=st.swap?sup.P:sup.Q;
  const WA=mfWire(ctx,endA,tL,MF.WIRE_R,0,[endA[0],endA[1]+170],[tL[0]-140,tL[1]+10],true);
  const WB1=mfWire(ctx,tR,sw.b,MF.WIRE_K,0,[tR[0],tR[1]+90],[sw.b[0]+90,sw.b[1]],false);
  const WB2=mfWire(ctx,sw.a,endB,MF.WIRE_K,0,[sw.a[0]-200,sw.a[1]],[endB[0],endB[1]+260],true);
  [tL,tR].forEach(q=>{ctx.save();ctx.beginPath();ctx.arc(q[0],q[1],12,0,PI2);ctx.fillStyle='#8E9AA2';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#33404A';ctx.stroke();ctx.restore();});
  mfCoil(ctx,M,I,{lsz:24});
  /* 전류가 흐를 때: 전선 위 화살촉 = (+)에서 나와 (−)로 들어가는 방향 */
  if(I){const f=st.swap?-1:1;mfFlowHeads(ctx,WA,f,[.35,.75]);mfFlowHeads(ctx,WB1,f,[.5]);mfFlowHeads(ctx,WB2,f,[.3,.7]);
    const a1=st.swap?[tL,ce.L]:[ce.L,tL];mfArrowOn(ctx,st.swap?ce.L:tL,st.swap?tL:ce.L,.2,.8,5);mfArrowOn(ctx,st.swap?tR:rb,st.swap?rb:tR,.2,.8,5);}
  // 나침반 6개
  const src=[MF_COIL(I)],r=k*1.12;D.COMPASS6.forEach(([x,y],i)=>{const tg=mfTarget(src,x,y,MF_EARTH),[X,Y]=M(x,y);st.nd[i]=st.nd[i]||{};mfCompass(ctx,X,Y,r,mfNeedle(st.nd[i],tg.a,tg.s,dt||0));});
  mfNorth(ctx,bd[2]-44,bd[1]-62,28);   /* 방위표: 판 오른쪽 위(판 위쪽 = 북쪽) */
  const ring=(x,y,rad)=>{ctx.save();ctx.strokeStyle=MF.ans;ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,rad,0,PI2);ctx.stroke();ctx.restore();};
  if(st.hi==='sw')ring(swx,swy,W*.075);if(st.hi==='term'){ctx.save();ctx.strokeStyle=MF.ans;ctx.lineWidth=5;rr(ctx,sup.Q[0]-44,sup.Q[1]-56,sup.P[0]-sup.Q[0]+88,90,14);ctx.stroke();ctx.restore();}
  if(st.hi==='lv'){ctx.save();ctx.strokeStyle=MF.ans;ctx.lineWidth=5;rr(ctx,sx+6,sy+40,sw_-12,sh*.3+14,10);ctx.stroke();ctx.restore();}
  return {M,sup,sw,swx,swy,I,bd};}

/* 탐구 과정 (단계 3개 — 강조만, 결과는 보여 주지 않는다) */
ANIMS.lab=o=>{const st={sw:0,swap:false,lv:1,nd:[],lines:false,hi:''};o.frame=()=>{clear(o);mfBg(o);const dt=mfTick(o),ph=o.phase;st.hi=['','sw','term','lv'][Math.min(3,ph)];mfApparatus(o,st,dt);

  const c=MF_EX[e];d.sw=false;d.swap=c.swap;d.lv=c.lv;d.ex=e;d.pend=.7;d.ton=0;d.msg=c.nm+' — 스위치를 닫는다…';d.cls='';}

ANIMS.labsim=o=>{cvHitInit(o);o.frame=()=>{const {ctx,W,H}=o;clear(o,false);o._hits=[];const sp=SPCL,d=sp.data,v=sp.v;
  if(!d.init)Object.assign(d,{init:1,sw:false,k:0,swap:false,lv:1,ex:0,pend:0,ton:0,nd:[],lines:false,rec:{},msg:'',cls:'',tt:0});

ANIMS.result=o=>{const nd={};let t1=-1,t2=-1,ph0=-1;cvHitInit(o);o.frame=()=>{const {ctx,W,H}=o;clear(o);mfBg(o);o._hits=[];const ph=o.phase,dt=mfTick(o);

/* 전자석의 이용 (빈칸 4: 세기 · 극 · 기중기 · 철판) */
function mfScrap(ctx,x,y,s,i){ctx.save();ctx.translate(x,y);ctx.rotate(i*.7);ctx.fillStyle=['#8E9AA2','#6B7B82','#A3AEB4'][i%3];ctx.strokeStyle='#33404A';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-s,-s*.4);ctx.lineTo(s*.6,-s*.7);ctx.lineTo(s,s*.3);ctx.lineTo(-s*.3,s*.6);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
ANIMS.use=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);mfBg(o);const ph=o.phase;
  // 위: 전자석의 세기와 극 — 단계 1·2
  const y0=H*.15;txt(ctx,'전류를 조절하면',W*.06,y0-62,24,MF.ink,'left',900);
  const cyc=Math.floor(t/2.4)%2,strong=ph>=1&&cyc===1,rev=ph>=2&&cyc===1;
  mfNail(ctx,W*.08,y0,W*.42,26);mfWound(ctx,W*.11,W*.36,y0,26,10,6);
  const nC=strong?6:3;for(let i=0;i<nC;i++)mfClip(ctx,W*.44+(i%3)*24,y0-12+Math.floor(i/3)*26,i%2?.5:-.4,1.1);
  const tipN=!rev;txt(ctx,tipN?'S':'N',W*.07,y0+40,26,tipN?MF.S:MF.N,'center',900);txt(ctx,tipN?'N':'S',W*.4,y0+40,26,tipN?MF.N:MF.S,'center',900);
  if(ph>=1)mfPill(ctx,strong?'전류 세게 → 자석이 세다':'전류 약하게 → 자석이 약하다',W*.76,y0-22,24,MF.ans,'#FFF3E6');
  if(ph>=2)mfPill(ctx,rev?'전류 방향 반대 → 극이 바뀐다':'처음 전류 방향',W*.76,y0+26,24,rev?MF.ans:MF.SUBT,'#fff');
  if(ph<1)txt(ctx,'무엇을 바꿀 수 있을까?',W*.76,y0,24,MF.SUBT,'center',900);
  ctx.save();ctx.strokeStyle='#D5E0DD';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(24,H*.3);ctx.lineTo(W-24,H*.3);ctx.moveTo(W/2,H*.33);ctx.lineTo(W/2,H*.88);ctx.stroke();ctx.restore();
  // 왼쪽 아래: 전자석 기중기 — 단계 3
  const gx=W*.25,gy=H*.36;txt(ctx,'전자석 기중기',gx,gy+6,24,MF.ink,'center',900);
  if(ph>=3){const c=(t%8)/8;let mx,my,curr;   /* 0~.25 내려감 · .25~.45 전류 ON 들어 올림 · .45~.7 옮김 · .7~.8 전류 OFF 내려놓음 · 돌아감 */
    const xa=W*.12,xb=W*.38,top=H*.48,low=H*.7;
    if(c<.25){mx=xa;my=top+(low-top)*ease(c/.25);curr=false;}else if(c<.45){mx=xa;my=low-(low-top)*ease((c-.25)/.2);curr=true;}else if(c<.7){mx=xa+(xb-xa)*ease((c-.45)/.25);my=top;curr=true;}else if(c<.8){mx=xb;my=top;curr=false;}else{mx=xb-(xb-xa)*ease((c-.8)/.2);my=top;curr=false;}
    ctx.save();ctx.strokeStyle='#55646A';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.04,H*.42);ctx.lineTo(W*.46,H*.42);ctx.stroke();ctx.beginPath();ctx.moveTo(mx,H*.42);ctx.lineTo(mx,my-18);ctx.stroke();ctx.restore();
    for(let i=0;i<7;i++)mfScrap(ctx,xa-36+(i%4)*24,low+30+Math.floor(i/4)*16,12,i);
    ctx.save();ctx.fillStyle='#C9D3D8';ctx.fillRect(xb-44,low+20,88,10);ctx.fillRect(xb-44,low-10,6,40);ctx.fillRect(xb+38,low-10,6,40);ctx.restore();
    const carried=(c>=.25&&c<.7);const dropT=c>=.7&&c<.8?(c-.7)/.1:0;
    for(let i=0;i<3;i++){const sy=carried?my+26+i*4:(dropT>0?top+26+(low+14-top-26)*ease(dropT):null);if(sy!=null)mfScrap(ctx,mx-18+i*18,sy,11,i+3);}
    ctx.save();rr(ctx,mx-34,my-18,68,24,8);ctx.fillStyle='#55646A';ctx.fill();ctx.fillStyle=curr?MF.cu:'#8E9AA2';ctx.fillRect(mx-28,my-12,56,8);ctx.restore();
    mfPill(ctx,curr?'전류 흐름 → 붙는다':'전류 끊음 → 놓는다',gx,H*.84,24,curr?MF.cur:MF.SUBT);}
  else{ctx.save();ctx.setLineDash([8,7]);ctx.strokeStyle='#C9D4D1';ctx.lineWidth=3;rr(ctx,W*.06,H*.42,W*.38,H*.42,16);ctx.stroke();ctx.restore();txt(ctx,'?',gx,H*.63,48,'#8FA29D','center',900);}
  // 오른쪽 아래: 전자석 잠금장치 — 단계 4
  const lx=W*.75;txt(ctx,'전자석 잠금장치',lx,gy+6,24,MF.ink,'center',900);
  if(ph>=4){/* 위에서 본 문(모식): 문틀(벽)에 전자석, 문 끝에 철판. 8초 주기 — 문 닫힘 → 전류 흐름(철판이 붙어 잠김, 밀어도 안 열림) → 전류 끊음 → 문이 열림 */
    const c=(t%8)/8;let ang,cur,push=0,st;
    if(c<.18){ang=40*(1-ease(c/.18));cur=false;st='문을 닫는다';}
    else if(c<.25){ang=0;cur=true;st='전류 흐름 → 철판을 잡아당김';}
    else if(c<.55){ang=0;cur=true;push=Math.abs(Math.sin((c-.25)/.3*Math.PI*6))*1.2;st='잠김 — 당겨도 열리지 않는다';}
    else if(c<.62){ang=0;cur=false;st='전류 끊음';}
    else{ang=40*ease(Math.min(1,(c-.62)/.25));cur=false;st='열림 — 문이 열린다';}
    const wy=H*.5,hx=W*.58,Ld=W*.3,wall0=W*.54,wall1=W*.95;
    ctx.save();ctx.fillStyle='#D9C3A4';ctx.fillRect(wall0,wy-22,wall1-wall0,22);ctx.restore();txt(ctx,'문틀(벽)',wall0+8,wy-38,24,'#5C4A3A','left',900);
    const mx=hx+Ld-26;ctx.save();rr(ctx,mx-40,wy-2,80,22,5);ctx.fillStyle='#55646A';ctx.fill();ctx.fillStyle=cur?MF.cu:'#8E9AA2';ctx.fillRect(mx-32,wy+3,64,10);ctx.restore();   /* 전자석(문틀에 붙음) */
    if(cur){ctx.save();ctx.strokeStyle='rgba(46,125,50,.7)';ctx.lineWidth=3;ctx.setLineDash([5,5]);ctx.beginPath();ctx.ellipse(mx,wy+22,52,18,0,0,Math.PI);ctx.stroke();ctx.restore();}
    const a=(ang+push)*Math.PI/180;ctx.save();ctx.translate(hx,wy+24);ctx.rotate(a);   /* 문: 경첩(hx) 둘레로 돈다 */
    ctx.fillStyle='#C99A74';ctx.strokeStyle='#33404A';ctx.lineWidth=3;rr(ctx,0,0,Ld,22,4);ctx.fill();ctx.stroke();ctx.fillStyle='#A3AEB4';ctx.fillRect(Ld-66,-6,80-16,8);ctx.strokeRect(Ld-66,-6,64,8);ctx.restore();
    ctx.save();ctx.beginPath();ctx.arc(hx,wy+24,7,0,PI2);ctx.fillStyle='#33404A';ctx.fill();ctx.restore();txt(ctx,'경첩',hx-12,wy+56,22,MF.SUBT,'right',800);
    txt(ctx,'전자석',mx+52,wy+8,24,MF.ink,'left',900);
    const pt=[hx+Math.cos(a)*(Ld-34),wy+24+Math.sin(a)*(Ld-34)];txt(ctx,'철판',pt[0]-Math.sin(a)*40+(ang>5?-34:6),pt[1]+Math.cos(a)*40+(ang>5?-6:0),24,MF.ink,ang>5?'right':'left',900);txt(ctx,'문',hx+Math.cos(a)*Ld*.35-Math.sin(a)*38,wy+24+Math.sin(a)*Ld*.35+Math.cos(a)*38,26,'#5C4A3A','center',900);
    if(c>=.25&&c<.55){const ax=hx+Ld*.62;arrow(ctx,ax,wy+62,ax,wy+122,'#7A5BB5',6,18);txt(ctx,'문을 당겨 봄',ax+14,wy+108,24,'#7A5BB5','left',900);}   /* 문은 벽 반대쪽(아래)으로 열린다 → 당기는 방향 */
    mfPill(ctx,st,lx,H*.86,24,cur?MF.cur:MF.SUBT);txt(ctx,'위에서 본 문(모식)',W*.95,H*.42,22,MF.SUBT,'right',800);qaState(o,{door:ang+push,cur,locked:cur&&ang===0});}
  else{ctx.save();ctx.setLineDash([8,7]);ctx.strokeStyle='#C9D4D1';ctx.lineWidth=3;rr(ctx,W*.56,H*.42,W*.38,H*.42,16);ctx.stroke();ctx.restore();txt(ctx,'?',lx,H*.63,48,'#8FA29D','center',900);}
  mfCap(o,'모식 그림 — 전류가 흐를 때만 자석이 되는 성질을 이용한다',MF.SUBT,H*.955);};};

/* 도입 질문 풀기 (단계 3: 늘 자석인가 · 세기 · 극) */
ANIMS.intro3=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);mfBg(o);const ph=o.phase;
  txt(ctx,'막대자석',W*.25,H*.07,32,MF.ink,'center',900);txt(ctx,'전자석',W*.73,H*.07,32,MF.ink,'center',900);
  const M=mfMap(W*.22,H*.22,W*.026);mfBar(ctx,M,10,2.2,1);for(let i=0;i<3;i++)mfClip(ctx,W*.22+W*.13+12+i*6,H*.22+i*22-20,.3*i,1.4);
  const cyc=Math.floor(t/2)%2,on=ph>=1?cyc:1;
  mfNail(ctx,W*.53,H*.22,W*.88,28);mfWound(ctx,W*.56,W*.8,H*.22,28,9,7);if(on)for(let i=0;i<(ph>=2&&Math.floor(t/4)%2?5:3);i++)mfClip(ctx,W*.9+(i%2)*22,H*.22+i*20-22,.3*i,1.4);
  if(ph>=1)txt(ctx,on?'전류 흐름 — 클립이 붙는다':'전류 끊음 — 클립이 떨어진다',W*.73,H*.36,26,on?MF.cur:MF.SUBT,'center',900);
  const rows=[['늘 자석이다','전류가 흐를 때만 자석'],['세기가 정해져 있다','전류의 세기로 세기 조절'],['극이 정해져 있다','전류의 방향으로 극을 바꿈']];
  rows.forEach(([a,b],i)=>{const y=H*(.5+i*.15);if(ph>i){ctx.save();rr(ctx,W*.04,y-36,W*.42,72,16);ctx.fillStyle='#EEF3F5';ctx.fill();rr(ctx,W*.52,y-36,W*.44,72,16);ctx.fillStyle='#FFF3E6';ctx.fill();ctx.restore();
      txt(ctx,a,W*.25,y,30,MF.ink,'center',900);txt(ctx,b,W*.74,y,30,MF.ans,'center',900);}
    else{ctx.save();ctx.setLineDash([8,7]);ctx.strokeStyle='#C9D4D1';ctx.lineWidth=3;rr(ctx,W*.04,y-36,W*.92,72,16);ctx.stroke();ctx.restore();txt(ctx,'?',W*.5,y,30,'#8FA29D','center',900);}});
  mfCap(o,'막대자석과 전자석은 무엇이 다를까? (모식)',MF.SUBT,H*.95,28);};};

/* 생각 넓히기: 공중에 떠 있는 지구의 (단계 2) */
ANIMS.globe=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);mfBg(o);const ph=o.phase,cx=W*.42,bob=Math.sin(t*1.6)*4;
  ctx.save();ctx.fillStyle='#C99A74';ctx.strokeStyle='#5C4A3A';ctx.lineWidth=3;rr(ctx,cx-150,H*.84,300,34,10);ctx.fill();ctx.stroke();
  ctx.lineWidth=16;ctx.strokeStyle='#B38A66';ctx.beginPath();ctx.arc(cx,H*.5,H*.36,Math.PI*.5,Math.PI*1.5,true);ctx.stroke();ctx.restore();
  ctx.save();rr(ctx,cx-90,H*.1,180,52,12);ctx.fillStyle='#C99A74';ctx.fill();ctx.strokeStyle='#5C4A3A';ctx.lineWidth=3;ctx.stroke();ctx.restore();
  const gy=H*.5+bob,R=H*.2;const g=ctx.createRadialGradient(cx-R*.3,gy-R*.3,R*.2,cx,gy,R);g.addColorStop(0,'#9FD3F2');g.addColorStop(1,'#3A7FB8');ctx.save();ctx.beginPath();ctx.arc(cx,gy,R,0,PI2);ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle='#6DBE6A';ctx.beginPath();ctx.ellipse(cx-R*.3,gy-R*.1,R*.32,R*.22,.5,0,PI2);ctx.fill();ctx.beginPath();ctx.ellipse(cx+R*.35,gy+R*.25,R*.25,R*.3,-.3,0,PI2);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#2C5F8A';ctx.beginPath();ctx.arc(cx,gy,R,0,PI2);ctx.stroke();ctx.restore();
  if(ph>=1){ctx.save();rr(ctx,cx-60,H*.1+8,120,36,8);ctx.fillStyle='#55646A';ctx.fill();ctx.restore();mfWound(ctx,cx-48,cx+48,H*.1+26,22,7,5);
    txt(ctx,'전자석',cx+110,H*.1+26,30,MF.ink,'left',900);
    ctx.save();ctx.fillStyle=MF.N;ctx.fillRect(cx-14,gy-R+6,28,22);ctx.fillStyle=MF.S;ctx.fillRect(cx-14,gy-R+28,28,22);ctx.strokeStyle='#33404A';ctx.lineWidth=2;ctx.strokeRect(cx-14,gy-R+6,28,44);ctx.restore();
    txt(ctx,'자석',cx+R+26,gy-R+28,30,MF.ink,'left',900);}
  if(ph>=2){txt(ctx,'S',cx,H*.1+70,32,MF.S,'center',900);txt(ctx,'N',cx+30,gy-R+14,28,MF.N,'center',900);   /* 자기력 화살표가 지나가지 않게 막대 옆에(자동 검사 ①) */
    /* 한 물체(지구의)에 작용하는 두 힘은 같은 작용점(지구의 중심 ●)에서 — 떠 있으므로 크기가 같고 방향이 반대(모식) */
    const L=H*.2;arrow(ctx,cx,gy,cx,gy-L,MF.fld,8,24);arrow(ctx,cx,gy,cx,gy+L,'#4A5A58',8,24);ctx.save();ctx.beginPath();ctx.arc(cx,gy,8,0,PI2);ctx.fillStyle='#1D2B2A';ctx.fill();ctx.restore();
    mfPill(ctx,'자기력(끌어당김)',cx-120,gy-L*.55,28,MF.fld);mfPill(ctx,'중력',cx-60,gy+L*.62,28,'#4A5A58');   /* 화살표 바로 왼쪽, 흰 바탕 알약(지구의 그림 위에서도 읽힘) */
    mfPill(ctx,'서로 다른 극이 마주 보아 끌어당긴다 (예)',W/2,H*.955,28,MF.ans,'#FFF3E6');}
  else mfCap(o,ph>=1?'전자석과 자석의 극은 어떻게 배열되어야 할까?':'지구의가 공중에 떠 있다! 어떻게 가능할까? (모식)',MF.SUBT,H*.955,28);};};

/* 점검 문제 Q4 그림 (정답 공개 단계 3개: ① 내부 자기장 → ② B 바늘 → ③ 작은 그림: 전류를 반대로 한 A 바늘) — 지구 자기장 무시. 큰 그림은 늘 처음 전류 그대로 */
ANIMS.q4=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o,false);mfBg(o);const ph=o.phase,I=D.Q4_CUR,M=mfMap(W*.5,H*.36,Math.min(W*.86/19.6,H*.56/11.4)),k=M.k;mfBoard(ctx,M);mfCoil(ctx,M,I,{label:false,aidx:[1,8]});
  if(ph>=1){const [x0,y0]=M(-MF_C.L/2-.6,0),[x1]=M(MF_C.L/2+.6,0),d=I<0?1:-1;ctx.save();ctx.globalAlpha=.9;arrow(ctx,d>0?x0:x1,y0,d>0?x1:x0,y0,MF.fld,10,28);ctx.restore();mfPill(ctx,'코일 내부 자기장 →',(x0+x1)/2,M(0,-MF_C.R-1.7)[1],28,MF.fld);}
  [[D.Q4_A,'A',99],[D.Q4_B,'B',2]].forEach(([p,nm,need])=>{const [X,Y]=M(p[0],p[1]),b=MAG.B([MF_COIL(I)],p[0],p[1]);
    mfCompass(ctx,X,Y,k*1.15,ph>=need?Math.atan2(b[1],b[0]):null,{kind:ph>=need?'fill':'empty',ring:ph>=need?MF.ans:null});txt(ctx,nm,X+k*1.15+22,Y-k*.9,32,MF.ink,'center',900);});
  /* 아래 작은 그림: 전류를 반대로 바꾸면 */
  const m=mfMap(W*.64,H*.82,k*.5);
  if(ph>=3){mfBoard(ctx,m);mfCoil(ctx,m,-I,{label:false});const [X,Y]=m(D.Q4_A[0],D.Q4_A[1]),b=MAG.B([MF_COIL(-I)],D.Q4_A[0],D.Q4_A[1]);mfCompass(ctx,X,Y,k*.62,Math.atan2(b[1],b[0]),{ring:MF.ans});txt(ctx,'A',X+k*.55+18,Y-k*.5,30,MF.ink,'center',900);
    txt(ctx,'전류를 반대로',W*.05,H*.79,30,MF.ans,'left',900);txt(ctx,'바꾸면',W*.05,H*.86,30,MF.ans,'left',900);}
  else txt(ctx,'위에서 본 모습',W*.05,H*.82,30,MF.SUBT,'left',800);};};


/* ================= 더 알아보기(교과서 밖 · 선택) ================= */
/* 곧은 도선 — 판을 수직으로 뚫는 도선을 위에서 본 모습. ph0 전류 없음(바늘 북쪽) → ph1 ⊙(판 위로 나옴) → ph2 ⊗(반대). 바늘·선 = 엔진(MAG.wire), 지구 자기장 뺀 모식 */
const MF_WRING=[0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4+Math.PI/8;return [3.2*Math.cos(a),3.2*Math.sin(a)];});
function mfWireMark(ctx,X,Y,r,I){ctx.save();ctx.beginPath();ctx.arc(X,Y,r,0,PI2);ctx.fillStyle=MF.cu;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=MF.CU2;ctx.stroke();
  ctx.strokeStyle=ctx.fillStyle='#fff';ctx.lineWidth=5;ctx.lineCap='round';
  if(I>0){ctx.beginPath();ctx.arc(X,Y,r*.28,0,PI2);ctx.fill();}else if(I<0){const q=r*.45;ctx.beginPath();ctx.moveTo(X-q,Y-q);ctx.lineTo(X+q,Y+q);ctx.moveTo(X+q,Y-q);ctx.lineTo(X-q,Y+q);ctx.stroke();}
  ctx.restore();}
/* 옆에서 본 작은 그림: 판(평행사변형)을 수직으로 뚫는 도선 + 전류 화살표 */
function mfWireSide(ctx,x,y,w,I){const h=w*.36,sk=w*.3,cx=x+w/2,t=y-w*.66,bt=y+w*.66,ew=w*.08,eh=ew*.42;
  const wireSeg=(y0,y1)=>{ctx.save();ctx.lineCap='butt';ctx.strokeStyle=MF.CU2;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(cx,y0);ctx.lineTo(cx,y1);ctx.stroke();ctx.strokeStyle=MF.cu;ctx.lineWidth=8;ctx.stroke();ctx.restore();};
  /* ① 판 아래로 내려간 도선(판 뒤에 가려지는 부분 포함) → ② 불투명한 판(두께 띠) → ③ 판을 뚫은 구멍 → ④ 판 위로 올라온 도선. 순서가 '판을 뚫고 지나감'을 만든다 */
  wireSeg(y,bt);ctx.save();ctx.beginPath();ctx.arc(cx,bt,6,0,PI2);ctx.fillStyle=MF.cu;ctx.fill();ctx.restore();
  ctx.save();ctx.beginPath();ctx.moveTo(x,y+h/2);ctx.lineTo(x+w-sk,y+h/2);ctx.lineTo(x+w-sk,y+h/2+9);ctx.lineTo(x,y+h/2+9);ctx.closePath();ctx.fillStyle='#B9C8CD';ctx.fill();
  ctx.beginPath();ctx.moveTo(x+w-sk,y+h/2);ctx.lineTo(x+w,y-h/2);ctx.lineTo(x+w,y-h/2+9);ctx.lineTo(x+w-sk,y+h/2+9);ctx.closePath();ctx.fillStyle='#A7B8BE';ctx.fill();
  ctx.beginPath();ctx.moveTo(x+sk,y-h/2);ctx.lineTo(x+w,y-h/2);ctx.lineTo(x+w-sk,y+h/2);ctx.lineTo(x,y+h/2);ctx.closePath();ctx.fillStyle='#E4ECEF';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#9DB0B6';ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,y,ew,eh,0,0,PI2);ctx.fillStyle='#55646A';ctx.fill();ctx.restore();
  wireSeg(t,y);ctx.save();ctx.beginPath();ctx.ellipse(cx,y,7,3,0,0,PI2);ctx.fillStyle=MF.CU2;ctx.fill();ctx.beginPath();ctx.arc(cx,t,6,0,PI2);ctx.fillStyle=MF.cu;ctx.fill();ctx.restore();
  if(I){const a=I>0?[cx,bt-14,cx,t+10]:[cx,t+14,cx,bt-10];arrow(ctx,a[0]+22,a[1],a[2]+22,a[3],MF.cur,6,18);txt(ctx,'전류',cx+36,y-w*.4,24,MF.cur,'left',900);}

const MF_HINTS=['오른손 네 손가락을 윗면 도선의 전류 방향으로 감아쥐면 엄지손가락이 코일 내부의 자기장 방향을 가리킨다.','코일 양 끝 바깥의 자기장은 내부와 같은 방향, 코일 바깥 옆(위·아래)은 내부와 반대 방향이다.','전류는 (+)단자에서 나와 코일로 들어간다. 왼쪽 단자로 들어오면 윗면 도선에서 전류는 화면 위쪽으로 흐른다.'];
function chRender(){const root=document.querySelector('.slide.active .chbox');if(!root)return;const m=root.querySelector('[data-chmsg]');m.textContent=MFCH.msg;m.className='chmsg'+(MFCH.cls?' '+MFCH.cls:'');

function chCheck(){if([0,1,2].some(i=>MFCH.pick[i]==null)){MFCH.msg='A, B, C 모두 골라야 확인할 수 있어.';MFCH.cls='';return;}
  const bad=[0,1,2].filter(i=>MFCH.pick[i]!==mfChAns(i)).length;
  if(!bad){MFCH.solved=true;MFCH.stars=Math.max(1,3-MFCH.hints-MFCH.wrong);MFCH.total+=MFCH.stars;MFCH.cls='ok';MFCH.msg='정답! 별 '+MFCH.stars+'개. 코일 내부의 자기장 방향을 먼저 찾으면 끝은 같은 방향, 바깥 옆은 반대 방향이다.';return;}
  MFCH.wrong++;MFCH.cls='bad';MFCH.msg='아직 맞지 않는 것이 '+bad+'개 있어. 코일 내부의 자기장 방향부터 다시 찾아보자.';}

    else if(b.dataset.chact==='check'&&!MFCH.solved)chCheck();

    else if(b.dataset.chact==='new'){MFCH.round++;MFCH.shuffle();MFCH.reset();}
    chRender();});}
