/* ---------- 손으로 여닫는 스위치 (v3.27e) ----------
   그림 속 스위치를 눌러도 되고(캔버스 hit), 왼쪽 글 칸의 버튼(키보드·스크린 리더용)으로도 여닫는다. 두 방법이 같은 상태 RCSW 를 바꾼다.
   캔버스를 눌렀을 때 스위치 위면 '다음 쪽으로 넘어가기'를 막는다(stopPropagation). */
const RCSW={ser:true,par:true,hs:[true,false,true]};
function rcHitInit(o){if(o._hitOn||!o.cv)return;o._hitOn=1;o._hits=[];
  const toD=e=>{const r=o.cv.getBoundingClientRect(),cw=o.cv.clientWidth,ch=o.cv.clientHeight,sc=window.ANIM_STAGE?Math.min(1,cw/o.W,ch/o.H):1,ox=(cw-o.W*sc)/2,oy=(ch-o.H*sc)/2;
    return [((e.clientX-r.left)*cw/r.width-ox)/sc,((e.clientY-r.top)*ch/r.height-oy)/sc];};
  const find=e=>{const [x,y]=toD(e);return (o._hits||[]).find(h=>Math.hypot(x-h.x,y-h.y)<h.r);};
  o.cv.addEventListener('click',e=>{const h=find(e);if(!h)return;e.stopPropagation();h.fn();rcSwSync();});
  ['pointerdown','mousedown','touchstart'].forEach(ev=>o.cv.addEventListener(ev,e=>{if(e.touches?find(e.touches[0]):find(e))e.stopPropagation();}));
  o.cv.addEventListener('mousemove',e=>{o.cv.style.cursor=find(e)?'pointer':'';});}
/* 누를 수 있는 스위치 표시(옅은 점선 고리) + 눌림 영역 등록 */
function rcHit(o,x,y,r,fn,hint){o._hits.push({x,y,r,fn});if(hint!==false){const c=o.ctx;c.save();c.setLineDash([5,5]);c.lineWidth=2.5;c.strokeStyle='rgba(224,168,46,'+(.45+.3*Math.sin(o.t*3))+')';c.beginPath();c.arc(x,y,r*.8,0,PI2);c.stroke();c.restore();}}
const rcSwk=(cur,on,dt)=>on?Math.min(1,cur+dt*4):Math.max(0,cur-dt*4);   // 약 0.25초에 걸쳐 여닫힘
/* 글 칸 버튼: data-sw="ser|par|h0|h1|h2" */
const RC_SWNAME={ser:'직렬 회로 스위치',par:'병렬 회로 스위치',h0:'전등 스위치',h1:'텔레비전 스위치',h2:'냉장고 스위치'};
const rcSwGet=k=>k[0]==='h'?RCSW.hs[+k[1]]:RCSW[k];
function rcSwSet(k,v){if(k[0]==='h')RCSW.hs[+k[1]]=v;else RCSW[k]=v;}
function rcSwSync(){document.querySelectorAll('[data-sw]').forEach(b=>{const on=rcSwGet(b.dataset.sw);b.textContent=RC_SWNAME[b.dataset.sw]+(on?' 열기':' 닫기');b.classList.toggle('on',on);});}
function rcSwBar(keys){return `<div class="swbar" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">${keys.map(k=>`<button class="cbtn" data-sw="${k}" style="font-size:24px;min-height:72px;padding:8px 22px"></button>`).join('')}</div>`;}
function rcSwEnter(el,init){if(init)Object.keys(init).forEach(k=>rcSwSet(k,init[k]));   /* 쪽에 들어올 때마다 처음 상태로 */
  const bar=el.querySelector('.swbar');if(bar&&!bar._b){bar._b=1;stopAll(bar);bar.addEventListener('click',e=>{const b=e.target.closest('[data-sw]');if(!b)return;rcSwSet(b.dataset.sw,!rcSwGet(b.dataset.sw));if(e.detail>0)b.blur();rcSwSync();});}rcSwSync();}

/* 애니메이션: ANIMS.이름 = o => { o.frame = () => {…} }.  o.phase = 공개한 단계(빈칸 번호), 빈칸 순서 = 단계 번호.
   모든 값은 모식(전원 3.0 V, 전구 1개 10 Ω 일정)이며 전류는 CIRC.series / CIRC.parallel(engine/sim_circuit.js)로 계산한다(bcSolve). */
const rcCap=(o,s,col,y,sz)=>txt(o.ctx,s,o.W*.5,y==null?o.H*.95:y,sz||26,col||TH.ink,'center',800);
function rcTitle(ctx,x,y,s,col,al){txt(ctx,s,x,y,25,col||RC.INK,al||'left',900);}

/* ---------- 표지 · 도입: 장식용 전구 ---------- */
function rcGarland(ctx,x0,x1,y,n,col,on,t,sag){sag=sag||26;ctx.save();ctx.strokeStyle='#2E7D4F';ctx.lineWidth=4;ctx.beginPath();
  for(let i=0;i<=40;i++){const f=i/40,x=x0+(x1-x0)*f,yy=y+sag*Math.sin(f*Math.PI*n)**2;i?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}ctx.stroke();ctx.restore();
  for(let i=0;i<n;i++){const f=(i+.5)/n,x=x0+(x1-x0)*f,yy=y+sag+6;
    ctx.save();ctx.fillStyle='#55646A';ctx.fillRect(x-6,yy-12,12,10);ctx.restore();
    if(on>0){const g=ctx.createRadialGradient(x,yy+12,3,x,yy+12,30);g.addColorStop(0,'rgba('+col+','+(.7*on)+')');g.addColorStop(1,'rgba('+col+',0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,yy+12,30,0,PI2);ctx.fill();}
    ctx.save();ctx.beginPath();ctx.moveTo(x,yy-2);ctx.bezierCurveTo(x-13,yy+4,x-12,yy+22,x,yy+30);ctx.bezierCurveTo(x+12,yy+22,x+13,yy+4,x,yy-2);
    ctx.fillStyle=on>0?'rgba('+col+','+(.35+.65*on)+')':'#E6ECEA';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#4A5A58';ctx.stroke();ctx.restore();}}
const rcBlink=(t,g)=>{const c=((t/1.8+g)%2+2)%2;return c<1?Math.min(1,c*5,(1-c)*5):0;};   // 두 묶음(g=0,1)이 1.8초씩 번갈아 켜진다(부드럽게)
ANIMS.cover=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);ctx.save();rr(ctx,4,4,W-8,H-8,28);ctx.fillStyle=RC.BG;ctx.fill();ctx.restore();
  txt(ctx,'두 줄의 전구가 번갈아 켜진다',W*.5,H*.1,28,RC.INK,'center',900);
  rcGarland(ctx,W*.08,W*.92,H*.3,6,'244,195,59',rcBlink(t,0),t);rcGarland(ctx,W*.08,W*.92,H*.56,6,'232,112,106',rcBlink(t,1),t);
  txt(ctx,'어떻게 연결했을까?',W*.5,H*.9,30,RC.CUR,'center',900);};};
ANIMS.deco=o=>{const P=[[.5,.27],[.42,.4],[.58,.42],[.34,.55],[.5,.56],[.66,.54],[.28,.7],[.42,.71],[.58,.72],[.72,.69]];
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
  ctx.save();ctx.fillStyle='#2E7D4F';[[.5,.12,.2,.36],[.5,.28,.3,.55],[.5,.44,.38,.76]].forEach(([cx,ty,hw,by])=>{ctx.beginPath();ctx.moveTo(W*cx,H*ty);ctx.lineTo(W*(cx-hw),H*by);ctx.lineTo(W*(cx+hw),H*by);ctx.closePath();ctx.fill();});
  ctx.fillStyle='#8A5A44';ctx.fillRect(W*.47,H*.76,W*.06,H*.08);ctx.restore();
  ohStarRC(ctx,W*.5,H*.11,22);
  P.forEach(([x,y],i)=>{const g=i%2,on=rcBlink(t,g),col=g?'232,112,106':'244,195,59';
    if(on>0){const rg=ctx.createRadialGradient(W*x,H*y,3,W*x,H*y,34);rg.addColorStop(0,'rgba('+col+','+(.75*on)+')');rg.addColorStop(1,'rgba('+col+',0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(W*x,H*y,34,0,PI2);ctx.fill();}
    ctx.beginPath();ctx.arc(W*x,H*y,13,0,PI2);ctx.fillStyle=on>0?'rgba('+col+','+(.35+.65*on)+')':'#E6ECEA';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#4A5A58';ctx.stroke();});
  rcCap(o,'어떤 전구는 켜지고, 어떤 전구는 꺼져 있다 (모식)',RC.SUB,H*.93);};};
function ohStarRC(ctx,x,y,r){rcStar(ctx,x,y,r,'#F4C33B');}

/* ---------- STAGE 1 : 직렬연결 · 병렬연결 낱말 (빈칸 2개: 한 줄 · 여러 개의 줄) ---------- */
ANIMS.defs=o=>{const S1={},S2={},k={s:1,p:1};rcHitInit(o);o.frame=()=>{const {ctx,W,H,t}=o;clear(o);o._hits=[];const dt=bcTick(o),ph=o.phase;
  /* v3.27d 교사 요청: 이름은 회로 아래, 설명 알약은 그림 가운데 위, 스위치 이름표는 뺀다. v3.27e: 스위치를 눌러 여닫는다(그림 속 스위치 또는 왼쪽 버튼) */
  k.s=rcSwk(k.s,RCSW.ser,dt);k.p=rcSwk(k.p,RCSW.par,dt);
  const g1=bcCircuit(ctx,{x:0,y:H*.055,w:W,h:H*.33},{kind:'ser',st:S1,dt,t,amm:'none',sw:k.s,swLabel:false,noV:true,path:ph>=1&&k.s>=1?'all':null});
  const g2=bcCircuit(ctx,{x:0,y:H*.535,w:W,h:H*.33},{kind:'par',st:S2,dt,t,amm:'none',sw:k.p,swLabel:false,noV:true,path:ph>=2&&k.p>=1?'all':null});
  rcHit(o,g1.sx,g1.Bt,46,()=>{RCSW.ser=!RCSW.ser;});rcHit(o,g2.sx,g2.Bt,46,()=>{RCSW.par=!RCSW.par;});
  txt(ctx,'직렬연결',W*.5,H*.4,26,RC.SER,'center',900);txt(ctx,'병렬연결',W*.5,H*.88,26,RC.PAR,'center',900);
  if(ph===1)pill(ctx,'전류가 지나는 길이 하나 — 한 줄',W*.5,H*.035,24,RC.SER);
  if(ph>=2)pill(ctx,'갈라졌다가 다시 만나는 여러 줄',W*.5,H*.49,24,RC.PAR);
  const anyOpen=!RCSW.ser||!RCSW.par;
  rcCap(o,anyOpen?'스위치가 열린 회로는 길이 끊겨 두 전구가 함께 꺼지고, 전자는 그 자리에 멈춘다':(ph===0?'두 회로에서 전류가 지나는 길을 비교해 보자 · 스위치를 눌러 여닫아 보자':'주황 띠 = 전류가 지나는 길 · 파란 (−) = 전자(전류와 반대 방향으로 이동)'),anyOpen?RC.EL:RC.SUB,H*.966,22);};};

/* ---------- STAGE 1 : 해 보기 과정 (빈칸 없음) ---------- */
ANIMS.setup=o=>{const st=[{},{},{}],sk=[0,0,0];o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const hh=H*.285,dt=bcTick(o),ph=o.phase;
  /* v3.27d: 클릭 1 = 과정 ① 스위치를 닫아 기준 밝기 관찰(닫히는 움직임 + 전자가 한꺼번에 움직이기 시작) · 클릭 2·3 = 과정 ②·③ 을 가리키고 예상만 묻는다
     (②·③ 의 결과를 여기서 보여 주면 다음 쪽 가상 실험의 '예상'이 의미가 없어진다 — 스위치는 가상 실험에서 직접 닫는다) */
  [['one','① 전구 1개'],['ser','② 전구 2개를 직렬로'],['par','③ 전구 2개를 병렬로']].forEach(([k,n],i)=>{const y=H*.02+i*(hh+H*.022),cur=ph===i+1;
    sk[i]=(i===0&&ph>=1)?Math.min(1,sk[i]+dt*3):Math.max(0,sk[i]-dt*3);
    if(cur){ctx.save();rr(ctx,W*.01,y-6,W*.98,hh+10,14);ctx.fillStyle='rgba(244,195,59,.14)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#E0A82E';ctx.stroke();ctx.restore();}
    txt(ctx,n,W*.03,y+12,24,i===1?RC.SER:i===2?RC.PAR:RC.INK,'left',900);
    const g=bcCircuit(ctx,{x:W*.12,y:y+6,w:W*.86,h:hh},{kind:k,st:st[i],dt,t,amm:'none',sw:sk[i],swLabel:false,noV:true}),gx=(g.L+g.R)/2,gy=k==='par'?g.yM:(g.T+g.Bt)/2;   /* 병렬은 위·아래 가지 사이의 빈 곳 */   /* 안내 글은 회로 고리 안의 빈 곳에(왼쪽 도선과 겹치지 않게) */
    if(i===0&&sk[0]>=1)txt(ctx,'기준 밝기',gx,gy,22,RC.CUR,'center',900);
    if(i>0&&cur)txt(ctx,k==='par'?'1개일 때보다? → 예상':'1개일 때보다 밝을까, 어두울까? → 예상',gx,gy,22,RC.CUR,'center',900);});
  rcCap(o,ph===0?'스위치를 열어 둔 상태(닫기 전) — 회로를 확인하자':ph===1?'스위치를 닫는 순간 회로 전체의 전자가 한꺼번에 움직인다':'②·③은 밝기를 예상한 뒤, 다음 쪽 가상 실험에서 스위치를 닫아 확인',RC.SUB,H*.975,23);};};

/* ---------- 시뮬레이션 ① 전구 연결 가상 실험 (id: cx) ---------- */
const RC_KN=['one','ser','par'],RC_KNAME=['전구 1개','직렬연결','병렬연결'];
const SPX=SIMSPEC.define({id:'cx',
  vars:[{id:'pred',label:'예상',choice:[[0,'더 밝다'],[1,'같다'],[2,'더 어둡다']],def:null},
        {id:'kind',label:'연결',choice:[[0,'전구 1개'],[1,'직렬연결'],[2,'병렬연결']],def:0,onChange:(v,sp)=>{if(sp.data){sp.data.rmB=false;sp.data.sw=false;}}}],   /* 회로를 바꿀 때는 스위치를 연다(실제 실험 순서) */
  reads:[{id:'It',label:'전류계(전체 전류)'},{id:'va',label:'전구 A에 걸리는 전압'},{id:'ba',label:'전구 A의 밝기'},{id:'cmp',label:'예상과 비교'}],
  flow:[{label:'예상: 전구 2개를 직렬로 연결하면 전구 하나의 밝기는 1개일 때보다?',var:'pred'},
        {label:'연결 방법 고르기',var:'kind',hint:'회로를 바꾸면 스위치가 열린다'},
        {label:'스위치를 닫아 밝기 관찰하기',act:'sw',btn:'스위치 닫기'},
        {label:'전구 B를 빼 보기',hint:'전구 2개일 때 눌러 봐요',act:'pull',btn:'전구 B 빼기'}],
  extra:[{id:'sw',label:'스위치 닫기',onClick:sp=>{const D=sp.data;if(!D.init)return;D.sw=!D.sw;D.swUsed=1;if(D.sw)D.swT=D.tt;}},
         {id:'pull',label:'전구 B 빼기',onClick:sp=>{const D=sp.data;if(!D.init||sp.v.kind===0)return;D.rmB=!D.rmB;D.used=1;}}],
  pace:.5,compact:true,
  scale:{mode:'schematic',note:'전자의 수·속도·크기는 비율 없이 그린 모식도이고 값은 모식(3.0 V, 전구 10 Ω)이다'},motion:true});
const rcBright=(b,kind)=>b<1e-6?'꺼짐':(kind===0?'기준':(b>.95?'1개일 때와 같다':'1개일 때보다 어둡다'));
ANIMS.sim_cx=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);
  let D=SPX.data;if(!D.init)Object.assign(D,{init:1,st:{},rmB:false,used:0,rec:{},tt:0,sig:'',sw:false,swk:0,swUsed:0,swT:-9});
  const v=SPX.v,dt=SPX.dt(o.t);D.tt+=dt;D.swk=D.sw?Math.min(1,D.swk+dt*4):Math.max(0,D.swk-dt*4);   /* 스위치가 약 0.25초 동안 움직여 닫힌다·열린다 */const kind=v.kind==null?0:v.kind,kn=RC_KN[kind],rm=[false,kind>0&&D.rmB];
  const Hu=H-SPX.readsHeight(24)-(o.legendGap||30)-6;
  const g=bcCircuit(ctx,{x:0,y:Hu*.045,w:W,h:Hu*.56},{kind:kn,rm,st:D.st,dt,t:D.tt,names:kind>0,arrows:true,sw:D.swk});
  txt(ctx,RC_KNAME[kind],W*.04,Hu*.05,26,kind===1?RC.SER:kind===2?RC.PAR:RC.INK,'left',900);
  const S=g.S,r=D.rec[kind]=D.rec[kind]||{};if(!g.swOpen){if(!rm[1]){r.I=S.It;r.b=S.ba;}else{r.pull=S.ba>1e-6?'그대로 켜짐':'꺼짐';}}   /* 스위치를 닫았을 때만 기록 */
  if(g.swOpen)txt(ctx,'스위치 열림 — 전류가 흐르지 않는다 (전자는 제자리에 멈춰 있다)',W*.5,Hu*.625,21,RC.SUB,'center',800);
  else if(D.tt-D.swT<3.5&&S.It>0)txt(ctx,'스위치를 닫는 순간 회로 전체의 전자가 한꺼번에 움직이기 시작한다',W*.5,Hu*.625,21,RC.EL,'center',800);
  // 기록 표
  const tx=W*.04,ty=Hu*.66,cw=[W*.2,W*.22,W*.26,W*.24],rh=Math.min(40,(Hu-ty)/4.3),hd=['연결','전체 전류','전구 A의 밝기','B를 빼면 A는'];
  let cx0=tx;hd.forEach((h,j)=>{txt(ctx,h,cx0+cw[j]/2,ty+rh/2,22,RC.SUB,'center',900);cx0+=cw[j];});
  ctx.save();ctx.strokeStyle='#C9D4D1';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx,ty+rh);ctx.lineTo(tx+cw.reduce((a,b)=>a+b,0),ty+rh);ctx.stroke();ctx.restore();
  [0,1,2].forEach(i=>{const yy=ty+rh*(i+1.55),R_=D.rec[i]||{};let c=tx;const cells=[RC_KNAME[i],R_.I!=null?bcA(R_.I):'',R_.b!=null?rcBright(R_.b,i):'',i===0?'—':(R_.pull||'')];
    if(i===kind){ctx.save();ctx.fillStyle='rgba(244,195,59,.22)';rr(ctx,tx-6,yy-rh/2+2,cw.reduce((a,b)=>a+b,0)+12,rh-4,8);ctx.fill();ctx.restore();}
    cells.forEach((s,j)=>{txt(ctx,s,c+cw[j]/2,yy,22,j===0?(i===1?RC.SER:i===2?RC.PAR:RC.INK):(j===1?RC.CUR:RC.INK),'center',j===0?900:800);c+=cw[j];});});
  const serSeen=D.rec[1]&&D.rec[1].b!=null;
  Object.assign(SPX.r,{It:bcA(S.It),va:S.Va.toFixed(1)+' V',ba:g.swOpen?'꺼짐 (스위치 열림)':(rm[1]&&S.ba<1e-6?'꺼짐':rcBright(S.ba,kind)),
    cmp:serSeen?'(직렬 결과) '+(v.pred==null?'예상을 고르지 않았다 — 직렬연결이면 전구가 어두워진다':(v.pred===2?'예상과 같다! 직렬연결이면 전구가 어두워진다':'예상과 달랐다! 직렬연결이면 각 전구에 걸리는 전압과 전류가 작아져 어두워진다')):'직렬연결에서 스위치를 닫아 보자'});
  SPX.btnText('pull',kind===0?'전구 2개일 때 눌러요':(D.rmB?'전구 B 다시 끼우기':'전구 B 빼기'));SPX.btnText('sw',D.sw?'스위치 열기':'스위치 닫기');
  const p0=v.pred!=null,sig=[p0,D.used,D.swUsed,D.sw,kind>0].join('|');if(sig!==D.sig){D.sig=sig;SPX.setFlow({pred:p0?'done':'now',kind:p0?'now':'lock',sw:p0?'now':'lock',pull:p0&&D.swUsed&&kind>0?'now':'lock'});}
  readsAt(SPX,o);};};

/* ---------- STAGE 1 결과 (빈칸 5개: 어두워진다 · 동일한 · 변함이 없다 · 꺼진다 · 들어온다) ---------- */
ANIMS.result=o=>{const st=[{},{},{},{},{}];o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=bcTick(o),ph=o.phase;
  // 기준: 전구 1개
  txt(ctx,'기준 : 전구 1개',W*.03,H*.09,23,RC.INK,'left',900);
  bcCircuit(ctx,{x:W*.3,y:H*.03,w:W*.46,h:H*.17},{kind:'one',st:st[4],dt,t,amm:'none',noV:true});
  const cw=W*.5,chh=H*.385,cells=[{k:'ser',rm:[false,false],at:1,tt:'직렬 · 전구 2개',res:'1개일 때보다 어둡다',x:0,y:H*.22},
    {k:'ser',rm:[false,true],at:4,tt:'직렬 · B를 뺐을 때',res:'A도 꺼진다',x:cw,y:H*.22},
    {k:'par',rm:[false,false],at:2,tt:'병렬 · 전구 2개',res:ph>=3?'1개일 때와 밝기가 같다':'각 전구에 3.0 V',x:0,y:H*.61},
    {k:'par',rm:[false,true],at:5,tt:'병렬 · B를 뺐을 때',res:'A는 그대로 켜져 있다',x:cw,y:H*.61}];
  cells.forEach((c,i)=>{const on=ph>=c.at,col=c.k==='ser'?RC.SER:RC.PAR;
    ctx.save();rr(ctx,c.x+6,c.y,cw-12,chh-8,14);ctx.strokeStyle=on?col:'#D5E0DD';ctx.lineWidth=3;ctx.stroke();ctx.restore();
    txt(ctx,c.tt,c.x+cw/2,c.y+24,22,col,'center',900);
    bcCircuit(ctx,{x:c.x+4,y:c.y+40,w:cw-8,h:chh-86},{kind:c.k,rm:c.rm,st:st[i],dt,t,amm:'none',noV:true,unlit:!on,hideEl:!on});
    /* v3.27e: 전구 옆 '3.0 V' 알약은 좁은 칸에서 빛·도선·전원과 겹쳐 뺐다 — 아래 글 '각 전구에 3.0 V'로 나타낸다 */
    if(on)txt(ctx,c.res,c.x+cw/2,c.y+chh-26,22,RC.CUR,'center',900);else txt(ctx,'?',c.x+cw/2,c.y+chh-26,26,'#8FA29D','center',900);});};};

/* ---------- STAGE 2 : 직렬 = 길이가 길어짐 (빈칸 3개: 길이 · 커지고 · 작아진다) ---------- */
ANIMS.serlen=o=>{const s1={},s2={};o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const dt=bcTick(o),ph=o.phase;
  rcTitle(ctx,W*.03,H*.04,'저항 1개',RC.INK);rcTitle(ctx,W*.03,H*.49,'저항 2개를 직렬로',RC.SER);
  bcCircuit(ctx,{x:0,y:H*.05,w:W,h:H*.34},{kind:'one',res:true,st:s1,dt,t,meters:ph>=3});

/* ---------- STAGE 4 : 가정의 전기 배선 (빈칸 3개: 병렬 · 220 V · 병렬) ---------- */

  [[x,y-14],[x,y+14]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4.5,0,PI2);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();});
  const c=closed===true?1:closed===false?0:closed;ctx.beginPath();ctx.moveTo(x,y+12);ctx.lineTo(x+14*(1-c),y-12+4*(1-c));ctx.stroke();ctx.restore();}   /* closed: true/false 또는 0~1 */
ANIMS.house=o=>{const hk=[1,0,1];rcHitInit(o);o.frame=()=>{const {ctx,W,H,t}=o;clear(o);o._hits=[];const dt=bcTick(o),ph=o.phase,yt=H*.2,yb=H*.62;   /* v3.27e: 기구마다 스위치를 학생이 직접 여닫는다(예전엔 시간에 따라 저절로) */
  ctx.save();ctx.strokeStyle=RC.WIRE;ctx.lineWidth=9;ctx.lineCap='round';[yt,yb].forEach(y=>{ctx.beginPath();ctx.moveTo(W*.04,y);ctx.lineTo(W*.97,y);ctx.stroke();});ctx.restore();
  txt(ctx,'바깥에서',W*.06,yt-46,22,RC.SUB,'left',800);txt(ctx,'스위치를 눌러 켜고 꺼 보자',W*.97,yt-24,22,'#B07A10','right',800);txt(ctx,'들어오는 전기',W*.06,yt-20,22,RC.SUB,'left',800);
  const AP=[['lamp','전등',W*.33,4.1,0],['tv','텔레비전',W*.58,5.3,1.7],['fridge','냉장고',W*.83,3.4,.6]];
  AP.forEach(([k,n,x,T_,off],i)=>{hk[i]=rcSwk(hk[i],RCSW.hs[i],dt);const on=hk[i]>=1;
    if(ph>=1&&on){const p=.5+.5*Math.sin(t*4+i);ctx.save();ctx.strokeStyle='rgba(180,84,15,'+(.18+.16*p)+')';ctx.lineWidth=22;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,yt);ctx.lineTo(x,yb);ctx.stroke();ctx.restore();}

    for(let i=0;i<4;i++){const sx=mx-120+i*80;ctx.save();ctx.beginPath();ctx.arc(sx,my,16,0,PI2);ctx.fillStyle='#EDE7F7';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=RC.PAR;ctx.stroke();ctx.fillStyle=RC.PAR;ctx.fillRect(sx-7,my-3,4,6);ctx.fillRect(sx+3,my-3,4,6);ctx.restore();}

ANIMS.tap=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const ph=o.phase,n=Math.min(4,ph+1),Itot=RC_TAP.slice(0,n).reduce((a,b)=>a+b[1],0),LIM=16,over=Itot>LIM;

/* ---------- 도전 : 비밀 상자의 연결 (RCCH = lib.js) ---------- */
ANIMS.chal=o=>{o.frame=()=>{const {ctx,W,H,t}=o;clear(o);

    if(RCCH.solved)txt(ctx,bx.mode==='s'?'직렬':'병렬',W*.6,y+20,22,'#fff','center',900);});
  for(let i=0;i<3;i++)rcStar(ctx,W*.1+i*52,H*.968,18,RCCH.solved&&i<RCCH.stars?'#F4C33B':'#E6ECEA');
  txt(ctx,'상자 안 전선은 보이지 않는다 · 같은 전원 3.0 V (모식)',W*.95,H*.975,22,RC.SUB,'right',700);};};

const CHUI=`<div class="simspec chbox" style="display:flex;flex-direction:column;gap:8px">

  <div class="chbar"><button class="cbtn go" data-chact="check">정답 확인</button><button class="cbtn" data-chact="hint">💡 힌트</button><button class="cbtn" data-chact="new">↻ 새 문제</button></div>
  <div class="chmsg" data-chmsg></div><div class="chstar" data-chstar></div></div>`;
const RC_HINTS=['기준 전구(1개)와 밝기를 비교해 보자. 병렬이면 각 전구에 전원의 전압이 그대로 걸려 기준과 밝기가 같았어.','전구 하나를 빼 보자. 나머지 전구가 모두 꺼지면 전류가 지나는 길이 몇 개라는 뜻일까?','전류계를 보자. 같은 전구를 더 연결했는데 전체 전류가 기준(0.30 A)보다 커졌다면 전체 저항은 커졌을까, 작아졌을까?'];
function chRender(root){
  root.querySelectorAll('.gkinds').forEach(g=>{const i=+g.dataset.g;g.querySelectorAll('[data-d]').forEach(b=>{const on=RCCH.ans[i]===b.dataset.d;
    b.classList.toggle('sel',on&&RCCH.res[i]==null);b.classList.toggle('ok',on&&RCCH.res[i]===true);b.classList.toggle('bad',on&&RCCH.res[i]===false);});
    const p=g.querySelector('[data-pull]');p.textContent=RCCH.boxes[i]&&RCCH.boxes[i].pulled?'다시 끼우기':'전구 빼기';});
  const m=root.querySelector('[data-chmsg]');m.textContent=RCCH.msg;m.className='chmsg'+(RCCH.cls?' '+RCCH.cls:'');
  root.querySelector('[data-chstar]').textContent='★ 모은 별 '+RCCH.total+'개 · 도전 '+RCCH.round+'번째';
  root.querySelector('[data-chact="check"]').disabled=RCCH.solved;}
function chCheck(){
  if(RCCH.ans.some(a=>a===null)){RCCH.msg='세 상자 모두 직렬인지 병렬인지 골라 줘!';RCCH.cls='bad';return;}
  const ok=RCCH.boxes.map((b,i)=>RCCH.ans[i]===b.mode);
  if(ok.every(Boolean)){RCCH.res=ok;RCCH.solved=true;RCCH.stars=Math.max(1,3-RCCH.hints-RCCH.wrong);RCCH.total+=RCCH.stars;RCCH.cls='ok';
    RCCH.msg='정답! 별 '+RCCH.stars+'개. 직렬 상자는 기준보다 어둡고 전체 전류가 작으며 하나를 빼면 모두 꺼진다. 병렬 상자는 기준과 밝기가 같고 전체 전류가 크다.';return;}
  RCCH.wrong++;RCCH.cls='bad';
  const nb=ok.filter(x=>!x).length,pulled=RCCH.boxes.some(b=>b.pulled);   // 어느 상자가 틀렸는지는 알려 주지 않는다(두 가지 중 하나라 찍기로 풀린다)
  RCCH.msg='아직 맞지 않는 상자가 있어. '+(pulled?'뺀 전구를 다시 끼운 상태에서 기준과 비교해 보자. ':'')+'기준보다 어둡고 전체 전류가 작으면 어떤 연결일까? 기준과 밝기가 같고 전체 전류가 크면?';}
function chEnter(el){
  const root=el.querySelector('.chbox');if(!root)return;if(!RCCH.boxes.length)RCCH.shuffle();RCCH.reset();
  if(!root._b){root._b=1;stopAll(root);
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.blur();
      if(b.dataset.pull!=null){const bx=RCCH.boxes[+b.dataset.pull];bx.pulled=!bx.pulled;}
      else if(b.dataset.d!=null&&!RCCH.solved){const i=+b.closest('.gkinds').dataset.g;RCCH.ans[i]=b.dataset.d;RCCH.res[i]=null;}
      else if(b.dataset.chact==='check'&&!RCCH.solved)chCheck();
      else if(b.dataset.chact==='hint'&&!RCCH.solved){RCCH.msg='💡 '+RC_HINTS[Math.min(RCCH.hints,2)];RCCH.hints=Math.min(3,RCCH.hints+1);RCCH.cls='';}
      else if(b.dataset.chact==='new'){RCCH.round++;RCCH.shuffle();RCCH.reset();}
      chRender(root);});}
  chRender(root);}
